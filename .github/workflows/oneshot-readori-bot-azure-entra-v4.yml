name: One-shot · Sync Readori Bot Azure Entra V4

on:
  push:
    paths:
      - '.github/workflows/oneshot-readori-bot-azure-entra-v4.yml'

permissions:
  contents: read
  actions: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate secrets
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "${TARGET_REPO_PAT:-}" || { echo "::error::TARGET_REPO_PAT is required"; exit 1; }

      - name: Checkout private bot source
        uses: actions/checkout@v6
        with:
          repository: readori/readoritgbot
          ref: main
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: bot
          fetch-depth: 20
          persist-credentials: true

      - name: Apply Azure Entra TTS V4 patch
        working-directory: bot
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          CURRENT="$(git hash-object src/tts/index.js)"
          EXPECTED_OLD="52e4293de2fede1361c958e0395d3298dca70f34"
          EXPECTED_NEW="91a209bc43d0f78bd8e7ec9c20e23056fe66b668"
          if [[ "$CURRENT" == "$EXPECTED_NEW" ]]; then
            echo "Azure Entra V4 already applied."
          else
            [[ "$CURRENT" == "$EXPECTED_OLD" ]] || { echo "::error::Unexpected src/tts/index.js blob $CURRENT"; exit 1; }
            printf '%s' "$PATCH_B64" | base64 -d | gzip -dc > /tmp/azure-entra-v4.patch
            git apply --check /tmp/azure-entra-v4.patch
            git apply /tmp/azure-entra-v4.patch
            node --check src/tts/index.js
            [[ "$(git hash-object src/tts/index.js)" == "$EXPECTED_NEW" ]] || { echo "::error::Patched blob mismatch"; exit 1; }
          fi

      - name: Install and test
        working-directory: bot
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run lint --if-present
          npm test
          node --check src/tts/index.js

      - name: Commit and push private bot main
        working-directory: bot
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No private repo changes to push."
            exit 0
          fi
          git config user.name "Readori CI"
          git config user.email "ci@readori.com"
          git add src/tts/index.js
          git commit -m "fix: add Azure Entra Speech fallback V4"
          git push origin HEAD:main

      - name: Dispatch production Bot deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run readori-bot.yml --repo readori/test-env-setup --ref main \
            -f bot_ref=main \
            -f mode=deploy \
            -f run_migrations=false
          echo "Production deploy dispatched."
