name: AA Readori Source Validator Cloudflare

run-name: Source Validator Cloudflare ${{ inputs.mode }} @ ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "仅检查 Wrangler 包，或部署 Pages/Worker 反向代理"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - dry-run
      source_ref:
        description: "readori-CheckSources 的分支、标签或提交 SHA"
        required: true
        default: main
        type: string
      health_url:
        description: "可选健康检查 URL，例如 https://validator.example.workers.dev/api/healthz"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: readori-source-validator-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull validator source and deploy server-only proxy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      SOURCE_REPOSITORY: readori/readori-CheckSources
      SOURCE_REF: ${{ inputs.source_ref }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      VALIDATOR_SERVER_URL: ${{ secrets.VALIDATOR_SERVER_URL || vars.VALIDATOR_SERVER_URL }}
      VALIDATOR_SERVER_TOKEN: ${{ secrets.VALIDATOR_SERVER_TOKEN }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN || vars.FRONTEND_ORIGIN }}
      DEPLOY_MODE: ${{ inputs.mode }}
      HEALTH_URL: ${{ inputs.health_url }}
    steps:
      - name: Checkout readori-CheckSources
        uses: actions/checkout@v4
        with:
          repository: readori/readori-CheckSources
          ref: ${{ inputs.source_ref }}
          path: source-validator
          token: ${{ secrets.TARGET_REPO_PAT || github.token }}
          fetch-depth: 1

      - name: Validate server-only deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "${VALIDATOR_SERVER_URL:-}" ] || missing+=(VALIDATOR_SERVER_URL)
          if [ "${DEPLOY_MODE}" != "dry-run" ]; then
            [ -n "${VALIDATOR_SERVER_TOKEN:-}" ] || missing+=(VALIDATOR_SERVER_TOKEN)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deployment secrets/variables: ${missing[*]}"
            echo "::error::D1/R2/Queue credentials are no longer used. Configure VALIDATOR_SERVER_URL and VALIDATOR_SERVER_TOKEN instead."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "${VALIDATOR_SERVER_TOKEN:-}" ] || echo "::add-mask::$VALIDATOR_SERVER_TOKEN"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: source-validator/cloudflare
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Generate deployment configuration
        working-directory: source-validator/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python3 - wrangler.toml wrangler-ci.toml "$VALIDATOR_SERVER_URL" "$FRONTEND_ORIGIN" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, target, server_url, origin = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          text = text.replace('VALIDATOR_SERVER_URL = "https://validator.example.com"', f'VALIDATOR_SERVER_URL = {json.dumps(server_url)}')
          text = text.replace('FRONTEND_ORIGIN = ""', f'FRONTEND_ORIGIN = {json.dumps(origin)}')
          Path(target).write_text(text, encoding="utf-8")
          PY
          test -s wrangler-ci.toml

      - name: Validate Wrangler package
        working-directory: source-validator/cloudflare
        run: npx wrangler deploy --dry-run --config wrangler-ci.toml --outdir .wrangler-dry-run

      - name: Deploy server-only Worker/Pages proxy
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: source-validator/cloudflare
        run: |
          npx wrangler deploy --config wrangler-ci.toml
          printf '%s' "$VALIDATOR_SERVER_TOKEN" | npx wrangler secret put VALIDATOR_SERVER_TOKEN --config wrangler-ci.toml

      - name: Post-deploy health check
        if: ${{ inputs.mode == 'deploy' && inputs.health_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors "$HEALTH_URL"
          echo

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Server-only Cloudflare deployment'
            echo
            echo "- Source: ${SOURCE_REPOSITORY}@${SOURCE_REF}"
            echo "- Mode: ${DEPLOY_MODE}"
            echo '- D1: **not used**'
            echo '- R2: **not used**'
            echo '- Queue: **not used**'
            echo '- AMD Micro: local FastAPI + SQLite server'
          } >> "$GITHUB_STEP_SUMMARY"
