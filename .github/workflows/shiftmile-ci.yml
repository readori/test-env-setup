name: ShiftMile iOS CI

run-name: ShiftMile iOS · ${{ inputs.distribution || 'verify' }} · ${{ inputs.source_ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Build task'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - sideload
          - archive
          - testflight
          - both
      source_ref:
        description: 'Private readori/AutoTaxMile branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      app_version:
        description: 'CFBundleShortVersionString. Blank = project MARKETING_VERSION'
        required: false
        default: ''
        type: string
      build_number:
        description: 'CFBundleVersion. Blank = public CI GitHub run number'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Optional notes for public sideload prerelease / CI summary'
        required: false
        default: ''
        type: string
      signing_bootstrap:
        description: 'Force a writable Match refresh for this run (normally not needed)'
        required: false
        default: false
        type: boolean
      auto_repair_signing:
        description: 'Automatically repair missing/stale Match signing assets on readori-certificates/main'
        required: false
        default: true
        type: boolean


# Default to the smallest token. This workflow grants contents:write only to the
# build job because sideload mode may publish a prerelease in THIS PUBLIC repo.
permissions:
  contents: read

concurrency:
  group: shiftmile-ios-${{ inputs.source_ref || 'main' }}-${{ inputs.distribution || 'verify' }}
  cancel-in-progress: false

env:
  PRIVATE_SOURCE_REPOSITORY: readori/AutoTaxMile
  PRIVATE_SOURCE_PATH: source
  SCHEME: ShiftMile
  EXPECTED_BUNDLE_ID: com.readori.shiftmile
  EXPECTED_IAP_PRODUCT_ID: com.readori.shiftmile.lifetime
  MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
  MATCH_GIT_BRANCH: main
  # Pin fastlane for reproducible Match behavior. TestFlight upload itself uses Apple's altool.
  FASTLANE_VERSION: '2.238.0'

jobs:
  ios:
    name: Build ShiftMile iOS
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write

    env:
      DISTRIBUTION: ${{ inputs.distribution || 'verify' }}
      SOURCE_REF: ${{ inputs.source_ref || 'main' }}
      APP_VERSION_INPUT: ${{ inputs.app_version || '' }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number || '' }}
      RELEASE_NOTES: ${{ inputs.release_notes || '' }}
      SIGNING_BOOTSTRAP: ${{ inputs.signing_bootstrap || false }}
      AUTO_REPAIR_SIGNING: ${{ inputs.auto_repair_signing || true }}

    steps:
      # ---------------------------------------------------------------------
      # 0. Security / request validation BEFORE private source checkout
      # ---------------------------------------------------------------------
      - name: Validate CI request and private-repository credential
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail

          [[ -n "${TARGET_REPO_PAT:-}" ]] || {
            echo '::error::Missing public-repo secret TARGET_REPO_PAT.'
            echo '::error::Use a fine-grained PAT with Contents read access to readori/AutoTaxMile (and certificates-repo access for signed modes).'
            exit 78
          }

          case "$DISTRIBUTION" in
            verify|sideload|archive|testflight|both) ;;
            *)
              echo "::error::Unsupported distribution mode: $DISTRIBUTION"
              exit 64
              ;;
          esac

          [[ -n "$SOURCE_REF" ]] || {
            echo '::error::source_ref must not be empty.'
            exit 64
          }

          echo "Requested mode: $DISTRIBUTION"
          echo "Requested private source ref: $SOURCE_REF"

      # ---------------------------------------------------------------------
      # 1. PUBLIC CI repository -> PRIVATE ShiftMile source repository
      # ---------------------------------------------------------------------
      - name: Checkout private ShiftMile source
        uses: actions/checkout@v7
        with:
          repository: readori/AutoTaxMile
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Discover and verify Xcode project
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ABS="$GITHUB_WORKSPACE/$PRIVATE_SOURCE_PATH"
          test -d "$SOURCE_ABS/.git" || {
            echo '::error::Private source checkout is missing its .git directory.'
            exit 66
          }

          PROJECT_PATH="$(find "$SOURCE_ABS" -maxdepth 3 -type d -name 'ShiftMile.xcodeproj' -print -quit)"
          if [[ -z "$PROJECT_PATH" || ! -f "$PROJECT_PATH/project.pbxproj" ]]; then
            echo '::error::ShiftMile.xcodeproj was not found within three levels of the private repository root.'
            find "$SOURCE_ABS" -maxdepth 3 -type d -name '*.xcodeproj' -print || true
            exit 66
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_PATH")"
          SOURCE_COMMIT="$(git -C "$SOURCE_ABS" rev-parse HEAD)"
          SOURCE_SHORT_SHA="${SOURCE_COMMIT:0:8}"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT_SHA=$SOURCE_SHORT_SHA" >> "$GITHUB_ENV"

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_short_sha=$SOURCE_SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Private source: $PRIVATE_SOURCE_REPOSITORY@$SOURCE_REF"
          echo "Private source commit: $SOURCE_SHORT_SHA"
          echo "Xcode project: $PROJECT_PATH"

      - name: Validate ShiftMile product identity
        shell: bash
        run: |
          set -euo pipefail

          INFO_PLIST="$PROJECT_ROOT/ShiftMile/Resources/Info.plist"
          STOREKIT_SWIFT="$PROJECT_ROOT/ShiftMile/Services/StoreKitManager.swift"
          STOREKIT_CONFIG="$PROJECT_ROOT/ShiftMile/StoreKit/ShiftMile.storekit"

          for required_file in "$INFO_PLIST" "$STOREKIT_SWIFT" "$STOREKIT_CONFIG"; do
            [[ -f "$required_file" ]] || {
              echo "::error::Missing required ShiftMile identity file: $required_file"
              exit 66
            }
          done

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          [[ "$DISPLAY_NAME" == 'ShiftMile' ]] || {
            echo "::error::CFBundleDisplayName must be ShiftMile; got: $DISPLAY_NAME"
            exit 65
          }

          grep -Fq "$EXPECTED_IAP_PRODUCT_ID" "$STOREKIT_SWIFT" || {
            echo "::error::StoreKitManager does not use $EXPECTED_IAP_PRODUCT_ID"
            exit 65
          }
          grep -Fq "\"productID\" : \"$EXPECTED_IAP_PRODUCT_ID\"" "$STOREKIT_CONFIG" 2>/dev/null || \
          grep -Fq "\"productID\": \"$EXPECTED_IAP_PRODUCT_ID\"" "$STOREKIT_CONFIG" || {
            echo "::error::ShiftMile.storekit does not contain $EXPECTED_IAP_PRODUCT_ID"
            exit 65
          }

          if grep -R -n --exclude-dir=.git --include='*.swift' --include='*.plist' --include='*.storekit' \
             -E 'com\.readori\.autotaxmile|AutoTaxMile' "$PROJECT_ROOT/ShiftMile"; then
            echo '::error::Legacy AutoTaxMile shipped identity remains in active ShiftMile sources.'
            exit 65
          fi

          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$INFO_PLIST" 2>/dev/null || true)"
          [[ "$BACKGROUND_MODE" == 'location' ]] || {
            echo '::error::ShiftMile must retain UIBackgroundModes/location for automatic mileage tracking.'
            exit 65
          }

          NON_EXEMPT="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$INFO_PLIST" 2>/dev/null || true)"
          [[ "$NON_EXEMPT" == 'false' ]] || {
            echo '::error::ITSAppUsesNonExemptEncryption must be false for the current ShiftMile release configuration.'
            exit 65
          }

          echo 'ShiftMile identity validation: PASS'
          echo "Bundle ID: $EXPECTED_BUNDLE_ID"
          echo "Lifetime Pro: $EXPECTED_IAP_PRODUCT_ID"

      # ---------------------------------------------------------------------
      # 2. Toolchain — use Xcode 26 on GitHub's macOS 26 public runner
      # ---------------------------------------------------------------------
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          select_xcode() {
            local app="$1"
            if [[ -d "$app/Contents/Developer" ]]; then
              sudo xcode-select -s "$app/Contents/Developer"
              echo "Selected Xcode: $app"
              return 0
            fi
            return 1
          }

          select_xcode /Applications/Xcode_26.6.app || \
          select_xcode /Applications/Xcode_26.5.app || \
          select_xcode /Applications/Xcode_26.4.app || \
          select_xcode /Applications/Xcode_26.3.app || \
          select_xcode /Applications/Xcode_26.2.app || \
          select_xcode /Applications/Xcode_26.1.app || \
          select_xcode /Applications/Xcode_26.app || \
          select_xcode /Applications/Xcode.app || {
            echo '::error::No Xcode installation was found.'
            ls -1 /Applications | grep '^Xcode' || true
            exit 69
          }

          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR != 26 )); then
            echo "::error::ShiftMile CI currently requires Xcode 26.x; selected $XCODE_VERSION"
            exit 69
          fi

          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Runner architecture: $(uname -m)"

      # ---------------------------------------------------------------------
      # 3. Resolve version/build without modifying the private repository
      # ---------------------------------------------------------------------
      - name: Resolve app version and build number
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -list -project "$PROJECT_PATH" >/tmp/shiftmile-xcode-list.txt
          grep -q "$SCHEME" /tmp/shiftmile-xcode-list.txt || {
            echo "::error::Shared scheme '$SCHEME' was not found."
            cat /tmp/shiftmile-xcode-list.txt
            exit 66
          }

          if [[ -n "$APP_VERSION_INPUT" ]]; then
            APP_VERSION="$APP_VERSION_INPUT"
          else
            APP_VERSION="$(
              xcodebuild \
                -project "$PROJECT_PATH" \
                -scheme "$SCHEME" \
                -configuration Release \
                -showBuildSettings 2>/dev/null \
              | awk -F ' = ' '/MARKETING_VERSION = / {print $2; exit}'
            )"
          fi

          [[ "$APP_VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]] || {
            echo "::error::Resolved app version must look like 1.1 or 1.1.0; got: ${APP_VERSION:-<empty>}"
            exit 64
          }

          RAW_BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$GITHUB_RUN_NUMBER}"
          [[ "$RAW_BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::build_number must be a positive integer; got: $RAW_BUILD_NUMBER"
            exit 64
          }

          BUILD_NUMBER="$((10#$RAW_BUILD_NUMBER))"
          (( BUILD_NUMBER > 0 )) || {
            echo "::error::build_number must be greater than zero; got: $RAW_BUILD_NUMBER"
            exit 64
          }

          if [[ "$BUILD_NUMBER" != "$RAW_BUILD_NUMBER" ]]; then
            echo "::notice::Normalized build number $RAW_BUILD_NUMBER -> $BUILD_NUMBER"
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "Version: $APP_VERSION ($BUILD_NUMBER)"

      # ---------------------------------------------------------------------
      # 4. Simulator unit tests — no signing and no secret-dependent build phase
      # ---------------------------------------------------------------------
      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in payload.get("devices", {}).items()
              if "SimRuntime.iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(devices[0]["udid"] if devices else "")
          ')"

          if [[ -z "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices available
            echo '::error::No available iPhone Simulator was found.'
            exit 69
          fi

          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "Selected simulator: $SIMULATOR_UDID"

      - name: Run ShiftMile unit tests
        shell: bash
        run: |
          set -euo pipefail

          TEST_RESULT="$RUNNER_TEMP/ShiftMileTests.xcresult"
          TEST_DERIVED="$RUNNER_TEMP/DerivedData-Tests"
          rm -rf "$TEST_RESULT" "$TEST_DERIVED"

          # -quiet materially reduces the amount of private-source metadata exposed
          # in this PUBLIC workflow's logs while still surfacing warnings/errors.
          xcodebuild test \
            -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$TEST_DERIVED" \
            -resultBundlePath "$TEST_RESULT" \
            -parallel-testing-enabled NO \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compile and verify complete ShiftMile app
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DERIVED="$RUNNER_TEMP/DerivedData-ShiftMile-Verify"
          rm -rf "$VERIFY_DERIVED"
          DERIVED_DATA_PATH="$VERIFY_DERIVED" BUILD_ARCH="$(uname -m)" SIMULATOR_UDID="$SIMULATOR_UDID" bash "$PROJECT_ROOT/Scripts/verify_project.sh"

      # ---------------------------------------------------------------------
      # 5A. Sideload package — intentionally UNSIGNED, then published only to
      #     the PUBLIC CI repository. AltStore/Sideloadly/etc. can re-sign it.
      # ---------------------------------------------------------------------
      - name: Build unsigned device app for sideload
        id: unsigned
        if: ${{ env.DISTRIBUTION == 'sideload' || env.DISTRIBUTION == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DERIVED="$RUNNER_TEMP/DerivedData-Unsigned"
          rm -rf "$DEVICE_DERIVED"

          xcodebuild build \
            -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DEVICE_DERIVED" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

          APP_PATH="$(find "$DEVICE_DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name 'ShiftMile.app' -print -quit)"
          [[ -n "$APP_PATH" && -d "$APP_PATH" ]] || {
            echo '::error::Unsigned ShiftMile.app was not produced.'
            find "$DEVICE_DERIVED/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 65
          }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID (expected $EXPECTED_BUNDLE_ID)"
            exit 65
          }

          echo "UNSIGNED_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package and verify unsigned sideload IPA
        id: sideload
        if: ${{ env.DISTRIBUTION == 'sideload' || env.DISTRIBUTION == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="$RUNNER_TEMP/ShiftMile-Sideload"
          OUTPUT_DIR="$PACKAGE_ROOT/output"
          IPA_NAME="ShiftMile-v${APP_VERSION}-b${BUILD_NUMBER}-${SOURCE_SHORT_SHA}-unsigned.ipa"
          APP_ZIP_NAME="ShiftMile-v${APP_VERSION}-b${BUILD_NUMBER}-${SOURCE_SHORT_SHA}-unsigned-app.zip"

          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT/Payload" "$OUTPUT_DIR"
          ditto "$UNSIGNED_APP_PATH" "$PACKAGE_ROOT/Payload/ShiftMile.app"

          # Defense-in-depth: remove any ad-hoc metadata a toolchain happened to add.
          rm -rf "$PACKAGE_ROOT/Payload/ShiftMile.app/_CodeSignature"
          rm -f "$PACKAGE_ROOT/Payload/ShiftMile.app/embedded.mobileprovision"
          codesign --remove-signature "$PACKAGE_ROOT/Payload/ShiftMile.app/ShiftMile" 2>/dev/null || true

          if [[ -d "$PACKAGE_ROOT/Payload/ShiftMile.app/_CodeSignature" ]] || \
             [[ -f "$PACKAGE_ROOT/Payload/ShiftMile.app/embedded.mobileprovision" ]]; then
            echo '::error::Signing material remains in the sideload app.'
            exit 65
          fi

          if codesign -d "$PACKAGE_ROOT/Payload/ShiftMile.app" >/dev/null 2>&1; then
            echo '::error::Sideload package unexpectedly still contains a code signature.'
            exit 65
          fi

          (
            cd "$PACKAGE_ROOT"
            /usr/bin/zip -qry "$OUTPUT_DIR/$IPA_NAME" Payload
          )

          ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE_ROOT/Payload/ShiftMile.app" \
            "$OUTPUT_DIR/$APP_ZIP_NAME"

          {
            echo "ShiftMile unsigned sideload build"
            echo "Version: $APP_VERSION"
            echo "Build: $BUILD_NUMBER"
            echo "Private source: $PRIVATE_SOURCE_REPOSITORY@$SOURCE_REF"
            echo "Private source commit: $SOURCE_COMMIT"
            echo "Bundle identifier: $EXPECTED_BUNDLE_ID"
            echo "GitHub public CI run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "Xcode: $(xcodebuild -version | head -1)"
            echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo
            echo 'SHA-256:'
            shasum -a 256 "$OUTPUT_DIR/$IPA_NAME" "$OUTPUT_DIR/$APP_ZIP_NAME"
          } > "$OUTPUT_DIR/build-info.txt"

          SIDELOAD_IPA_PATH="$OUTPUT_DIR/$IPA_NAME"
          echo "SIDELOAD_OUTPUT=$OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "SIDELOAD_IPA=$SIDELOAD_IPA_PATH" >> "$GITHUB_ENV"
          echo "ipa_path=$SIDELOAD_IPA_PATH" >> "$GITHUB_OUTPUT"

          ls -lh "$OUTPUT_DIR"

          bash "$PROJECT_ROOT/Scripts/verify_ipa_localizations.sh" "$SIDELOAD_IPA_PATH"

      - name: Upload sideload IPA as Actions artifact
        id: sideload_artifact
        if: ${{ env.DISTRIBUTION == 'sideload' || env.DISTRIBUTION == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMile-sideload-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.SIDELOAD_IPA }}
            ${{ env.SIDELOAD_OUTPUT }}/build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Print sideload IPA output
        if: ${{ env.DISTRIBUTION == 'sideload' || env.DISTRIBUTION == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_FILE="$(basename "$SIDELOAD_IPA")"
          IPA_SIZE="$(du -h "$SIDELOAD_IPA" | awk '{print $1}')"
          IPA_SHA256="$(shasum -a 256 "$SIDELOAD_IPA" | awk '{print $1}')"
          ARTIFACT_URL='${{ steps.sideload_artifact.outputs.artifact-url }}'

          echo '=========================================='
          echo 'ShiftMile SIDELOAD IPA READY'
          echo "IPA file:     $IPA_FILE"
          echo "IPA path:     $SIDELOAD_IPA"
          echo "IPA size:     $IPA_SIZE"
          echo "IPA SHA-256:  $IPA_SHA256"
          echo "Artifact URL: $ARTIFACT_URL"
          echo '=========================================='

          echo "::notice title=ShiftMile Sideload IPA::$IPA_FILE"
          echo "::notice title=ShiftMile IPA Path::$SIDELOAD_IPA"
          echo "SIDELOAD_ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_ENV"
          echo "SIDELOAD_IPA_SHA256=$IPA_SHA256" >> "$GITHUB_ENV"

      - name: Publish sideload IPA to public GitHub prerelease
        if: ${{ env.DISTRIBUTION == 'sideload' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_TAG="shiftmile-sideload-v${APP_VERSION}-b${BUILD_NUMBER}-run${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="ShiftMile Sideload v${APP_VERSION} (${BUILD_NUMBER})"
          NOTES_FILE="$RUNNER_TEMP/shiftmile-sideload-release-notes.md"

          {
            echo '# ShiftMile unsigned sideload build'
            echo
            echo "- Version: \`${APP_VERSION}\`"
            echo "- Build: \`${BUILD_NUMBER}\`"
            echo "- Bundle ID: \`${EXPECTED_BUNDLE_ID}\`"
            echo "- Match branch: \`${MATCH_GIT_BRANCH}\`"
            echo "- Private source: \`${PRIVATE_SOURCE_REPOSITORY}@${SOURCE_REF}\`"
            echo "- Source commit: \`${SOURCE_SHORT_SHA}\`"
            echo
            echo '> This IPA is intentionally unsigned. Install it with a sideloading tool that re-signs the app with your own Apple ID/developer certificate. It is not the TestFlight/App Store package.'
            if [[ -n "${RELEASE_NOTES:-}" ]]; then
              echo
              echo '## Notes'
              echo
              printf '%s\n' "$RELEASE_NOTES"
            fi
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" \
            "$SIDELOAD_OUTPUT"/* \
            --repo "$PUBLIC_RELEASE_REPO" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --prerelease

          SIDELOAD_RELEASE_URL="https://github.com/${PUBLIC_RELEASE_REPO}/releases/tag/${RELEASE_TAG}"
          echo "SIDELOAD_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SIDELOAD_RELEASE_URL=$SIDELOAD_RELEASE_URL" >> "$GITHUB_ENV"
          echo "Sideload prerelease: $SIDELOAD_RELEASE_URL"

      # ---------------------------------------------------------------------
      # 5B. App Store signing / Archive / TestFlight
      #     - certificates/profiles: readori/readori-certificates via Match
      #     - one TARGET_REPO_PAT is used for private source + Match certificates repo
      #     - upload: Apple's Xcode 26 altool with App Store Connect API key
      # ---------------------------------------------------------------------
      - name: Validate App Store signing secrets
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          required=(
            TARGET_REPO_PAT
            MATCH_PASSWORD
            ASC_ISSUER_ID
            ASC_KEY_ID
            ASC_PRIVATE_KEY
            ASC_TEAM_ID
          )

          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing public-repo secret required for App Store signing: $name"
              missing=1
            fi
          done
          (( missing == 0 )) || exit 78

          if [[ "$SIGNING_BOOTSTRAP" == 'true' || "$AUTO_REPAIR_SIGNING" == 'true' ]]; then
            echo '::notice::Signed run may update Match when bootstrap or automatic repair is enabled.'
          fi

      - name: Install pinned fastlane for Match only
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          FASTLANE_GEM_HOME="$RUNNER_TEMP/fastlane-gems"
          rm -rf "$FASTLANE_GEM_HOME"
          mkdir -p "$FASTLANE_GEM_HOME"

          export GEM_HOME="$FASTLANE_GEM_HOME"
          export GEM_PATH="$FASTLANE_GEM_HOME"
          export PATH="$FASTLANE_GEM_HOME/bin:$PATH"

          gem install --no-document fastlane -v "$FASTLANE_VERSION"
          fastlane --version

          echo "GEM_HOME=$FASTLANE_GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$FASTLANE_GEM_HOME" >> "$GITHUB_ENV"
          echo "$FASTLANE_GEM_HOME/bin" >> "$GITHUB_PATH"

      - name: Create ephemeral signing keychain and App Store Connect key
        id: signing_env
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEYCHAIN_NAME="shiftmile-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # Keep login plus the ephemeral CI keychain in the search list.
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$LOGIN_KEYCHAIN" >> "$GITHUB_ENV"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"

          ASC_DIR="$RUNNER_TEMP/shiftmile-asc"
          mkdir -p "$ASC_DIR" "$HOME/.appstoreconnect/private_keys"
          P8_PATH="$ASC_DIR/AuthKey_${ASC_KEY_ID}.p8"
          API_KEY_JSON="$ASC_DIR/api-key.json"

          printf '%s\n' "$ASC_PRIVATE_KEY" > "$P8_PATH"
          chmod 600 "$P8_PATH"

          grep -q 'BEGIN PRIVATE KEY' "$P8_PATH" || {
            echo '::error::ASC_PRIVATE_KEY does not look like an App Store Connect .p8 private key.'
            exit 78
          }

          cp "$P8_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          export P8_PATH_FOR_PY="$P8_PATH"
          python3 - "$API_KEY_JSON" <<'PY'
          import json, os, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          p8 = Path(os.environ["P8_PATH_FOR_PY"]).read_text(encoding="utf-8")
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": p8,
              "in_house": False,
          }
          path.write_text(json.dumps(payload), encoding="utf-8")
          PY

          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "ASC_P8_PATH=$P8_PATH" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_JSON=$API_KEY_JSON" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"

          echo "keychain_name=$KEYCHAIN_NAME" >> "$GITHUB_OUTPUT"
          echo "api_key_json=$API_KEY_JSON" >> "$GITHUB_OUTPUT"

      - name: Configure Match repository authentication
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"

          git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
            ls-remote "$MATCH_GIT_URL" HEAD >/dev/null

          MATCH_BRANCH_SHA="$(
            git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
              ls-remote --heads "$MATCH_GIT_URL" "refs/heads/$MATCH_GIT_BRANCH" \
            | awk 'NR==1 {print $1}'
          )"
          [[ -n "$MATCH_BRANCH_SHA" ]] || {
            echo "::error::Required Match branch '$MATCH_GIT_BRANCH' does not exist in readori/readori-certificates."
            exit 66
          }
          echo 'Match credential can read readori/readori-certificates.'
          echo "Match branch: $MATCH_GIT_BRANCH (${MATCH_BRANCH_SHA:0:8})"

          if [[ "$SIGNING_BOOTSTRAP" == 'true' || "$AUTO_REPAIR_SIGNING" == 'true' ]]; then
            PROBE_DIR="$(mktemp -d)"
            trap 'rm -rf "$PROBE_DIR"' EXIT
            git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
              clone --depth=1 "$MATCH_GIT_URL" "$PROBE_DIR" >/dev/null 2>&1
            PROBE_REF="refs/heads/__shiftmile_match_probe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            if ! git -C "$PROBE_DIR" \
              -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
              push --dry-run origin "HEAD:$PROBE_REF" >/dev/null 2>&1; then
              echo '::error::Signed ShiftMile runs with bootstrap/auto-repair require TARGET_REPO_PAT write access to readori/readori-certificates.'
              exit 78
            fi
            echo 'Match write permission dry-run: PASS'
          fi

      - name: Install or auto-repair ShiftMile App Store signing assets with Match
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail

          MATCH_LOG="$RUNNER_TEMP/shiftmile-match.log"
          rm -f "$MATCH_LOG"

          run_match() {
            local readonly="$1"
            local force="$2"
            local app_id="${3:-$EXPECTED_BUNDLE_ID}"
            local args=(
              fastlane match appstore
              --app_identifier "$app_id"
              --git_url "$MATCH_GIT_URL"
              --git_branch "$MATCH_GIT_BRANCH"
              --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION"
              --team_id "$ASC_TEAM_ID"
              --api_key_path "$ASC_API_KEY_JSON"
              --keychain_name "$KEYCHAIN_NAME"
              --keychain_password "$KEYCHAIN_PASSWORD"
              --shallow_clone true
              --clone_branch_directly true
              --readonly "$readonly"
            )
            if [[ "$force" == 'true' ]]; then
              args+=(--force true)
            fi
            echo "Match: branch=$MATCH_GIT_BRANCH app=$app_id readonly=$readonly force=$force"
            "${args[@]}"
          }

          reset_signing_keychain() {
            security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
            security default-keychain -d user -s "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$ORIGINAL_DEFAULT_KEYCHAIN"
          }

          remove_dead_match_certificate() {
            local cert_id="$1"
            local repair_dir="$RUNNER_TEMP/shiftmile-match-repair"
            local match_auth="$MATCH_GIT_BASIC_AUTHORIZATION"
            local found=0

            [[ "$cert_id" =~ ^[A-Za-z0-9]+$ ]] || {
              echo "::error::Refusing to repair unexpected certificate id: $cert_id"
              return 1
            }

            rm -rf "$repair_dir"
            git -c http.extraheader="AUTHORIZATION: basic $match_auth" \
              clone --branch "$MATCH_GIT_BRANCH" --single-branch "$MATCH_GIT_URL" "$repair_dir"

            git -C "$repair_dir" config user.name 'ShiftMile CI Signing Repair'
            git -C "$repair_dir" config user.email 'actions@users.noreply.github.com'

            for ext in cer p12; do
              candidate="$repair_dir/certs/distribution/${cert_id}.${ext}"
              if [[ -f "$candidate" ]]; then
                git -C "$repair_dir" rm "certs/distribution/${cert_id}.${ext}"
                found=1
              fi
            done

            (( found == 1 )) || {
              echo "::error::Apple reported certificate $cert_id missing from the Developer Portal, but its exact .cer/.p12 pair was not found on Match branch $MATCH_GIT_BRANCH. Refusing broad deletion."
              return 1
            }

            # Remove only ShiftMile's stale App Store profile here. Other apps are not mutated by this app CI.
            while IFS= read -r profile; do
              [[ -n "$profile" ]] || continue
              rel="${profile#$repair_dir/}"
              git -C "$repair_dir" rm "$rel"
            done < <(find "$repair_dir/profiles/appstore" -maxdepth 1 -type f -iname "*${EXPECTED_BUNDLE_ID}*" -print 2>/dev/null || true)

            git -C "$repair_dir" commit -m "Remove revoked Apple Distribution certificate ${cert_id} for ShiftMile repair"
            git -C "$repair_dir" \
              -c http.extraheader="AUTHORIZATION: basic $match_auth" \
              push origin "HEAD:$MATCH_GIT_BRANCH"

            echo "::notice::Removed revoked Match certificate $cert_id from $MATCH_GIT_BRANCH using exact-ID deletion only."
          }

          install_key_partition_list() {
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s \
              -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH" >/dev/null
          }

          if [[ "$SIGNING_BOOTSTRAP" == 'true' ]]; then
            echo '::notice::signing_bootstrap=true: running writable Match on the shared main branch.'
            run_match false true
            install_key_partition_list
            exit 0
          fi

          set +e
          run_match true false 2>&1 | tee "$MATCH_LOG"
          match_status=${PIPESTATUS[0]}
          set -e

          if (( match_status == 0 )); then
            install_key_partition_list
            exit 0
          fi

          [[ "$AUTO_REPAIR_SIGNING" == 'true' ]] || {
            echo '::error::Readonly Match failed and auto_repair_signing=false.'
            exit "$match_status"
          }

          DEAD_CERT_ID="$(sed -nE "s/.*Certificate '([A-Za-z0-9]+)'.*not available on the Developer Portal.*/\1/p" "$MATCH_LOG" | head -1)"
          if [[ -n "$DEAD_CERT_ID" ]]; then
            echo "::warning::Match certificate $DEAD_CERT_ID is stored in the repository but no longer exists on the Apple Developer Portal."
            remove_dead_match_certificate "$DEAD_CERT_ID"
            reset_signing_keychain
            run_match false true
            install_key_partition_list
            exit 0
          fi

          if grep -Eqi \
            'No code signing identity found.*readonly|No matching provisioning profiles|provisioning profile.*not found|Could not find.*provisioning profile|No profiles for.*were found' \
            "$MATCH_LOG"; then
            echo '::notice::Readonly Match is missing a usable Distribution identity or ShiftMile profile. Retrying writable Match on main.'
            reset_signing_keychain
            run_match false true
            install_key_partition_list
            exit 0
          fi

          echo '::error::Readonly Match failed for an unrecognized reason. No certificate repository mutation was attempted.'
          exit "$match_status"

      - name: Locate and validate installed App Store profile
        id: profile
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          PROFILE_SCAN_DIR="$RUNNER_TEMP/shiftmile-profile-scan"
          rm -rf "$PROFILE_SCAN_DIR"
          mkdir -p "$PROFILE_SCAN_DIR"

          PROFILE_PATH=''
          PROFILE_NAME=''
          PROFILE_UUID=''
          PROFILE_TEAM=''
          GET_TASK_ALLOW=''

          shopt -s nullglob
          candidates=(
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          )
          shopt -u nullglob

          for profile in "${candidates[@]}"; do
            [[ -f "$profile" ]] || continue
            plist="$PROFILE_SCAN_DIR/$(basename "$profile").plist"
            /usr/bin/security cms -D -i "$profile" > "$plist" 2>/dev/null || continue

            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)"
            [[ "$app_id" == *".$EXPECTED_BUNDLE_ID" ]] || continue

            PROFILE_PATH="$profile"
            PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")"
            GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist" 2>/dev/null || echo false)"
            break
          done

          [[ -n "$PROFILE_PATH" ]] || {
            echo "::error::No App Store provisioning profile for $EXPECTED_BUNDLE_ID was installed by Match."
            echo '::error::If this is the first ShiftMile signing run, create the App ID/App Store Connect app and rerun with signing_bootstrap=true.'
            exit 65
          }

          [[ "$PROFILE_TEAM" == "$ASC_TEAM_ID" ]] || {
            echo "::error::Provisioning profile team $PROFILE_TEAM does not match ASC_TEAM_ID $ASC_TEAM_ID."
            exit 65
          }

          [[ "$GET_TASK_ALLOW" != 'true' ]] || {
            echo '::error::Installed profile has get-task-allow=true and is not an App Store distribution profile.'
            exit 65
          }

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution' || {
            echo '::error::No Apple Distribution signing identity was installed into the ephemeral keychain.'
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 65
          }

          echo "APPSTORE_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "APPSTORE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPSTORE_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "profile_path=$PROFILE_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Team: $PROFILE_TEAM"

      - name: Build signed App Store archive and IPA
        id: appstore
        if: ${{ env.DISTRIBUTION == 'archive' || env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/ShiftMile.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/ShiftMile-AppStore-Export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ShiftMile-ExportOptions.plist"

          rm -rf "$ARCHIVE_PATH" "$EXPORT_DIR" "$EXPORT_OPTIONS"
          mkdir -p "$EXPORT_DIR"

          xcodebuild archive \
            -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$APPSTORE_PROFILE_NAME"

          test -d "$ARCHIVE_PATH/Products/Applications/ShiftMile.app" || {
            echo '::error::Signed xcarchive was not produced.'
            exit 65
          }

          export BUNDLE_ID_FOR_PLIST="$EXPECTED_BUNDLE_ID"
          export PROFILE_NAME_FOR_PLIST="$APPSTORE_PROFILE_NAME"
          export TEAM_ID_FOR_PLIST="$ASC_TEAM_ID"
          python3 - "$EXPORT_OPTIONS" <<'PY'
          import os, plistlib, sys

          payload = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["TEAM_ID_FOR_PLIST"],
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID_FOR_PLIST"]: os.environ["PROFILE_NAME_FOR_PLIST"]
              },
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(sys.argv[1], "wb") as fh:
              plistlib.dump(payload, fh)
          PY

          xcodebuild -exportArchive \
            -quiet \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          SIGNED_IPA="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$SIGNED_IPA" && -f "$SIGNED_IPA" ]] || {
            echo '::error::Signed App Store IPA was not exported.'
            find "$EXPORT_DIR" -maxdepth 2 -type f -print || true
            exit 65
          }

          VERIFY_DIR="$RUNNER_TEMP/ShiftMile-Signed-Verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$SIGNED_IPA" -d "$VERIFY_DIR"
          SIGNED_APP="$VERIFY_DIR/Payload/ShiftMile.app"

          test -f "$SIGNED_APP/embedded.mobileprovision" || {
            echo '::error::Signed IPA is missing embedded.mobileprovision.'
            exit 65
          }
          codesign --verify --deep --strict "$SIGNED_APP"

          SIGNED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_APP/Info.plist")"
          [[ "$SIGNED_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::Signed IPA bundle ID mismatch: $SIGNED_BUNDLE_ID"
            exit 65
          }

          bash "$PROJECT_ROOT/Scripts/verify_ipa_localizations.sh" "$SIGNED_IPA"

          shasum -a 256 "$SIGNED_IPA" > "$EXPORT_DIR/ShiftMile-AppStore.sha256"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "SIGNED_EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"
          echo "SIGNED_IPA=$SIGNED_IPA" >> "$GITHUB_ENV"

          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$SIGNED_IPA" >> "$GITHUB_OUTPUT"

          echo "Signed IPA: $SIGNED_IPA"
          ls -lh "$SIGNED_IPA" "$EXPORT_DIR/ShiftMile-AppStore.sha256"

      - name: Upload signed archive artifact (archive mode only)
        if: ${{ env.DISTRIBUTION == 'archive' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShiftMile-AppStore-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ShiftMile-AppStore-Export/*.ipa
            ${{ runner.temp }}/ShiftMile-AppStore-Export/ShiftMile-AppStore.sha256
            ${{ runner.temp }}/ShiftMile.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: Validate App Store package with Apple
        if: ${{ env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          xcrun altool \
            --validate-app \
            --file "$SIGNED_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload ShiftMile to TestFlight
        if: ${{ env.DISTRIBUTION == 'testflight' || env.DISTRIBUTION == 'both' }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --file "$SIGNED_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo 'TestFlight binary upload accepted by App Store Connect.'

      # ---------------------------------------------------------------------
      # 6. Final summary
      # ---------------------------------------------------------------------
      - name: Build summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo '## ShiftMile iOS CI completed'
            echo
            echo "- Mode: \`${DISTRIBUTION}\`"
            echo "- Version: \`${APP_VERSION}\`"
            echo "- Build: \`${BUILD_NUMBER}\`"
            echo "- Bundle ID: \`${EXPECTED_BUNDLE_ID}\`"
            echo "- Private source: \`${PRIVATE_SOURCE_REPOSITORY}@${SOURCE_REF}\`"
            echo "- Source commit: \`${SOURCE_SHORT_SHA}\`"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- Tests: \`passed\`"

            if [[ "$DISTRIBUTION" == 'sideload' || "$DISTRIBUTION" == 'both' ]]; then
              echo "- Sideload IPA: \`$(basename "$SIDELOAD_IPA")\`"
              echo "- Runner IPA path: \`${SIDELOAD_IPA}\`"
              echo "- IPA SHA-256: \`${SIDELOAD_IPA_SHA256}\`"
              echo "- Actions artifact: ${SIDELOAD_ARTIFACT_URL}"
              echo "- Sideload prerelease: ${SIDELOAD_RELEASE_URL}"
            fi
            if [[ "$DISTRIBUTION" == 'archive' ]]; then
              echo '- Signed App Store archive: uploaded as a 14-day Actions artifact.'
            fi
            if [[ "$DISTRIBUTION" == 'testflight' || "$DISTRIBUTION" == 'both' ]]; then
              echo '- TestFlight: Apple validation passed and binary upload was accepted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 7. Cleanup secrets/signing material even after failures
      # ---------------------------------------------------------------------
      - name: Cleanup signing material and simulator
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1 || true
            security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1 || true
          fi

          if [[ -n "${KEYCHAIN_NAME:-}" ]]; then
            security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
          fi

          if [[ -n "${ASC_P8_PATH:-}" ]]; then
            rm -f "$ASC_P8_PATH" >/dev/null 2>&1 || true
          fi
          if [[ -n "${ASC_API_KEY_JSON:-}" ]]; then
            rm -f "$ASC_API_KEY_JSON" >/dev/null 2>&1 || true
          fi
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >/dev/null 2>&1 || true
          fi

          rm -rf "$RUNNER_TEMP/shiftmile-asc" "$RUNNER_TEMP/shiftmile-profile-scan" >/dev/null 2>&1 || true
