# SoDesk Windows end-to-end tests: features that only a real Windows desktop can prove.
#
# Public CI repository -> source readori/SoDesk.
#
#   mount : windows-11-arm (Windows 11, a desktop edition: it ships the WebClient service, the
#           WebDAV redirector that windows-latest / Windows Server lacks without a reboot).
#           `rds mount` end to end: loopback WebDAV server + `net use` drive mapping; read, write,
#           rename, delete, unmap (internal/svc/fs/mount, TestDavE2EWindows, SODESK_MOUNT_E2E=1).
#   gui   : windows-latest (x64) and windows-11-arm (arm64, native Go): the interactive-desktop
#           features. Reports whether the runner has a desktop it can inject into and capture, then
#           runs SendInput tests (pointer read back with GetCursorPos, typing into a real text box),
#           the screenshot service against a window of known colour, and a desktop session
#           (ddagrab / gdigrab capture, encoder selection, client-side decode, input over the session)
#           with a pinned, SHA-256-verified ffmpeg.
#
# No deploy, signing or cloud credentials are used. Nothing is uploaded: no artifacts.
#
# Triggers: workflow_dispatch, or a push to main that changes ci-requests/sodesk-e2e-windows.env (how
# the project's AI engineer requests a run). Only people with push access to this repo can trigger;
# never pull_request. The request file is parsed as plain KEY=VALUE text with strict patterns and is
# never executed.
#
# Safety rules (public repo, public logs): no pull_request triggers; only GitHub-owned actions,
# pinned to commit SHAs; everything else is plain PowerShell; TARGET_REPO_PAT is used only by the
# checkout step and not persisted; logs carry test results and failure tails only.
name: SoDesk Windows E2E

run-name: SoDesk Windows E2E · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-e2e-windows.env)' || inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'readori/SoDesk branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-e2e-windows.env']

permissions:
  contents: read

concurrency:
  group: sodesk-e2e-windows-${{ inputs.ref || 'request' }}
  cancel-in-progress: true

env:
  # ffmpeg 9.1 "essentials" build by gyan.dev (x64; it runs on Windows 11 ARM under emulation).
  # GitHub's archive of the same release is the stable URL; the SHA-256 is checked before use.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.zip
  FFMPEG_SHA256: b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd

jobs:
  mount:
    name: WebDAV mount (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-e2e-windows.env
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            # Download only the request file of this exact commit (public repo, no credentials).
            $req = Join-Path $env:RUNNER_TEMP 'sodesk-e2e-request.env'
            try { Invoke-WebRequest -Uri $env:REQUEST_URL -OutFile $req -MaximumRetryCount 3 -TimeoutSec 30 }
            catch { Write-Output '::error::Could not read ci-requests/sodesk-e2e-windows.env at this commit.'; exit 64 }
            # Plain text, read line by line; never sourced or executed.
            $line = Get-Content -LiteralPath $req | Where-Object { $_ -cmatch '^REF=' } | Select-Object -First 1
            $ref = if ($line) { $line.Substring(4).Trim() } else { '' }
          } else {
            $ref = "$env:INPUT_REF"
          }
          if ($ref.Length -eq 0 -or $ref.Length -gt 200 -or $ref -cnotmatch '\A[A-Za-z0-9._/][A-Za-z0-9._/-]*\z') {
            Write-Output '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          if (-not $env:TARGET_REPO_PAT) {
            Write-Output '::error::Missing public CI credential: TARGET_REPO_PAT (it must have read access to readori/SoDesk).'
            exit 78
          }
          "SOURCE_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Source ref: $ref"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/SoDesk
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      # Native windows/arm64 Go, the version go.mod asks for.
      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Toolchain
        working-directory: source
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          $sha = (git rev-parse --short HEAD)
          @("### SoDesk Windows E2E · mount", "", "- Source: ``readori/SoDesk@$sha`` (ref ``$env:SOURCE_REF``)", "- $(go version)", "- $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version)") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Unit tests of the mount package (arm64)
        working-directory: source
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 ./internal/svc/fs/mount/ 2>&1 | ForEach-Object { if ($_.Length -gt 2000) { $_.Substring(0, 2000) } else { $_ } } | Select-Object -Last 60
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The WebClient service is the OS's WebDAV client. Desktop Windows has it (Manual, trigger start);
      # make sure it is not disabled and is running, and show what the redirector is configured with.
      - name: Start the WebClient service
        continue-on-error: true
        run: |
          $svc = Get-Service WebClient -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Output '::warning::The WebClient service does not exist on this image.'; exit 0 }
          Set-Service WebClient -StartupType Manual
          Start-Service WebClient
          (Get-Service WebClient) | Format-List Name, Status, StartType
          sc.exe qc WebClient
          reg.exe query 'HKLM\SYSTEM\CurrentControlSet\Services\WebClient\Parameters'
          Write-Output "OS: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([Environment]::OSVersion.Version)"

      # rds mount: loopback WebDAV server + `net use` through the WebClient redirector; read, write,
      # rename, delete and unmap through the drive letter, each checked against the remote directory.
      - name: WebDAV mount round trip
        id: e2e
        working-directory: source
        env:
          SODESK_MOUNT_E2E: '1'
          CGO_ENABLED: '0'
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'mount-e2e.log'
          go test -count=1 -v -timeout 10m -run 'TestDavE2EWindows' ./internal/svc/fs/mount/ *> $log
          $rc = $LASTEXITCODE
          Get-Content -LiteralPath $log | ForEach-Object { if ($_.Length -gt 2000) { $_.Substring(0, 2000) } else { $_ } } | Select-Object -Last 150
          $lines = Get-Content -LiteralPath $log | Where-Object { $_ -match '^\s*--- (PASS|FAIL|SKIP)|^(ok|FAIL|PASS)\b' }
          @('', '#### WebDAV mount', '```') + $lines + '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Select-String -LiteralPath $log -Pattern '--- SKIP' -Quiet) { Write-Output '::warning::The mount e2e test was SKIPPED (see the reason above): nothing was proven.' }
          exit $rc

      - name: WebDAV client diagnostics (after a failure)
        if: failure() && steps.e2e.conclusion == 'failure'
        continue-on-error: true
        run: |
          Get-Service WebClient | Format-List Name, Status, StartType
          net.exe use
          try { Get-WinEvent -LogName 'Microsoft-Windows-WebDAV-Client/Operational' -MaxEvents 30 | Select-Object TimeCreated, Id, @{n='Msg';e={ $_.Message.Substring(0, [Math]::Min(300, $_.Message.Length)) }} | Format-List } catch { Write-Output "WebDAV-Client event log: $($_.Exception.Message)" }

  gui:
    name: GUI input and capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    defaults:
      run:
        shell: pwsh
    env:
      SODESK_INPUT_E2E: '1'
      SODESK_DESKTOP_E2E: '1'
      CGO_ENABLED: '0'

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-e2e-windows.env
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            $req = Join-Path $env:RUNNER_TEMP 'sodesk-e2e-request.env'
            try { Invoke-WebRequest -Uri $env:REQUEST_URL -OutFile $req -MaximumRetryCount 3 -TimeoutSec 30 }
            catch { Write-Output '::error::Could not read ci-requests/sodesk-e2e-windows.env at this commit.'; exit 64 }
            $line = Get-Content -LiteralPath $req | Where-Object { $_ -cmatch '^REF=' } | Select-Object -First 1
            $ref = if ($line) { $line.Substring(4).Trim() } else { '' }
          } else {
            $ref = "$env:INPUT_REF"
          }
          if ($ref.Length -eq 0 -or $ref.Length -gt 200 -or $ref -cnotmatch '\A[A-Za-z0-9._/][A-Za-z0-9._/-]*\z') {
            Write-Output '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          if (-not $env:TARGET_REPO_PAT) {
            Write-Output '::error::Missing public CI credential: TARGET_REPO_PAT (it must have read access to readori/SoDesk).'
            exit 78
          }
          "SOURCE_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Source ref: $ref"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/SoDesk
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Toolchain
        working-directory: source
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          $sha = (git rev-parse --short HEAD)
          @("### SoDesk Windows E2E · GUI · ${{ matrix.os }}", "", "- Source: ``readori/SoDesk@$sha`` (ref ``$env:SOURCE_REF``)", "- $(go version)", "- $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version), $env:PROCESSOR_ARCHITECTURE") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Writes the helper that runs one go test selection and prints its tail, its RESULT lines and
      # the step-summary block. It is plain PowerShell written to the runner's temp directory.
      - name: Test helper
        run: |
          $helper = @'
          param([string]$Title, [string]$Pkgs, [string]$Run)
          $log = Join-Path $env:RUNNER_TEMP ('gotest-' + ($Run -replace '[^A-Za-z0-9]', '_') + '.log')
          & go test -count=1 -v -timeout 12m -run $Run ($Pkgs -split ' ') *> $log
          $rc = $LASTEXITCODE
          Get-Content -LiteralPath $log | ForEach-Object { if ($_.Length -gt 2000) { $_.Substring(0, 2000) } else { $_ } } | Select-Object -Last 220
          $lines = Get-Content -LiteralPath $log | Where-Object { $_ -match 'RESULT|^\s*--- (PASS|FAIL|SKIP)|^(ok|FAIL|PASS)\b' } | ForEach-Object { if ($_.Length -gt 600) { $_.Substring(0, 600) } else { $_ } }
          @('', "#### $Title ($env:MATRIX_OS)", '```') + $lines + '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Select-String -LiteralPath $log -Pattern '--- SKIP' -Quiet) { Write-Output '::warning::Some tests were SKIPPED (see above): that part was not proven. A RESULT RUNNER LIMIT line means the runner shell covered the test window.' }
          exit $rc
          '@
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'gotest.ps1') -Value $helper -Encoding utf8
          "MATRIX_OS=${{ matrix.os }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # What kind of desktop is this runner? User, session, window station, resolution, display adapter.
      - name: Desktop session diagnostics
        continue-on-error: true
        run: |
          whoami
          Write-Output "OS: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([Environment]::OSVersion.Version), arch $env:PROCESSOR_ARCHITECTURE"
          Write-Output "Session name: $env:SESSIONNAME"
          query user 2>&1
          Get-Process -Id $PID | Select-Object Id, SessionId | Format-Table
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId, UserName | Format-Table
          Get-CimInstance Win32_VideoController | Format-List Name, AdapterCompatibility, DriverVersion, VideoProcessor, CurrentHorizontalResolution, CurrentVerticalResolution, Status
          Get-CimInstance Win32_DesktopMonitor | Format-List Name, ScreenWidth, ScreenHeight
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "screen $($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }
          Write-Output "Cursor: $([System.Windows.Forms.Cursor]::Position)"

      # Runner images can show first-run windows (the windows-11-arm image shows a "Microsoft account"
      # dialog that sits above every normal window and takes the foreground, so clicks, typing and
      # screenshots would hit it instead of the test windows). List the windows with titles and close
      # that one; the tests also check that nothing covers their window and say so if something does.
      - name: Close stray first-run windows
        continue-on-error: true
        run: |
          function Show-Windows { Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200 }
          Write-Output 'Windows with titles:'; Show-Windows
          # The dialog belongs to WWAHost.exe (Web Account Host), which has no main window of its own.
          foreach ($p in (Get-Process -Name WWAHost -ErrorAction SilentlyContinue)) {
            Write-Output "Stopping WWAHost.exe (pid $($p.Id)), the host of the 'Microsoft account' dialog"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          foreach ($p in (Get-Process | Where-Object { $_.MainWindowTitle -match 'Microsoft account' })) {
            Write-Output "Closing '$($p.MainWindowTitle)' ($($p.ProcessName), pid $($p.Id))"
            [void]$p.CloseMainWindow()
            Start-Sleep -Seconds 2
            if (-not $p.HasExited -and $p.ProcessName -notin @('explorer', 'dwm', 'winlogon', 'csrss')) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          # Close any Start menu / Search flyout that opened (Escape).
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 2
          Write-Output 'Windows with titles after:'; Show-Windows

      - name: Install ffmpeg (pinned, SHA-256 verified)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($h -ne $env:FFMPEG_SHA256) { throw "ffmpeg archive SHA-256 mismatch: $h" }
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe is not in the archive' }
          "RDS_FFMPEG=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName -hide_banner -version | Select-Object -First 1
          & $exe.FullName -hide_banner -filters 2>&1 | Select-String -Pattern ' ddagrab '
          & $exe.FullName -hide_banner -devices 2>&1 | Select-String -Pattern 'gdigrab'
          & $exe.FullName -hide_banner -encoders 2>&1 | Select-String -Pattern ' (libx264|h264_mf|h264_nvenc|h264_qsv|h264_amf|libsvtav1|libaom-av1|libopenh264) '

      - name: Build (cross-checks the tests compile)
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -o "$env:RUNNER_TEMP\rds.exe" ./cmd/rds
          & "$env:RUNNER_TEMP\rds.exe" version
          go vet ./internal/inject/ ./internal/svc/input/ ./internal/svc/screenshot/ ./internal/svc/desktop/ ./internal/wintest/

      # SendInput: the pointer lands on the exact pixel (read back with GetCursorPos), and Unicode text,
      # scan codes, keysyms and Shift reach a real text box.
      - name: Input injector (SendInput)
        if: always()
        working-directory: source
        run: '& "$env:RUNNER_TEMP\gotest.ps1" -Title "SendInput injector" -Pkgs "./internal/inject/" -Run "TestWinE2E"'

      # The same through the input service over a real rds session: move, click, type, key combos.
      - name: Input service (rds input)
        if: always()
        working-directory: source
        run: '& "$env:RUNNER_TEMP\gotest.ps1" -Title "input service" -Pkgs "./internal/svc/input/" -Run "TestWinMoveE2E|TestWinTypeE2E"'

      - name: Screenshot service
        if: always()
        working-directory: source
        run: '& "$env:RUNNER_TEMP\gotest.ps1" -Title "screenshot service" -Pkgs "./internal/svc/screenshot/" -Run "TestWinScreenshotE2E"'

      # ddagrab needs a D3D11 device and a real output; gdigrab is the fallback. This reports which
      # of them work here and which encoders (libx264, h264_mf, GPU ones) work and get picked.
      - name: Capture backends and encoders
        if: always()
        working-directory: source
        run: '& "$env:RUNNER_TEMP\gotest.ps1" -Title "capture backends and encoders" -Pkgs "./internal/svc/desktop/" -Run "TestWinCaptureBackends|TestWinEncoders"'

      - name: Desktop session (capture, encode, decode, input)
        if: always()
        working-directory: source
        run: '& "$env:RUNNER_TEMP\gotest.ps1" -Title "desktop session" -Pkgs "./internal/svc/desktop/" -Run "TestWinDesktopE2E"'
