name: certificates-repo asc-cli V2

on:
  workflow_dispatch:
    inputs:
      app_scheme:
        description: "SPM / xcodebuild scheme name"
        required: false
        default: "Readori"
        type: string

      xcode_version:
        description: "Xcode version (optional)"
        required: false
        default: ""
        type: string

      signing_mode:
        description: "readonly = normal | bootstrap_empty = first init only | refresh_profile = regenerate App Store profile after capability changes"
        required: true
        default: "readonly"
        type: choice
        options:
          - readonly
          - bootstrap_empty
          - refresh_profile

      write_confirmation:
        description: "For bootstrap_empty/refresh_profile only: type WRITE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: certificates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: production

    env:
      APP_BUNDLE_ID: com.readori.app
      MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
      MATCH_GIT_BRANCH: main

    steps:
      # ============================================================
      # 1. APP SOURCE SSH ONLY
      #    Certificates deliberately do NOT use SSH.
      # ============================================================
      - name: Configure source repository SSH
        env:
          PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
        run: |
          set -euo pipefail

          [[ -n "${PRIVATE_REPO_KEY:-}" ]] || {
            echo '::error::Missing PRIVATE_REPO_KEY.'
            exit 78
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$PRIVATE_REPO_KEY" > "$HOME/.ssh/app_key"
          chmod 600 "$HOME/.ssh/app_key"
          ssh-keygen -y -f "$HOME/.ssh/app_key" >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY is not a valid SSH private key.'
            exit 78
          }

          cat > "$HOME/.ssh/config" <<'EOF'
          Host github-app
            HostName github.com
            User git
            IdentityFile ~/.ssh/app_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

          git ls-remote git@github-app:readori/readori.git HEAD >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY cannot read readori/readori.'
            exit 78
          }
          echo 'Private source repository access: PASS'

      # ============================================================
      # 2. CLONE PRIVATE APP
      # ============================================================
      - name: Clone private repo
        run: |
          set -euo pipefail
          git clone --depth=1 git@github-app:readori/readori.git core_project
          echo "[clone] $(git -C core_project rev-parse --short HEAD)"

      # ============================================================
      # 3. CERTIFICATES REPO AUTH — HTTPS/PAT ONLY
      #    Normal runs should use MATCH_REPO_PAT_RO (Contents: Read).
      #    Write modes should use MATCH_REPO_PAT_RW (Contents: Read/Write).
      #    MATCH_REPO_PAT / TARGET_REPO_PAT are compatibility fallbacks.
      # ============================================================
      - name: Configure certificates repository authentication
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          WRITE_CONFIRMATION: ${{ inputs.write_confirmation }}
          MATCH_REPO_PAT_RO: ${{ secrets.MATCH_REPO_PAT_RO }}
          MATCH_REPO_PAT_RW: ${{ secrets.MATCH_REPO_PAT_RW }}
          MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail

          case "$SIGNING_MODE" in
            readonly)
              CERT_REPO_PAT="${MATCH_REPO_PAT_RO:-${MATCH_REPO_PAT:-${TARGET_REPO_PAT:-}}}"
              ;;
            bootstrap_empty|refresh_profile)
              [[ "$WRITE_CONFIRMATION" == 'WRITE' ]] || {
                echo '::error::Write signing mode requires write_confirmation=WRITE.'
                exit 64
              }
              CERT_REPO_PAT="${MATCH_REPO_PAT_RW:-${MATCH_REPO_PAT:-}}"
              ;;
            *)
              echo "::error::Unsupported signing_mode: $SIGNING_MODE"
              exit 64
              ;;
          esac

          [[ -n "$CERT_REPO_PAT" ]] || {
            if [[ "$SIGNING_MODE" == 'readonly' ]]; then
              echo '::error::Set MATCH_REPO_PAT_RO (preferred), MATCH_REPO_PAT, or TARGET_REPO_PAT.'
            else
              echo '::error::Set MATCH_REPO_PAT_RW (preferred) or MATCH_REPO_PAT with Contents: Read and write.'
            fi
            exit 78
          }

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$CERT_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$CERT_REPO_PAT"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"

          git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
            ls-remote "$MATCH_GIT_URL" >/tmp/readori-match-refs.txt

          echo 'Certificates repository HTTPS/PAT access: PASS'

          if [[ "$SIGNING_MODE" == 'bootstrap_empty' ]]; then
            if [[ -s /tmp/readori-match-refs.txt ]]; then
              echo '::error::bootstrap_empty refused: readori/readori-certificates already contains refs. Use readonly or refresh_profile.'
              sed -n '1,8p' /tmp/readori-match-refs.txt
              exit 64
            fi
            echo 'Certificate repository is empty: bootstrap is allowed.'
          fi

      # ============================================================
      # 4. PINNED FASTLANE
      # ============================================================
      - name: Install pinned Fastlane
        run: |
          set -euo pipefail
          sudo gem install fastlane -v 2.237.0 --no-document
          fastlane --version

      # ============================================================
      # 5. OPTIONAL XCODE
      # ============================================================
      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        uses: readori/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      # ============================================================
      # 6. ASC API KEY JSON
      #    Accepts either raw PEM or base64-encoded .p8 in ASC_PRIVATE_KEY.
      # ============================================================
      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          python3 - <<'PYEOF'
          import base64, json, os
          from pathlib import Path

          raw = os.environ['ASC_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'BEGIN PRIVATE KEY' in raw or 'BEGIN EC PRIVATE KEY' in raw:
              key = raw
          else:
              try:
                  key = base64.b64decode(raw, validate=True).decode('utf-8').strip()
              except Exception as exc:
                  raise SystemExit(f'ASC_PRIVATE_KEY is neither PEM nor valid base64: {exc}')

          if 'PRIVATE KEY' not in key:
              raise SystemExit('ASC_PRIVATE_KEY did not decode to a .p8 PEM private key')

          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          key_path = Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{key_id}.p8'
          key_path.write_text(key + ('\n' if not key.endswith('\n') else ''), encoding='utf-8')
          os.chmod(key_path, 0o600)

          payload = {
              'key_id': key_id,
              'issuer_id': issuer_id,
              'key': key,
              'in_house': False,
          }
          Path('/tmp/asc_api_key.json').write_text(json.dumps(payload), encoding='utf-8')
          print('ASC API key JSON written OK')
          PYEOF

      # ============================================================
      # 7. SWIFT RESOLVE / ICONS
      # ============================================================
      - name: Resolve Swift Packages
        run: |
          set -euo pipefail
          cd core_project
          swift package resolve

      - name: Generate icons
        run: |
          set -euo pipefail
          if [[ -f "core_project/scripts/generate_icons.swift" ]]; then
            swift core_project/scripts/generate_icons.swift "${GITHUB_WORKSPACE}/core_project"
          fi

      # ============================================================
      # 8. FASTLANE MATCH
      # ============================================================
      - name: Setup certificates with Fastlane Match
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          FL_NO_UPDATE_ACTION: "true"
          CI: "true"
        run: |
          set -euo pipefail
          for name in MATCH_PASSWORD ASC_TEAM_ID MATCH_GIT_BASIC_AUTHORIZATION; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done

          cd core_project

          COMMON_ARGS=(
            appstore
            --git_url "$MATCH_GIT_URL"
            --git_branch "$MATCH_GIT_BRANCH"
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION"
            --type appstore
            --app_identifier "$APP_BUNDLE_ID"
            --team_id "$ASC_TEAM_ID"
            --api_key_path /tmp/asc_api_key.json
          )

          case "$SIGNING_MODE" in
            readonly)
              fastlane match "${COMMON_ARGS[@]}" --readonly
              ;;
            bootstrap_empty)
              # Repository emptiness and explicit WRITE confirmation were checked above.
              fastlane match "${COMMON_ARGS[@]}"
              ;;
            refresh_profile)
              # Regenerates the App Store provisioning profile while reusing the
              # existing Match certificate. Use after enabling capabilities such
              # as Associated Domains on the App ID.
              fastlane match "${COMMON_ARGS[@]}" --force
              ;;
          esac

      # ============================================================
      # 9. VERIFY INSTALLED APP STORE PROFILE
      #    Universal Links require Associated Domains in the actual profile.
      # ============================================================
      - name: Verify Readori provisioning profile capabilities
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MATCHED=''

          shopt -s nullglob
          for p in "$PROFILE_DIR"/*.mobileprovision; do
            out="$(mktemp)"
            if security cms -D -i "$p" > "$out" 2>/dev/null; then
              appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$out" 2>/dev/null || true)"
              if [[ "$appid" == "$ASC_TEAM_ID.$APP_BUNDLE_ID" ]]; then
                cp "$out" /tmp/readori-profile.plist
                MATCHED="$p"
                rm -f "$out"
                break
              fi
            fi
            rm -f "$out"
          done

          [[ -n "$MATCHED" ]] || {
            echo "::error::No installed App Store provisioning profile covers $ASC_TEAM_ID.$APP_BUNDLE_ID"
            exit 78
          }

          echo "Matched profile: $(basename "$MATCHED")"

          python3 - <<'PYEOF'
          import plistlib
          p = plistlib.load(open('/tmp/readori-profile.plist','rb'))
          ent = p.get('Entitlements', {})
          domains = ent.get('com.apple.developer.associated-domains', [])
          if isinstance(domains, str):
              domains = [domains]
          required = 'applinks:api.readori.com'
          if required not in domains:
              raise SystemExit(
                  'Provisioning profile is missing Associated Domains: '
                  + required
                  + '. Enable Associated Domains for com.readori.app in Apple Developer, '
                    'then run signing_mode=refresh_profile with write_confirmation=WRITE.'
              )
          print('Associated Domains profile capability: PASS')
          PYEOF

      # ============================================================
      # 10. BUILD
      # ============================================================
      - name: Build IPA
        run: |
          set -euo pipefail
          mkdir -p build
          cd core_project
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh \
            "${{ inputs.app_scheme }}" \
            "${GITHUB_WORKSPACE}/build"

      # ============================================================
      # 11. OUTPUT / ARTIFACT
      # ============================================================
      - name: Show output
        run: ls -R build || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*.ipa
          if-no-files-found: error

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo '## Readori certificates / build workflow'
            echo
            echo "- Signing mode: \`${{ inputs.signing_mode }}\`"
            echo "- Certificates repo: \`$MATCH_GIT_URL\`"
            echo '- Certificates auth: HTTPS/PAT (SSH deliberately disabled)'
            echo "- App ID: \`$APP_BUNDLE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
