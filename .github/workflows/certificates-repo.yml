name: certificates-repo asc-cli V2

on:
  workflow_dispatch:
    inputs:
      app_scheme:
        description: "SPM / xcodebuild scheme name"
        required: false
        default: "Readori"
        type: string

      xcode_version:
        description: "Xcode version (optional)"
        required: false
        default: ""
        type: string

      signing_mode:
        description: "readonly | refresh_profile | recover_existing_identity | bootstrap_empty"
        required: true
        default: "readonly"
        type: choice
        options:
          - readonly
          - refresh_profile
          - recover_existing_identity
          - bootstrap_empty

      write_confirmation:
        description: "For write modes only: type WRITE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: certificates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: production

    env:
      APP_BUNDLE_ID: com.readori.app
      MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
      MATCH_GIT_BRANCH: main

    steps:
      # ============================================================
      # 1. PRIVATE APP SOURCE — SSH only
      # ============================================================
      - name: Configure source repository SSH
        env:
          PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_REPO_KEY:-}" ]] || { echo '::error::Missing PRIVATE_REPO_KEY.'; exit 78; }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$PRIVATE_REPO_KEY" > "$HOME/.ssh/app_key"
          chmod 600 "$HOME/.ssh/app_key"
          ssh-keygen -y -f "$HOME/.ssh/app_key" >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY is not a valid SSH private key.'
            exit 78
          }

          cat > "$HOME/.ssh/config" <<'EOF'
          Host github-app
            HostName github.com
            User git
            IdentityFile ~/.ssh/app_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

          git ls-remote git@github-app:readori/readori.git HEAD >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY cannot read readori/readori.'
            exit 78
          }
          echo 'Private source repository access: PASS'

      - name: Clone private repo
        run: |
          set -euo pipefail
          git clone --depth=1 git@github-app:readori/readori.git core_project
          echo "[clone] $(git -C core_project rev-parse --short HEAD)"

      # ============================================================
      # 2. SANITIZE HISTORICAL MATCHFILE IN RUNNER ONLY
      #    The private repository may still contain the old github-certs
      #    SSH URL and readonly(true). Do not let those defaults leak into CI.
      #    This does NOT commit or modify the user's repository.
      # ============================================================
      - name: Install CI-safe Matchfile override
        run: |
          set -euo pipefail
          mkdir -p core_project/fastlane
          if [[ -f core_project/fastlane/Matchfile ]]; then
            cp core_project/fastlane/Matchfile /tmp/Readori.Matchfile.original
          fi
          cat > core_project/fastlane/Matchfile <<'RUBY'
          git_url(ENV.fetch("MATCH_GIT_URL"))
          storage_mode("git")
          git_branch(ENV.fetch("MATCH_GIT_BRANCH", "main"))
          type("appstore")
          app_identifier([ENV.fetch("APP_BUNDLE_ID", "com.readori.app")])
          team_id(ENV["ASC_TEAM_ID"]) if ENV["ASC_TEAM_ID"] && !ENV["ASC_TEAM_ID"].empty?
          readonly(%w[true 1 yes].include?(ENV.fetch("MATCH_READONLY", "true").downcase))
          RUBY
          echo 'CI Matchfile override installed (HTTPS URL + environment-controlled readonly).'

      # ============================================================
      # 3. CERT REPOSITORY — HTTPS + TARGET_REPO_PAT only
      # ============================================================
      - name: Configure certificates repository authentication
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          WRITE_CONFIRMATION: ${{ inputs.write_confirmation }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          [[ -n "${TARGET_REPO_PAT:-}" ]] || { echo '::error::Missing TARGET_REPO_PAT'; exit 78; }

          case "$SIGNING_MODE" in
            readonly) ;;
            refresh_profile|recover_existing_identity|bootstrap_empty)
              [[ "$WRITE_CONFIRMATION" == 'WRITE' ]] || {
                echo '::error::Write signing mode requires write_confirmation=WRITE.'
                exit 64
              }
              echo '::notice::TARGET_REPO_PAT must have Contents: Read and write on readori/readori-certificates.'
              ;;
            *) echo "::error::Unsupported signing_mode: $SIGNING_MODE"; exit 64 ;;
          esac

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$TARGET_REPO_PAT"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"

          git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
            ls-remote "$MATCH_GIT_URL" >/tmp/readori-match-refs.txt || {
              echo '::error::TARGET_REPO_PAT cannot read readori/readori-certificates.'
              exit 78
            }
          echo 'Certificates repository HTTPS/TARGET_REPO_PAT access: PASS'

          if [[ "$SIGNING_MODE" == 'bootstrap_empty' && -s /tmp/readori-match-refs.txt ]]; then
            echo '::error::bootstrap_empty refused: certificates repository is not empty.'
            echo '::error::Use recover_existing_identity if the repository lacks a usable private key.'
            exit 64
          fi

      # ============================================================
      # 4. FASTLANE 2.238.0
      # ============================================================
      - name: Install pinned Fastlane
        run: |
          set -euo pipefail
          sudo gem install fastlane -v 2.238.0 --no-document
          fastlane --version

      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        uses: readori/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      # ============================================================
      # 5. ASC API KEY
      # ============================================================
      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PYEOF'
          import base64, json, os
          from pathlib import Path

          raw = os.environ['ASC_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'BEGIN PRIVATE KEY' in raw or 'BEGIN EC PRIVATE KEY' in raw:
              key = raw
          else:
              try:
                  key = base64.b64decode(''.join(raw.split()), validate=True).decode('utf-8').strip()
              except Exception as exc:
                  raise SystemExit(f'ASC_PRIVATE_KEY is neither PEM nor valid base64: {exc}')
          if 'PRIVATE KEY' not in key:
              raise SystemExit('ASC_PRIVATE_KEY did not decode to a .p8 PEM private key')

          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          key_path = Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{key_id}.p8'
          key_path.write_text(key + ('\n' if not key.endswith('\n') else ''), encoding='utf-8')
          os.chmod(key_path, 0o600)
          Path('/tmp/asc_api_key.json').write_text(json.dumps({
              'key_id': key_id,
              'issuer_id': issuer_id,
              'key': key,
              'in_house': False,
          }), encoding='utf-8')
          print('ASC API key JSON written OK')
          PYEOF

      # ============================================================
      # 6. OPTIONAL RECOVERY OF EXISTING DISTRIBUTION IDENTITY
      #    Uses the already-configured IOS_CERTIFICATE + password.
      #    No new Apple Distribution certificate is created and nothing is revoked.
      # ============================================================
      - name: Recover existing Apple Distribution identity into Match
        if: ${{ inputs.signing_mode == 'recover_existing_identity' }}
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE MATCH_PASSWORD ASC_TEAM_ID MATCH_GIT_BASIC_AUTHORIZATION; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done

          WORK="$RUNNER_TEMP/readori-existing-identity"
          KC="$WORK/recovery.keychain-db"
          P12="$WORK/legacy.p12"
          BLANK_P12="$WORK/recovered.p12"
          CERT_PEM="$WORK/recovered.pem"
          CERT_DER="$WORK/recovered.cer"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          chmod 700 "$WORK"

          export P12
          python3 - <<'PYEOF'
          import base64, os
          from pathlib import Path
          raw = ''.join(os.environ['IOS_CERTIFICATE'].split())
          try:
              blob = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'IOS_CERTIFICATE must be the base64-encoded PKCS#12 (.p12): {exc}')
          if len(blob) < 256:
              raise SystemExit('IOS_CERTIFICATE decoded to an unexpectedly small file')
          Path(os.environ['P12']).write_bytes(blob)
          os.chmod(os.environ['P12'], 0o600)
          print(f'Legacy IOS_CERTIFICATE decoded ({len(blob)} bytes)')
          PYEOF

          # Import into an isolated keychain first. This proves that the P12 password
          # and private key are usable before anything is written to Match.
          security create-keychain -p recovery-temp "$KC"
          security unlock-keychain -p recovery-temp "$KC"
          security import "$P12" -k "$KC" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A >/dev/null

          ID_COUNT="$(security find-identity -v -p codesigning "$KC" | grep -c 'Apple Distribution\|iPhone Distribution' || true)"
          [[ "$ID_COUNT" -ge 1 ]] || {
            echo '::error::IOS_CERTIFICATE does not contain a usable Apple Distribution identity + private key.'
            security delete-keychain "$KC" || true
            exit 78
          }

          # Extract the imported leaf certificate and verify it has not expired.
          security find-certificate -a -p "$KC" > "$CERT_PEM"
          openssl x509 -in "$CERT_PEM" -noout -checkend 0 || {
            echo '::error::IOS_CERTIFICATE is expired.'
            security delete-keychain "$KC" || true
            exit 78
          }
          openssl x509 -in "$CERT_PEM" -outform der -out "$CERT_DER"

          # match later imports private-key PKCS#12 files with an empty password.
          # Let Apple's Security framework export the identity with that representation.
          security export -k "$KC" -t identities -f pkcs12 -P '' -o "$BLANK_P12" >/dev/null
          chmod 600 "$BLANK_P12" "$CERT_DER"

          # Resolve the exact Apple Developer certificate ID before import. If the
          # certificate was revoked or is not part of this Team, fail safely here.
          export CERT_DER
          RECOVERED_CERTIFICATE_ID="$(ruby <<'RUBY'
          require 'base64'
          require 'spaceship'
          token = Spaceship::ConnectAPI::Token.from(filepath: '/tmp/asc_api_key.json')
          Spaceship::ConnectAPI.token = token
          wanted = Base64.strict_encode64(File.binread(ENV.fetch('CERT_DER')))
          types = [
            Spaceship::ConnectAPI::Certificate::CertificateType::IOS_DISTRIBUTION,
            Spaceship::ConnectAPI::Certificate::CertificateType::MAC_APP_DISTRIBUTION,
            Spaceship::ConnectAPI::Certificate::CertificateType::DISTRIBUTION
          ].join(',')
          cert = Spaceship::ConnectAPI::Certificate.all(filter: { certificateType: types }).find do |item|
            item.certificate_content == wanted
          end
          abort('RECOVERY_CERT_NOT_ON_PORTAL') unless cert
          puts cert.id
          RUBY
          )" || {
            echo '::error::IOS_CERTIFICATE is not an active Distribution certificate on this Apple Developer team.'
            echo '::error::Do not revoke certificates blindly. Supply another existing valid identity or free one certificate slot intentionally.'
            security delete-keychain "$KC" || true
            exit 78
          }
          [[ -n "$RECOVERED_CERTIFICATE_ID" ]] || { echo '::error::Unable to resolve Distribution certificate ID.'; exit 78; }
          echo "RECOVERED_CERTIFICATE_ID=$RECOVERED_CERTIFICATE_ID" >> "$GITHUB_ENV"
          echo 'Existing Distribution identity verified against Apple Developer Portal: PASS'

          cd core_project

          # Import the already-existing identity into the encrypted Match repository.
          # Paths are piped into the official match import prompts. No new Apple cert is created.
          printf '%s\n%s\n\n' "$CERT_DER" "$BLANK_P12" | \
            MATCH_READONLY=false fastlane match import \
              --git_url "$MATCH_GIT_URL" \
              --git_branch "$MATCH_GIT_BRANCH" \
              --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION" \
              --type appstore \
              --app_identifier "$APP_BUNDLE_ID" \
              --team_id "$ASC_TEAM_ID" \
              --api_key_path /tmp/asc_api_key.json \
              --readonly false

          security delete-keychain "$KC" || true
          rm -rf "$WORK"
          echo 'Existing Distribution identity imported into Match: PASS'

      # ============================================================
      # 7. SWIFT RESOLVE / ICONS
      # ============================================================
      - name: Resolve Swift Packages
        run: |
          set -euo pipefail
          cd core_project
          swift package resolve

      - name: Generate icons
        run: |
          set -euo pipefail
          if [[ -f "core_project/scripts/generate_icons.swift" ]]; then
            swift core_project/scripts/generate_icons.swift "${GITHUB_WORKSPACE}/core_project"
          fi

      # ============================================================
      # 8. MATCH / PROFILE REFRESH
      # ============================================================
      - name: Setup certificates with Fastlane Match
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          FL_NO_UPDATE_ACTION: "true"
          CI: "true"
        run: |
          set -euo pipefail
          for name in MATCH_PASSWORD ASC_TEAM_ID MATCH_GIT_BASIC_AUTHORIZATION; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done
          cd core_project

          COMMON_ARGS=(
            appstore
            --git_url "$MATCH_GIT_URL"
            --git_branch "$MATCH_GIT_BRANCH"
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION"
            --type appstore
            --app_identifier "$APP_BUNDLE_ID"
            --team_id "$ASC_TEAM_ID"
            --api_key_path /tmp/asc_api_key.json
          )

          case "$SIGNING_MODE" in
            readonly)
              MATCH_READONLY=true fastlane match "${COMMON_ARGS[@]}" --readonly true
              ;;

            refresh_profile)
              # Safe refresh: first prove a valid Distribution identity already exists
              # in Match. Do NOT fall through to certificate creation when Apple slots
              # are full. If this preflight fails, use recover_existing_identity.
              echo 'Preflight: validating existing Match Distribution identity without profiles...'
              if ! MATCH_READONLY=true fastlane match "${COMMON_ARGS[@]}" \
                    --readonly true \
                    --skip_provisioning_profiles true; then
                echo '::error::No usable Distribution identity exists in Match.'
                echo '::error::Run signing_mode=recover_existing_identity with write_confirmation=WRITE to recover IOS_CERTIFICATE safely.'
                exit 78
              fi

              MATCH_READONLY=false fastlane match "${COMMON_ARGS[@]}" \
                --readonly false \
                --force
              ;;

            recover_existing_identity)
              [[ -n "${RECOVERED_CERTIFICATE_ID:-}" ]] || {
                echo '::error::Recovery step did not produce RECOVERED_CERTIFICATE_ID.'
                exit 78
              }
              # Pin Match to the exact identity we just verified/imported so stale
              # historical certificate files cannot cause it to choose another pair.
              MATCH_READONLY=false fastlane match "${COMMON_ARGS[@]}" \
                --readonly false \
                --certificate_id "$RECOVERED_CERTIFICATE_ID" \
                --force
              ;;

            bootstrap_empty)
              # First-time repository initialization only. This mode may ask Apple to
              # create a Distribution certificate and will still fail if the Team's
              # certificate quota is already full. It is NOT the recovery path.
              MATCH_READONLY=false fastlane match "${COMMON_ARGS[@]}" \
                --readonly false \
                --generate_apple_certs true
              ;;
          esac

      # ============================================================
      # 9. VERIFY ASSOCIATED DOMAINS IN THE ACTUAL PROFILE
      # ============================================================
      - name: Verify Readori provisioning profile capabilities
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          MATCHED=''
          for PROFILE_DIR in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            [[ -d "$PROFILE_DIR" ]] || continue
            while IFS= read -r p; do
              [[ -f "$p" ]] || continue
              out="$(mktemp)"
              if security cms -D -i "$p" > "$out" 2>/dev/null; then
                appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$out" 2>/dev/null || true)"
                if [[ "$appid" == "$ASC_TEAM_ID.$APP_BUNDLE_ID" ]]; then
                  cp "$out" /tmp/readori-profile.plist
                  MATCHED="$p"
                  rm -f "$out"
                  break 2
                fi
              fi
              rm -f "$out"
            done < <(find "$PROFILE_DIR" -maxdepth 1 -type f \( -name '*.mobileprovision' -o -name '*.provisionprofile' \) -print 2>/dev/null)
          done

          [[ -n "$MATCHED" ]] || {
            echo "::error::No installed App Store profile covers $ASC_TEAM_ID.$APP_BUNDLE_ID"
            exit 78
          }
          echo "Matched profile: $(basename "$MATCHED")"

          python3 - <<'PYEOF'
          import plistlib
          with open('/tmp/readori-profile.plist','rb') as fh:
              p = plistlib.load(fh)
          ent = p.get('Entitlements', {})
          domains = ent.get('com.apple.developer.associated-domains', [])
          if isinstance(domains, str):
              domains = [domains]
          required = 'applinks:api.readori.com'
          if required not in domains:
              raise SystemExit(
                  'Provisioning profile is missing Associated Domains: ' + required
                  + '. Enable Associated Domains for com.readori.app in Apple Developer, '
                    'then run refresh_profile or recover_existing_identity with WRITE.'
              )
          print('Associated Domains profile capability: PASS')
          PYEOF

      # ============================================================
      # 10. BUILD
      # ============================================================
      - name: Build IPA
        run: |
          set -euo pipefail
          mkdir -p build
          cd core_project
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh \
            "${{ inputs.app_scheme }}" \
            "${GITHUB_WORKSPACE}/build"

      - name: Show output
        run: ls -R build || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*.ipa
          if-no-files-found: error

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo '## Readori certificates / build workflow v5'
            echo
            echo "- Signing mode: \`${{ inputs.signing_mode }}\`"
            echo "- Certificates repo: \`$MATCH_GIT_URL\`"
            echo '- Certificates auth: HTTPS + TARGET_REPO_PAT'
            echo '- Existing identity recovery: IOS_CERTIFICATE + IOS_CERTIFICATE_PASSWORD (when explicitly selected)'
            echo '- Safety: no automatic certificate revocation / no match nuke'
            echo "- App ID: \`$APP_BUNDLE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
