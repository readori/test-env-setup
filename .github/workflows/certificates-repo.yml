name: certificates-repo asc-cli V2

on:
  workflow_dispatch:
    inputs:
      app_scheme:
        description: "SPM / xcodebuild scheme name"
        required: false
        default: "Readori"
        type: string

      xcode_version:
        description: "Xcode version (optional)"
        required: false
        default: ""
        type: string

      signing_mode:
        description: "readonly_verify | fresh_bootstrap_both"
        required: true
        default: "readonly_verify"
        type: choice
        options:
          - readonly_verify
          - fresh_bootstrap_both

      destructive_confirmation:
        description: "For fresh_bootstrap_both only: type RESET_ALL_SIGNING"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: certificates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing:
    runs-on: macos-15
    timeout-minutes: 90
    environment: production

    env:
      READORI_BUNDLE_ID: com.readori.app
      MAIL_BUNDLE_ID: com.readori.mail
      MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
      MATCH_GIT_BRANCH: main

    steps:
      # ============================================================
      # 1. SAFETY / INPUTS
      # ============================================================
      - name: Validate requested operation
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
        run: |
          set -euo pipefail
          case "$SIGNING_MODE" in
            readonly_verify)
              ;;
            fresh_bootstrap_both)
              [[ "$DESTRUCTIVE_CONFIRMATION" == 'RESET_ALL_SIGNING' ]] || {
                echo '::error::fresh_bootstrap_both requires destructive_confirmation=RESET_ALL_SIGNING.'
                exit 64
              }
              echo '::warning::Fresh bootstrap assumes Apple Developer Distribution certificates/profiles were intentionally revoked/deleted first.'
              echo '::warning::This workflow clears signing assets from the Match repository branch, then creates ONE fresh Distribution identity and fresh App Store profiles for com.readori.app and com.readori.mail.'
              ;;
            *)
              echo "::error::Unsupported signing_mode: $SIGNING_MODE"
              exit 64
              ;;
          esac

      # ============================================================
      # 2. PRIVATE SOURCE — SSH only (build source)
      # ============================================================
      - name: Configure source repository SSH
        env:
          PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_REPO_KEY:-}" ]] || { echo '::error::Missing PRIVATE_REPO_KEY.'; exit 78; }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$PRIVATE_REPO_KEY" > "$HOME/.ssh/app_key"
          chmod 600 "$HOME/.ssh/app_key"
          ssh-keygen -y -f "$HOME/.ssh/app_key" >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY is not a valid SSH private key.'
            exit 78
          }

          cat > "$HOME/.ssh/config" <<'EOF'
          Host github-app
            HostName github.com
            User git
            IdentityFile ~/.ssh/app_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

          git ls-remote git@github-app:readori/readori.git HEAD >/dev/null || {
            echo '::error::PRIVATE_REPO_KEY cannot read readori/readori.'
            exit 78
          }
          echo 'Private source repository access: PASS'

      - name: Clone private repo
        run: |
          set -euo pipefail
          git clone --depth=1 git@github-app:readori/readori.git core_project
          echo "[clone] $(git -C core_project rev-parse --short HEAD)"

      # ============================================================
      # 3. MATCH REPOSITORY — TARGET_REPO_PAT / HTTPS ONLY
      # ============================================================
      - name: Configure Match repository authentication
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          set -euo pipefail
          [[ -n "${TARGET_REPO_PAT:-}" ]] || { echo '::error::Missing TARGET_REPO_PAT.'; exit 78; }

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$TARGET_REPO_PAT"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"

          git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
            ls-remote "$MATCH_GIT_URL" >/tmp/match-refs.txt || {
              echo '::error::TARGET_REPO_PAT cannot read readori/readori-certificates.'
              exit 78
            }
          echo 'Match repository HTTPS/TARGET_REPO_PAT access: PASS'

          if [[ "$SIGNING_MODE" == 'fresh_bootstrap_both' ]]; then
            echo '::notice::TARGET_REPO_PAT must have Contents: Read and write for readori/readori-certificates.'
          fi

      # ============================================================
      # 4. FASTLANE + ASC API KEY
      # ============================================================
      - name: Install pinned Fastlane
        run: |
          set -euo pipefail
          sudo gem install fastlane -v 2.238.0 --no-document
          fastlane --version

      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        uses: readori/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_TEAM_ID MATCH_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PYEOF'
          import base64, json, os
          from pathlib import Path
          raw = os.environ['ASC_PRIVATE_KEY'].strip().replace('\\n', '\n')
          if 'BEGIN PRIVATE KEY' in raw or 'BEGIN EC PRIVATE KEY' in raw:
              key = raw
          else:
              try:
                  key = base64.b64decode(''.join(raw.split()), validate=True).decode('utf-8').strip()
              except Exception as exc:
                  raise SystemExit(f'ASC_PRIVATE_KEY is neither PEM nor valid base64: {exc}')
          if 'PRIVATE KEY' not in key:
              raise SystemExit('ASC_PRIVATE_KEY did not decode to a .p8 PEM private key')
          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          key_path = Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{key_id}.p8'
          key_path.write_text(key + ('\n' if not key.endswith('\n') else ''), encoding='utf-8')
          os.chmod(key_path, 0o600)
          Path('/tmp/asc_api_key.json').write_text(json.dumps({
              'key_id': key_id,
              'issuer_id': issuer_id,
              'key': key,
              'in_house': False,
          }), encoding='utf-8')
          print('ASC API key JSON written OK')
          PYEOF

      # ============================================================
      # 5. EPHEMERAL KEYCHAIN
      # ============================================================
      - name: Create signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="readori-reset.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          rm -f "$KEYCHAIN_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "SIGNING_KEYCHAIN_NAME=$KEYCHAIN_NAME" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

      # ============================================================
      # 6. DESTRUCTIVE MATCH STORAGE RESET
      #    IMPORTANT: Apple Portal revocation/deletion is intentionally manual.
      #    This step only removes old encrypted signing files from Match storage.
      # ============================================================
      - name: Clear old Match signing assets
        if: ${{ inputs.signing_mode == 'fresh_bootstrap_both' }}
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/readori-match-reset"
          rm -rf "$WORK"

          git -c http.extraheader="AUTHORIZATION: basic $MATCH_GIT_BASIC_AUTHORIZATION" \
            clone --branch "$MATCH_GIT_BRANCH" "$MATCH_GIT_URL" "$WORK"

          cd "$WORK"
          BEFORE="$(git status --short)"
          rm -rf certs profiles
          git add -A

          if git diff --cached --quiet; then
            echo 'Match repository already contains no certs/profiles.'
          else
            git config user.name 'readori-signing-reset'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Reset Match signing assets for clean Readori + CF Mail bootstrap'
            git -c http.extraheader="AUTHORIZATION: basic $MATCH_GIT_BASIC_AUTHORIZATION" \
              push origin "$MATCH_GIT_BRANCH"
            echo 'Old Match certs/profiles removed from repository: PASS'
          fi

      # ============================================================
      # 7A. FRESH BOOTSTRAP
      #     One Distribution certificate is created by the first Match call.
      #     The second App Store profile reuses that same identity.
      # ============================================================
      - name: Fresh bootstrap Readori and CF Mail signing
        if: ${{ inputs.signing_mode == 'fresh_bootstrap_both' }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          COMMON=(
            --git_url "$MATCH_GIT_URL"
            --git_branch "$MATCH_GIT_BRANCH"
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION"
            --team_id "$ASC_TEAM_ID"
            --api_key_path /tmp/asc_api_key.json
            --readonly false
            --generate_apple_certs true
            --keychain_name "$SIGNING_KEYCHAIN_NAME"
            --keychain_password "$SIGNING_KEYCHAIN_PASSWORD"
            --skip_confirmation true
          )

          echo '=== 1/2 Readori: create fresh Distribution identity + App Store profile ==='
          MATCH_READONLY=false fastlane match appstore \
            --app_identifier "$READORI_BUNDLE_ID" \
            --force \
            "${COMMON[@]}"

          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH" >/dev/null

          ID_COUNT="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH" | grep -c 'Apple Distribution\|iPhone Distribution' || true)"
          [[ "$ID_COUNT" -ge 1 ]] || {
            echo '::error::Fresh Readori bootstrap completed without an Apple Distribution identity.'
            exit 78
          }
          echo "Distribution identity after Readori bootstrap: PASS ($ID_COUNT)"

          echo '=== 2/2 CF Mail: create fresh App Store profile using shared identity ==='
          MATCH_READONLY=false fastlane match appstore \
            --app_identifier "$MAIL_BUNDLE_ID" \
            --force \
            "${COMMON[@]}"

          echo 'Fresh Match bootstrap for both active apps: PASS'

      # ============================================================
      # 7B. READONLY VERIFY
      # ============================================================
      - name: Verify current Match assets readonly
        if: ${{ inputs.signing_mode == 'readonly_verify' }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for bundle in "$READORI_BUNDLE_ID" "$MAIL_BUNDLE_ID"; do
            echo "=== Verify $bundle ==="
            MATCH_READONLY=true fastlane match appstore \
              --app_identifier "$bundle" \
              --git_url "$MATCH_GIT_URL" \
              --git_branch "$MATCH_GIT_BRANCH" \
              --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION" \
              --team_id "$ASC_TEAM_ID" \
              --api_key_path /tmp/asc_api_key.json \
              --readonly true \
              --keychain_name "$SIGNING_KEYCHAIN_NAME" \
              --keychain_password "$SIGNING_KEYCHAIN_PASSWORD"
          done

      # ============================================================
      # 8. VALIDATE INSTALLED PROFILES
      # ============================================================
      - name: Validate Readori and CF Mail App Store profiles
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_ROOTS=(
            "$HOME/Library/MobileDevice/Provisioning Profiles"
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          )

          find_profile() {
            local bundle="$1"
            local out="$2"
            rm -f "$out"
            for root in "${PROFILE_ROOTS[@]}"; do
              [[ -d "$root" ]] || continue
              while IFS= read -r p; do
                tmp="$(mktemp)"
                if security cms -D -i "$p" > "$tmp" 2>/dev/null; then
                  appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$tmp" 2>/dev/null || true)"
                  gettask="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$tmp" 2>/dev/null || true)"
                  if [[ "$appid" == "$ASC_TEAM_ID.$bundle" && "$gettask" != 'true' ]]; then
                    cp "$tmp" "$out"
                    rm -f "$tmp"
                    echo "$p"
                    return 0
                  fi
                fi
                rm -f "$tmp"
              done < <(find "$root" -maxdepth 1 -type f \( -name '*.mobileprovision' -o -name '*.provisionprofile' \) -print 2>/dev/null)
            done
            return 1
          }

          READORI_PROFILE="$(find_profile "$READORI_BUNDLE_ID" /tmp/readori-appstore.plist)" || {
            echo '::error::No installed App Store profile found for com.readori.app.'
            exit 78
          }
          MAIL_PROFILE="$(find_profile "$MAIL_BUNDLE_ID" /tmp/readori-mail-appstore.plist)" || {
            echo '::error::No installed App Store profile found for com.readori.mail.'
            exit 78
          }

          echo "Readori profile: $(basename "$READORI_PROFILE")"
          echo "CF Mail profile: $(basename "$MAIL_PROFILE")"

          python3 - <<'PYEOF'
          import plistlib
          with open('/tmp/readori-appstore.plist','rb') as f:
              app = plistlib.load(f)
          ent = app.get('Entitlements', {})
          domains = ent.get('com.apple.developer.associated-domains', [])
          if isinstance(domains, str):
              domains = [domains]
          required = 'applinks:api.readori.com'
          if required not in domains:
              raise SystemExit(
                  'Readori App Store profile is missing Associated Domains: ' + required
                  + '. Enable Associated Domains on com.readori.app in Apple Developer before fresh bootstrap.'
              )
          print('Readori Associated Domains profile capability: PASS')

          with open('/tmp/readori-mail-appstore.plist','rb') as f:
              mail = plistlib.load(f)
          mail_ent = mail.get('Entitlements', {})
          if not str(mail_ent.get('application-identifier','')).endswith('.com.readori.mail'):
              raise SystemExit('CF Mail profile application-identifier mismatch')
          print('CF Mail App Store profile bundle identity: PASS')
          PYEOF

      # ============================================================
      # 9. BUILD READORI IPA (same workflow behavior as before)
      # ============================================================
      - name: Resolve Swift Packages
        run: |
          set -euo pipefail
          cd core_project
          swift package resolve

      - name: Generate icons
        run: |
          set -euo pipefail
          if [[ -f "core_project/scripts/generate_icons.swift" ]]; then
            swift core_project/scripts/generate_icons.swift "${GITHUB_WORKSPACE}/core_project"
          fi

      - name: Build IPA
        run: |
          set -euo pipefail
          mkdir -p build
          cd core_project
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh \
            "${{ inputs.app_scheme }}" \
            "${GITHUB_WORKSPACE}/build"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*.ipa
          if-no-files-found: error

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo '## Readori signing reset / verification v7'
            echo
            echo "- Mode: \`${{ inputs.signing_mode }}\`"
            echo "- Match repo: \`$MATCH_GIT_URL@$MATCH_GIT_BRANCH\`"
            echo '- Match auth: HTTPS + TARGET_REPO_PAT'
            echo '- Active App IDs: com.readori.app + com.readori.mail'
            echo '- Fresh bootstrap target: one shared Apple Distribution identity + two App Store profiles'
            echo '- APNs keys / ASC API keys / Identifiers are never deleted by this workflow'
            echo '- Apple Developer certificate/profile revocation is intentionally manual'
          } >> "$GITHUB_STEP_SUMMARY"
