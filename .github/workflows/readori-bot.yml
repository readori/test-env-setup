name: Readori Bot · Public CI → Private Source → Cloudflare

# Runs entirely in the PUBLIC repository readori/test-env-setup.
# No new GitHub Secrets are required.
#
# Existing public-repo secrets used:
#   TARGET_REPO_PAT
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN
#   READORI_SOCIAL_WORKER_ENDPOINT   # optional health check, already exists
#
# Existing Worker secrets (BOT_TOKEN / APPLE_IAP_* / PRO_LEASE_* / etc.)
# remain stored on Cloudflare and are NOT copied into this workflow.
# Cloudflare Wrangler deployments preserve existing Worker secrets.

on:
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "readori/readoritgbot branch / tag / SHA"
        required: true
        default: "main"
        type: string
      mode:
        description: "validate = test + dry-run only; deploy = migrations + deploy"
        required: true
        default: "deploy"
        type: choice
        options:
          - validate
          - deploy
      run_migrations:
        description: "Apply remote D1 migrations before deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: readori-bot-cloudflare-production
  cancel-in-progress: false

env:
  BOT_REPOSITORY: readori/readoritgbot
  BOT_DIR: bot
  WORKER_NAME: bot-readori
  D1_DATABASE_NAME: tg-bot-db
  KV_NAMESPACE_TITLE: SENT_RECORDS

jobs:
  bot:
    name: Validate and deploy Readori Bot
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # ============================================================
      # 1. Validate only the secrets that already exist in PUBLIC CI
      # ============================================================
      - name: Validate public CI credentials
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${TARGET_REPO_PAT:-}" ]] || missing+=("TARGET_REPO_PAT")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")

          if (( ${#missing[@]} )); then
            echo "::error::Missing existing public-repo secret(s): ${missing[*]}"
            exit 1
          fi

          echo "Public CI credentials: PASS"

      # ============================================================
      # 2. Checkout PRIVATE bot source with existing TARGET_REPO_PAT
      # ============================================================
      - name: Checkout private readori/readoritgbot
        uses: actions/checkout@v6
        with:
          repository: readori/readoritgbot
          ref: ${{ inputs.bot_ref }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: bot
          fetch-depth: 1
          persist-credentials: false

      - name: Verify private source
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::package.json missing"; exit 1; }
          test -f src/index.js || { echo "::error::src/index.js missing"; exit 1; }
          test -f wrangler.toml.template || { echo "::error::wrangler.toml.template missing"; exit 1; }

          echo "Private repo checkout: PASS"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Short SHA: $(git rev-parse --short HEAD)"

      # ============================================================
      # 3. Node + tests
      # ============================================================
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # This production deployment handles Cloudflare credentials.
          # Disable setup-node automatic package-manager caching so the job
          # does not depend on package-lock.json being committed/present.
          package-manager-cache: false

      - name: Verify Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          [[ "$(node --version)" == v24.* ]] || {
            echo "::error::Expected Node.js 24.x"
            exit 1
          }

      - name: Install dependencies
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        working-directory: bot
        run: npm run lint --if-present

      - name: Test
        working-directory: bot
        run: npm test

      - name: JavaScript syntax check
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 2>/dev/null || true)

          [[ "$found" -eq 1 ]] || echo "::notice::No JS files found under src/scripts"
          echo "JavaScript syntax: PASS"

      # ============================================================
      # 4. Discover EXISTING Cloudflare resources.
      #    No D1_DATABASE_ID / KV_NAMESPACE_ID GitHub secrets needed.
      # ============================================================
      - name: Discover existing D1 and KV IDs
        id: cloudflare_resources
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          echo "Wrangler:"
          npx wrangler --version

          # ---------- D1 ----------
          D1_JSON="$(npx wrangler d1 list --json)"
          D1_ID="$(
            printf '%s' "$D1_JSON" |
              jq -r --arg name "$D1_DATABASE_NAME" '
                .[]
                | select(.name == $name)
                | (.uuid // .id // empty)
              ' |
              head -n 1
          )"

          if [[ -z "$D1_ID" || "$D1_ID" == "null" ]]; then
            echo "::error::Existing D1 database '$D1_DATABASE_NAME' was not found."
            exit 1
          fi

          # ---------- KV ----------
          # Cloudflare KV namespace IDs are not secrets. We discover the
          # existing production namespace by its title instead of duplicating
          # the ID into another GitHub repository.
          KV_JSON="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100"
          )"

          KV_SUCCESS="$(printf '%s' "$KV_JSON" | jq -r '.success // false')"
          if [[ "$KV_SUCCESS" != "true" ]]; then
            echo "::error::Cloudflare KV namespace listing failed."
            printf '%s' "$KV_JSON" | jq -c '{success,errors,messages}' || true
            exit 1
          fi

          KV_ID="$(
            printf '%s' "$KV_JSON" |
              jq -r --arg title "$KV_NAMESPACE_TITLE" '
                .result[]
                | select(.title == $title)
                | .id
              ' |
              head -n 1
          )"

          if [[ -z "$KV_ID" || "$KV_ID" == "null" ]]; then
            echo "::error::Existing KV namespace '$KV_NAMESPACE_TITLE' was not found."
            echo "::error::No new namespace will be auto-created."
            exit 1
          fi

          echo "D1 database: $D1_DATABASE_NAME"
          echo "KV namespace: $KV_NAMESPACE_TITLE"

          # IDs are resource identifiers, not secret values, but do not need to
          # print them to the log.
          {
            echo "D1_DATABASE_ID=$D1_ID"
            echo "KV_NAMESPACE_ID=$KV_ID"
            echo "KV_PREVIEW_NAMESPACE_ID=$KV_ID"
          } >> "$GITHUB_ENV"

          echo "Existing Cloudflare resources: PASS"

      # ============================================================
      # 5. Render the PRIVATE repository's wrangler template
      # ============================================================
      - name: Render wrangler.toml
        working-directory: bot
        shell: bash
        env:
          AI_TTS_OPENAI_ENABLED: ${{ vars.AI_TTS_OPENAI_ENABLED }}
          AI_TTS_AZURE_ENABLED: ${{ vars.AI_TTS_AZURE_ENABLED }}
          AI_TTS_AZURE_PREFERRED_FOR_NATURAL: ${{ vars.AI_TTS_AZURE_PREFERRED_FOR_NATURAL }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_ENDPOINT: ${{ vars.AZURE_SPEECH_ENDPOINT }}
          AI_TTS_ORACLE_EDGE_ENABLED: ${{ vars.AI_TTS_ORACLE_EDGE_ENABLED }}
          ORACLE_EDGE_TTS_URL: ${{ vars.ORACLE_EDGE_TTS_URL }}
          AI_TTS_AZURE_VOICE_ZH_CN: ${{ vars.AI_TTS_AZURE_VOICE_ZH_CN }}
          AI_TTS_AZURE_VOICE_ZH_TW: ${{ vars.AI_TTS_AZURE_VOICE_ZH_TW }}
          AI_TTS_AZURE_VOICE_EN_US: ${{ vars.AI_TTS_AZURE_VOICE_EN_US }}
          AI_TTS_AZURE_VOICE_JA_JP: ${{ vars.AI_TTS_AZURE_VOICE_JA_JP }}
          AI_TTS_AZURE_VOICE_KO_KR: ${{ vars.AI_TTS_AZURE_VOICE_KO_KR }}
          AI_TTS_AZURE_VOICE_FR_FR: ${{ vars.AI_TTS_AZURE_VOICE_FR_FR }}
          AI_TTS_AZURE_VOICE_ES_ES: ${{ vars.AI_TTS_AZURE_VOICE_ES_ES }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          template_path = Path("wrangler.toml.template")
          if not template_path.is_file():
              raise SystemExit("wrangler.toml.template is missing")

          text = template_path.read_text(encoding="utf-8")

          # Current safe production default:
          # Cloudflare Workers AI / MeloTTS ON by binding,
          # OpenAI / Azure / Oracle OFF unless an existing GitHub Variable says otherwise.
          values = {
              "KV_NAMESPACE_ID": os.environ["KV_NAMESPACE_ID"],
              "KV_PREVIEW_NAMESPACE_ID": os.environ.get("KV_PREVIEW_NAMESPACE_ID") or os.environ["KV_NAMESPACE_ID"],
              "D1_DATABASE_ID": os.environ["D1_DATABASE_ID"],

              "AI_TTS_OPENAI_ENABLED": os.environ.get("AI_TTS_OPENAI_ENABLED", "").strip() or "false",
              "AI_TTS_AZURE_ENABLED": os.environ.get("AI_TTS_AZURE_ENABLED", "").strip() or "false",
              "AI_TTS_AZURE_PREFERRED_FOR_NATURAL": os.environ.get("AI_TTS_AZURE_PREFERRED_FOR_NATURAL", "").strip() or "false",
              "AZURE_SPEECH_REGION": os.environ.get("AZURE_SPEECH_REGION", "").strip(),
              "AZURE_SPEECH_ENDPOINT": os.environ.get("AZURE_SPEECH_ENDPOINT", "").strip(),

              "AI_TTS_ORACLE_EDGE_ENABLED": os.environ.get("AI_TTS_ORACLE_EDGE_ENABLED", "").strip() or "false",
              "ORACLE_EDGE_TTS_URL": os.environ.get("ORACLE_EDGE_TTS_URL", "").strip(),

              "AI_TTS_AZURE_VOICE_ZH_CN": os.environ.get("AI_TTS_AZURE_VOICE_ZH_CN", "").strip(),
              "AI_TTS_AZURE_VOICE_ZH_TW": os.environ.get("AI_TTS_AZURE_VOICE_ZH_TW", "").strip(),
              "AI_TTS_AZURE_VOICE_EN_US": os.environ.get("AI_TTS_AZURE_VOICE_EN_US", "").strip(),
              "AI_TTS_AZURE_VOICE_JA_JP": os.environ.get("AI_TTS_AZURE_VOICE_JA_JP", "").strip(),
              "AI_TTS_AZURE_VOICE_KO_KR": os.environ.get("AI_TTS_AZURE_VOICE_KO_KR", "").strip(),
              "AI_TTS_AZURE_VOICE_FR_FR": os.environ.get("AI_TTS_AZURE_VOICE_FR_FR", "").strip(),
              "AI_TTS_AZURE_VOICE_ES_ES": os.environ.get("AI_TTS_AZURE_VOICE_ES_ES", "").strip(),
          }

          for key, value in values.items():
              safe = str(value).replace("\\", "\\\\").replace('"', '\\"').replace("\r", "").replace("\n", "")
              text = text.replace(f"__{key}__", safe)

          unresolved = []
          for token in set(part for part in text.replace('"', ' ').split() if "__" in part):
              unresolved.append(token)
          if unresolved:
              raise SystemExit(f"Unresolved wrangler placeholders: {sorted(unresolved)}")

          Path("wrangler.toml").write_text(text, encoding="utf-8")
          print("wrangler.toml rendered")
          PY

          echo "Rendered configuration bindings:"
          grep -E '^(name|main|binding|database_name|AI_TTS_.*ENABLED)' wrangler.toml || true

      # ============================================================
      # 6. Confirm existing Worker secret NAMES on Cloudflare.
      #    Values remain hidden and are never moved into public CI.
      # ============================================================
      - name: Verify existing Cloudflare Worker secrets
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          SECRET_JSON="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"

          required=(
            BOT_TOKEN
            WEBHOOK_SECRET
            ADMIN_SECRET
            APPLE_IAP_KEY_ID
            APPLE_IAP_ISSUER_ID
            APPLE_IAP_PRIVATE_KEY
            PRO_LEASE_PRIVATE_KEY_JWK
            DEVICE_CHALLENGE_SECRET
            APPLE_ALLOW_SANDBOX_IAP
          )

          missing=()
          for name in "${required[@]}"; do
            if ! printf '%s' "$SECRET_JSON" |
                 jq -e --arg name "$name" '.[] | select(.name == $name)' >/dev/null; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "::error::The existing Cloudflare Worker is missing required secret name(s): ${missing[*]}"
            echo "::error::This CI intentionally does not copy secret values from another GitHub repository."
            exit 1
          fi

          echo "Existing Worker secrets: PASS (${#required[@]} required names found)"

      # ============================================================
      # 7. Build-only Wrangler validation
      # ============================================================
      - name: Wrangler dry-run
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/readori-bot-dry-run
          npx wrangler deploy \
            --dry-run \
            --outdir /tmp/readori-bot-dry-run \
            --keep-vars
          echo "Wrangler dry-run: PASS"

      - name: Stop after validate
        if: ${{ inputs.mode == 'validate' }}
        run: |
          echo "Validation completed."
          echo "No Cloudflare Worker code, D1 migration, or secret was changed."

      # ============================================================
      # 8. D1 migrations
      # ============================================================
      - name: Apply D1 migrations
        if: ${{ inputs.mode == 'deploy' && inputs.run_migrations }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Verify required D1 tables
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          OUT="$(
            npx wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          )"

          required_tables=(
            coupon_codes
            ordinary_coupon_claims
            send_records
            bind_codes
            social_bindings
            reading_sessions
            reading_session_dedup
            user_cultivation
            daily_reading_stats
            cultivation_logs
            user_finished_books
            pro_applications
            app_devices
            pro_purchases
            pro_devices
            pro_device_activation_history
            pro_reward_codes
            level24_pro_rewards
            ai_tts_daily_usage
            ai_tts_global_daily_usage
            ai_tts_provider_health
          )

          missing=()
          for table in "${required_tables[@]}"; do
            grep -q "$table" <<<"$OUT" || missing+=("$table")
          done

          if (( ${#missing[@]} )); then
            echo "::error::Missing required D1 table(s): ${missing[*]}"
            exit 1
          fi

          echo "Required D1 tables: PASS (${#required_tables[@]})"

      # ============================================================
      # 9. Deploy code/config only.
      #
      # IMPORTANT:
      # - No `wrangler secret put` here.
      # - Existing Worker secrets are preserved by Wrangler deployment.
      # - --keep-vars also preserves remote plain-text vars not represented
      #   in this config, while applying the TTS vars rendered above.
      # ============================================================
      - name: Deploy Cloudflare Worker
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars

      # ============================================================
      # 10. Health check using EXISTING public-repo endpoint secret
      # ============================================================
      - name: Health check
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
        run: |
          set -euo pipefail

          BASE="${READORI_SOCIAL_WORKER_ENDPOINT:-}"
          if [[ -z "$BASE" ]]; then
            echo "::notice::READORI_SOCIAL_WORKER_ENDPOINT is empty; deployment succeeded, HTTP health check skipped."
            exit 0
          fi

          BASE="${BASE%/}"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
                 "$BASE/health" > /tmp/readori-health.json; then
              cat /tmp/readori-health.json
              echo
              echo "Worker health check: PASS"
              exit 0
            fi
            echo "Health attempt $attempt failed; retrying..."
            sleep 3
          done

          echo "::error::Worker deployed but /health did not become healthy."
          exit 1

      # ============================================================
      # 11. Summary
      # ============================================================
      - name: Summary
        if: ${{ always() }}
        working-directory: bot
        shell: bash
        run: |
          {
            echo "## Readori Bot"
            echo
            echo "- CI repository: \`${{ github.repository }}\`"
            echo "- Source: \`$BOT_REPOSITORY\`"
            echo "- Ref: \`${{ inputs.bot_ref }}\`"
            echo "- SHA: \`$(git rev-parse --short HEAD 2>/dev/null || echo unknown)\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- D1: \`$D1_DATABASE_NAME\`"
            echo "- KV: \`$KV_NAMESPACE_TITLE\`"
            echo "- Existing Cloudflare Worker secret values were not copied or modified."
          } >> "$GITHUB_STEP_SUMMARY"
