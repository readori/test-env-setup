# SoDesk (lightweight P2P remote control, Go) cross-platform CI.
#
# Public CI repository -> source readori/SoDesk.
#
#   test  : on Linux, macOS and Windows: go vet, go test ./..., build the rds binary,
#           then test/smoke/smoke.sh (one host and one client on loopback: shell, jobs,
#           cp, sync, forward, clipboard).
#
# No deploy, signing or cloud credentials are used. Nothing is uploaded: no artifacts.
#
# Triggers: workflow_dispatch, or a push to main that changes ci-requests/sodesk.env (how the
# project's AI engineer requests a run). Only people with push access to this repo can trigger;
# never pull_request. The request file is parsed as plain KEY=VALUE text with strict patterns
# and is never executed.
#
# Safety rules (public repo, public logs): no pull_request triggers; third-party actions pinned
# to commit SHAs; TARGET_REPO_PAT is used only by the checkout step and not persisted; test
# output is limited to package results and failing-test logs.
name: SoDesk CI

run-name: SoDesk CI · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk.env)' || inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'readori/SoDesk branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk.env']

permissions:
  contents: read

concurrency:
  group: sodesk-ci-${{ inputs.ref || 'request' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/sodesk-ci-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
          else
            SOURCE_REF="$INPUT_REF"
          fi
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ -n "${TARGET_REPO_PAT:-}" ]] || {
            echo '::error::Missing public CI credential: TARGET_REPO_PAT (it must have read access to readori/SoDesk).'
            exit 78
          }
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "Source ref: $SOURCE_REF"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/SoDesk
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      # Linux and Windows images ship a Go toolchain; the macOS image does not put one on PATH.
      # GOTOOLCHAIN=auto then fetches the exact version go.mod asks for.
      - name: Install Go (macOS)
        if: runner.os == 'macOS'
        run: command -v go >/dev/null || brew install --quiet go

      - name: Toolchain
        working-directory: source
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go version
          echo "commit: $(git rev-parse --short HEAD)"
          { echo "### SoDesk CI · ${{ matrix.os }}"; echo; echo "- Source: \`readori/SoDesk@$(git rev-parse --short HEAD)\` (ref \`$SOURCE_REF\`)"; echo "- $(go version)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: go vet
        working-directory: source
        run: go vet ./...

      - name: go test
        if: always()
        working-directory: source
        run: |
          set -o pipefail
          # Package results plus the output of failing tests only.
          go test -count=1 ./... 2>&1 | grep -v 'no test files' | tee "$RUNNER_TEMP/test.log"

      - name: Build
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          EXT=''; [[ "$RUNNER_OS" == 'Windows' ]] && EXT='.exe'
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/rds$EXT" ./cmd/rds
          "$RUNNER_TEMP/rds$EXT" version
          echo "RDS_BIN=$RUNNER_TEMP/rds$EXT" >> "$GITHUB_ENV"

      - name: Loopback smoke test
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          [[ -f test/smoke/smoke.sh ]] || { echo '::notice::test/smoke/smoke.sh is not on this ref; skipped.'; exit 0; }
          bash test/smoke/smoke.sh "$RDS_BIN"
