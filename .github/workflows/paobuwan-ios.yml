# Paobuwan (The Long Boring Run) iOS CI.
#
# Public CI repository -> private source readori/paobuwan (Expo SDK 57 / React Native).
# Modeled on shiftmile-ci.yml (native Xcode pipeline) with the Expo-specific steps added:
#   npm ci -> expo prebuild -> pod install -> Xcode build/archive of the .xcworkspace.
#
# Safety rules (public repo, public logs):
#   - workflow_dispatch only; never pull_request.
#   - third-party actions pinned to commit SHAs; xcodebuild always -quiet.
#   - derived secret values are add-mask'ed; private source/config files are never printed.
#   - no sideload, no GitHub Release, no Actions artifact: the signed IPA never leaves the
#     runner (this repo is public; artifacts would be downloadable by anyone signed in).
#   - signing material is created only in signed modes, after all private-source
#     lifecycle scripts (npm ci / prebuild / pod install) have run.
name: Paobuwan iOS CI

run-name: Paobuwan iOS · ${{ inputs.mode || 'verify' }} · ${{ inputs.ref || 'main' }}${{ inputs.build_number && format(' · build {0}', inputs.build_number) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = simulator build + Maestro smoke (no signing); archive = signed IPA + altool validate (IPA is not kept); testflight = archive + upload to TestFlight'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
          - archive
          - testflight
      ref:
        description: 'Private readori/paobuwan branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      build_number:
        description: 'Build number (CFBundleVersion), entered by the product owner. Required for archive / testflight: a whole number higher than the last build uploaded to App Store Connect. verify: leave empty (uses the run number).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: paobuwan-ios-${{ inputs.ref || 'main' }}-${{ inputs.mode || 'verify' }}
  cancel-in-progress: false

env:
  PRIVATE_SOURCE_REPOSITORY: readori/paobuwan
  PRIVATE_SOURCE_PATH: source
  EXPECTED_BUNDLE_ID: com.readori.paobuwan
  # Live Activity widget extension (T-071). Optional: refs without the extension target build as before.
  EXPECTED_LIVE_ACTIVITY_BUNDLE_ID: com.readori.paobuwan.LiveActivity
  # Opus decision (T-008, 2026-10-11): Xcode 26.4+ on the 26.x track; min iOS 16.4.
  XCODE_MAJOR_WANTED: '26'
  XCODE_MIN_VERSION: '26.4'
  EXPECTED_MIN_IOS: '16.4'
  MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
  MATCH_GIT_BRANCH: main
  # Pinned like shiftmile-ci.yml / certificates-repo.yml. Upload itself uses Apple's altool.
  FASTLANE_VERSION: '2.238.0'
  # Maestro CLI (smoke tests). Verify mode only, and only when e2e/ contains *.yaml.
  # MAESTRO_SHA256 must be pinned by the product owner (see T-007 draft notes); the job
  # refuses to run an unverified download.
  MAESTRO_VERSION: '2.11.0'
  # Pinned 2026-10-12: sha256 of cli-2.11.0 maestro.zip (314886578 bytes), matches the GitHub release asset digest.
  MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
  # Privacy: the app collects nothing, so the build tooling should not phone home either.
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
  LANG: en_US.UTF-8

jobs:
  ios:
    name: Build Paobuwan iOS
    runs-on: macos-26
    timeout-minutes: 75

    env:
      MODE: ${{ inputs.mode || 'verify' }}
      SOURCE_REF: ${{ inputs.ref || 'main' }}
      BUILD_NUMBER_INPUT: ${{ inputs.build_number || '' }}

    steps:
      # ---------------------------------------------------------------------
      # 0. Request validation BEFORE any private-source checkout
      # ---------------------------------------------------------------------
      - name: Validate request and required secrets
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          PAOBUWAN_ASC_APP_ID: ${{ secrets.PAOBUWAN_ASC_APP_ID }}
        run: |
          set -euo pipefail

          case "$MODE" in
            verify|archive|testflight) ;;
            *)
              echo "::error::Unsupported mode: $MODE"
              exit 64
              ;;
          esac

          # The ref is used as a git ref only; keep it to a conservative character set.
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only).'
            exit 64
          }

          [[ -n "${TARGET_REPO_PAT:-}" ]] || {
            echo '::error::Missing public-repo secret TARGET_REPO_PAT.'
            echo '::error::It needs Contents read access to readori/paobuwan (and to readori-certificates for signed modes).'
            exit 78
          }

          if [[ "$MODE" == 'archive' || "$MODE" == 'testflight' ]]; then
            required=(MATCH_PASSWORD ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY ASC_TEAM_ID)
            if [[ "$MODE" == 'testflight' ]]; then
              required+=(PAOBUWAN_ASC_APP_ID)
            fi
            missing=0
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing public-repo secret required for $MODE mode: $name"
                missing=1
              fi
            done
            (( missing == 0 )) || exit 78

            if [[ "$MODE" == 'testflight' ]]; then
              [[ "$PAOBUWAN_ASC_APP_ID" =~ ^[0-9]+$ ]] || {
                echo '::error::PAOBUWAN_ASC_APP_ID must be the numeric App Store Connect Apple ID.'
                exit 78
              }
            fi
          fi

          # Build number: entered by hand on each run (product owner decision 2026-10-12).
          if [[ -n "$BUILD_NUMBER_INPUT" ]]; then
            [[ "$BUILD_NUMBER_INPUT" =~ ^[1-9][0-9]{0,8}$ ]] || {
              echo '::error::build_number must be a whole number (1-999999999) with no leading zeros, spaces, or dots.'
              exit 64
            }
          elif [[ "$MODE" == 'archive' || "$MODE" == 'testflight' ]]; then
            echo "::error::build_number is required for $MODE mode: enter a number higher than the last build uploaded to App Store Connect."
            exit 64
          fi

          echo "Mode: $MODE"
          echo "Private source ref: $SOURCE_REF"
          echo "Build number input: ${BUILD_NUMBER_INPUT:-<empty, verify uses run number>}"

      # ---------------------------------------------------------------------
      # 1. PUBLIC CI repository -> PRIVATE source repository
      # ---------------------------------------------------------------------
      - name: Checkout private Paobuwan source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/paobuwan
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify private source layout
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ABS="$GITHUB_WORKSPACE/$PRIVATE_SOURCE_PATH"
          for f in package.json package-lock.json app.json; do
            [[ -f "$SOURCE_ABS/$f" ]] || {
              echo "::error::Private source is missing $f at its root."
              exit 66
            }
          done

          SOURCE_COMMIT="$(git -C "$SOURCE_ABS" rev-parse HEAD)"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT_SHA=${SOURCE_COMMIT:0:8}" >> "$GITHUB_ENV"

          # Print only the comparison result, never the file contents.
          CONFIGURED_BUNDLE_ID="$(node -e 'const c=require(process.argv[1]).expo||{}; process.stdout.write(String((c.ios||{}).bundleIdentifier||""))' "$SOURCE_ABS/app.json")"
          [[ "$CONFIGURED_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::app.json ios.bundleIdentifier must be $EXPECTED_BUNDLE_ID (got: ${CONFIGURED_BUNDLE_ID:-<empty>})."
            exit 65
          }

          echo "Private source: $PRIVATE_SOURCE_REPOSITORY@$SOURCE_REF (${SOURCE_COMMIT:0:8})"
          echo "Bundle ID check: PASS"

      # ---------------------------------------------------------------------
      # 2. Toolchain: Node 24 (same major as the private repo's ci.yml) + Xcode 26.4+
      # ---------------------------------------------------------------------
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.PRIVATE_SOURCE_PATH }}/package-lock.json

      - name: Select Xcode 26.4+
        shell: bash
        run: |
          set -euo pipefail

          # Pick the newest non-beta Xcode of the wanted major by its real
          # CFBundleShortVersionString (file names do not sort reliably).
          XCODE_APP=''
          BEST_VERSION=''
          for app in /Applications/Xcode*.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            case "$app" in *[Bb]eta*) continue ;; esac
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [[ "${version%%.*}" == "$XCODE_MAJOR_WANTED" ]] || continue
            if [[ -z "$BEST_VERSION" ]] || [[ "$(printf '%s\n%s\n' "$BEST_VERSION" "$version" | sort -V | tail -1)" == "$version" ]]; then
              BEST_VERSION="$version"
              XCODE_APP="$app"
            fi
          done

          if [[ -z "$XCODE_APP" ]]; then
            echo "::error::No Xcode ${XCODE_MAJOR_WANTED}.x installation was found on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 69
          fi
          if [[ "$(printf '%s\n%s\n' "$XCODE_MIN_VERSION" "$BEST_VERSION" | sort -V | head -1)" != "$XCODE_MIN_VERSION" ]]; then
            echo "::error::Paobuwan CI requires Xcode $XCODE_MIN_VERSION or later on the 26.x track; newest found: $BEST_VERSION"
            exit 69
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected Xcode: $XCODE_APP ($BEST_VERSION)"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Runner architecture: $(uname -m)"

      # ---------------------------------------------------------------------
      # 3. JS dependencies, native project generation, CocoaPods
      #    (all private-source lifecycle scripts run here, BEFORE any signing
      #    material or App Store Connect key exists on the runner)
      # ---------------------------------------------------------------------
      - name: Install npm dependencies
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --no-audit --no-fund --loglevel=error

      - name: Generate native iOS project (expo prebuild)
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          # ios/ is generated, never committed. --no-install: JS deps are already
          # installed and CocoaPods runs as its own step below.
          npx expo prebuild --platform ios --clean --no-install

          test -d ios || {
            echo '::error::expo prebuild did not create ios/.'
            exit 66
          }

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/ios
        shell: bash
        run: |
          set -euo pipefail
          pod --version
          pod install --silent

      - name: Resolve workspace, scheme, version and build number
        shell: bash
        run: |
          set -euo pipefail

          IOS_DIR="$GITHUB_WORKSPACE/$PRIVATE_SOURCE_PATH/ios"

          WORKSPACE_PATH=''
          COUNT=0
          for ws in "$IOS_DIR"/*.xcworkspace; do
            [[ -d "$ws" ]] || continue
            WORKSPACE_PATH="$ws"
            COUNT=$((COUNT + 1))
          done
          (( COUNT == 1 )) || {
            echo "::error::Expected exactly one .xcworkspace in ios/ after pod install; found $COUNT."
            exit 66
          }

          # Expo names the scheme after the generated project (= workspace basename).
          SCHEME="$(basename "$WORKSPACE_PATH" .xcworkspace)"
          xcodebuild -list -workspace "$WORKSPACE_PATH" -json > "$RUNNER_TEMP/paobuwan-xcode-list.json"
          python3 - "$RUNNER_TEMP/paobuwan-xcode-list.json" "$SCHEME" <<'PY'
          import json, sys
          schemes = json.load(open(sys.argv[1])).get("workspace", {}).get("schemes", [])
          if sys.argv[2] not in schemes:
              print("::error::Scheme '%s' was not found in the generated workspace." % sys.argv[2])
              print("Available schemes (%d): %s" % (len(schemes), ", ".join(schemes[:40])))
              raise SystemExit(66)
          PY

          # Product bundle ID and marketing version as Xcode sees them (not printed in full).
          SETTINGS_FILE="$RUNNER_TEMP/paobuwan-build-settings.txt"
          xcodebuild -showBuildSettings -workspace "$WORKSPACE_PATH" -scheme "$SCHEME" -configuration Release 2>/dev/null > "$SETTINGS_FILE"

          BUNDLE_ID="$(awk -F ' = ' '/^ *PRODUCT_BUNDLE_IDENTIFIER = / {print $2; exit}' "$SETTINGS_FILE")"
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER is '${BUNDLE_ID:-<empty>}', expected $EXPECTED_BUNDLE_ID."
            exit 65
          }

          APP_VERSION="$(awk -F ' = ' '/^ *MARKETING_VERSION = / {print $2; exit}' "$SETTINGS_FILE")"
          [[ "$APP_VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]] || {
            echo "::error::MARKETING_VERSION must look like 0.1 or 0.1.0; got: ${APP_VERSION:-<empty>}"
            exit 64
          }

          # Build number: the build_number input (validated in step 0; required for archive / testflight).
          # verify without an input falls back to the run number (simulator only, never uploaded).
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-${GITHUB_RUN_NUMBER}}"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Build number is not a positive integer: $BUILD_NUMBER"
            exit 64
          }

          # expo prebuild writes a literal CFBundleVersion (app.json ios.buildNumber, default "1") into the app
          # Info.plist, so CURRENT_PROJECT_VERSION alone does not change the uploaded build number. Write it there.
          INFOPLIST_REL="$(awk -F ' = ' '/^ *INFOPLIST_FILE = / {print $2; exit}' "$SETTINGS_FILE")"
          INFOPLIST_PATH="$IOS_DIR/$INFOPLIST_REL"
          [[ -n "$INFOPLIST_REL" && -f "$INFOPLIST_PATH" ]] || {
            echo "::error::App Info.plist not found (INFOPLIST_FILE=${INFOPLIST_REL:-<empty>})."
            exit 66
          }
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFOPLIST_PATH"

          # Source commit (8-char short SHA) for the in-app diagnostics page (T-077 reads PBWSourceCommit).
          # Not a secret: the same short SHA is printed in this workflow's summary.
          if [[ "${SOURCE_SHORT_SHA:-}" =~ ^[0-9a-f]{7,40}$ ]]; then
            /usr/libexec/PlistBuddy -c "Delete :PBWSourceCommit" "$INFOPLIST_PATH" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :PBWSourceCommit string $SOURCE_SHORT_SHA" "$INFOPLIST_PATH"
          else
            echo '::warning::SOURCE_SHORT_SHA is missing; diagnostics will show no source commit.'
          fi

          DEPLOYMENT_TARGET="$(awk -F ' = ' '/^ *IPHONEOS_DEPLOYMENT_TARGET = / {print $2; exit}' "$SETTINGS_FILE")"
          if [[ "$DEPLOYMENT_TARGET" != "$EXPECTED_MIN_IOS" ]]; then
            echo "::warning::IPHONEOS_DEPLOYMENT_TARGET is '${DEPLOYMENT_TARGET:-<empty>}'; the Opus decision (T-008) is $EXPECTED_MIN_IOS."
          fi

          rm -f "$SETTINGS_FILE"

          # Live Activity widget extension target (added by the private repo's config plugin).
          # When present it is signed with its own App Store profile, and its Info.plist takes
          # CFBundleVersion from $(CURRENT_PROJECT_VERSION), so the xcodebuild override below
          # keeps it equal to the app's build number (checked after the build).
          HAS_LIVE_ACTIVITY=false
          LA_ID_PATTERN="PRODUCT_BUNDLE_IDENTIFIER = \"?${EXPECTED_LIVE_ACTIVITY_BUNDLE_ID//./\\.}\"?;"
          if grep -Eq "$LA_ID_PATTERN" "$IOS_DIR"/*.xcodeproj/project.pbxproj 2>/dev/null; then
            HAS_LIVE_ACTIVITY=true
          fi
          echo "HAS_LIVE_ACTIVITY=$HAS_LIVE_ACTIVITY" >> "$GITHUB_ENV"

          echo "WORKSPACE_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "Scheme: $SCHEME"
          echo "Version: $APP_VERSION ($BUILD_NUMBER)"
          echo "Deployment target: ${DEPLOYMENT_TARGET:-unknown}"
          echo "Live Activity extension target: $HAS_LIVE_ACTIVITY"

      # ---------------------------------------------------------------------
      # 4. VERIFY mode: Simulator build + Maestro smoke (no signing, no secrets)
      # ---------------------------------------------------------------------
      - name: Select an available iPhone Simulator
        if: ${{ env.MODE == 'verify' }}
        shell: bash
        run: |
          set -euo pipefail

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, runtime_devices in payload.get("devices", {}).items()
              if "SimRuntime.iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          print(devices[0]["udid"] if devices else "")
          ')"

          if [[ -z "$SIMULATOR_UDID" ]]; then
            xcrun simctl list devices available
            echo '::error::No available iPhone Simulator was found.'
            exit 69
          fi

          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "Selected simulator: $SIMULATOR_UDID"

      - name: Build app for iOS Simulator (Release, embedded JS bundle)
        if: ${{ env.MODE == 'verify' }}
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_DERIVED="$RUNNER_TEMP/DerivedData-Paobuwan-Verify"
          rm -rf "$VERIFY_DERIVED"

          # Release (not Debug) so the JS bundle is embedded and the app runs without Metro.
          # -quiet keeps private project metadata out of this PUBLIC log.
          xcodebuild build \
            -quiet \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$VERIFY_DERIVED" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          APP_PATH="$(find "$VERIFY_DERIVED/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$APP_PATH" && -d "$APP_PATH" ]] || {
            echo '::error::Simulator .app was not produced.'
            exit 65
          }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          [[ "$BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::Unexpected bundle identifier in built app: $BUNDLE_ID"
            exit 65
          }

          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            APPEX_PATH="$APP_PATH/PlugIns/LiveActivityExtension.appex"
            [[ -d "$APPEX_PATH" ]] || {
              echo '::error::Live Activity extension target exists but LiveActivityExtension.appex is not embedded in PlugIns.'
              exit 65
            }
            APPEX_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX_PATH/Info.plist")"
            APPEX_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APPEX_PATH/Info.plist")"
            APPEX_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APPEX_PATH/Info.plist")"
            APP_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
            [[ "$APPEX_ID" == "$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID" ]] || {
              echo "::error::Live Activity extension bundle ID is '$APPEX_ID', expected $EXPECTED_LIVE_ACTIVITY_BUNDLE_ID."
              exit 65
            }
            [[ "$APPEX_BUILD" == "$BUILD_NUMBER" && "$APPEX_VERSION" == "$APP_SHORT_VERSION" ]] || {
              echo "::error::Extension version $APPEX_VERSION ($APPEX_BUILD) does not match the app's $APP_SHORT_VERSION ($BUILD_NUMBER)."
              exit 65
            }
            echo "Live Activity extension embedded: $APPEX_ID $APPEX_VERSION ($APPEX_BUILD)"
          fi

          echo "SIMULATOR_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo 'Simulator build: PASS'

      - name: Detect Maestro flows
        if: ${{ env.MODE == 'verify' }}
        id: maestro_flows
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ABS="$GITHUB_WORKSPACE/$PRIVATE_SOURCE_PATH"
          FLOW_COUNT=0
          if [[ -d "$SOURCE_ABS/e2e" ]]; then
            FLOW_COUNT="$(find "$SOURCE_ABS/e2e" -type f -name '*.yaml' | wc -l | tr -d ' ')"
          fi

          if (( FLOW_COUNT == 0 )); then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No *.yaml flows in e2e/; skipping Maestro smoke tests.'
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "Maestro flow files: $FLOW_COUNT"
          fi

      - name: Install Maestro CLI
        if: ${{ env.MODE == 'verify' && steps.maestro_flows.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$MAESTRO_SHA256" ]] || {
            echo '::error::MAESTRO_SHA256 is not pinned in this workflow; refusing to run an unverified download.'
            echo "::error::Download https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip on a trusted machine, compute its SHA-256, and set MAESTRO_SHA256."
            exit 78
          }

          java -version 2>&1 | head -1 || {
            echo '::error::Java is required by Maestro and was not found on this runner.'
            exit 69
          }

          MAESTRO_ZIP="$RUNNER_TEMP/maestro.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$MAESTRO_ZIP"

          ACTUAL="$(shasum -a 256 "$MAESTRO_ZIP" | awk '{print $1}')"
          [[ "$ACTUAL" == "$MAESTRO_SHA256" ]] || {
            echo '::error::Maestro download checksum mismatch.'
            echo "::error::expected $MAESTRO_SHA256"
            echo "::error::actual   $ACTUAL"
            exit 65
          }

          MAESTRO_DIR="$RUNNER_TEMP/maestro-cli"
          rm -rf "$MAESTRO_DIR"
          mkdir -p "$MAESTRO_DIR"
          unzip -q "$MAESTRO_ZIP" -d "$MAESTRO_DIR"
          echo "$MAESTRO_DIR/maestro/bin" >> "$GITHUB_PATH"
          "$MAESTRO_DIR/maestro/bin/maestro" --version

      - name: Run Maestro smoke tests
        if: ${{ env.MODE == 'verify' && steps.maestro_flows.outputs.found == 'true' }}
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        shell: bash
        env:
          # Hosted macOS runners are slow to start Maestro's XCTest driver on a cold simulator;
          # the default startup wait is too short there ("iOS driver not ready in time"). Milliseconds.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          set -euo pipefail

          # Make sure the selected simulator is still fully booted after the long build.
          xcrun simctl boot "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          xcrun simctl install "$SIMULATOR_UDID" "$SIMULATOR_APP_PATH"

          # Infrastructure retry only: if Maestro's XCTest driver never comes up on the hosted runner,
          # reboot the simulator and try once more. A flow that actually runs and fails is never retried.
          MAESTRO_LOG="$RUNNER_TEMP/maestro-run.log"
          for attempt in 1 2; do
            set +e
            maestro --device "$SIMULATOR_UDID" test e2e/ 2>&1 | tee "$MAESTRO_LOG"
            status="${PIPESTATUS[0]}"
            set -e
            [[ "$status" -eq 0 ]] && exit 0
            if [[ "$attempt" -eq 1 ]] && grep -q 'iOS driver not ready in time' "$MAESTRO_LOG"; then
              echo '::warning::Maestro iOS driver did not start; rebooting the simulator and retrying once.'
              xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
              xcrun simctl boot "$SIMULATOR_UDID"
              xcrun simctl bootstatus "$SIMULATOR_UDID" -b
              xcrun simctl install "$SIMULATOR_UDID" "$SIMULATOR_APP_PATH"
              continue
            fi
            if grep -q 'iOS driver not ready in time' "$MAESTRO_LOG"; then
              echo 'MAESTRO_DRIVER_FAILED=true' >> "$GITHUB_ENV"
              echo '::error title=Maestro driver::iOS driver not ready in time (after one simulator reboot).'
            else
              # Failed flow lines as one annotation: annotations are readable through the public API
              # without signing in, unlike job logs.
              FAILED="$(sed -e 's/\x1b\[[0-9;]*m//g' "$MAESTRO_LOG" | grep -E '\[Failed\]|Flows? (Passed|Failed)|Element not found|Assertion is false' | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=Maestro failed flows::${FAILED:-no [Failed] lines found}"
            fi
            exit "$status"
          done

      - name: Diagnose Maestro failure (UI tree after choosing a mode, log only)
        if: ${{ failure() && env.MODE == 'verify' && steps.maestro_flows.outputs.found == 'true' && env.MAESTRO_DRIVER_FAILED != 'true' }}
        shell: bash
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: |
          set -uo pipefail

          # Replays the common first steps (fresh install -> health notice -> mode select -> Finger)
          # and prints only element ids, texts and labels on screen. No screenshots or artifacts are
          # published from this public repository.
          DIAG_DIR="$RUNNER_TEMP/maestro-diagnose"
          rm -rf "$DIAG_DIR"
          mkdir -p "$DIAG_DIR"
          cat > "$DIAG_DIR/diagnose.yaml" <<'YAML'
          appId: com.readori.paobuwan
          ---
          - launchApp:
              clearState: true
              stopApp: true
          - extendedWaitUntil:
              visible:
                id: "health-notice"
              timeout: 30000
          - tapOn:
              id: "health-notice-continue"
          - extendedWaitUntil:
              visible:
                id: "mode-select"
              timeout: 10000
          - waitForAnimationToEnd:
              timeout: 5000
          - tapOn:
              id: "mode-select-B"
          - waitForAnimationToEnd:
              timeout: 15000
          YAML

          maestro --device "$SIMULATOR_UDID" test "$DIAG_DIR/diagnose.yaml" || echo '::warning::Diagnostic replay itself failed; dumping the current screen anyway.'
          sleep 10

          maestro --device "$SIMULATOR_UDID" hierarchy > "$DIAG_DIR/hierarchy.json" 2>/dev/null || true
          python3 - "$DIAG_DIR/hierarchy.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          start = raw.find("{")
          if start < 0:
              print("No hierarchy JSON was produced.")
              raise SystemExit(0)
          tree = json.loads(raw[start:])
          lines = []
          def walk(node, depth=0):
              attrs = node.get("attributes", {}) or {}
              rid = attrs.get("resource-id") or ""
              text = attrs.get("text") or ""
              label = attrs.get("accessibilityText") or ""
              enabled = attrs.get("enabled")
              if rid or text or label:
                  parts = [p for p in (
                      ("id=" + rid) if rid else "",
                      ("text=" + text[:80]) if text else "",
                      ("label=" + label[:80]) if label and label != text else "",
                      "disabled" if enabled == "false" else "",
                  ) if p]
                  lines.append("  " * min(depth, 12) + " | ".join(parts))
              for child in node.get("children", []) or []:
                  walk(child, depth + 1)
          walk(tree)
          print("\n".join(lines))
          # Also emit the tree as annotations (readable through the public API without signing in).
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          chunks, cur = [], ""
          for line in lines:
              if len(cur) + len(line) + 1 > 3500:
                  chunks.append(cur)
                  cur = ""
              cur += line + "\n"
          if cur:
              chunks.append(cur)
          if not chunks:
              chunks = ["(no elements with id, text or label)"]
          total = min(len(chunks), 8)
          for i, chunk in enumerate(chunks[:8], 1):
              print("::notice title=Maestro UI tree " + str(i) + "/" + str(total) + "::" + esc(chunk))
          PY
          rm -rf "$DIAG_DIR"

      # ---------------------------------------------------------------------
      # 5. ARCHIVE / TESTFLIGHT: Match signing (readonly), archive, export, altool
      # ---------------------------------------------------------------------
      - name: Install pinned fastlane for Match only
        if: ${{ env.MODE == 'archive' || env.MODE == 'testflight' }}
        shell: bash
        run: |
          set -euo pipefail

          FASTLANE_GEM_HOME="$RUNNER_TEMP/fastlane-gems"
          rm -rf "$FASTLANE_GEM_HOME"
          mkdir -p "$FASTLANE_GEM_HOME"

          export GEM_HOME="$FASTLANE_GEM_HOME"
          export GEM_PATH="$FASTLANE_GEM_HOME"
          export PATH="$FASTLANE_GEM_HOME/bin:$PATH"

          gem install --no-document fastlane -v "$FASTLANE_VERSION"
          fastlane --version

          echo "GEM_HOME=$FASTLANE_GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$FASTLANE_GEM_HOME" >> "$GITHUB_ENV"
          echo "$FASTLANE_GEM_HOME/bin" >> "$GITHUB_PATH"

      - name: Create ephemeral keychain, write ASC key, install signing assets with Match
        if: ${{ env.MODE == 'archive' || env.MODE == 'testflight' }}
        shell: bash
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          # --- ephemeral keychain (password never leaves this step) ---------
          KEYCHAIN_NAME="paobuwan-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$LOGIN_KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"

          # --- App Store Connect API key (Match + altool) -------------------
          ASC_DIR="$RUNNER_TEMP/paobuwan-asc"
          mkdir -p "$ASC_DIR" "$HOME/.appstoreconnect/private_keys"
          P8_PATH="$ASC_DIR/AuthKey_${ASC_KEY_ID}.p8"
          API_KEY_JSON="$ASC_DIR/api-key.json"

          printf '%s\n' "$ASC_PRIVATE_KEY" > "$P8_PATH"
          chmod 600 "$P8_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$P8_PATH" || {
            echo '::error::ASC_PRIVATE_KEY does not look like an App Store Connect .p8 private key.'
            exit 78
          }
          cp "$P8_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          export P8_PATH_FOR_PY="$P8_PATH"
          python3 - "$API_KEY_JSON" <<'PY'
          import json, os, sys
          from pathlib import Path

          p8 = Path(os.environ["P8_PATH_FOR_PY"]).read_text(encoding="utf-8")
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": p8,
              "in_house": False,
          }
          Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          chmod 600 "$API_KEY_JSON"

          echo "ASC_P8_PATH=$P8_PATH" >> "$GITHUB_ENV"
          echo "ASC_API_KEY_JSON=$API_KEY_JSON" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"

          # --- Match repository authentication (readonly) -------------------
          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_AUTH"

          MATCH_BRANCH_SHA="$(
            git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
              ls-remote --heads "$MATCH_GIT_URL" "refs/heads/$MATCH_GIT_BRANCH" \
            | awk 'NR==1 {print $1}'
          )"
          [[ -n "$MATCH_BRANCH_SHA" ]] || {
            echo "::error::Match branch '$MATCH_GIT_BRANCH' is not readable in readori/readori-certificates (TARGET_REPO_PAT scope?)."
            exit 66
          }
          echo "Match branch: $MATCH_GIT_BRANCH (${MATCH_BRANCH_SHA:0:8})"

          # --- Match: shared Apple Distribution identity + Paobuwan App Store profile
          # Readonly by design: this workflow never writes to the shared certificates
          # repository. The profile is created once by certificates-repo.yml
          # (signing_mode=refresh_paobuwan_profile), which also covers the Live Activity extension.
          MATCH_APP_IDENTIFIERS="$EXPECTED_BUNDLE_ID"
          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            MATCH_APP_IDENTIFIERS="$EXPECTED_BUNDLE_ID,$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID"
          fi
          if ! MATCH_READONLY=true fastlane match appstore \
              --app_identifier "$MATCH_APP_IDENTIFIERS" \
              --git_url "$MATCH_GIT_URL" \
              --git_branch "$MATCH_GIT_BRANCH" \
              --git_basic_authorization "$MATCH_AUTH" \
              --team_id "$ASC_TEAM_ID" \
              --api_key_path "$API_KEY_JSON" \
              --keychain_name "$KEYCHAIN_NAME" \
              --keychain_password "$KEYCHAIN_PASSWORD" \
              --shallow_clone true \
              --clone_branch_directly true \
              --readonly true; then
            echo "::error::Readonly Match could not install signing assets for $MATCH_APP_IDENTIFIERS."
            echo '::error::First run? Run certificates-repo.yml with signing_mode=refresh_paobuwan_profile and destructive_confirmation=WRITE, then retry.'
            exit 65
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

      - name: Locate and validate installed App Store profile
        if: ${{ env.MODE == 'archive' || env.MODE == 'testflight' }}
        shell: bash
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          PROFILE_SCAN_DIR="$RUNNER_TEMP/paobuwan-profile-scan"
          rm -rf "$PROFILE_SCAN_DIR"
          mkdir -p "$PROFILE_SCAN_DIR"

          shopt -s nullglob
          candidates=(
            "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          )
          shopt -u nullglob

          # Prints the installed App Store profile name for one bundle ID, or exits 65.
          locate_profile() {
            local bundle="$1"
            local found_path='' found_name='' found_team='' found_get_task=''
            for profile in "${candidates[@]}"; do
              [[ -f "$profile" ]] || continue
              plist="$PROFILE_SCAN_DIR/$(basename "$profile").plist"
              /usr/bin/security cms -D -i "$profile" > "$plist" 2>/dev/null || continue

              app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)"
              [[ "$app_id" == *".$bundle" ]] || continue

              found_path="$profile"
              found_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
              found_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")"
              found_get_task="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist" 2>/dev/null || echo false)"
              break
            done

            [[ -n "$found_path" ]] || {
              echo "::error::No App Store provisioning profile for $bundle was installed by Match." >&2
              exit 65
            }
            [[ "$found_team" == "$ASC_TEAM_ID" ]] || {
              echo "::error::Provisioning profile team for $bundle does not match ASC_TEAM_ID." >&2
              exit 65
            }
            [[ "$found_get_task" != 'true' ]] || {
              echo "::error::Installed profile for $bundle has get-task-allow=true and is not an App Store distribution profile." >&2
              exit 65
            }
            printf '%s\n' "$found_name"
          }

          PROFILE_NAME="$(locate_profile "$EXPECTED_BUNDLE_ID")"
          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            LA_PROFILE_NAME="$(locate_profile "$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID")"
          fi

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution' || {
            echo '::error::No Apple Distribution signing identity was installed into the ephemeral keychain.'
            exit 65
          }

          rm -rf "$PROFILE_SCAN_DIR"
          echo "APPSTORE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile: $PROFILE_NAME"
          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            echo "LIVE_ACTIVITY_PROFILE_NAME=$LA_PROFILE_NAME" >> "$GITHUB_ENV"
            echo "Live Activity extension profile: $LA_PROFILE_NAME"
          fi

      - name: Check build number is higher than the latest TestFlight build
        if: ${{ env.MODE == 'testflight' }}
        shell: bash
        run: |
          set -euo pipefail

          # Fails in minutes instead of after the archive when build_number was already uploaded.
          # Read-only App Store Connect query with the same API key used by Match and altool.
          set +e
          LATEST_OUTPUT="$(
            fastlane run latest_testflight_build_number \
              api_key_path:"$ASC_API_KEY_JSON" \
              app_identifier:"$EXPECTED_BUNDLE_ID" \
              version:"$APP_VERSION" \
              initial_build_number:0 2>&1
          )"
          query_status=$?
          set -e
          LATEST="$(printf '%s\n' "$LATEST_OUTPUT" | sed -n 's/.*Result: \([0-9][0-9]*\).*/\1/p' | tail -1)"

          if [[ "$query_status" -ne 0 || -z "$LATEST" ]]; then
            echo '::warning title=Build number check skipped::Could not read the latest TestFlight build number; continuing to archive.'
            exit 0
          fi

          echo "Latest TestFlight build for $APP_VERSION: $LATEST; requested: $BUILD_NUMBER"
          if (( BUILD_NUMBER <= LATEST )); then
            echo "::error title=Build number already used::build_number $BUILD_NUMBER is not higher than the latest TestFlight build $LATEST for version $APP_VERSION. Re-run with build_number $((LATEST + 1)) or higher."
            exit 1
          fi

      - name: Build signed App Store archive and IPA
        if: ${{ env.MODE == 'archive' || env.MODE == 'testflight' }}
        shell: bash
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Paobuwan.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/Paobuwan-AppStore-Export"
          EXPORT_OPTIONS="$RUNNER_TEMP/Paobuwan-ExportOptions.plist"

          rm -rf "$ARCHIVE_PATH" "$EXPORT_DIR" "$EXPORT_OPTIONS"
          mkdir -p "$EXPORT_DIR"

          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            # Two signed targets (app + Live Activity extension) need different profiles, so the
            # profile cannot be a global xcodebuild override. Write it per target into the app's
            # Release configuration (xcodeproj ships with the pinned fastlane gem set).
            PBXPROJ_DIR=''
            for proj in "$(dirname "$WORKSPACE_PATH")"/*.xcodeproj; do
              [[ -d "$proj" ]] && PBXPROJ_DIR="$proj"
            done
            [[ -n "$PBXPROJ_DIR" ]] || {
              echo '::error::App .xcodeproj not found next to the workspace.'
              exit 66
            }
            export SIGN_APP_ID="$EXPECTED_BUNDLE_ID"
            export SIGN_APP_PROFILE="$APPSTORE_PROFILE_NAME"
            export SIGN_LA_ID="$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID"
            export SIGN_LA_PROFILE="$LIVE_ACTIVITY_PROFILE_NAME"
            export SIGN_TEAM_ID="$ASC_TEAM_ID"
            ruby - "$PBXPROJ_DIR" <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open(ARGV[0])
          profiles = {
            ENV.fetch('SIGN_APP_ID') => ENV.fetch('SIGN_APP_PROFILE'),
            ENV.fetch('SIGN_LA_ID') => ENV.fetch('SIGN_LA_PROFILE'),
          }
          signed = {}
          project.native_targets.each do |target|
            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              bundle = config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'].to_s.delete('"')
              next unless profiles.key?(bundle)
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('SIGN_TEAM_ID')
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profiles[bundle]
              signed[bundle] = true
            end
          end
          missing = profiles.keys.reject { |bundle| signed[bundle] }
          unless missing.empty?
            puts "::error::No Release target found for: #{missing.join(', ')}"
            exit 66
          end
          project.save
          puts "Per-target signing set for #{signed.size} targets."
          RUBY

            xcodebuild archive \
              -quiet \
              -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
              CODE_SIGN_IDENTITY='Apple Distribution'
          else
            xcodebuild archive \
              -quiet \
              -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
              CODE_SIGN_IDENTITY='Apple Distribution' \
              PROVISIONING_PROFILE_SPECIFIER="$APPSTORE_PROFILE_NAME"
          fi

          ARCHIVED_APP="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          [[ -n "$ARCHIVED_APP" && -d "$ARCHIVED_APP" ]] || {
            echo '::error::Signed xcarchive was not produced.'
            exit 65
          }

          export BUNDLE_ID_FOR_PLIST="$EXPECTED_BUNDLE_ID"
          export PROFILE_NAME_FOR_PLIST="$APPSTORE_PROFILE_NAME"
          export TEAM_ID_FOR_PLIST="$ASC_TEAM_ID"
          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            export LA_BUNDLE_ID_FOR_PLIST="$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID"
            export LA_PROFILE_NAME_FOR_PLIST="$LIVE_ACTIVITY_PROFILE_NAME"
          fi
          python3 - "$EXPORT_OPTIONS" <<'PY'
          import os, plistlib, sys

          profiles = {os.environ["BUNDLE_ID_FOR_PLIST"]: os.environ["PROFILE_NAME_FOR_PLIST"]}
          if os.environ.get("LA_BUNDLE_ID_FOR_PLIST"):
              profiles[os.environ["LA_BUNDLE_ID_FOR_PLIST"]] = os.environ["LA_PROFILE_NAME_FOR_PLIST"]

          payload = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": os.environ["TEAM_ID_FOR_PLIST"],
              "provisioningProfiles": profiles,
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(sys.argv[1], "wb") as fh:
              plistlib.dump(payload, fh)
          PY

          xcodebuild -exportArchive \
            -quiet \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          SIGNED_IPA="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$SIGNED_IPA" && -f "$SIGNED_IPA" ]] || {
            echo '::error::Signed App Store IPA was not exported.'
            find "$EXPORT_DIR" -maxdepth 2 -type f -print || true
            exit 65
          }

          # Verify the exported IPA without printing its contents.
          VERIFY_DIR="$RUNNER_TEMP/Paobuwan-Signed-Verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$SIGNED_IPA" -d "$VERIFY_DIR"
          SIGNED_APP="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$SIGNED_APP" ]] || {
            echo '::error::Exported IPA has no .app payload.'
            exit 65
          }

          test -f "$SIGNED_APP/embedded.mobileprovision" || {
            echo '::error::Signed IPA is missing embedded.mobileprovision.'
            exit 65
          }
          codesign --verify --deep --strict "$SIGNED_APP"

          SIGNED_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SIGNED_APP/Info.plist")"
          [[ "$SIGNED_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || {
            echo "::error::Signed IPA CFBundleVersion is '$SIGNED_BUILD_NUMBER', expected $BUILD_NUMBER."
            exit 65
          }

          SIGNED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_APP/Info.plist")"
          [[ "$SIGNED_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "::error::Signed IPA bundle ID mismatch: $SIGNED_BUNDLE_ID"
            exit 65
          }

          if [[ "$HAS_LIVE_ACTIVITY" == 'true' ]]; then
            SIGNED_APPEX="$SIGNED_APP/PlugIns/LiveActivityExtension.appex"
            [[ -d "$SIGNED_APPEX" ]] || {
              echo '::error::Signed IPA is missing PlugIns/LiveActivityExtension.appex.'
              exit 65
            }
            test -f "$SIGNED_APPEX/embedded.mobileprovision" || {
              echo '::error::Live Activity extension is missing embedded.mobileprovision.'
              exit 65
            }
            APPEX_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_APPEX/Info.plist")"
            APPEX_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SIGNED_APPEX/Info.plist")"
            APPEX_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SIGNED_APPEX/Info.plist")"
            APP_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SIGNED_APP/Info.plist")"
            [[ "$APPEX_ID" == "$EXPECTED_LIVE_ACTIVITY_BUNDLE_ID" ]] || {
              echo "::error::Signed extension bundle ID mismatch: $APPEX_ID"
              exit 65
            }
            [[ "$APPEX_BUILD" == "$BUILD_NUMBER" && "$APPEX_VERSION" == "$APP_SHORT_VERSION" ]] || {
              echo "::error::Signed extension version $APPEX_VERSION ($APPEX_BUILD) does not match the app's $APP_SHORT_VERSION ($BUILD_NUMBER)."
              exit 65
            }
            echo "Live Activity extension signed and embedded: $APPEX_ID $APPEX_VERSION ($APPEX_BUILD)"
          fi

          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$SIGNED_APP/Info.plist" 2>/dev/null || true)"
          if [[ "$MIN_OS" != "$EXPECTED_MIN_IOS" ]]; then
            echo "::warning::MinimumOSVersion is '${MIN_OS:-<empty>}'; the Opus decision (T-008) is $EXPECTED_MIN_IOS."
          fi

          NON_EXEMPT="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$SIGNED_APP/Info.plist" 2>/dev/null || true)"
          if [[ -z "$NON_EXEMPT" ]]; then
            echo '::warning::ITSAppUsesNonExemptEncryption is not set; App Store Connect will ask the export-compliance question for every build.'
          fi

          rm -rf "$VERIFY_DIR"
          shasum -a 256 "$SIGNED_IPA" > "$EXPORT_DIR/Paobuwan-AppStore.sha256"

          echo "SIGNED_IPA=$SIGNED_IPA" >> "$GITHUB_ENV"
          echo "SIGNED_EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

          echo "Signed IPA: $(basename "$SIGNED_IPA")"
          ls -lh "$SIGNED_IPA" "$EXPORT_DIR/Paobuwan-AppStore.sha256"


      - name: Validate App Store package with Apple (altool)
        if: ${{ env.MODE == 'archive' || env.MODE == 'testflight' }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          ALTOOL_LOG="$RUNNER_TEMP/altool-validate.log"
          set +e
          xcrun altool \
            --validate-app \
            --file "$SIGNED_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$ALTOOL_LOG"
          altool_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$altool_status" -ne 0 ]] || grep -qiE '^[[:space:]]*[*]{3} Error|ERROR ITMS-' "$ALTOOL_LOG"; then
            # Apple's messages as one annotation (readable without signing in); no secrets are printed by altool.
            MSG="$(grep -iE 'error|ITMS-|bundle version|CFBundleVersion|message' "$ALTOOL_LOG" | head -30 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=altool validate failed::${MSG:-altool exited with status $altool_status}"
            exit 1
          fi

      - name: Upload Paobuwan to TestFlight (altool)
        if: ${{ env.MODE == 'testflight' }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          # Numeric App Store Connect app id. altool --upload-app resolves the app from the
          # IPA's bundle ID; the id is checked here only to prove the App record exists
          # and is the one the owner configured (see T-007 draft notes).
          PAOBUWAN_ASC_APP_ID: ${{ secrets.PAOBUWAN_ASC_APP_ID }}
        run: |
          set -euo pipefail

          [[ "$PAOBUWAN_ASC_APP_ID" =~ ^[0-9]+$ ]] || {
            echo '::error::PAOBUWAN_ASC_APP_ID must be the numeric App Store Connect Apple ID.'
            exit 78
          }

          ALTOOL_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool \
            --upload-app \
            --file "$SIGNED_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$ALTOOL_LOG"
          altool_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$altool_status" -ne 0 ]] || grep -qiE '^[[:space:]]*[*]{3} Error|ERROR ITMS-' "$ALTOOL_LOG"; then
            # Apple's messages as one annotation (readable without signing in); no secrets are printed by altool.
            MSG="$(grep -iE 'error|ITMS-|bundle version|CFBundleVersion|message' "$ALTOOL_LOG" | head -30 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=altool upload failed::${MSG:-altool exited with status $altool_status}"
            exit 1
          fi

          echo 'TestFlight binary upload accepted by App Store Connect.'

      # ---------------------------------------------------------------------
      # 6. Summary
      # ---------------------------------------------------------------------
      - name: Build summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo '## Paobuwan iOS CI completed'
            echo
            echo "- Mode: \`${MODE}\`"
            echo "- Version: \`${APP_VERSION}\` (${BUILD_NUMBER})"
            echo "- Bundle ID: \`${EXPECTED_BUNDLE_ID}\`"
            if [[ "${HAS_LIVE_ACTIVITY:-false}" == 'true' ]]; then
              echo "- Live Activity extension: \`${EXPECTED_LIVE_ACTIVITY_BUNDLE_ID}\` (embedded, version and build checked)"
            fi
            echo "- Private source: \`${PRIVATE_SOURCE_REPOSITORY}@${SOURCE_REF}\` (\`${SOURCE_SHORT_SHA}\`)"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            if [[ "$MODE" == 'verify' ]]; then
              echo '- Simulator build: passed (Maestro smoke runs only when e2e/ has flows)'
            fi
            if [[ "$MODE" == 'archive' ]]; then
              echo '- Signed IPA: Apple validation passed (not uploaded anywhere; the runner is discarded).'
            fi
            if [[ "$MODE" == 'testflight' ]]; then
              echo '- TestFlight: Apple validation passed and binary upload was accepted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # 7. Cleanup signing material and simulator, even after failures
      # ---------------------------------------------------------------------
      - name: Cleanup signing material and simulator
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          fi

          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1 || true
            security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          if [[ -n "${KEYCHAIN_NAME:-}" ]]; then
            security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
          fi

          if [[ -n "${ASC_P8_PATH:-}" ]]; then
            rm -f "$ASC_P8_PATH" >/dev/null 2>&1 || true
          fi
          if [[ -n "${ASC_API_KEY_JSON:-}" ]]; then
            rm -f "$ASC_API_KEY_JSON" >/dev/null 2>&1 || true
          fi
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >/dev/null 2>&1 || true
          fi

          rm -rf "$RUNNER_TEMP/paobuwan-asc" "$RUNNER_TEMP/paobuwan-profile-scan" "$RUNNER_TEMP/Paobuwan-Signed-Verify" >/dev/null 2>&1 || true
