# RemoHop macOS release: the universal `remohop` CLI and the quick-support app RemoHop.app, both
# signed with Developer ID and notarized; the app is also stapled.
#
# Public CI repository -> source repository: env SOURCE_REPOSITORY.
#
#   release : build remohop for darwin/arm64 and darwin/amd64 (CGO_ENABLED=0, the Makefile's release
#             flags) -> lipo into one universal binary -> codesign with the Developer ID
#             Application certificate, hardened runtime, secure timestamp, no entitlements ->
#             zip -> notarize with notarytool (App Store Connect API key) -> verify the
#             signature, the notarization and Gatekeeper's verdict -> run the signed binary:
#             `remohop version`, `remohop --help`, the loopback smoke test (host + client), and a desktop
#             probe that makes the hardened binary load system frameworks at run time.
#   app     : (refs that have packaging/quick/build.sh) build RemoHop.app (cmd/remohop-quick, universal,
#             LICENSE/NOTICE/THIRD_PARTY_LICENSES.txt in Contents/Resources) -> codesign the bundle
#             (Developer ID, hardened runtime, timestamp, no entitlements, identifier com.remohop.quick
#             from Info.plist) -> notarize a ditto zip -> staple the ticket to the bundle -> zip it again
#             with ditto (RemoHop-macos.zip) -> verify: strict deep signature, stapler validate,
#             spctl --assess --type execute (Notarized Developer ID), a quarantined copy unpacked from
#             the zip passes Gatekeeper and runs, the app's UI server answers (quick --no-open), and
#             LaunchServices starts the bundle (open -n).
#
# By default nothing is uploaded: no artifacts, no release. The summary reports the SHA-256 of
# the signed binary and of the notarized zip. The exception is the release hand-off below.
# A bare executable cannot carry a stapled ticket (stapler
# only handles bundles, disk images and packages), so Gatekeeper checks the notarization of a
# downloaded remohop online on first run.
#
# Secrets used: MACOS_DEVID_P12_BASE64 + MACOS_DEVID_P12_PASSWORD (the Developer ID Application
# certificate with its key), ASC_KEY_ID + ASC_ISSUER_ID + ASC_PRIVATE_KEY (App Store Connect API
# key for notarytool), ASC_TEAM_ID (the certificate must belong to this team), TARGET_REPO_PAT
# (source checkout). The certificate lives in a keychain made for this run and deleted at the
# end, whatever happens.
#
# Release hand-off: the RemoHop repository's release workflow (env SOURCE_REPOSITORY, release.yml) starts
# this workflow with workflow_dispatch (ref=<tag>, version=<tag>, upload=true, correlation=<id>),
# waits for it, and downloads the artifact `remohop-macos-universal` (the signed universal `remohop`, the
# notarized zip, RemoHop-macos.zip and SHA256SUMS-macos, kept 3 days) to put them into the release. The Apple
# secrets stay here, in this repository; the RemoHop repository only holds a token that may start
# and read runs of this workflow. `upload` defaults to false, so request-file runs and manual runs
# still upload nothing. The artifact exists only if every step above it passed (signature,
# notarization, Gatekeeper check, the smoke tests and the framework probe).
#
# Triggers: workflow_dispatch, or a push to main that changes ci-requests/sodesk-macos-release.env
# (how the project's AI engineer requests a run). Only people with push access to this repo can
# trigger; never pull_request. The request file is plain KEY=VALUE text, parsed with strict
# patterns and never executed:
#
#   REF=<sha>          # source repository branch, tag or SHA
#   VERSION=v1.2.3     # optional: the version to stamp; default `git describe --tags --always`
#
# Steps that collect results start with `set +e`: the runner's bash runs with -e, which would
# end a step at the first failing check instead of reporting it.
#
# Safety rules (public repo, public logs): no pull_request triggers; only GitHub-owned actions,
# pinned to commit SHAs; secrets reach only the steps that need them, through env, and are never
# echoed; the keychain password and the smoke test's host password are made per run and masked;
# tool output that could quote a secret is not printed, only chosen fields.
name: RemoHop macOS release

run-name: RemoHop macOS release · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-macos-release.env)' || inputs.ref }}${{ inputs.correlation && format(' [{0}]', inputs.correlation) || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source repository branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Version to stamp (empty: git describe --tags --always)'
        required: false
        default: ''
        type: string
      upload:
        description: 'Upload the signed binary and RemoHop-macos.zip as the artifact remohop-macos-universal (release hand-off)'
        required: false
        default: false
        type: boolean
      correlation:
        description: 'Opaque id shown in the run name, so the caller can find this run (release hand-off)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-macos-release.env']

permissions:
  contents: read

concurrency:
  group: remohop-macos-release-${{ inputs.ref || 'request' }}
  cancel-in-progress: true

env:
  # Source repository (public since the open-source release).
  SOURCE_REPOSITORY: readori/RemoHop
  CGO_ENABLED: '0'
  SIGN_IDENTIFIER: com.remohop.cli
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  release:
    name: Sign and notarize remohop
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          MACOS_DEVID_P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CORRELATION: ${{ inputs.correlation }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-macos-release.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/remohop-macos-release-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-macos-release.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
            WANT_VERSION="$(sed -n 's/^VERSION=//p' "$REQ" | head -n 1 | tr -d '\r')"
          else
            SOURCE_REF="$INPUT_REF"
            WANT_VERSION="$INPUT_VERSION"
          fi
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ -z "$WANT_VERSION" || ( "$WANT_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ && ${#WANT_VERSION} -le 64 ) ]] || {
            echo '::error::version may hold letters, digits and . _ + - only (at most 64 characters).'
            exit 64
          }
          [[ "$INPUT_CORRELATION" =~ ^[A-Za-z0-9._-]{0,64}$ ]] || {
            echo '::error::correlation may hold letters, digits and . _ - only (at most 64 characters).'
            exit 64
          }
          missing=()
          for name in TARGET_REPO_PAT MACOS_DEVID_P12_BASE64 MACOS_DEVID_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_TEAM_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing secret(s) in this repository: ${missing[*]}. Signing needs MACOS_DEVID_P12_BASE64 (base64 of the Developer ID Application .p12) and MACOS_DEVID_P12_PASSWORD; notarization needs ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (.p8) and ASC_TEAM_ID; the checkout needs TARGET_REPO_PAT."
            exit 78
          fi
          [[ "$ASC_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::ASC_TEAM_ID is not a 10-character Apple team ID.'; exit 78; }
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "WANT_VERSION=$WANT_VERSION" >> "$GITHUB_ENV"
          echo "Source ref: $SOURCE_REF · version: ${WANT_VERSION:-(git describe)}"

      # Full history and tags: the default version is `git describe --tags --always`.
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: source/go.mod
          cache: false

      # The Makefile's release build (LDFLAGS: -s -w -X …/internal/cli.Version=VERSION, -trimpath,
      # CGO_ENABLED=0), once per architecture, joined with lipo.
      - name: Build the universal binary
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$WANT_VERSION"
          [[ -n "$VERSION" ]] || VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "::error::unusable version string from git describe."; exit 65; }
          grep -q 'internal/cli.Version=' Makefile || { echo '::error::the Makefile no longer sets internal/cli.Version; update this workflow.'; exit 65; }
          OUT="$RUNNER_TEMP/remohop-release"; rm -rf "$OUT"; mkdir -p "$OUT"
          LDFLAGS="-s -w -X github.com/readori/RemoHop/internal/cli.Version=$VERSION"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "$OUT/remohop-darwin-$arch" ./cmd/remohop
          done
          lipo -create -output "$OUT/remohop" "$OUT/remohop-darwin-arm64" "$OUT/remohop-darwin-amd64"
          chmod 755 "$OUT/remohop"
          ARCHS="$(lipo -archs "$OUT/remohop")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::the binary is not universal: $ARCHS"; exit 65; }
          GOT="$("$OUT/remohop" version)"
          [[ "$GOT" == "remohop $VERSION" ]] || { echo "::error::the binary reports '$GOT', expected 'remohop $VERSION'."; exit 65; }
          # No dynamic libraries beyond the system's: nothing third-party to sign or to validate.
          LIBS="$(otool -L "$OUT/remohop" | awk '$0 !~ /:$/ && $1 !~ /^\/(usr\/lib|System)\// {print $1}' | sort -u | tr '\n' ' ')"
          [[ -z "$LIBS" ]] || { echo "::error::the binary links non-system libraries: $LIBS"; exit 65; }
          C="$(git rev-parse HEAD)"
          {
            echo "OUT=$OUT"; echo "VERSION=$VERSION"; echo "SOURCE_SHA=$C"
          } >> "$GITHUB_ENV"
          echo "built remohop $VERSION ($ARCHS), $(du -h "$OUT/remohop" | cut -f1), $(go version | cut -d' ' -f3), source ${C:0:8}"
          {
            echo '### RemoHop macOS release'; echo
            echo "- Source: \`$SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`), version \`$VERSION\`, $(go version | cut -d' ' -f3), macOS $(sw_vers -productVersion)"
            echo "- Universal binary: \`$ARCHS\`, $(du -h "$OUT/remohop" | cut -f1), CGO off, system libraries only"
          } >> "$GITHUB_STEP_SUMMARY"

      # RemoHop.app: packaging/quick/build.sh with TARGETS=macos (the same release flags, the
      # bundle laid out by packaging/quick/gen, the license texts inside). Refs from before the
      # quick-support packaging have no build.sh; they still get the CLI, and APP stays empty.
      - name: Build RemoHop.app (quick support, universal)
        working-directory: source
        run: |
          set -euo pipefail
          if [[ ! -f packaging/quick/build.sh ]]; then
            echo '::notice::packaging/quick/build.sh is not on this ref; RemoHop.app is skipped.'
            echo '- RemoHop.app: skipped (packaging/quick/build.sh is not on this ref)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          Q="$RUNNER_TEMP/remohop-quick"; rm -rf "$Q"
          VERSION="$VERSION" OUT="$Q" TARGETS=macos sh packaging/quick/build.sh > "$RUNNER_TEMP/quick-build.log" 2>&1 \
            || { cut -c1-300 "$RUNNER_TEMP/quick-build.log" | tail -n 20; echo '::error::building RemoHop.app failed.'; exit 65; }
          APP="$Q/macos/RemoHop.app"
          BIN="$APP/Contents/MacOS/RemoHop"
          [[ -x "$BIN" ]] || { echo '::error::RemoHop.app has no Contents/MacOS/RemoHop.'; exit 65; }
          ARCHS="$(lipo -archs "$BIN")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::RemoHop.app is not universal: $ARCHS"; exit 65; }
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          [[ "$BID" == com.remohop.quick ]] || { echo "::error::unexpected bundle identifier '$BID' (privacy permissions are tied to com.remohop.quick)."; exit 65; }
          BVER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          for f in LICENSE NOTICE THIRD_PARTY_LICENSES.txt RemoHop.icns; do
            [[ -s "$APP/Contents/Resources/$f" ]] || { echo "::error::RemoHop.app lacks Contents/Resources/$f."; exit 65; }
          done
          GOT="$("$BIN" version)"
          [[ "$GOT" == "remohop $VERSION" ]] || { echo "::error::RemoHop.app reports '$GOT', expected 'remohop $VERSION'."; exit 65; }
          LIBS="$(otool -L "$BIN" | awk '$0 !~ /:$/ && $1 !~ /^\/(usr\/lib|System)\// {print $1}' | sort -u | tr '\n' ' ')"
          [[ -z "$LIBS" ]] || { echo "::error::RemoHop.app links non-system libraries: $LIBS"; exit 65; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "built RemoHop.app $BID $BVER ($ARCHS), $(du -sh "$APP" | cut -f1)"
          echo "- RemoHop.app: \`$BID\` $BVER, \`$ARCHS\`, $(du -sh "$APP" | cut -f1), licenses in Contents/Resources" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the signing keychain and import the certificate
        env:
          MACOS_DEVID_P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="remohop-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          # The search list as it is now, to put back at the end.
          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//' | tr '\n' ':')"
          {
            echo "KEYCHAIN_NAME=$KEYCHAIN_NAME"; echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "ORIGINAL_KEYCHAINS=$ORIGINAL_KEYCHAINS"
          } >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          # Searched first, the existing ones kept (codesign builds the certificate chain from them).
          OLD=(); while IFS= read -r k; do [[ -n "$k" ]] && OLD+=("$k"); done < <(tr ':' '\n' <<<"$ORIGINAL_KEYCHAINS")
          security list-keychains -d user -s "$KEYCHAIN_PATH" ${OLD[@]+"${OLD[@]}"}

          P12="$RUNNER_TEMP/remohop-devid.p12"
          trap 'rm -f "$P12"' EXIT
          ( umask 077; python3 -c '
          import base64, os, sys
          raw = "".join(os.environ["MACOS_DEVID_P12_BASE64"].split())
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              sys.exit("MACOS_DEVID_P12_BASE64 is not base64")
          if len(data) < 500:
              sys.exit("MACOS_DEVID_P12_BASE64 is too short to be a .p12")
          open(sys.argv[1], "wb").write(data)
          ' "$P12" ) || { echo '::error::MACOS_DEVID_P12_BASE64 could not be decoded (it must be the base64 of the .p12 file).'; exit 78; }
          security import "$P12" -k "$KEYCHAIN_PATH" -f pkcs12 -P "$MACOS_DEVID_P12_PASSWORD" -T /usr/bin/codesign > /dev/null 2>&1 \
            || { echo '::error::The .p12 could not be imported: wrong MACOS_DEVID_P12_PASSWORD, or the file is not a PKCS#12 with a certificate and its private key.'; exit 78; }
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1

          # Exactly one usable Developer ID Application identity, of the expected team.
          IDS="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' || true)"
          N="$(grep -c . <<<"$IDS" || true)"
          if [[ "$N" -ne 1 ]]; then
            echo "::error::The keychain holds $N valid 'Developer ID Application' signing identities, expected 1. The .p12 must contain the Developer ID Application certificate together with its private key (an 'Apple Distribution' or 'Developer ID Installer' certificate does not sign a command-line tool for distribution)."
            security find-identity -p codesigning "$KEYCHAIN_PATH" | sed -E 's/^ *[0-9]+\) [0-9A-F]{40} /  identity: /' | grep 'identity:' | cut -c1-120 || true
            exit 78
          fi
          SIGN_HASH="$(awk '{print $2}' <<<"$IDS")"
          SIGN_NAME="$(sed -E 's/^[^"]*"([^"]*)".*/\1/' <<<"$IDS")"
          [[ "$SIGN_HASH" =~ ^[0-9A-F]{40}$ ]] || { echo '::error::could not read the identity from the keychain.'; exit 78; }
          [[ "$SIGN_NAME" == *"($ASC_TEAM_ID)" ]] || { echo '::error::The Developer ID certificate belongs to a different team than ASC_TEAM_ID.'; exit 78; }
          EXPIRES="$(security find-certificate -c "$SIGN_NAME" -p "$KEYCHAIN_PATH" | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)"
          echo "SIGN_HASH=$SIGN_HASH" >> "$GITHUB_ENV"
          # The name (a legal name and the team ID) is public in every signature made with it.
          echo "signing identity: $SIGN_NAME · certificate valid until ${EXPIRES:-unknown}"
          echo "- Signing identity: \`$SIGN_NAME\`, certificate valid until ${EXPIRES:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      # Hardened runtime, secure timestamp, and no entitlements: remohop is a static Go program. It
      # generates no code at run time (purego calls system frameworks through fixed trampolines,
      # so no allow-jit / allow-unsigned-executable-memory), the only libraries it loads are
      # Apple's own (they pass library validation, so no disable-library-validation), it needs
      # no DYLD_* variables, and ffmpeg is a separate program it starts, not code it loads.
      # Screen Recording and Accessibility are permissions the user grants (TCC), not
      # entitlements. The desktop probe below checks that claim on the signed binary.
      - name: Sign (Developer ID, hardened runtime, timestamp)
        run: |
          set -euo pipefail
          codesign --force --sign "$SIGN_HASH" --keychain "$KEYCHAIN_PATH" --options runtime --timestamp \
            --identifier "$SIGN_IDENTIFIER" "$OUT/remohop" > "$RUNNER_TEMP/codesign.log" 2>&1 \
            || { cut -c1-300 "$RUNNER_TEMP/codesign.log" | tail -n 10; echo '::error::codesign failed.'; exit 1; }
          codesign --verify --strict --verbose=2 "$OUT/remohop" 2>&1 | cut -c1-200
          INFO="$(codesign -dvvv --entitlements - "$OUT/remohop" 2>&1)"
          grep -E '^(Identifier|Format|CodeDirectory|Authority|TeamIdentifier|Timestamp|Runtime Version)=' <<<"$INFO" | cut -c1-200
          grep -q 'flags=.*runtime' <<<"$INFO" || { echo '::error::the signature does not have the hardened runtime flag.'; exit 1; }
          grep -q '^Timestamp=' <<<"$INFO" || { echo '::error::the signature has no secure timestamp.'; exit 1; }
          grep -q '^Authority=Developer ID Application' <<<"$INFO" || { echo '::error::not signed by a Developer ID Application certificate.'; exit 1; }
          if grep -q '<key>' <<<"$INFO"; then echo '::error::the signature carries entitlements; none are expected.'; exit 1; fi
          # Both slices are signed (lipo -create before signing; codesign signs each).
          for arch in arm64 x86_64; do
            codesign --verify --strict --arch "$arch" "$OUT/remohop" || { echo "::error::the $arch slice does not verify."; exit 1; }
          done
          [[ "$("$OUT/remohop" version)" == "remohop $VERSION" ]] || { echo '::error::the signed binary does not run.'; exit 1; }
          echo '- Signature: Developer ID Application, hardened runtime, secure timestamp, no entitlements, both slices verify (`codesign --verify --strict`)' >> "$GITHUB_STEP_SUMMARY"

      # The bundle is signed as a whole (main program + sealed Info.plist and resources), once, with
      # the same rules as the CLI: hardened runtime, timestamp, no entitlements. It is the same
      # program as remohop plus the quick-support page: it is not sandboxed, it starts only Apple's
      # own tools (osascript for the approval dialog, open, defaults) and a browser, and the Screen
      # Recording and Accessibility prompts are TCC permissions, not entitlements. The identifier
      # comes from Info.plist (com.remohop.quick); TCC remembers it together with the team, so it
      # must not change between releases.
      - name: Sign RemoHop.app (Developer ID, hardened runtime, timestamp)
        if: env.APP != ''
        run: |
          set -euo pipefail
          codesign --force --sign "$SIGN_HASH" --keychain "$KEYCHAIN_PATH" --options runtime --timestamp \
            "$APP" > "$RUNNER_TEMP/codesign-app.log" 2>&1 \
            || { cut -c1-300 "$RUNNER_TEMP/codesign-app.log" | tail -n 10; echo '::error::codesign of RemoHop.app failed.'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | sed -e "s#$RUNNER_TEMP#\$RUNNER_TEMP#g" | cut -c1-200
          INFO="$(codesign -dvvv --entitlements - "$APP" 2>&1)"
          grep -E '^(Identifier|Format|CodeDirectory|Authority|TeamIdentifier|Timestamp|Runtime Version|Sealed Resources)' <<<"$INFO" | cut -c1-200
          grep -q '^Identifier=com.remohop.quick$' <<<"$INFO" || { echo '::error::the app is not signed as com.remohop.quick.'; exit 1; }
          grep -q 'flags=.*runtime' <<<"$INFO" || { echo '::error::the app signature does not have the hardened runtime flag.'; exit 1; }
          grep -q '^Timestamp=' <<<"$INFO" || { echo '::error::the app signature has no secure timestamp.'; exit 1; }
          grep -q '^Authority=Developer ID Application' <<<"$INFO" || { echo '::error::the app is not signed by a Developer ID Application certificate.'; exit 1; }
          grep -q '^Sealed Resources' <<<"$INFO" || { echo '::error::the app signature does not seal its resources.'; exit 1; }
          if grep -q '<key>' <<<"$INFO"; then echo '::error::the app signature carries entitlements; none are expected.'; exit 1; fi
          for arch in arm64 x86_64; do
            codesign --verify --strict --arch "$arch" "$APP" || { echo "::error::the $arch slice of the app does not verify."; exit 1; }
          done
          [[ "$("$APP/Contents/MacOS/RemoHop" version)" == "remohop $VERSION" ]] || { echo '::error::the signed app does not run.'; exit 1; }
          echo '- RemoHop.app signature: Developer ID Application, hardened runtime, secure timestamp, no entitlements, resources sealed, both slices verify' >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set +e -uo pipefail
          ASC_DIR="$RUNNER_TEMP/remohop-asc"; rm -rf "$ASC_DIR"; ( umask 077; mkdir -p "$ASC_DIR" )
          P8="$ASC_DIR/AuthKey.p8"
          ( umask 077; python3 -c '
          import base64, os, sys
          raw = os.environ["ASC_PRIVATE_KEY"].strip().replace("\\n", "\n")
          key = raw if "PRIVATE KEY" in raw else base64.b64decode("".join(raw.split())).decode("utf-8").strip()
          if "BEGIN PRIVATE KEY" not in key:
              sys.exit("ASC_PRIVATE_KEY is not a .p8 key")
          open(sys.argv[1], "w").write(key + "\n")
          ' "$P8" ) || { echo '::error::ASC_PRIVATE_KEY is not a .p8 private key.'; exit 78; }

          # notarize ZIP LABEL: submit, wait, print only chosen fields; on failure print the
          # service's findings about the file and fail the step.
          notarize() {
            local zip="$1" label="$2" st SUB_ID STATUS
            local RESULT="$RUNNER_TEMP/notary-result.json"
            xcrun notarytool submit "$zip" --key "$P8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$RESULT" 2> "$RUNNER_TEMP/notary.err"
            st=$?
            read -r SUB_ID STATUS < <(python3 -c '
          import json, re, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              d = {}
          i, s = str(d.get("id", "")), str(d.get("status", ""))
          print(i if re.fullmatch(r"[0-9a-fA-F-]{36}", i) else "-", s if re.fullmatch(r"[A-Za-z ]{1,40}", s) else "unknown")
          ' "$RESULT")
            echo "notarytool ($label): exit $st, submission ${SUB_ID}, status ${STATUS}"
            if [[ "$st" -ne 0 || "$STATUS" != 'Accepted' ]]; then
              # Why: the service's own findings (paths and messages about our file, no credentials).
              if [[ "$SUB_ID" != '-' ]]; then
                xcrun notarytool log "$SUB_ID" --key "$P8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" "$RUNNER_TEMP/notary-log.json" > /dev/null 2>&1
                python3 -c '
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              sys.exit(0)
          print("  log status:", str(d.get("status"))[:40], "-", str(d.get("statusSummary"))[:200])
          for it in (d.get("issues") or [])[:20]:
              print("  issue: %s %s (%s): %s" % (str(it.get("severity"))[:20], str(it.get("path"))[:120], str(it.get("architecture"))[:10], str(it.get("message"))[:300]))
          ' "$RUNNER_TEMP/notary-log.json"
              else
                # No submission: authentication or agreement problems are reported here.
                grep -Ei 'error|unauthor|401|403|agreement|invalid|expired|not found' "$RUNNER_TEMP/notary.err" | sed -E 's/[A-Za-z0-9+\/=_-]{40,}/<redacted>/g' | cut -c1-300 | tail -n 8
              fi
              rm -rf "$ASC_DIR"
              echo "::error::Notarization of $label did not succeed. Common causes: the API key lacks access (it needs the Developer role or higher), a pending agreement in the Apple Developer account, or the code was not signed with a Developer ID certificate, hardened runtime and a secure timestamp."
              echo "- Notarization ($label): **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- Notarization ($label): Accepted (submission \`$SUB_ID\`)" >> "$GITHUB_STEP_SUMMARY"
          }

          ZIP="$OUT/remohop-macos-universal.zip"
          rm -f "$ZIP"
          ( cd "$OUT" && /usr/bin/zip -q -X "$ZIP" remohop ) || { echo '::error::zip failed.'; exit 1; }
          notarize "$ZIP" remohop
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          # The app is submitted as a ditto zip of the signed bundle (what Apple's tools expect);
          # the ticket is stapled to the bundle in the next step.
          if [[ -n "${APP:-}" ]]; then
            AZ="$RUNNER_TEMP/RemoHop-notarize.zip"; rm -f "$AZ"
            /usr/bin/ditto -c -k --keepParent "$APP" "$AZ" || { echo '::error::ditto failed.'; exit 1; }
            notarize "$AZ" RemoHop.app
            rm -f "$AZ"
          fi
          rm -rf "$ASC_DIR"

      # What a user's Mac will decide. The ticket is looked up online (nothing can be stapled to
      # a bare executable), and may take a moment to become visible after acceptance.
      - name: Verify signature, notarization and Gatekeeper
        run: |
          set +e -uo pipefail
          FAILED=0
          ok()   { printf '   ok    %s\n' "$*"; }
          fail() { printf '   FAIL  %s\n' "$*"; FAILED=1; }
          info() { printf '   info  %s\n' "$*"; }
          BIN="$OUT/remohop"
          if codesign --verify --strict --verbose=2 "$BIN" > "$RUNNER_TEMP/verify.txt" 2>&1; then ok 'codesign --verify --strict'; else fail 'codesign --verify --strict'; cut -c1-200 "$RUNNER_TEMP/verify.txt" | tail -n 5; fi
          # The zip holds exactly the binary that was signed.
          X="$RUNNER_TEMP/unzipped"; rm -rf "$X"; mkdir -p "$X"; /usr/bin/unzip -q "$ZIP" -d "$X"
          if cmp -s "$X/remohop" "$BIN" && codesign --verify --strict "$X/remohop" 2>/dev/null; then ok 'the binary in the zip is the signed one and verifies after unpacking'; else fail 'the binary in the zip differs from the signed one'; fi

          NOTARIZED=
          for _ in 1 2 3 4 5 6; do
            if codesign --verify --strict --check-notarization -R='notarized' "$BIN" > "$RUNNER_TEMP/notarized.txt" 2>&1; then NOTARIZED=1; break; fi
            sleep 10
          done
          if [[ -n "$NOTARIZED" ]]; then ok "Apple's notarization ticket for this binary is found online (codesign -R=notarized --check-notarization)"; else fail 'no notarization ticket found online for this binary'; cut -c1-200 "$RUNNER_TEMP/notarized.txt" | tail -n 3; fi

          ASSESS="$(spctl --assess --type install -vv "$BIN" 2>&1)"; code=$?
          SRC="$(sed -n 's/^source=//p' <<<"$ASSESS" | head -n 1)"
          if [[ "$code" -eq 0 && "$SRC" == *Notarized* ]]; then ok "spctl --assess --type install: accepted, source=$SRC"
          else info "spctl --assess --type install: exit $code, $(head -n 1 <<<"$ASSESS" | sed -e "s#$BIN#remohop#" | cut -c1-160) ${SRC:+source=$SRC} (spctl judges bundles and installers; for a bare tool the ticket check above is the authority)"; fi
          STAPLE="$(xcrun stapler staple "$BIN" 2>&1 | tail -n 1 | cut -c1-160)"
          info "stapler on the bare executable: ${STAPLE:-no output} (expected: only bundles, disk images and packages can carry a stapled ticket)"

          # As downloaded: with the quarantine mark a browser sets, the system checks the
          # notarization before it lets the file run.
          Q="$RUNNER_TEMP/quarantined"; rm -rf "$Q"; mkdir -p "$Q"; cp "$BIN" "$Q/remohop"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$Q/remohop"
          GOT="$("$Q/remohop" version 2>&1)"; code=$?
          if [[ "$code" -eq 0 && "$GOT" == "remohop $VERSION" ]]; then ok 'a quarantined copy (as if downloaded) runs'; else fail "a quarantined copy does not run: exit $code"; head -n 2 <<<"$GOT" | cut -c1-200; fi
          # Under Rosetta, where the runner has it, the Intel slice runs too.
          if GOT="$(arch -x86_64 "$BIN" version 2>/dev/null)" && [[ "$GOT" == "remohop $VERSION" ]]; then ok 'the x86_64 slice runs (Rosetta)'; else info 'the x86_64 slice was not run (no Rosetta on this runner)'; fi

          SHA_BIN="$(shasum -a 256 "$BIN" | cut -d' ' -f1)"; SHA_ZIP="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          echo "   sha256 remohop                      $SHA_BIN"
          echo "   sha256 remohop-macos-universal.zip  $SHA_ZIP"
          {
            if [[ "$FAILED" -eq 0 ]]; then echo '- Verification: signature strict-valid, notarization ticket found online, quarantined copy runs: PASS'; else echo '- Verification: **FAIL** (see the log)'; fi
            echo '- Not stapled: a bare executable cannot carry a ticket (`stapler` handles bundles, disk images and packages); Gatekeeper looks the ticket up online on first run'
            echo "- SHA-256 \`remohop\` (universal, signed): \`$SHA_BIN\`"
            echo "- SHA-256 \`remohop-macos-universal.zip\` (as notarized): \`$SHA_ZIP\`"
            echo '- Nothing uploaded unless the release hand-off was requested (upload=true).'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$FAILED"

      # A bundle can carry its ticket, so Gatekeeper's first-run check passes offline. The zip that
      # is released is made after stapling, with ditto, so the ticket is inside it. Then the checks a
      # user's Mac makes: on a copy unpacked from that zip and marked as downloaded.
      - name: Staple and verify RemoHop.app (Gatekeeper, launch, UI server)
        if: env.APP != ''
        run: |
          set +e -uo pipefail
          FAILED=0
          ok()   { printf '   ok    %s\n' "$*"; }
          fail() { printf '   FAIL  %s\n' "$*"; FAILED=1; }
          STAPLED=
          for _ in 1 2 3 4 5 6; do
            if xcrun stapler staple "$APP" > "$RUNNER_TEMP/staple.txt" 2>&1; then STAPLED=1; break; fi
            sleep 10
          done
          if [[ -n "$STAPLED" ]]; then ok 'stapler staple RemoHop.app'; else fail 'stapler staple RemoHop.app'; tail -n 3 "$RUNNER_TEMP/staple.txt" | cut -c1-200; fi
          if xcrun stapler validate "$APP" > /dev/null 2>&1; then ok 'stapler validate: the ticket is in the bundle'; else fail 'stapler validate'; fi
          if codesign --verify --deep --strict "$APP" > /dev/null 2>&1; then ok 'codesign --verify --deep --strict after stapling'; else fail 'codesign --verify --deep --strict after stapling'; fi
          AZIP="$OUT/RemoHop-macos.zip"; rm -f "$AZIP"
          /usr/bin/ditto -c -k --keepParent "$APP" "$AZIP" || fail 'ditto -c -k --keepParent'
          echo "AZIP=$AZIP" >> "$GITHUB_ENV"

          # As downloaded: unpacked from the released zip, with the quarantine mark a browser sets.
          Q="$RUNNER_TEMP/app-quarantined"; rm -rf "$Q"; mkdir -p "$Q"
          /usr/bin/ditto -x -k "$AZIP" "$Q"
          QAPP="$Q/RemoHop.app"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$AZIP"
          find "$QAPP" -exec xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" {} \; 2>/dev/null
          if cmp -s "$QAPP/Contents/MacOS/RemoHop" "$APP/Contents/MacOS/RemoHop" && codesign --verify --deep --strict "$QAPP" 2>/dev/null; then ok 'the app in RemoHop-macos.zip is the signed one and verifies after unpacking'; else fail 'the app in RemoHop-macos.zip differs or does not verify'; fi
          if xcrun stapler validate "$QAPP" > /dev/null 2>&1; then ok 'the unpacked app carries the stapled ticket'; else fail 'the unpacked app has no stapled ticket'; fi
          ASSESS="$(spctl --assess --type execute -vv "$QAPP" 2>&1)"; code=$?
          SRC="$(sed -n 's/^source=//p' <<<"$ASSESS" | head -n 1)"
          if [[ "$code" -eq 0 && "$SRC" == *Notarized* ]]; then ok "spctl --assess --type execute (quarantined copy): accepted, source=$SRC"
          else fail "spctl --assess --type execute: exit $code, $(head -n 1 <<<"$ASSESS" | sed -e "s#$Q/##" | cut -c1-160) ${SRC:+source=$SRC}"; fi
          GOT="$("$QAPP/Contents/MacOS/RemoHop" version 2>&1)"; code=$?
          if [[ "$code" -eq 0 && "$GOT" == "remohop $VERSION" ]]; then ok 'the quarantined app program runs'; else fail "the quarantined app program does not run: exit $code"; head -n 2 <<<"$GOT" | cut -c1-200; fi

          # The hardened app serves its window: `quick --no-open` prints the page address (with its
          # access token, so it is not printed here) and the page must answer.
          W="$RUNNER_TEMP/quick-probe"; rm -rf "$W"; mkdir -p "$W/cfg"
          REMOHOP_CONFIG_DIR="$W/cfg" "$APP/Contents/MacOS/RemoHop" quick --no-open --lang en > "$W/out.txt" 2> "$W/err.txt" < /dev/null &
          QPID=$!
          URL=
          for _ in $(seq 1 100); do
            URL="$(sed -n 's/^RemoHop quick support: \(http:\/\/127\.0\.0\.1:[0-9]*\/[^ ]*\)$/\1/p' "$W/out.txt" 2>/dev/null | head -n 1)"
            [[ -n "$URL" ]] && break
            sleep 0.2
          done
          if [[ -n "$URL" ]]; then
            echo "::add-mask::$URL"
            CODE="$(curl -s -o "$W/page.html" -w '%{http_code}' --max-time 10 "$URL")"
            if [[ "$CODE" == 200 ]] && grep -qi 'remohop' "$W/page.html"; then ok 'quick --no-open: the window page answers on 127.0.0.1 (HTTP 200)'; else fail "quick --no-open: the page answered HTTP $CODE"; fi
          else
            fail 'quick --no-open printed no page address'; sed -E 's#https?://[^ ]+#<url>#g' "$W/err.txt" | tail -n 5 | cut -c1-300
          fi
          kill "$QPID" 2>/dev/null; wait "$QPID" 2>/dev/null

          # LaunchServices starts the signed bundle the way a double-click does (no quarantine on this
          # copy: the first-run confirmation would wait for a click). The window opens in the default
          # browser; the process is then stopped.
          open -n "$APP" > "$W/open.txt" 2>&1; code=$?
          PIDS=
          for _ in $(seq 1 50); do
            PIDS="$(pgrep -f "$APP/Contents/MacOS/RemoHop" | tr '\n' ' ')"
            [[ -n "$PIDS" ]] && break
            sleep 0.2
          done
          if [[ "$code" -eq 0 && -n "$PIDS" ]]; then
            sleep 3
            if pgrep -f "$APP/Contents/MacOS/RemoHop" > /dev/null; then ok 'open -n RemoHop.app: LaunchServices started the app and it keeps running'; else fail 'open -n RemoHop.app: the app exited at once'; fi
          else
            fail "open -n RemoHop.app: exit $code, no process"; cut -c1-200 "$W/open.txt" | tail -n 3
          fi
          pkill -f "$APP/Contents/MacOS/RemoHop" 2>/dev/null
          LOG="$HOME/Library/Application Support/remohop/quick.log"
          [[ -f "$LOG" ]] && grep -E 'opening the window|no page connected|could not' "$LOG" | sed -E 's#https?://[^ ]+#<url>#g' | tail -n 4 | cut -c1-200 | sed 's/^/   log   /'
          rm -rf "$W"

          SHA_APPZIP="$(shasum -a 256 "$AZIP" | cut -d' ' -f1)"
          echo "   sha256 RemoHop-macos.zip            $SHA_APPZIP"
          {
            if [[ "$FAILED" -eq 0 ]]; then echo '- RemoHop.app verification: stapled, deep strict signature, Gatekeeper accepts the quarantined copy from the zip (Notarized Developer ID), it runs, its UI server answers, LaunchServices starts it: PASS'; else echo '- RemoHop.app verification: **FAIL** (see the log)'; fi
            echo "- SHA-256 \`RemoHop-macos.zip\` (stapled app, ditto): \`$SHA_APPZIP\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$FAILED"

      # The usual Mac download: a disk image with the stapled app and an Applications link, so the
      # user drags RemoHop into Applications. The image itself is signed, notarized and stapled, so
      # Gatekeeper accepts it offline when it is opened.
      - name: Build, sign, notarize and staple RemoHop-macos.dmg
        if: env.APP != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e -uo pipefail
          FAILED=0
          ok()   { printf '   ok    %s\n' "$*"; }
          fail() { printf '   FAIL  %s\n' "$*"; FAILED=1; }
          P8="$RUNNER_TEMP/remohop-asc/AuthKey.p8"
          [[ -s "$P8" ]] || { echo '::error::the notary key from the Notarize step is gone.'; exit 1; }
          STAGE="$RUNNER_TEMP/dmg-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          /usr/bin/ditto "$APP" "$STAGE/RemoHop.app" || fail 'ditto RemoHop.app into the image folder'
          ln -s /Applications "$STAGE/Applications"
          DMG="$OUT/RemoHop-macos.dmg"; rm -f "$DMG"
          if hdiutil create -volname RemoHop -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "$DMG" > "$RUNNER_TEMP/hdiutil.txt" 2>&1; then ok 'hdiutil create (UDZO)'; else fail 'hdiutil create'; tail -n 3 "$RUNNER_TEMP/hdiutil.txt" | cut -c1-200; exit 1; fi
          if codesign --force --sign "$SIGN_HASH" --keychain "$KEYCHAIN_PATH" --timestamp "$DMG" > "$RUNNER_TEMP/codesign-dmg.log" 2>&1; then ok 'codesign the disk image (Developer ID, timestamp)'; else fail 'codesign the disk image'; tail -n 3 "$RUNNER_TEMP/codesign-dmg.log" | cut -c1-200; exit 1; fi
          RESULT="$RUNNER_TEMP/notary-dmg.json"
          xcrun notarytool submit "$DMG" --key "$P8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RESULT" 2> "$RUNNER_TEMP/notary-dmg.err"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$RESULT" 2>/dev/null)"
          if [[ "$STATUS" == "Accepted" ]]; then ok 'notarytool: RemoHop-macos.dmg Accepted'; else fail "notarytool: RemoHop-macos.dmg status '${STATUS:-none}'"; grep -Ei 'error|invalid|401|403' "$RUNNER_TEMP/notary-dmg.err" | sed -E 's/[A-Za-z0-9+\/=_-]{40,}/<redacted>/g' | cut -c1-300 | tail -n 5; exit 1; fi
          STAPLED=
          for _ in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG" > "$RUNNER_TEMP/staple-dmg.txt" 2>&1; then STAPLED=1; break; fi
            sleep 10
          done
          if [[ -n "$STAPLED" ]]; then ok 'stapler staple RemoHop-macos.dmg'; else fail 'stapler staple RemoHop-macos.dmg'; tail -n 3 "$RUNNER_TEMP/staple-dmg.txt" | cut -c1-200; fi
          if xcrun stapler validate "$DMG" > /dev/null 2>&1; then ok 'stapler validate: the ticket is in the disk image'; else fail 'stapler validate RemoHop-macos.dmg'; fi
          # As downloaded: quarantined, then opened the way Finder opens it.
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$DMG"
          ASSESS="$(spctl --assess --type open --context context:primary-signature -vv "$DMG" 2>&1)"; code=$?
          SRC="$(sed -n 's/^source=//p' <<<"$ASSESS" | head -n 1)"
          if [[ "$code" -eq 0 && "$SRC" == *Notarized* ]]; then ok "spctl --assess --type open (quarantined dmg): accepted, source=$SRC"; else fail "spctl --assess --type open: exit $code ${SRC:+source=$SRC}"; fi
          xattr -d com.apple.quarantine "$DMG" 2>/dev/null
          MNT="$RUNNER_TEMP/dmg-mnt"; rm -rf "$MNT"; mkdir -p "$MNT"
          if hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" > /dev/null 2>&1; then
            if cmp -s "$MNT/RemoHop.app/Contents/MacOS/RemoHop" "$APP/Contents/MacOS/RemoHop" && codesign --verify --deep --strict "$MNT/RemoHop.app" 2>/dev/null && xcrun stapler validate "$MNT/RemoHop.app" > /dev/null 2>&1; then ok 'the app in the image is the signed, stapled one'; else fail 'the app in the image differs or does not verify'; fi
            [[ -L "$MNT/Applications" ]] && ok 'the image has the Applications link' || fail 'no Applications link in the image'
            hdiutil detach "$MNT" > /dev/null 2>&1 || hdiutil detach -force "$MNT" > /dev/null 2>&1
          else
            fail 'hdiutil attach RemoHop-macos.dmg'
          fi
          rm -rf "$STAGE"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          SHA_DMG="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          echo "   sha256 RemoHop-macos.dmg            $SHA_DMG"
          {
            if [[ "$FAILED" -eq 0 ]]; then echo '- RemoHop-macos.dmg: signed, notarized, stapled, Gatekeeper accepts the quarantined image, holds the stapled app: PASS'; else echo '- RemoHop-macos.dmg: **FAIL** (see the log)'; fi
            echo "- SHA-256 \`RemoHop-macos.dmg\`: \`$SHA_DMG\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$FAILED"

      - name: Run the signed binary (help, loopback smoke test)
        working-directory: source
        run: |
          set +e -uo pipefail
          BIN="$OUT/remohop"
          "$BIN" --help > "$RUNNER_TEMP/help.txt" 2>&1; code=$?
          if [[ "$code" -eq 0 ]] && grep -q 'vpn' "$RUNNER_TEMP/help.txt" && grep -q 'desktop' "$RUNNER_TEMP/help.txt"; then echo "   ok    remohop --help ($(wc -l < "$RUNNER_TEMP/help.txt" | tr -d ' ') lines)"; else echo "::error::remohop --help failed (exit $code)."; head -n 5 "$RUNNER_TEMP/help.txt" | cut -c1-200; exit 1; fi
          [[ -f test/smoke/smoke.sh ]] || { echo '::error::test/smoke/smoke.sh is not on this ref.'; exit 66; }
          bash test/smoke/smoke.sh "$BIN" > "$RUNNER_TEMP/smoke.txt" 2>&1; code=$?
          cut -c1-300 "$RUNNER_TEMP/smoke.txt" | tail -n 80
          if [[ "$code" -eq 0 ]] && ! grep -q '^   FAIL' "$RUNNER_TEMP/smoke.txt"; then
            echo "- Signed binary: \`remohop --help\` and the loopback smoke test (host + client: $(grep -c '^   ok' "$RUNNER_TEMP/smoke.txt") checks): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Signed binary: loopback smoke test **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::the loopback smoke test failed with the signed binary.'; exit 1
          fi

      # The one thing the hardened runtime could break: remohop loads CoreGraphics and
      # ApplicationServices at run time (purego) for displays and input. A desktop probe makes
      # the signed host do exactly that; its JSON holds the viewer URL (with an access token),
      # so only chosen fields are printed.
      - name: Run the signed binary (system frameworks under the hardened runtime)
        run: |
          set +e -uo pipefail
          BIN="$OUT/remohop"
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > "$RUNNER_TEMP/brew-ffmpeg.log" 2>&1 \
            || { echo '::warning::ffmpeg could not be installed; the framework check was skipped.'; echo '- Signed binary loading system frameworks: skipped (no ffmpeg)' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          W="$RUNNER_TEMP/release-probe"; rm -rf "$W"; mkdir -p "$W/host" "$W/cli"
          PORT=$((20000 + RANDOM % 10000)); TARGET="127.0.0.1:$PORT"
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          REMOHOP_CONFIG_DIR="$W/host" "$BIN" host --no-signal --listen "$TARGET" --password "$PW" > "$W/host.log" 2>&1 < /dev/null &
          HOST_PID=$!
          CLI_PID=
          cleanup() { [[ -z "$CLI_PID" ]] || kill "$CLI_PID" 2>/dev/null; kill "$HOST_PID" 2>/dev/null; sleep 0.5; rm -rf "$W"; }
          trap cleanup EXIT
          for _ in $(seq 1 100); do grep -q 'host ready' "$W/host.log" 2>/dev/null && break; sleep 0.2; done
          grep -q 'host ready' "$W/host.log" || { echo '::error::the signed remohop host did not start.'; tail -n 5 "$W/host.log" | cut -c1-300; exit 1; }
          REMOHOP_CONFIG_DIR="$W/cli" REMOHOP_PASSWORD="$PW" "$BIN" "$TARGET" desktop --no-open --json > "$W/desktop.json" 2> "$W/desktop.err" < /dev/null &
          CLI_PID=$!
          for _ in $(seq 1 300); do
            grep -q '^}' "$W/desktop.json" 2>/dev/null && break
            kill -0 "$CLI_PID" 2>/dev/null || break
            sleep 0.2
          done
          if ! grep -q '^}' "$W/desktop.json" 2>/dev/null; then
            echo '::error::the signed binary could not answer a desktop probe (loading system frameworks under the hardened runtime?).'
            sed -E 's#https?://[^ ]+#<url>#g' "$W/desktop.err" | tail -n 5 | cut -c1-400
            echo '- Signed binary loading system frameworks (desktop probe): **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - "$W/desktop.json" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          d.pop("url", None)
          enc = d.get("encoders") or {}
          line = "host OS %s, screen %sx%s, encoders %s, input %s %s" % (
              d.get("os"), d.get("screen_width"), d.get("screen_height"),
              ", ".join("%s=%s" % kv for kv in sorted(enc.items())), d.get("input"), (d.get("input_error") or "")[:120])
          print("   " + line)
          # The screen size comes from CoreGraphics and the input answer from
          # ApplicationServices: both were loaded by the hardened binary.
          bad = not d.get("screen_width") or "load " in (d.get("input_error") or "")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("- Signed binary loading system frameworks under the hardened runtime (desktop probe): %s\n    - %s\n" % ("**FAIL**" if bad else "PASS", line))
          if bad:
              print("::error::the signed binary could not use the system frameworks")
              sys.exit(1)
          PY

      # Release hand-off (see the header): only when the caller asked for it, and only reached
      # when every check above passed. Public repository: the artifact is as public as the
      # release the binary goes into.
      - name: Stage the signed binary for the release hand-off
        if: inputs.upload == true
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/handoff"; rm -rf "$H"; mkdir -p "$H"
          cp "$OUT/remohop" "$H/remohop"
          cp "$ZIP" "$H/remohop-macos-universal.zip"
          FILES=(remohop remohop-macos-universal.zip)
          if [[ -n "${AZIP:-}" ]]; then cp "$AZIP" "$H/RemoHop-macos.zip"; FILES+=(RemoHop-macos.zip); fi
          if [[ -n "${DMG:-}" ]]; then cp "$DMG" "$H/RemoHop-macos.dmg"; FILES+=(RemoHop-macos.dmg); fi
          ( cd "$H" && shasum -a 256 "${FILES[@]}" > SHA256SUMS-macos && cat SHA256SUMS-macos )
          echo "HANDOFF_DIR=$H" >> "$GITHUB_ENV"
          echo "- Hand-off: artifact \`remohop-macos-universal\` uploaded for the release workflow (kept 3 days)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed binary (release hand-off)
        if: inputs.upload == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-macos-universal
          path: ${{ env.HANDOFF_DIR }}/*
          retention-days: 3
          if-no-files-found: error

      - name: Remove the signing keychain and key files
        if: always()
        run: |
          set +e
          if [[ -n "${ORIGINAL_KEYCHAINS:-}" ]]; then
            OLD=(); while IFS= read -r k; do [[ -n "$k" ]] && OLD+=("$k"); done < <(tr ':' '\n' <<<"$ORIGINAL_KEYCHAINS")
            [[ "${#OLD[@]}" -gt 0 ]] && security list-keychains -d user -s "${OLD[@]}" >/dev/null 2>&1
          fi
          [[ -n "${KEYCHAIN_NAME:-}" ]] && security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/remohop-asc" "$RUNNER_TEMP/remohop-devid.p12" "$RUNNER_TEMP/notary-result.json" "$RUNNER_TEMP/notary-log.json" "$RUNNER_TEMP/RemoHop-notarize.zip" "$RUNNER_TEMP/notary-dmg.json" >/dev/null 2>&1
          true
