# Radio (Meridian) mobile POCs — POC-02 (iOS) and POC-03 (Android) on GitHub-hosted VMs.
#
# Public CI repository -> private source readori/Radio (poc/ios-player, poc/android-player).
#
#   ios-core       : macos-26, iOS simulator. `xcodebuild test` of the MeridianPlayerCore Swift
#                    package: AVPlayer on real streams (Icecast + HLS), MTAudioProcessingTap, and
#                    ShazamKit with a custom catalog built from audio the tests generate.
#   ios-background : macos-26, iOS simulator. XcodeGen host app (UIBackgroundModes audio) + XCUITest:
#                    plays a fixture stream, goes to the home screen (screen lock best effort) for
#                    bg_minutes, samples the app state each minute, then reads back how far
#                    playback advanced while in the background. Not part of `all` (long).
#   android-spike  : ubuntu, KVM + Android emulator readiness: boot time of a phone image and an
#                    Android Automotive image.
#   android-poc    : ubuntu + KVM. Builds poc/android-player (Media3 MediaLibraryService), then on a
#                    phone emulator browses the tree and plays in the background with the screen
#                    off; on an Automotive emulator opens the system media center and reads the
#                    channel labels from the on-screen accessibility tree (uiautomator dump).
#
# Simulator/emulator results are not device results; device checks stay with a human.
#
# Safety rules (public repo, public logs): workflow_dispatch only; actions pinned to SHAs;
# TARGET_REPO_PAT only in checkout, not persisted; no other secrets; no artifacts. Logs show only
# `RESULT` lines (booleans, counts, stream labels — never URLs), test pass/fail lines and compiler
# `file:line: error:` lines. Raw xcodebuild logs, simulator logs, xcresult and logcat are never printed.
name: Radio Mobile POC

run-name: Radio Mobile POC · ${{ inputs.job }} · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Private readori/Radio branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      job:
        description: 'Which POC job to run'
        required: true
        default: all
        type: choice
        options: [all, ios-core, ios-background, android-spike, android-poc]
      play_seconds:
        description: 'android-poc: seconds of background playback with the screen off'
        required: true
        default: '120'
        type: string
      bg_minutes:
        description: 'ios-background: minutes in the background'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: radio-mobile-poc-${{ inputs.job }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.ref }}

jobs:
  ios-core:
    name: POC-02 iOS core (simulator)
    if: inputs.job == 'all' || inputs.job == 'ios-core'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Pick a simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          [[ -f source/poc/ios-player/MeridianPlayerCore/Package.swift ]] || { echo '::error::poc/ios-player is missing at this ref (POC-02)'; exit 66; }
          echo "Private source commit: $(git -C source rev-parse --short=8 HEAD)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid // empty')"
          [[ -n "$udid" ]] || { echo '::error::no available iPhone simulator'; exit 1; }
          echo "Simulator: $(xcrun simctl list devices -j | jq -r --arg u "$udid" '.devices | to_entries[] | .key as $rt | .value[] | select(.udid == $u) | "\(.name) (\($rt | sub(".*SimRuntime."; "")))"')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b > /dev/null

      - name: Test MeridianPlayerCore on the simulator
        shell: bash
        working-directory: source/poc/ios-player/MeridianPlayerCore
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          log="$(mktemp)"
          schemes="$(xcodebuild -list -json 2>/dev/null | jq -r '(.workspace.schemes // .project.schemes // [])[]')"
          scheme=MeridianPlayerCore
          grep -qx 'MeridianPlayerCore-Package' <<< "$schemes" && scheme=MeridianPlayerCore-Package
          echo "scheme: $scheme"
          xcodebuild test -scheme "$scheme" -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation > "$log" 2>&1 && status=0 || status=$?
          echo '--- results ---'
          grep -E '^RESULT ' "$log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '--- tests ---'
          grep -E "^Test Case '.*' (passed|failed)|^\*\* TEST (SUCCEEDED|FAILED) \*\*|Executed [0-9]+ tests?" "$log" | sed -E 's/ \([0-9.]+ seconds\)//' || true
          echo '--- errors (file:line only) ---'
          grep -E '^/[^ ]+:[0-9]+:([0-9]+:)? error: ' "$log" | sed -E 's#^.*/(poc/[^:]+)#\1#' | sort -u | head -40 || true
          echo "xcodebuild exit: $status"
          exit "$status"

  ios-background:
    name: POC-02 iOS background playback (simulator)
    if: inputs.job == 'ios-background'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BG_MINUTES: ${{ inputs.bg_minutes }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }
          [[ "$BG_MINUTES" =~ ^[0-9]{1,2}$ ]] && (( BG_MINUTES >= 1 && BG_MINUTES <= 60 )) || { echo '::error::bg_minutes must be 1-60'; exit 64; }

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Pick a simulator, generate the host project
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          [[ -f source/poc/ios-player/BackgroundHost/project.yml ]] || { echo '::error::poc/ios-player/BackgroundHost is missing at this ref (POC-02)'; exit 66; }
          echo "Private source commit: $(git -C source rev-parse --short=8 HEAD)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          command -v xcodegen > /dev/null || brew install xcodegen > /dev/null 2>&1
          echo "XcodeGen: $(xcodegen --version)"
          (cd source/poc/ios-player/BackgroundHost && xcodegen generate --quiet)
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid // empty')"
          [[ -n "$udid" ]] || { echo '::error::no available iPhone simulator'; exit 1; }
          echo "Simulator: $(xcrun simctl list devices -j | jq -r --arg u "$udid" '.devices | to_entries[] | .key as $rt | .value[] | select(.udid == $u) | "\(.name) (\($rt | sub(".*SimRuntime."; "")))"')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b > /dev/null

      - name: Background playback XCUITest
        shell: bash
        working-directory: source/poc/ios-player/BackgroundHost
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_BG_MINUTES: ${{ inputs.bg_minutes }}
        run: |
          set -uo pipefail
          log="$(mktemp)"
          xcodebuild test -project MeridianBackgroundHost.xcodeproj -scheme MeridianBackgroundHost \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation > "$log" 2>&1 && status=0 || status=$?
          echo '--- results ---'
          grep -oE 'RESULT [a-z_]+ .*' "$log" | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '--- tests ---'
          grep -E "^Test Case '.*' (passed|failed)|^\*\* TEST (SUCCEEDED|FAILED) \*\*|Executed [0-9]+ tests?" "$log" || true
          echo '--- errors (file:line only) ---'
          grep -E '^/[^ ]+:[0-9]+:([0-9]+:)? error: ' "$log" | sed -E 's#^.*/(poc/[^:]+)#\1#' | sort -u | head -40 || true
          grep -E '^error: |xcodebuild: error' "$log" | cut -c1-200 | sort -u | head -10 || true
          echo "xcodebuild exit: $status"
          exit "$status"

  android-spike:
    name: POC-03 Android emulator readiness
    if: inputs.job == 'all' || inputs.job == 'android-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo "kvm writable: $([[ -w /dev/kvm ]] && echo yes || echo no)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install emulator and system images
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          list="$(mktemp)"
          "$sdkm" --list > "$list" 2>/dev/null
          phone='system-images;android-35;google_apis;x86_64'
          grep -q "$phone" "$list" || phone="$(grep -oE 'system-images;android-[0-9]+;google_apis;x86_64' "$list" | sort -uV | tail -1)"
          auto="$(grep -oE 'system-images;android-[0-9]+[^ ;]*;android-automotive[^ ;]*;x86_64' "$list" | sort -uV | tail -1)"
          echo "phone image: $phone" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "automotive image: ${auto:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! "$sdkm" --install emulator platform-tools "$phone" ${auto:+"$auto"} > "$list.install" 2>&1; then
            grep -iE 'licen|error|fail' "$list.install" | head -20
            exit 1
          fi
          echo "phone=$phone" >> "$GITHUB_OUTPUT"
          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | head -5

      - name: Boot phone and Automotive emulators
        shell: bash
        env:
          PHONE_IMAGE: ${{ steps.sdk.outputs.phone }}
          AUTO_IMAGE: ${{ steps.sdk.outputs.auto }}
        run: |
          set -uo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # avdmanager and the emulator must agree on where AVDs live.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          boot() {
            local name="$1" image="$2" device="$3" start elapsed
            echo no | avdmanager create avd -n "$name" -k "$image" ${device:+-d "$device"} --force > /dev/null 2>&1 || { echo "$name: avd create failed"; return 1; }
            start=$(date +%s)
            emulator -avd "$name" -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on \
              -no-audio -camera-back none -camera-front none -no-metrics > "$RUNNER_TEMP/$name-emulator.log" 2>&1 &
            local pid=$!
            if ! timeout 300 adb wait-for-device; then
              echo "$name: device never appeared (emulator running: $(kill -0 "$pid" 2>/dev/null && echo yes || echo no))" | tee -a "$GITHUB_STEP_SUMMARY"
              # The emulator log holds no secrets or private source: SDK paths and device messages only.
              grep -iE 'error|fatal|panic|fail' "$RUNNER_TEMP/$name-emulator.log" | head -20
              tail -n 15 "$RUNNER_TEMP/$name-emulator.log"
              kill "$pid" 2>/dev/null || true
              return 1
            fi
            for _ in $(seq 1 120); do
              [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
              sleep 5
            done
            elapsed=$(( $(date +%s) - start ))
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              echo "$name booted: yes in ${elapsed}s, sdk $(adb shell getprop ro.build.version.sdk | tr -d '\r')" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$name booted: no after ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            adb emu kill > /dev/null 2>&1 || true
            sleep 10
          }
          ok=0
          boot phone "$PHONE_IMAGE" pixel_7 || ok=1
          if [[ -n "$AUTO_IMAGE" ]]; then
            device="$(avdmanager list device -c 2>/dev/null | grep -m1 -E 'automotive_1024p_landscape|automotive' || true)"
            boot automotive "$AUTO_IMAGE" "$device" || ok=1
          fi
          exit "$ok"

  android-poc:
    name: POC-03 Android Media3 (emulators)
    if: inputs.job == 'android-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_VERSION: 8.14.3
      PLAY_SECONDS: ${{ inputs.play_seconds }}
      APP_ID: dev.meridian.poc
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }
          [[ "$PLAY_SECONDS" =~ ^[0-9]{2,4}$ ]] || { echo '::error::play_seconds must be 10-9999'; exit 64; }

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up SDK, Gradle and KVM
        shell: bash
        run: |
          set -euo pipefail
          [[ -f source/poc/android-player/settings.gradle.kts ]] || { echo '::error::poc/android-player is missing at this ref (POC-03)'; exit 66; }
          echo "Private source commit: $(git -C source rev-parse --short=8 HEAD)"
          sudo chmod 666 /dev/kvm
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          list="$(mktemp)"
          "$sdkm" --list > "$list" 2>/dev/null
          auto="$(grep -oE 'system-images;android-[0-9]+[^ ;]*;android-automotive[^ ;]*;x86_64' "$list" | sort -uV | tail -1)"
          echo "AUTO_IMAGE=$auto" >> "$GITHUB_ENV"
          if ! "$sdkm" --install emulator platform-tools 'platforms;android-36' 'build-tools;36.0.0' \
              'system-images;android-35;google_apis;x86_64' "$auto" > "$list.install" 2>&1; then
            grep -iE 'licen|error|fail' "$list.install" | head -20
            exit 1
          fi
          # Gradle distribution, verified against the checksum published next to it.
          cd "$RUNNER_TEMP"
          curl -fsSLo gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256")  gradle.zip" | sha256sum -c - > /dev/null
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          # The runner's default JDK can be newer than Gradle supports; AGP needs 17+.
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "Gradle ${GRADLE_VERSION} verified; $("$JAVA_HOME/bin/java" -version 2>&1 | head -1)"

      - name: Build APKs
        id: build
        shell: bash
        working-directory: source/poc/android-player
        run: |
          set -uo pipefail
          log="$(mktemp)"
          if ! gradle --no-daemon --console=plain -q assemblePhoneDebug assemblePhoneDebugAndroidTest assembleAutomotiveDebug > "$log" 2>&1; then
            echo 'build failed; compiler errors and Gradle failure summary only:'
            grep -E -A3 '^e: |What went wrong' "$log" | grep -vE 'Run with --|Get more help|^--$' | sed -E 's#file://[^ ]*/(poc/[^ ]+)#\1#' | head -40
            exit 1
          fi
          find app/build/outputs/apk -name '*.apk' -printf '%P %k KiB\n'

      - name: Phone emulator - browse, then background playback with the screen off
        shell: bash
        working-directory: source/poc/android-player
        run: |
          set +e -uo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n phone -k 'system-images;android-35;google_apis;x86_64' -d pixel_7 --force > /dev/null
          # Audio left on: with -no-audio the emulator may not consume audio in real time.
          emulator -avd phone -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on \
            -camera-back none -camera-front none -no-metrics > "$RUNNER_TEMP/phone.log" 2>&1 &
          timeout 300 adb wait-for-device || { grep -iE 'error|fatal' "$RUNNER_TEMP/phone.log" | head; exit 1; }
          timeout 600 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'
          echo "phone booted, sdk $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          adb install -r app/build/outputs/apk/phone/debug/*.apk > /dev/null
          adb install -r app/build/outputs/apk/androidTest/phone/debug/*.apk > /dev/null
          adb shell pm grant "$APP_ID" android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          runner="$APP_ID.test/androidx.test.runner.AndroidJUnitRunner"
          summarize() { grep -E '^OK \(|^FAILURES|^Tests run|AssertionError|INSTRUMENTATION_(FAILED|CODE: -?[0-9])' "$1" | head -10; }
          adb shell am instrument -w -e class "$APP_ID.BrowseAndPlayTest#browseTreeListsChannels" "$runner" > "$RUNNER_TEMP/browse.txt" 2>&1
          echo '--- browse ---'
          summarize "$RUNNER_TEMP/browse.txt"
          adb shell am instrument -w -e class "$APP_ID.BrowseAndPlayTest#playsInBackground" -e playSeconds "$PLAY_SECONDS" "$runner" > "$RUNNER_TEMP/play.txt" 2>&1 &
          inst=$!
          sample() {
            # Only our session's playback state and position; never metadata or URIs.
            local state
            state="$(adb shell dumpsys media_session | awk -v app="$APP_ID" '/package=/{mine=index($0, "package=" app)>0} mine && /state=PlaybackState/{print; exit}' \
              | sed -E 's/.*state=PlaybackState \{state=([A-Z_0-9]+)[^,]*, position=([0-9]+).*/state=\1 position_ms=\2/')"
            echo "$1: ${state:-no session state} | $(adb shell dumpsys power | grep -m1 -oE 'mWakefulness=[A-Za-z]+' | tr -d '\r') | notification records: $(adb shell dumpsys notification | grep -c "pkg=$APP_ID" | tr -d '\r')"
          }
          sleep 30
          sample 'playing, app in background'
          adb shell input keyevent KEYCODE_HOME
          adb shell input keyevent KEYCODE_SLEEP
          sleep 20
          sample 'screen off +20s'
          sleep $(( PLAY_SECONDS > 70 ? PLAY_SECONDS - 60 : 10 ))
          sample 'screen off, later'
          wait "$inst"
          echo '--- background playback ---'
          summarize "$RUNNER_TEMP/play.txt"
          echo '--- results ---'
          adb logcat -d -s System.out:I | grep -oE 'RESULT .*' | tee -a "$GITHUB_STEP_SUMMARY"
          ok=0
          grep -qE '^OK \(' "$RUNNER_TEMP/browse.txt" || ok=1
          grep -qE '^OK \(' "$RUNNER_TEMP/play.txt" || ok=1
          adb emu kill > /dev/null 2>&1 || true
          exit "$ok"

      - name: Automotive emulator - system media center lists the channels
        if: always() && steps.build.outcome == 'success' && env.AUTO_IMAGE != ''
        shell: bash
        working-directory: source/poc/android-player
        run: |
          set +e -uo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sleep 10
          device="$(avdmanager list device -c 2>/dev/null | grep -m1 -E 'automotive_1024p_landscape|automotive' || true)"
          echo no | avdmanager create avd -n auto -k "$AUTO_IMAGE" ${device:+-d "$device"} --force > /dev/null
          emulator -avd auto -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -no-audio \
            -camera-back none -camera-front none -no-metrics > "$RUNNER_TEMP/auto.log" 2>&1 &
          timeout 300 adb wait-for-device || { grep -iE 'error|fatal' "$RUNNER_TEMP/auto.log" | head; exit 1; }
          timeout 600 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'
          echo "automotive booted, sdk $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          adb install -r app/build/outputs/apk/automotive/debug/*.apk 2>&1 | grep -oE "Success|INSTALL_[A-Z_]+" | head -1
          sleep 15
          adb shell am start -a android.car.intent.action.MEDIA_TEMPLATE \
            --es android.car.intent.extra.MEDIA_COMPONENT "$APP_ID/.PlaybackService" > /dev/null 2>&1
          found=''
          for _ in $(seq 1 12); do
            sleep 5
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 || continue
            found="$(adb exec-out cat /sdcard/ui.xml | grep -oE 'Meridian Test . Channel [A-C]' | sed -E 's/.* //' | sort -u | tr -d '\n')"
            [[ -n "$found" ]] && break
          done
          focus="$(adb shell dumpsys window | grep -m1 -oE 'mCurrentFocus=Window\{[^}]*\}' | grep -oE '[a-z][a-z0-9_]*(\.[a-z0-9_]+)+' | head -1 | tr -d '\r')"
          echo "RESULT aaos focused_package=${focus:-unknown} channels_on_screen=${found:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -z "$found" ]]; then
            # Diagnostics: on-screen labels of the emulator's own system UI (no private data).
            adb exec-out cat /sdcard/ui.xml 2>/dev/null | grep -oE 'text="[^"]{1,40}"' | sort -u | head -15
            echo "media sessions for app: $(adb shell dumpsys media_session | grep -c "package=$APP_ID")"
          fi
          adb emu kill > /dev/null 2>&1 || true
          [[ "$found" == 'ABC' ]]
