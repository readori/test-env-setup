name: Readori Voice Packs

run-name: Voice packs ${{ inputs.mode }} @ ${{ inputs.source_ref }}${{ inputs.mode == 'build' && format(' · {0}', inputs.packs) || '' }}${{ inputs.publish && ' · publish' || '' }}

# CI for the public repository readori/readori-voice-packs (offline sherpa-onnx voice packs).
# That repository holds no workflows; every check and build runs here.
#
#   mode=check  lint + unit tests + registry / license gate. Downloads no models.
#   mode=build  check, then fetch -> build -> validate -> smoke -> (audit) -> pack each selected
#               pack; with publish=true (source_ref main only) upload GitHub Releases to
#               readori/readori-voice-packs and commit catalog/v1/index.json back to its main.
#   mode=asset-packs  check, then package the already published packs (asset_pack_ids, default all
#               with an appleAssetPackId) into Apple asset packs (.aar artifact); builds nothing.
#
# Every job checks out the same commit (resolved once in `check`). Only the two publishing steps
# receive TARGET_REPO_PAT; everything else uses read-only tokens. No Apple / App Store Connect
# secrets are used: Apple asset packs (job `apple-asset-pack`, mode=asset-packs or after a publish)
# are built as artifacts from the published Release ZIPs and uploaded separately by hand.
# Official actions are pinned to commit SHAs (checkout v7.0.1, setup-python v7.1.0,
# upload-artifact v7.0.2, download-artifact v8.0.2).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 代码检查与测试；build = 检查后制作语音包；asset-packs = 检查后只把已发布的包打成 Apple 资产包 .aar"
        required: true
        default: check
        type: choice
        options:
          - check
          - build
          - asset-packs
      source_ref:
        description: "readori-voice-packs 的分支、标签或提交 SHA（发布只允许 main）"
        required: true
        default: main
        type: string
      packs:
        description: "build：逗号分隔的语音包 id，或 all-approved（官方包）/ all-community（社区包，仅 GitHub Releases）"
        required: true
        default: all-approved
        type: string
      audit:
        description: "build：逐音色声学审计（仅多音色包）"
        required: true
        default: true
        type: boolean
      publish:
        description: "build：发布 GitHub Releases 并更新 catalog/v1/index.json"
        required: true
        default: false
        type: boolean
      asset_pack_ids:
        description: "asset-packs / 发布后的 Apple 资产包：逗号分隔的语音包 id；留空 = index.json 中所有带 appleAssetPackId 的包（build 模式留空 = 本次构建的包）"
        required: false
        default: ""
        type: string
      allow_unpinned:
        description: "build：允许 registry 中未固定 sha256 / bytes 的模型（不可与 publish 同用）"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: readori-voice-packs
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: readori/readori-voice-packs

jobs:
  check:
    name: Lint, tests and license gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    defaults:
      run:
        working-directory: voice-packs
    steps:
      - name: Validate inputs
        working-directory: .
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
          ALLOW_UNPINNED: ${{ inputs.allow_unpinned }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            [ "$MODE" = "build" ] || { echo "::error::publish=true requires mode=build"; exit 1; }
            [ "$SOURCE_REF" = "main" ] || { echo "::error::publish=true requires source_ref=main"; exit 1; }
            [ "$ALLOW_UNPINNED" != "true" ] || { echo "::error::publish=true cannot be combined with allow_unpinned"; exit 1; }
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          path: voice-packs
          persist-credentials: false

      - name: Resolve source commit
        id: rev
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source: \`$SOURCE_REPOSITORY@$sha\` (ref \`${{ inputs.source_ref }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest

      - name: Registry schema and license gate
        run: python -m readori_voicepack registry-check

  plan:
    name: Build plan
    needs: check
    if: ${{ inputs.mode == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packs: ${{ steps.plan.outputs.has_packs }}
    defaults:
      run:
        working-directory: voice-packs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.check.outputs.sha }}
          path: voice-packs
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Publishing token can write the target repository
        if: ${{ inputs.publish }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::TARGET_REPO_PAT is not set"; exit 1; }
          push="$(gh api "repos/$SOURCE_REPOSITORY" --jq '.permissions.push' 2>/dev/null || echo error)"
          if [ "$push" != "true" ]; then
            echo "::error::TARGET_REPO_PAT cannot push to $SOURCE_REPOSITORY (got: $push); grant it Contents read/write there"
            exit 1
          fi

      - name: License gate and build matrix
        id: plan
        env:
          PACKS: ${{ inputs.packs }}
          ALLOW_UNPINNED: ${{ inputs.allow_unpinned }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(--select "$PACKS" --matrix)
          if [ "$ALLOW_UNPINNED" != "true" ]; then args+=(--require-pinned); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--for-publish); fi
          python -m readori_voicepack registry-check "${args[@]}" > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' matrix.json)" -gt 0 ]; then has=true; else has=false; fi
          echo "has_packs=$has" >> "$GITHUB_OUTPUT"
          {
            echo "### Build plan"
            echo
            echo '```json'
            cat matrix.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.id }}
    needs: [check, plan]
    if: ${{ needs.plan.outputs.has_packs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: voice-packs
    env:
      PACK_ID: ${{ matrix.id }}
      UNPINNED_FLAG: ${{ inputs.allow_unpinned && '--allow-unpinned' || '' }}
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.check.outputs.sha }}
          path: voice-packs
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install (sherpa-onnx is pinned by the audio extra)
        run: python -m pip install -e ".[audio]"

      - name: Fetch upstream archive (bytes / sha256 checked)
        run: python -m readori_voicepack fetch "$PACK_ID" $UNPINNED_FLAG

      - name: Build pack directory
        run: python -m readori_voicepack build "$PACK_ID" $UNPINNED_FLAG

      - name: Validate (app importer rules)
        run: python -m readori_voicepack validate "build/packs/$PACK_ID"

      - name: Smoke synthesis
        run: python -m readori_voicepack smoke "build/packs/$PACK_ID"

      - name: Audit speakers
        if: ${{ inputs.audit }}
        run: python -m readori_voicepack audit "build/packs/$PACK_ID" --min-speakers 2

      - name: Validate again after audit
        if: ${{ inputs.audit }}
        run: python -m readori_voicepack validate "build/packs/$PACK_ID"

      - name: Pack (deterministic ZIP)
        run: |
          python -m readori_voicepack pack "build/packs/$PACK_ID" --out dist
          python -m readori_voicepack validate dist/*.zip
          {
            echo "### $PACK_ID"
            echo
            echo '```json'
            cat dist/*.zip.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-${{ matrix.id }}
          path: voice-packs/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload sidecar (used by the index job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-${{ matrix.id }}
          path: voice-packs/dist/*.zip.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release to readori-voice-packs
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          VER="$(jq -r '.packVersion' dist/*.zip.json)"
          SPDX="$(jq -r '.license.spdx // "see readori-attribution.txt"' dist/*.zip.json)"
          SHA="$(jq -r '.sha256' dist/*.zip.json)"
          TAG="pack/${PACK_ID}/v${VER}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TIER="$(jq -r '.tier // "official"' dist/*.zip.json)"
          if [ "$TIER" = "community" ]; then
            LICENSE_LINE="Community tier: collected from the community, not recommended by Readori; add at your own discretion. Licence not verified. 社区收集，Readori 不推荐，由用户自行添加使用，许可证未经核实。"
          else
            LICENSE_LINE="Model license: ${SPDX}."
          fi
          NOTES="Readori offline voice pack ${PACK_ID} v${VER}. ${LICENSE_LINE} ZIP SHA-256: ${SHA}. Built from ${SOURCE_REPOSITORY}@${SOURCE_SHA} by ${RUN_URL}."
          if gh release view "$TAG" --repo "$SOURCE_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.zip.json --clobber --repo "$SOURCE_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/*.zip.json \
              --repo "$SOURCE_REPOSITORY" \
              --title "${PACK_ID} v${VER}" \
              --notes "$NOTES" \
              --target "$SOURCE_SHA"
          fi

  apple-asset-pack:
    # Apple-hosted Background Assets packs (.aar), built from the published GitHub Release ZIPs
    # (the exact bytes the app's GitHub fallback downloads) and the committed catalog/v1/index.json.
    # Runs for mode=asset-packs, and after a successful publish (build + index) for the packs of
    # that build. Needs Xcode 26 (`xcrun ba-package`); otherwise it explains why it was skipped.
    # continue-on-error: this job never fails the workflow. No secrets; nothing is uploaded to
    # App Store Connect (a separate manual step). Community-tier packs are never packaged.
    name: Apple asset packs
    needs: [check, plan, build, index]
    if: ${{ always() && needs.check.result == 'success' && (inputs.mode == 'asset-packs' || (inputs.publish && needs.index.result == 'success')) }}
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        working-directory: voice-packs
    env:
      RELEASE_PREFIX: https://github.com/readori/readori-voice-packs/releases/download/
      ASSET_PACK_IDS: ${{ inputs.asset_pack_ids }}
      BUILT_MATRIX: ${{ needs.plan.outputs.matrix }}
      RUN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          # After a publish the index was committed to main by the `index` job; otherwise use the
          # commit that passed the checks.
          ref: ${{ (inputs.mode == 'build' && inputs.publish) && 'main' || needs.check.outputs.sha }}
          path: voice-packs
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Detect Xcode 26 and xcrun ba-package
        id: detect
        run: |
          set -uo pipefail
          latest="$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          version="$(xcodebuild -version 2>&1)"; echo "$version"
          major="${version%%$'\n'*}"; major="${major#Xcode }"; major="${major%%.*}"
          if [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 26 )) && xcrun --find ba-package > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "=========== xcrun ba-package --help";        xcrun ba-package --help || true
            echo "=========== xcrun ba-package help package";  xcrun ba-package help package || true
            echo "=========== xcrun ba-package help template"; xcrun ba-package help template || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Apple asset packs skipped"
              echo
              echo "\`xcrun ba-package\` needs Xcode 26 (selected: ${major:-unknown}). The GitHub Release ZIPs are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Select packs
        id: select
        if: ${{ steps.detect.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          ids="${ASSET_PACK_IDS// /}"
          if ! [[ "$ids" =~ ^[a-z0-9,-]*$ ]]; then
            echo "::error::asset_pack_ids may only contain lowercase letters, digits, hyphens and commas"
            exit 1
          fi
          mkdir -p work
          # Every eligible entry of the index (appleAssetPackId set, official tier, release URL).
          python -m readori_voicepack ba-layout --plan > work/plan-all.json
          if [ -n "$ids" ]; then
            # Explicit ids: ba-layout refuses unknown, community or appleAssetPackId-less ones.
            python -m readori_voicepack ba-layout --plan --pack-ids "$ids" > work/plan.json
          elif [ "$RUN_MODE" = "build" ]; then
            # After a publish: only the packs of this build (community ones are not in the plan).
            built="$(printf '%s' "${BUILT_MATRIX:-}" | jq -c '[.include[]?.id]' 2>/dev/null || echo '[]')"
            jq --argjson built "${built:-[]}" '[.[] | select(.id as $i | $built | index($i))]' \
              work/plan-all.json > work/plan.json
          else
            cp work/plan-all.json work/plan.json
          fi
          count="$(jq 'length' work/plan.json)"
          if [ "$count" -eq 0 ]; then
            if [ "$RUN_MODE" = "build" ]; then
              echo "none of the built packs has an appleAssetPackId (community or not yet in the index): nothing to package" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "any=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::no index entry has an appleAssetPackId: nothing to package"
            exit 1
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "ids=$(jq -r 'map(.id) | join(",")' work/plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Asset packs to build ($count)"
            echo
            jq -r '.[] | "- `\(.assetPackId)` (\(.bytes) bytes)"' work/plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Release ZIPs and verify sha256 / size
        if: ${{ steps.select.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p work/zips
          jq -c '.[]' work/plan.json | while IFS= read -r row; do
            id="$(jq -r '.id' <<<"$row")"
            url="$(jq -r '.url' <<<"$row")"
            file="$(jq -r '.file' <<<"$row")"
            sha="$(jq -r '.sha256' <<<"$row")"
            size="$(jq -r '.bytes' <<<"$row")"
            case "$url" in
              "${RELEASE_PREFIX}"*) ;;
              *) echo "::error::refusing to download from outside ${RELEASE_PREFIX}: $url"; exit 1 ;;
            esac
            echo "download $id"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --output "work/zips/$file" "$url"
            actual="$(shasum -a 256 "work/zips/$file" | cut -d' ' -f1)"
            [ "$actual" = "$sha" ] || { echo "::error::$id sha256 mismatch: $actual != $sha"; exit 1; }
            [ "$(wc -c < "work/zips/$file" | tr -d ' ')" = "$size" ] || { echo "::error::$id size mismatch"; exit 1; }
            echo "ok $id sha256=$sha"
          done

      - name: Print the real ba-package template
        if: ${{ steps.select.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          rm -rf work/tmpl && mkdir -p work/tmpl
          (
            cd work/tmpl
            xcrun ba-package template > stdout.txt
            # The tool may print the template or write a JSON file into the working directory.
            found="$(ls -1 ./*.json 2>/dev/null | head -n 1 || true)"
            if [ -n "$found" ]; then cp "$found" ../ba-template.json; else cp stdout.txt ../ba-template.json; fi
          )
          python -c 'import json; json.load(open("work/ba-template.json", encoding="utf-8"))' \
            || { echo "::error::the ba-package template is not valid JSON"; cat work/ba-template.json; exit 1; }
          {
            echo "### \`xcrun ba-package template\`"
            echo
            echo '```json'
            cat work/ba-template.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lay out asset packs and fill manifests from the template
        if: ${{ steps.select.outputs.any == 'true' }}
        env:
          SELECTED_IDS: ${{ steps.select.outputs.ids }}
        run: |
          set -euo pipefail
          python -m readori_voicepack ba-layout --pack-ids "$SELECTED_IDS" \
            --zips work/zips --out work/ba --template work/ba-template.json --hardlink
          for m in work/ba/*.manifest.json; do
            echo "=========== $m"; cat "$m"
          done

      - name: Package .aar with ba-package
        if: ${{ steps.select.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p work/aar
          aar_dir="$PWD/work/aar"
          for manifest in work/ba/*.manifest.json; do
            asset="$(basename "$manifest" .manifest.json)"
            manifest_abs="$PWD/$manifest"
            echo "=========== package $asset"
            # File selectors are relative to the asset pack root: run from inside it.
            (
              cd "work/ba/$asset"
              # Subcommand form first (`ba-package package`), plain form as a fallback; the help
              # texts printed above document which one this Xcode accepts.
              if xcrun ba-package package "$manifest_abs" -o "$aar_dir/$asset.aar"; then
                echo "packaged with: xcrun ba-package package <manifest> -o <aar>"
              else
                echo "::warning::'ba-package package' failed, trying 'ba-package <manifest> -o <aar>'"
                rm -f "$aar_dir/$asset.aar"
                xcrun ba-package "$manifest_abs" -o "$aar_dir/$asset.aar"
                echo "packaged with: xcrun ba-package <manifest> -o <aar>"
              fi
            )
            [ -s "$aar_dir/$asset.aar" ] || { echo "::error::no .aar produced for $asset"; exit 1; }
          done
          {
            echo "### Asset packs"
            echo
            echo '```'
            (cd "$aar_dir" && ls -l && shasum -a 256 ./*.aar)
            echo '```'
            echo
            echo "Not uploaded anywhere. Uploading to App Store Connect is a separate manual step."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp work/ba/*.manifest.json work/ba-template.json work/plan.json "$aar_dir/"

      - name: Upload asset packs
        if: ${{ steps.select.outputs.any == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-asset-packs
          path: voice-packs/work/aar/*
          if-no-files-found: error
          retention-days: 14

  index:
    name: Update catalog index
    needs: [check, build]
    if: ${{ inputs.publish && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: voice-packs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          path: voice-packs
          token: ${{ secrets.TARGET_REPO_PAT }}
          persist-credentials: true # needed to push the index commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sidecar-*
          path: voice-packs/sidecars
          merge-multiple: true

      - name: Update catalog/v1/index.json
        run: python -m readori_voicepack index --sidecars sidecars --repo "$SOURCE_REPOSITORY"

      - name: Commit index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- catalog/v1/index.json; then
            echo "index.json unchanged"
          else
            git add catalog/v1/index.json
            git commit -m "catalog: update index.json (readori/test-env-setup run ${GITHUB_RUN_ID})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
