        # Get existing version localizations
        r = subprocess.run(
            ['asc', 'version-localizations', 'list', '--version-id', version_id, '--output', 'json'],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'Failed to list version localizations: {r.stderr[:200]}'); sys.exit(0)

        try:
            data = json.loads(r.stdout)
            locs = data['data'] if isinstance(data, dict) and 'data' in data else data
        except Exception as e:
