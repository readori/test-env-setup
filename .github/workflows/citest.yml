        # Clean up leading whitespace from heredoc indentation
        import textwrap
        DESC_EN = textwrap.dedent(DESC_EN).strip()
        DESC_ZH_HANS = textwrap.dedent(DESC_ZH_HANS).strip()
        DESC_ZH_HANT = textwrap.dedent(DESC_ZH_HANT).strip()

        locale_meta = {
            'en-US': {
                'description': DESC_EN,
                'keywords': 'reading,ebook,epub,audiobook,gutenberg,librivox,book reader,public domain,tts,offline reader',
                'promotionalText': 'A focused reading app with customizable themes, smart sources, and continuity across devices.',
                'supportUrl': 'https://readori.com',
                'marketingUrl': 'https://readori.com',
            },
            'zh-Hans': {
                'description': DESC_ZH_HANS,
                'keywords': '\u9605\u8bfb,\u7535\u5b50\u4e66,epub,\u6709\u58f0\u4e66,\u53e4\u817e\u5821,librivox,\u4e66\u6e90,\u516c\u5171\u9886\u57df,\u6717\u8bfb,\u79bb\u7ebf\u9605\u8bfb',
                'promotionalText': '\u4e13\u6ce8\u957f\u9605\u8bfb\u4f53\u9a8c\uff0c\u652f\u6301\u4e3b\u9898\u5b9a\u5236\u3001\u4e66\u6e90\u7ba1\u7406\u4e0e\u8de8\u8bbe\u5907\u8fde\u7eed\u9605\u8bfb\u3002',
                'supportUrl': 'https://readori.com',
                'marketingUrl': 'https://readori.com',
            },
            'zh-Hant': {
                'description': DESC_ZH_HANT,
                'keywords': '\u95b1\u8b80,\u96fb\u5b50\u66f8,epub,\u6709\u8072\u66f8,\u53e4\u9a30\u5821,librivox,\u66f8\u6e90,\u516c\u5171\u9818\u57df,\u6717\u8b80,\u96e2\u7dda\u95b1\u8b80',
                'promotionalText': '\u5c08\u6ce8\u9577\u95b1\u8b80\u9ad4\u9a57\uff0c\u652f\u63f4\u4e3b\u984c\u81ea\u8a02\u3001\u66f8\u6e90\u7ba1\u7406\u8207\u8de8\u88dd\u7f6e\u63a5\u7e8c\u95b1\u8b80\u3002',
