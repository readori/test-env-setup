    # ==============================================
    # 16. SUBMIT FOR REVIEW (submit only)
    # ==============================================
    - name: Submit for App Store review
      if: ${{ env.MODE == 'submit' }}
      run: |
        VERSION_ID=$(asc versions list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json 2>/dev/null | \
          python3 -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            versions = data['data'] if isinstance(data, dict) and 'data' in data else data
            ordered = sorted(versions, key=lambda v: (
        0 if v.get('appStoreState') == 'READY_FOR_REVIEW' else 1
            ))
            print(ordered[0]['id'] if ordered else '')
        except: print('')
        " || echo "")
        if [[ -z "$VERSION_ID" ]]; then
          echo "No version in READY_FOR_REVIEW — skipping submit"
          exit 0
        fi
        echo "Submitting version-id: $VERSION_ID"
        asc versions submit --version-id "$VERSION_ID"

    # ==============================================
    # 16.5 AUTO-CAPTURE SIMULATOR SCREENSHOTS
    #       (screenshots mode, when no pre-staged screenshots exist)
    #       Boots an iPhone simulator AND an iPad simulator, installs a
    #       debug build on both, and captures screens per required locale.
    #
    #       🐛 修复（之前这个功能不完整，"iPhone、iPad 上架"里其实完全没有 iPad）：
    #       1. 只处理了 iPhone 模拟器，从未启动/安装/截图 iPad 模拟器——但 App
    #          Store 要求"支持 iPad 的 App 必须提供至少一组 iPad 截图"，否则
    #          iPad 版本会在审核/上架时被拒或干脆没有列表图。这里补上 iPad Pro
    #          13 英寸 (M4) 模拟器，display-type 用 App Store Connect API 实际
    #          认的 APP_IPAD_PRO_3GEN_129（Apple 目前仍复用这个旧枚举承载新的
    #          13 寸截图，官方 API 文档尚未新增专门枚举）。
    #       2. Tab 栏点击坐标之前是写死的绝对像素（108,940 / 322,940），只在
    #          "恰好是同一台 iPhone 16 Pro Max、同一个 Xcode 默认模拟器"时凑巧
    #          管用；换一台机型/iPad 完全是另一套屏幕尺寸，点了也点不中。这里
    #          改成按各机型真实的点尺寸（非像素）算比例坐标。
    #       3. 之前直接把 en-US 截图复制给 zh-Hans，中文商品页配的是英文界面
    #          截图。这里改为用 -AppleLanguages/-AppleLocale 以目标语种重启
    #          App 后再截图，确保每个语种看到的是真正对应语言的界面。
    #       4. 增加基本校验：截图文件如果几乎是空文件（明显失败帧），重试一次。
    # ==============================================
    - name: Auto-capture simulator screenshots
      if: ${{ env.MODE == 'testflight' || env.MODE == 'submit' || env.MODE == 'screenshots' }}
      continue-on-error: true
      run: |
        set +e  # best-effort: any single failure here should not fail the whole job
        SCREENSHOTS_DIR="$GITHUB_WORKSPACE/screenshots_captured"
        TARGET_DIR="core_project/screenshots"
        BUNDLE_ID="com.readori.app"

        # Skip auto-capture if screenshots already exist
        if [[ -d "$TARGET_DIR" ]] && [[ -n "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]]; then
          echo "Pre-staged screenshots found at $TARGET_DIR — skipping auto-capture"
          exit 0
        fi

        # ---- helper: print "udid|name" for the first available simulator matching any pattern ----
        # 注意：这里故意写成单行 python3 -c 而不是 heredoc/多行脚本——
        # heredoc 的结束标记必须顶格、不能带 YAML 缩进，会把这个 run block 提前截断。
        pick_simulator() {
          python3 -c "import json,subprocess,sys; patterns=sys.argv[1:]; data=json.loads(subprocess.run(['xcrun','simctl','list','devices','available','--json'],capture_output=True,text=True).stdout); all_devs=[d for devs in data.get('devices',{}).values() for d in devs if d.get('isAvailable')]; match=next((d for pat in patterns for d in all_devs if pat in d.get('name','')), None); print((match['udid']+'|'+match['name']) if match else '', end='')" "$@"
        }

        IPHONE_SIM=$(pick_simulator "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 14 Pro Max" "iPhone 13 Pro Max")
        IPAD_SIM=$(pick_simulator "iPad Pro 13-inch (M4)" "iPad Pro (12.9-inch) (6th generation)" "iPad Pro (12.9-inch) (5th generation)")

        if [[ -z "$IPHONE_SIM" && -z "$IPAD_SIM" ]]; then
          echo "No suitable iPhone or iPad simulator available — skipping auto-capture"
          exit 0
        fi
        [[ -n "$IPHONE_SIM" ]] && echo "iPhone simulator: $IPHONE_SIM" || echo "No iPhone simulator found"
        [[ -n "$IPAD_SIM"   ]] && echo "iPad simulator:   $IPAD_SIM"   || echo "No iPad simulator found"

        # ---- build once: a simulator .app build is arch/runtime-generic across
        #      iPhone and iPad simulators of the same Xcode/SDK, no need to build twice ----
        BOOT_UDID="${IPHONE_SIM%%|*}"
        [[ -z "$BOOT_UDID" ]] && BOOT_UDID="${IPAD_SIM%%|*}"
        xcrun simctl boot "$BOOT_UDID" 2>/dev/null || true
        sleep 5

        cd "$GITHUB_WORKSPACE/core_project"
        # 🐛 Bug 修复（"后台没收到截图"的根本原因）：
        # INFOPLIST_FILE 之前用的是相对路径 "Readori/Supporting/Info.plist"。
        # 这里是作为 xcodebuild 的全局命令行覆盖传入的，会应用到本次构建涉及的
        # *所有* target，不只是 Readori 这个 App target——包括 ZIPFoundation 等
        # SPM 依赖包的 target。相对路径是按"各 target 自己的 SRCROOT"解析的：
        # 对主 App target 恰好能在 core_project 下解析到真实文件，但对
        # ZIPFoundation（checkout 在 DerivedData/.../SourcePackages/checkouts/
        # ZIPFoundation 下）而言，同一个相对路径在它自己的目录下根本不存在，
        # 导致 "Build input file cannot be found" 直接构建失败——日志里
        # "No simulator .app found — skipping auto-capture" 就是构建从未成功
        # 的直接后果，截图步骤根本没跑起来，后台自然什么都收不到。
        # 改成绝对路径后，无论哪个 target 解析都会指向同一个真实存在的文件，
        # 和 11b 签名 IPA 构建步骤里一直以来的做法保持一致（那里用的就是绝对路径，
        # 所以从未出现过这个问题）。
        INFOPLIST_ABS="$GITHUB_WORKSPACE/core_project/Readori/Supporting/Info.plist"
        # 🐛 修复（"No simulator .app found" 但日志里完全看不到任何错误信息）：
        # 之前用 `grep -E "^(error:|Build succeeded|BUILD FAILED)"` 过滤
        # xcodebuild 输出——但这个正则只匹配"整行以字面量 error: 开头"的行。
        # 真实的 xcodebuild/swiftc 报错几乎从来不是这个格式：编译器级错误一般是
        # "路径/File.swift:12:5: error: ..."（开头是文件路径，不是 error:），
        # xcodebuild 驱动层的错误则是 "xcodebuild: error: ..."（开头是
        # xcodebuild:，同样匹配不上 ^error:）。也就是说，无论构建因为什么原因
        # 失败，这个过滤器几乎必然把真正的报错原文一起吞掉，只留下一片空白，
        # 这正是排查这个问题时"看不到任何线索"的根源。改成把完整输出 tee 到
        # 日志文件；构建成功与否都只打印一份精简摘要，但只要最终没找到 .app，
        # 就把完整日志的尾部原样打出来，报错信息不会再被过滤掉。
        BUILD_LOG="/tmp/sim_build.log"
        xcodebuild build \
          -scheme                    "$SCHEME" \
          -sdk                       iphonesimulator \
          -destination               "platform=iOS Simulator,id=$BOOT_UDID" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -onlyUsePackageVersionsFromResolvedFile \
          GENERATE_INFOPLIST_FILE=NO \
          INFOPLIST_FILE="$INFOPLIST_ABS" \
          READORI_SOCIAL_WORKER_ENDPOINT="$READORI_SOCIAL_WORKER_ENDPOINT" \
          READORI_API_SECRET="$READORI_API_SECRET" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ENABLE_TESTABILITY=NO \
          CONFIGURATION_BUILD_DIR="/tmp/sim_build" \
          > "$BUILD_LOG" 2>&1
        BUILD_RC=$?
        grep -E "error:|Build succeeded|BUILD FAILED" "$BUILD_LOG" || true

        # 🐛 彻底修复（"xcodebuild 明明 BUILD SUCCEEDED、exit=0，却依然
        # 'No simulator .app found'"的真正根因）：
        # 上面构建日志里 Ld 那一行清清楚楚写着 `-o /tmp/sim_build/Readori`——
        # 构建产物是一个裸 Mach-O 可执行文件，根本不是 `.app` bundle。这和
        # 11b 签名 IPA 那一步开头注释说的"SPM executableTarget does NOT
        # produce a real .app via archive"是同一件事——11b 为此专门写了一整段
        # "手工拼装 .app bundle"的逻辑（拷贝可执行文件、补 Info.plist、编译资源、
        # 提升 .lproj 到 bundle 根目录），但这段逻辑从来没有被搬到这个截图构建
        # 步骤里来过。之前这里只是天真地 `find /tmp/sim_build -name "*.app"`，
        # 不管构建成不成功，这个 .app 从一开始就不可能被找到。
        # 这里照抄 11b 的思路，针对模拟器截图的场景做了精简：可执行文件 +
        # Info.plist（含 UIDeviceFamily=[1,2]，和前面几轮的修复保持一致）+
        # 编译后的 Assets.car（应用内实际会显示的图片/图标）+ SPM 资源包里的
        # .lproj（这是重中之重——没有它们，多语种截图这件事本身就无从谈起，
        # App 里的文案不会跟着 -AppleLanguages/-AppleLocale 变化）。
        APP_PATH="/tmp/sim_build/${SCHEME}.app"
        rm -rf "$APP_PATH"
        APP_BINARY="/tmp/sim_build/$SCHEME"
        if [[ ! -f "$APP_BINARY" ]]; then
          echo "No simulator .app found — skipping auto-capture (xcodebuild exit=$BUILD_RC, no bare executable at $APP_BINARY either)"
          echo "---- last 150 lines of $BUILD_LOG ----"
          tail -150 "$BUILD_LOG"
          exit 0
        fi

        mkdir -p "$APP_PATH"
        cp "$APP_BINARY" "$APP_PATH/$SCHEME"
        chmod +x "$APP_PATH/$SCHEME"
        cp "$INFOPLIST_ABS" "$APP_PATH/Info.plist"

        /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $SCHEME" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION:-1.0.0}" "$APP_PATH/Info.plist" || true
        if [[ -n "$READORI_SOCIAL_WORKER_ENDPOINT" ]]; then
          /usr/bin/plutil -replace READORI_SOCIAL_WORKER_ENDPOINT -string "$READORI_SOCIAL_WORKER_ENDPOINT" "$APP_PATH/Info.plist" || true
        fi
        if [[ -n "$READORI_API_SECRET" ]]; then
          /usr/bin/plutil -replace READORI_API_SECRET -string "$READORI_API_SECRET" "$APP_PATH/Info.plist" || true
        fi
        /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$APP_PATH/Info.plist" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"

        # 应用内实际显示的图片/图标（书架封面占位图等）
        ASSETS_CAR=$(find /tmp/sim_build -maxdepth 1 -name "Assets.car" | head -1)
        [[ -n "$ASSETS_CAR" ]] && cp "$ASSETS_CAR" "$APP_PATH/Assets.car"

        # SPM 资源包：.lproj（多语种截图必须）、Fonts 等
        for RESOURCE_DIR in "/tmp/sim_build/${SCHEME}_${SCHEME}.bundle" "/tmp/sim_build/Readori_Readori.bundle"; do
          if [[ -d "$RESOURCE_DIR" ]]; then
            cp -R "$RESOURCE_DIR" "$APP_PATH/" || true
            for LPROJ in "$RESOURCE_DIR"/*.lproj; do
              if [[ -d "$LPROJ" ]]; then
                LPROJ_NAME=$(basename "$LPROJ")
                [[ "$LPROJ_NAME" == old_* ]] && continue
                cp -R "$LPROJ" "$APP_PATH/$LPROJ_NAME"
              fi
            done
            if [[ -d "$RESOURCE_DIR/Fonts" ]]; then
              cp -R "$RESOURCE_DIR/Fonts" "$APP_PATH/Fonts"
            fi
          fi
        done

        echo "Wrapped simulator .app at: $APP_PATH"
        ls -d "$APP_PATH"/*.lproj 2>/dev/null || echo "WARNING: No .lproj directories at app root — localized screenshots will not work!"

        LOCALES="en-US zh-Hans zh-Hant"

        # 🐛 彻底修复（iPhone/iPad 自动截图此前一直不正常的两个根因）：
        #
        # 1) App 端 AppState.checkFirstLaunch() 里，只要 UserDefaults 没有
        #    hasLaunchedBefore 就会判定为"首次启动"并弹出 OnboardingView 的
        #    .fullScreenCover——而 CI 每次都是全新模拟器 + 全新 simctl install，
        #    UserDefaults 必然是空的，所以*每一次*截图其实截到的都是引导页，
        #    后续无论点哪里都点在引导页上而不是真正的 TabView 上。
        # 2) 旧脚本用"点击底部固定坐标"切换 Tab，这在 iPhone（底部 Tab 栏）上
        #    凑巧成立，但 iPad 在 iOS 18+ 下 ContentView 用的是
        #    `.tabViewStyle(.sidebarAdaptable)`（见 ViewExtensions.applyTabViewStyle）
        #    ——Tab 变成左侧竖排侧边栏，不再是底部横条，原来按"屏幕底部横向三
        #    等分"算出来的坐标在 iPad 上根本点不中任何 Tab，于是 iPad 的三张
        #    截图永远是同一张初始页。
        #
        # 根治方案是不再依赖任何"点击坐标切 Tab"的假设（这本来就随布局/机型
        # 易碎），而是在 App 端加了两个仅在启动环境变量存在时生效、不影响真实
        # 用户安装的旁路（见 AppState.swift 的 isScreenshotAutomationMode /
        # applyScreenshotAutomationOverridesIfNeeded）：
        #   READORI_SCREENSHOT_MODE=1   → 跳过首次启动引导页
        #   READORI_SCREENSHOT_TAB=xxx  → 启动后直接停在指定 Tab
        # 这里通过 `SIMCTL_CHILD_<VAR>` 前缀把环境变量透传给 simctl launch 启动
        # 的目标进程（前缀会被自动去掉），对每个需要的 Tab 单独重启一次 App 并
        # 截图，iPhone 和 iPad 用同一套逻辑，不再关心 Tab 到底是画在底部还是
        # 侧边栏。

        # ---- helper: capture the bookshelf/explore/settings screens for one device ----
        capture_for_device() {
          UDID="$1"; DISPLAY_NAME="$2"; DISPLAY_TYPE="$3"
          echo "=== Capturing for $DISPLAY_NAME ($DISPLAY_TYPE) udid=$UDID ==="
          xcrun simctl boot "$UDID" 2>/dev/null || true
          sleep 8
          if ! xcrun simctl install "$UDID" "$APP_PATH"; then
            echo "install failed for $DISPLAY_NAME — skipping this device"
            return
          fi

          for LOCALE in $LOCALES; do
            OUT_DIR="$SCREENSHOTS_DIR/$LOCALE/$DISPLAY_TYPE"
            mkdir -p "$OUT_DIR"

            APPLE_LANG="en"; APPLE_LOCALE="en_US"
            case "$LOCALE" in
              zh-Hans) APPLE_LANG="zh-Hans"; APPLE_LOCALE="zh_CN" ;;
              zh-Hant) APPLE_LANG="zh-Hant"; APPLE_LOCALE="zh_TW" ;;
            esac

            capture_one() {
              TAB="$1"; FILE="$2"
              # 每张截图都用目标 Tab + 目标语种重新启动一次 App，跳过引导页
              # 并直接停在指定 Tab 上——不点任何坐标，天然对 iPhone/iPad、
              # 底部 Tab 栏/侧边栏布局都成立。
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              SIMCTL_CHILD_READORI_SCREENSHOT_MODE=1 \
              SIMCTL_CHILD_READORI_SCREENSHOT_TAB="$TAB" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID" \
                -AppleLanguages "($APPLE_LANG)" -AppleLocale "$APPLE_LOCALE" 2>/dev/null || true
              sleep 6
              xcrun simctl io "$UDID" screenshot "$FILE" 2>/dev/null || true
              # 明显失败帧（文件几乎是空的）重试一次；不做真正的图像内容校验，
              # 只拦截"压根没截到东西"这种最常见的失败模式。
              if [[ ! -s "$FILE" ]] || [[ $(wc -c < "$FILE" 2>/dev/null || echo 0) -lt 2048 ]]; then
                echo "  WARNING: $FILE looks invalid, retrying once..."
                sleep 2
                xcrun simctl io "$UDID" screenshot "$FILE" 2>/dev/null || true
              fi
            }

            capture_one "bookshelf" "$OUT_DIR/01_bookshelf.png"
            capture_one "explore"   "$OUT_DIR/02_explore.png"
            capture_one "settings"  "$OUT_DIR/03_settings.png"
          done

          xcrun simctl shutdown "$UDID" 2>/dev/null || true
        }

        if [[ -n "$IPHONE_SIM" ]]; then
          capture_for_device "${IPHONE_SIM%%|*}" "${IPHONE_SIM##*|}" "APP_IPHONE_67"
        else
          echo "Skipping iPhone screenshots (no simulator available)"
        fi

        if [[ -n "$IPAD_SIM" ]]; then
          # iPad Pro 13" (M4): 2064x2752 px @2x → 1032x1376 pt logical resolution
          capture_for_device "${IPAD_SIM%%|*}" "${IPAD_SIM##*|}" "APP_IPAD_PRO_3GEN_129"
        else
          echo "Skipping iPad screenshots — WARNING: App Store requires iPad screenshots for apps that support iPad"
        fi

        # Move captured screenshots to expected location
        if [[ -n "$(ls -A "$SCREENSHOTS_DIR" 2>/dev/null)" ]]; then
          mv "$SCREENSHOTS_DIR" "$TARGET_DIR"
          echo "Auto-captured screenshots saved to $TARGET_DIR"
          find "$TARGET_DIR" -name '*.png' | sort
        else
          echo "WARNING: no screenshots were captured"
        fi

    # ==============================================
    # 17. SCREENSHOTS UPLOAD (screenshots mode)
    #     Directory: screenshots/<locale>/<display-type>/<filename>.png
    #     display-type = ASC enum e.g. APP_IPHONE_67, APP_IPHONE_65
    # ==============================================
    - name: Upload App Store screenshots
      if: ${{ env.MODE == 'testflight' || env.MODE == 'submit' || env.MODE == 'screenshots' }}
      continue-on-error: true
      run: |
        SCREENSHOTS_DIR="core_project/screenshots"
        if [[ ! -d "$SCREENSHOTS_DIR" ]]; then
          echo "No screenshots directory found at $SCREENSHOTS_DIR — skipping"
          exit 0
        fi

        # Resolve editable version
        if [[ -z "${VERSION_ID:-}" ]]; then
          VERSION_ID=$(asc versions list \
            --app-id ${{ secrets.ASC_APP_ID }} \
            --output json 2>/dev/null | \
            python3 -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            versions = data['data'] if isinstance(data, dict) and 'data' in data else data
            ordered = sorted(versions, key=lambda v: (
        0 if v.get('appStoreState') in ('PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW') else 1
            ))
            print(ordered[0]['id'] if ordered else '')
        except: print('')
        " || echo "")
        fi
        if [[ -z "$VERSION_ID" ]]; then
          echo "No editable version found — cannot upload screenshots"
          exit 1
        fi
        echo "Uploading screenshots to version-id: $VERSION_ID"

        # Build locale → localization-id map and export for Python
        LOCS_JSON=$(asc version-localizations list \
          --version-id "$VERSION_ID" --output json 2>/dev/null || echo '{}')
        export LOCS_JSON
        export VERSION_ID

        python3 - << 'PYEOF'
        import subprocess, json, os, glob, sys

        screenshots_dir = 'core_project/screenshots'
        locs_json = os.environ.get('LOCS_JSON', '{}')
        try:
            data = json.loads(locs_json)
            locs = data['data'] if isinstance(data, dict) and 'data' in data else data
        except:
            locs = []

        locale_to_id = {loc.get('locale',''): loc.get('id','') for loc in locs}
        print(f'Known localizations: {list(locale_to_id.keys())}')

        errors = 0
        for locale_dir in sorted(glob.glob(f'{screenshots_dir}/*/')):
            locale = os.path.basename(locale_dir.rstrip('/'))
            loc_id = locale_to_id.get(locale, '')
            if not loc_id:
                print(f'  skip {locale}: no localization ID found')
                continue
            print(f'  Locale: {locale}  (loc_id={loc_id})')

            for device_dir in sorted(glob.glob(f'{locale_dir}*/')):
                display_type = os.path.basename(device_dir.rstrip('/'))
                print(f'    display-type: {display_type}')

                # Create screenshot set
                r = subprocess.run(
                    ['asc', 'screenshot-sets', 'create',
                     '--localization-id', loc_id,
                     '--display-type', display_type,
                     '--output', 'json'],
                    capture_output=True, text=True
                )
                if r.returncode == 0:
                    try:
                        d = json.loads(r.stdout)
                        set_id = (d.get('data') or d).get('id', '') if isinstance(d, dict) else ''
                    except:
                        set_id = ''
                else:
                    set_id = ''

                # If create failed, try fetching existing set
                if not set_id:
                    r2 = subprocess.run(
                        ['asc', 'screenshot-sets', 'list',
                         '--localization-id', loc_id,
                         '--output', 'json'],
                        capture_output=True, text=True
                    )
                    try:
                        d2 = json.loads(r2.stdout)
                        sets = d2['data'] if isinstance(d2, dict) and 'data' in d2 else d2
                        match = next((s for s in sets if s.get('screenshotDisplayType') == display_type), None)
                        set_id = match['id'] if match else ''
                    except:
                        set_id = ''

                if not set_id:
                    print(f'    WARNING: could not create/find set for {display_type}')
                    errors += 1
                    continue

                # Upload each PNG in sorted order
                imgs = sorted(glob.glob(f'{device_dir}*.png'))
                for img in imgs:
                    r3 = subprocess.run(
                        ['asc', 'screenshots', 'upload', '--set-id', set_id, '--file', img],
                        capture_output=True, text=True
                    )
                    status = '\u2713' if r3.returncode == 0 else '\u2717'
                    print(f'      {status} {os.path.basename(img)}')
                    if r3.returncode != 0:
                        print(f'        error: {r3.stderr[:200]}')
                        errors += 1

        print(f'Done. Errors: {errors}')
        if errors > 0:
            sys.exit(1)
        PYEOF

    # ==============================================
    # 18. SUBSCRIPTION GROUPS — diagnostic list
    #     Runs in testflight/submit modes to confirm IAP setup
    # ==============================================
    - name: List subscription groups (diagnostic)
      if: ${{ env.MODE == 'testflight' || env.MODE == 'submit' }}
      continue-on-error: true
      run: |
        echo "=== Subscription Groups ==="
        asc subscription-groups list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json | \
          python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        groups = data['data'] if isinstance(data, dict) and 'data' in data else (data if isinstance(data, list) else [])
        for g in groups:
            if isinstance(g, dict):
                print(f\"  {g.get('referenceName','?')}  id={g.get('id','?')}\")
            else:
                print(f'  {g}')
        " || echo "(no subscription groups or error)"
