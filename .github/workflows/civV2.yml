name: Readori civ V2

# Unified pipeline — three modes via single dispatch:

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "unsigned = sideload | testflight = upload TF | screenshots = auto-capture + publish as GitHub artifact"
        required: false
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - testflight
          - screenshots

      app_scheme:
        description: "xcodebuild scheme"
        required: false
        default: "Readori"
        type: string

      xcode_version:
        description: "Xcode version (optional, e.g. 26.0)"
        required: false
        default: ""
        type: string

      generate_icons:
        description: "Run icon generation script"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

      app_version:
        description: "Marketing version string (e.g. 1.2.0) — required for testflight"
        required: false
        default: "1.0.0"
        type: string

      whats_new_en:
        description: "What's New text (English) — for testflight"
        required: false
        default: ""
        type: string

      whats_new_zh_hans:
        description: "What's New text (Simplified Chinese) — for testflight"
        required: false
        default: ""
        type: string

      whats_new_zh_hant:
        description: "What's New text (Traditional Chinese) — for testflight"
        required: false
        default: ""
        type: string

      beta_notes:
        description: "TestFlight beta test notes (English)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    environment: production

    env:
      MODE: ${{ github.event.inputs.mode }}
      SCHEME: ${{ github.event.inputs.app_scheme }}
      APP_VERSION: ${{ github.event.inputs.app_version }}
      READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
      READORI_API_SECRET: ${{ secrets.READORI_API_SECRET }}

    steps:

    # ==============================================
    # 1. SSH — private source repository
    # ==============================================
    - name: Install private repository SSH key
      env:
        PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
      run: |
        set -euo pipefail
        test -n "$PRIVATE_REPO_KEY" || { echo "::error::PRIVATE_REPO_KEY is required"; exit 1; }

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

        printf '%s\n' "$PRIVATE_REPO_KEY" > ~/.ssh/app_key
        chmod 600 ~/.ssh/app_key

        cat > ~/.ssh/config <<'EOF'
        Host github-app
          HostName github.com
          User git
          IdentityFile ~/.ssh/app_key
          IdentitiesOnly yes
        EOF
        chmod 600 ~/.ssh/config

    # ==============================================
    # 2. CLONE PRIVATE REPO
    # ==============================================
    - name: Clone readori/readori
      run: |
        git clone --depth=50 git@github-app:readori/readori.git core_project
        echo "[clone] $(git -C core_project rev-parse --short HEAD)"

    # ==============================================
    # 3. SELECT XCODE VERSION
    # ==============================================
    - name: Select Xcode 26.x
      env:
        REQUESTED_XCODE_VERSION: ${{ inputs.xcode_version }}
      run: |
        set -euo pipefail

        SELECTED_XCODE_APP="$(python3 - <<'PY'
        import glob, os, re, sys

        requested = os.environ.get('REQUESTED_XCODE_VERSION', '').strip()
        candidates = []
        for path in glob.glob('/Applications/Xcode*.app'):
            name = os.path.basename(path)
            m = re.fullmatch(r'Xcode_(\d+(?:\.\d+){0,2})\.app', name)
            if not m:
                continue
            version = m.group(1)
            parts = tuple(int(x) for x in version.split('.'))
            if parts[0] != 26:
                continue
            candidates.append((parts, version, path))

        if requested:
            direct = f'/Applications/Xcode_{requested}.app'
            if os.path.isdir(direct):
                print(direct)
                raise SystemExit(0)
            matches = [item for item in candidates if item[1] == requested or item[1].startswith(requested + '.')]
            if matches:
                print(max(matches)[2])
                raise SystemExit(0)
            print(f'Requested Xcode {requested} was not found', file=sys.stderr)
            raise SystemExit(2)

        if not candidates:
            print('No Xcode 26.x installation found', file=sys.stderr)
            raise SystemExit(3)
        print(max(candidates)[2])
        PY
        )" || {
          echo "::error::Unable to select requested Xcode 26.x"
          echo "Installed Xcodes:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        }

        sudo xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"
        XCODE_VERSION_RAW="$(xcodebuild -version | head -n1 | awk '{print $2}')"
        XCODE_MAJOR="${XCODE_VERSION_RAW%%.*}"
        SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

        if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
          echo "::error::Xcode 26+ is required; selected ${XCODE_VERSION_RAW:-unknown}"
          exit 1
        fi

        echo "SELECTED_XCODE_VERSION=$XCODE_VERSION_RAW" >> "$GITHUB_ENV"
        echo "Xcode: $XCODE_VERSION_RAW"
        echo "iOS SDK: $SDK_VERSION"
        echo "Developer dir: $(xcode-select -p)"

    # ==============================================
    # 4. SPM CACHE + RESOLVE
    # ==============================================
    - name: Cache Swift packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          core_project/.build
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-xcode-${{ env.SELECTED_XCODE_VERSION }}-${{ hashFiles('core_project/Package.resolved', 'core_project/Package.swift') }}
        restore-keys: |
          spm-${{ runner.os }}-xcode-${{ env.SELECTED_XCODE_VERSION }}-
          spm-${{ runner.os }}-
        # 🐛 修复：此前把 ~/Library/Developer/Xcode/DerivedData 也一起缓存，

    - name: Resolve Swift packages
      run: cd core_project && swift package resolve

    # ==============================================
    # 5. ICON GENERATION (optional, skip for screenshots)
    # ==============================================
    - name: Generate icons
      if: ${{ github.event.inputs.generate_icons == 'yes' && env.MODE != 'screenshots' }}
      run: |
        if [[ -f "core_project/scripts/generate_icons.swift" ]]; then
          swift core_project/scripts/generate_icons.swift "${GITHUB_WORKSPACE}/core_project"
        fi

    # ==============================================
    # 6. INSTALL asc-cli (TestFlight only)
    # ==============================================
    - name: Ensure asc-cli is available
      if: ${{ env.MODE == 'testflight' }}
      run: |
        set -euo pipefail
        if ! command -v asc >/dev/null 2>&1; then
          brew tap tddworks/tap
          brew install tddworks/tap/asccli
        fi
        asc --version
        echo "asc: $(command -v asc)"

    - name: Validate TestFlight / Match secrets
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}
      run: |
        set -euo pipefail
        missing=()
        for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_APP_ID ASC_TEAM_ID MATCH_PASSWORD MATCH_REPO_PAT; do
          [[ -n "${!name:-}" ]] || missing+=("$name")
        done
        if (( ${#missing[@]} )); then
          echo "::error::Missing TestFlight / Match secrets: ${missing[*]}"
          exit 1
        fi
        if ! [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid app_version: $APP_VERSION"
          exit 1
        fi

    # ==============================================
    # 7. ASC API KEY JSON (TestFlight only)
    # ==============================================
    - name: Setup ASC API key
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        printf '%s' "$ASC_PRIVATE_KEY" \
          > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

        python3 - << PYEOF
        import json, os
        key_path = os.path.expanduser(
            f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8"
        )
        json.dump({
            "key_id":    os.environ["ASC_KEY_ID"],
            "issuer_id": os.environ["ASC_ISSUER_ID"],
            "key":       open(key_path).read(),
            "in_house":  False
        }, open("/tmp/asc_api_key.json", "w"))
        print("ASC API key JSON ready")
        PYEOF

    # ==============================================
    # 8. AUTHENTICATE asc-cli
    # ==============================================
    - name: Authenticate asc-cli
      if: ${{ env.MODE == 'testflight' }}
      run: |
        asc auth login \
          --key-id           ${{ secrets.ASC_KEY_ID }} \
          --issuer-id        ${{ secrets.ASC_ISSUER_ID }} \
          --private-key-path ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

    # ==============================================
    # 9. AUTO BUILD NUMBER (testflight only)
    # ==============================================
    - name: Auto-increment build number
      if: ${{ env.MODE == 'testflight' }}
      run: |
        RUN_NUMBER="${{ github.run_number }}"
        LATEST=$(asc builds list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json 2>/dev/null | \
          python3 -c "
        import sys, json
        run_number = $RUN_NUMBER
        try:
            data = json.load(sys.stdin)
            builds = data['data'] if isinstance(data, dict) and 'data' in data else (data if isinstance(data, list) else [])
            nums = []
            for b in builds:
                v = b.get('version','') if isinstance(b, dict) else ''
                if str(v).isdigit():
                    nums.append(int(v))
            from_asc = (max(nums) + 1) if nums else 0
            # 与 run_number 取 max 兜底，避免分页缺失导致算出偏小的号
            print(max(from_asc, run_number))
        except:
            print(run_number)
        " || echo "$RUN_NUMBER")
        # 双重保险：若上面管道整体失败导致 LATEST 为空，回退到 run_number
        LATEST="${LATEST:-$RUN_NUMBER}"
        echo "BUILD_NUMBER=$LATEST" >> $GITHUB_ENV
        echo "Build number will be: $LATEST (from ASC or run_number fallback: $RUN_NUMBER)"

    # ==============================================
    # 10. SIGNING — Fastlane Match / readori-certificates
    # ==============================================
    - name: Install App Store signing assets with Fastlane Match
      if: ${{ env.MODE == 'testflight' }}
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      run: |
        set -euo pipefail

        APP_BUNDLE_ID="com.readori.app"
        MATCH_GIT_URL="https://github.com/readori/readori-certificates.git"
        KEYCHAIN_NAME="readori-ci.keychain-db"
        KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        PROFILE_PLIST="/tmp/readori-match-profile.plist"

        echo "READORI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

        # Match repo uses a dedicated least-privilege PAT.
        MATCH_AUTH="$(printf '%s:%s' 'readori' "$MATCH_REPO_PAT" | base64 | tr -d '\n')"
        echo "::add-mask::$MATCH_AUTH"

        git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
          ls-remote "$MATCH_GIT_URL" HEAD >/dev/null
        echo "Match repository access: PASS"

        # Keep this workflow independent from the private Readori repository:
        # Fastlane is only needed here to decrypt/install Match signing assets.
        if ! command -v fastlane >/dev/null 2>&1; then
          brew install fastlane
        fi
        fastlane --version

        # Dedicated ephemeral keychain; later manual codesign continues to use
        # READORI_KEYCHAIN_PATH exactly as before.
        rm -f "$KEYCHAIN_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
        security default-keychain -d user -s "$KEYCHAIN_PATH"

        # /tmp/asc_api_key.json is created earlier by "Setup ASC API key".
        [[ -s /tmp/asc_api_key.json ]] || {
          echo "::error::ASC API key JSON is missing before Match."
          exit 1
        }

        # CI is deliberately readonly: the certificates repository is the
        # signing source of truth. This installs the encrypted Distribution
        # certificate/private key and AppStore_com.readori.app.mobileprovision.
        MATCH_PASSWORD="$MATCH_PASSWORD" \
        fastlane match appstore \
          --app_identifier "$APP_BUNDLE_ID" \
          --git_url "$MATCH_GIT_URL" \
          --git_basic_authorization "$MATCH_AUTH" \
          --team_id "$ASC_TEAM_ID" \
          --api_key_path /tmp/asc_api_key.json \
          --readonly true \
          --keychain_name "$KEYCHAIN_NAME" \
          --keychain_password "$KEYCHAIN_PASSWORD"

        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

        IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution\|iPhone Distribution' || true)"
        if [[ "$IDENTITY_COUNT" -lt 1 ]]; then
          echo "::error::Fastlane Match completed, but no Apple Distribution signing identity is available."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi

        # Match/Xcode may install profiles in either of these locations.
        # Resolve the exact com.readori.app profile, then normalize it to the
        # path expected by the existing manual-sign build step.
        SELECTED_PROFILE=""
        PROFILE_UUID=""
        PROFILE_NAME=""
        PROFILE_EXPIRATION=""

        while IFS= read -r profile; do
          [[ -f "$profile" ]] || continue
          if ! security cms -D -i "$profile" > "$PROFILE_PLIST" 2>/dev/null; then
            continue
          fi

          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"
          [[ "$APP_IDENTIFIER" == "${ASC_TEAM_ID}.${APP_BUNDLE_ID}" ]] || continue

          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST" 2>/dev/null || true)"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST" 2>/dev/null || true)"
          EXPIRATION="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST" 2>/dev/null || true)"
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)"

          [[ -n "$UUID" ]] || continue
          if [[ "$GET_TASK_ALLOW" == "true" ]]; then
            echo "::warning::Ignoring development profile for $APP_BUNDLE_ID: ${NAME:-unknown}"
            continue
          fi

          SELECTED_PROFILE="$profile"
          PROFILE_UUID="$UUID"
          PROFILE_NAME="$NAME"
          PROFILE_EXPIRATION="$EXPIRATION"
          break
        done < <(
          find \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            -type f -name '*.mobileprovision' -print 2>/dev/null || true
        )

        rm -f "$PROFILE_PLIST"

        if [[ -z "$SELECTED_PROFILE" || -z "$PROFILE_UUID" ]]; then
          echo "::error::Match did not install an App Store provisioning profile for ${ASC_TEAM_ID}.${APP_BUNDLE_ID}."
          echo "::error::Expected Match asset: profiles/appstore/AppStore_com.readori.app.mobileprovision"
          exit 1
        fi

        mkdir -p "$PROFILE_DIR"
        TARGET_PROFILE="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
        if [[ "$SELECTED_PROFILE" != "$TARGET_PROFILE" ]]; then
          cp "$SELECTED_PROFILE" "$TARGET_PROFILE"
        fi
        chmod 600 "$TARGET_PROFILE" || true

        # Verify the normalized profile one final time.
        security cms -D -i "$TARGET_PROFILE" > "$PROFILE_PLIST"
        FINAL_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"
        rm -f "$PROFILE_PLIST"
        [[ "$FINAL_APP_ID" == "${ASC_TEAM_ID}.${APP_BUNDLE_ID}" ]] || {
          echo "::error::Resolved provisioning profile belongs to unexpected App ID: ${FINAL_APP_ID:-missing}"
          exit 1
        }

        echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
        echo "Signing identity installed by Match: yes"
        echo "Provisioning profile: ${PROFILE_NAME:-unknown} ($PROFILE_UUID)"
        [[ -n "$PROFILE_EXPIRATION" ]] && echo "Profile expiration: $PROFILE_EXPIRATION"

    # ==============================================
    # 11a. BUILD — unsigned (sideload)
    # ==============================================
    - name: Build unsigned IPA
      if: ${{ env.MODE == 'unsigned' }}
      env:
        ALLOW_WRAPPED_APP: "1"
        APP_BUNDLE_IDENTIFIER: "com.readori.app"
        READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
        READORI_API_SECRET: ${{ secrets.READORI_API_SECRET }}
      run: |
        mkdir -p build
        cd core_project
        chmod +x scripts/build_unsigned_ipa.sh
        ./scripts/build_unsigned_ipa.sh "$SCHEME" "${GITHUB_WORKSPACE}/build"

    # ==============================================
    # 11b. BUILD — signed IPA for App Store (Match-installed identity/profile)
    # ==============================================
    - name: Build signed IPA (SPM manual sign)
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      run: |
        set -euo pipefail
        REPO_ROOT="$GITHUB_WORKSPACE/core_project"
        BUILD_ROOT="$GITHUB_WORKSPACE/build"
        DERIVED_DATA="$BUILD_ROOT/DerivedData"
        EXPORT_DIR="$BUILD_ROOT/export"
        INFO_PLIST="$REPO_ROOT/Readori/Supporting/Info.plist"
        ENTITLEMENTS="$REPO_ROOT/Readori/Supporting/Readori.entitlements"
        LAUNCH_STORYBOARD="$REPO_ROOT/Readori/Supporting/LaunchScreen.storyboard"
        ICONSET_DIR="$REPO_ROOT/Readori/Resources/Assets.xcassets/AppIcon.appiconset"
        AUTH_KEY="/tmp/asc_keys/AuthKey_${ASC_KEY_ID}.p8"

        mkdir -p "$EXPORT_DIR"
        rm -rf "$DERIVED_DATA"

        # ── Pre-build: Strip alpha from AppIcon PNGs (Apple requires no transparency) ──
        if [[ -d "$ICONSET_DIR" ]]; then
          echo "Stripping alpha from AppIcon PNGs..."
          # 🐛 修复：之前这里检查的文件名是 icon-1024.png，但 generate_icons.swift
          MARKETING_ICON="$ICONSET_DIR/AppIcon-1024x1024@1x-ios-marketing.png"
          if [[ ! -f "$MARKETING_ICON" ]]; then
            echo "$(basename "$MARKETING_ICON") missing, generating from largest available icon..."
            # Run generate_icons.swift if available
            if [[ -f "$REPO_ROOT/scripts/generate_icons.swift" ]]; then
              swift "$REPO_ROOT/scripts/generate_icons.swift" "$REPO_ROOT" 2>&1 || true
            fi
            # Fallback: scale up from the largest icon still present if generation failed
            if [[ ! -f "$MARKETING_ICON" ]]; then
              LARGEST=$(ls -S "$ICONSET_DIR"/*.png 2>/dev/null | head -1)
              if [[ -n "$LARGEST" ]]; then
                sips -z 1024 1024 "$LARGEST" --out "$MARKETING_ICON" 2>/dev/null || true
                echo "Generated $(basename "$MARKETING_ICON") from $LARGEST"
              fi
            fi
          fi
          for png in "$ICONSET_DIR"/*.png; do
            [[ -f "$png" ]] && sips -s format png -s formatOptions 100 --setProperty hasAlpha false "$png" --out "$png" 2>/dev/null || true
          done
          echo "Alpha stripped from all AppIcon PNGs"
        fi

        # ── Step 1: Build unsigned (with INFOPLIST_FILE for proper bundle) ──
        echo "=== Step 1: Build unsigned ==="
        cd "$REPO_ROOT"
        # 🐛 Bug 修复（"iPad 上装了最新版本，App 还是以 iPhone 兼容模式跑在小窗口里"）：
        xcodebuild build \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$DERIVED_DATA" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -onlyUsePackageVersionsFromResolvedFile \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          TARGETED_DEVICE_FAMILY="1,2" \
          GENERATE_INFOPLIST_FILE=NO \
          INFOPLIST_FILE="$INFO_PLIST" \
          INFOPLIST_KEY_UILaunchStoryboardName=LaunchScreen \
          CURRENT_PROJECT_VERSION="${{ env.BUILD_NUMBER }}" \
          MARKETING_VERSION="${{ env.APP_VERSION }}" \
          READORI_SOCIAL_WORKER_ENDPOINT="$READORI_SOCIAL_WORKER_ENDPOINT" \
          READORI_API_SECRET="$READORI_API_SECRET" \
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
          ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=YES \
          ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ENABLE_TESTABILITY=NO \
          2>&1 | tee /tmp/build.log

        echo "** BUILD SUCCEEDED **"

        # ── Step 2: Find or wrap .app bundle ──
        echo "=== Step 2: Locate .app bundle ==="
        PRODUCT_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos"
        APP_PATH=""

        # Try standard product directory first
        if [[ -d "$PRODUCT_DIR/${SCHEME}.app" ]]; then
          APP_PATH="$PRODUCT_DIR/${SCHEME}.app"
        else
          # Search DerivedData for .app
          APP_PATH=$(find "$DERIVED_DATA" -type d -name '*.app' \
            ! -path '*/Index.noindex/*' ! -path '*/SourcePackages/*' \
            | while read -r app; do
                if [[ -f "$app/$SCHEME" ]]; then echo "$app"; break; fi
              done) || true
        fi

        if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
          echo "No .app bundle found. Wrapping bare executable into .app..."
          APP_BINARY="$PRODUCT_DIR/$SCHEME"
          if [[ ! -f "$APP_BINARY" ]]; then
            APP_BINARY=$(find "$PRODUCT_DIR" -name "$SCHEME" -type f | head -1)
          fi
          if [[ ! -f "$APP_BINARY" ]]; then
            echo "ERROR: No executable found in $PRODUCT_DIR"
            ls -la "$PRODUCT_DIR" || true
            exit 1
          fi

          APP_PATH="$BUILD_ROOT/${SCHEME}.app"
          rm -rf "$APP_PATH"
          mkdir -p "$APP_PATH"

          cp "$APP_BINARY" "$APP_PATH/$SCHEME"
          chmod +x "$APP_PATH/$SCHEME"
          cp "$INFO_PLIST" "$APP_PATH/Info.plist"

          # Patch Info.plist for app bundle
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $SCHEME" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.readori.app" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.BUILD_NUMBER }}" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION }}" "$APP_PATH/Info.plist" || true
          if [[ -n "$READORI_SOCIAL_WORKER_ENDPOINT" ]]; then
            /usr/bin/plutil -replace READORI_SOCIAL_WORKER_ENDPOINT -string "$READORI_SOCIAL_WORKER_ENDPOINT" "$APP_PATH/Info.plist" || true
          fi
          if [[ -n "$READORI_API_SECRET" ]]; then
            /usr/bin/plutil -replace READORI_API_SECRET -string "$READORI_API_SECRET" "$APP_PATH/Info.plist" || true
          fi

          # UIDeviceFamily
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"

          # UILaunchScreen dict
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$APP_PATH/Info.plist" || true

          # Compile LaunchScreen storyboard
          if [[ -f "$LAUNCH_STORYBOARD" ]]; then
            xcrun ibtool --compile "$APP_PATH/LaunchScreen.storyboardc" "$LAUNCH_STORYBOARD" \
              --target-device iphone --minimum-deployment-target 16.0 || true
          fi

          # Copy app icons
          if [[ -d "$ICONSET_DIR" ]]; then
            [[ -f "$ICONSET_DIR/AppIcon-60x60@2x-iphone.png" ]] && cp "$ICONSET_DIR/AppIcon-60x60@2x-iphone.png" "$APP_PATH/AppIcon60x60@2x.png"
            [[ -f "$ICONSET_DIR/AppIcon-60x60@3x-iphone.png" ]] && cp "$ICONSET_DIR/AppIcon-60x60@3x-iphone.png" "$APP_PATH/AppIcon60x60@3x.png"
          fi

          # Copy compiled Assets.car from build products (contains AppIcon + other assets)
          ASSETS_CAR=$(find "$DERIVED_DATA" -name "Assets.car" ! -path "*/SourcePackages/*" | head -1)
          if [[ -n "$ASSETS_CAR" ]]; then
            cp "$ASSETS_CAR" "$APP_PATH/Assets.car"
            echo "Copied Assets.car from: $ASSETS_CAR"
          else
            echo "No Assets.car found. Compiling asset catalog manually..."
            ASSETS_XCASSETS="$REPO_ROOT/Readori/Resources/Assets.xcassets"
            if [[ -d "$ASSETS_XCASSETS" ]]; then
              xcrun actool "$ASSETS_XCASSETS" \
                --compile "$APP_PATH" \
                --platform iphoneos \
                --minimum-deployment-target 16.0 \
                --app-icon AppIcon \
                --output-partial-info-plist /tmp/assetcatalog_partial.plist \
                2>&1 || echo "WARNING: actool failed"
            fi
          fi

          # Copy SPM resources (lproj folders, Fonts, etc.)
          for RESOURCE_DIR in "$PRODUCT_DIR"/${SCHEME}_${SCHEME}.bundle "$PRODUCT_DIR"/Readori_Readori.bundle; do
            if [[ -d "$RESOURCE_DIR" ]]; then
              echo "Copying SPM resource bundle: $RESOURCE_DIR"
              cp -R "$RESOURCE_DIR" "$APP_PATH/" || true
              # Hoist .lproj directories to app root (iOS requires them at bundle root for localization)
              # Skip old_* dirs — invalid locale names cause App Store warning 90176
              for LPROJ in "$RESOURCE_DIR"/*.lproj; do
                if [[ -d "$LPROJ" ]]; then
                  LPROJ_NAME=$(basename "$LPROJ")
                  if [[ "$LPROJ_NAME" == old_* ]]; then
                    echo "  Skipping $LPROJ_NAME (invalid locale name)"
                    continue
                  fi
                  echo "  Hoisting $LPROJ_NAME to app root"
                  cp -R "$LPROJ" "$APP_PATH/$LPROJ_NAME"
                fi
              done
              # Also hoist Fonts directory if present
              if [[ -d "$RESOURCE_DIR/Fonts" ]]; then
                echo "  Hoisting Fonts to app root"
                cp -R "$RESOURCE_DIR/Fonts" "$APP_PATH/Fonts"
              fi
            fi
          done
          # Verify lproj presence at app root
          echo "=== Localization check ==="
          ls -d "$APP_PATH"/*.lproj 2>/dev/null || echo "WARNING: No .lproj directories at app root!"

          # Remove old_* lproj dirs (invalid locale names cause warning 90176)
          find "$APP_PATH" -type d -name 'old_*' -exec rm -rf {} + 2>/dev/null || true

          echo "Wrapped .app at: $APP_PATH"

        # Always ensure required plist fields (whether found or wrapped)
        XCODE_OUTPUT=$(xcodebuild -version 2>/dev/null || true)
        XCODE_VER=$(echo "$XCODE_OUTPUT" | head -1 | sed 's/Xcode //')
        XCODE_BUILD=$(echo "$XCODE_OUTPUT" | tail -1 | sed 's/Build version //')
        SDK_VER=$(xcrun --show-sdk-version --sdk iphoneos)
        SDK_BUILD=$(xcrun --show-sdk-build-version --sdk iphoneos)
        SDK_NAME="iphoneos${SDK_VER}"
        OS_BUILD=$(sw_vers -buildVersion)

        echo "Injecting DT* fields:"
        echo "  Xcode=$XCODE_VER  XcodeBuild=$XCODE_BUILD"
        echo "  SDK=$SDK_NAME  SDKBuild=$SDK_BUILD"
        echo "  macOS Build=$OS_BUILD"
        PB="/usr/libexec/PlistBuddy"
        PLIST="$APP_PATH/Info.plist"

        # DT* build metadata (required by App Store validation)
        $PB -c "Delete :DTPlatformName" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformName string iphoneos" "$PLIST"
        $PB -c "Delete :DTPlatformVersion" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformVersion string $SDK_VER" "$PLIST"
        $PB -c "Delete :DTSDKName" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTSDKName string $SDK_NAME" "$PLIST"
        $PB -c "Delete :DTSDKBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTSDKBuild string $SDK_BUILD" "$PLIST"
        $PB -c "Delete :DTXcode" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTXcode string $(echo $XCODE_VER | tr -d '.')" "$PLIST"
        $PB -c "Delete :DTXcodeBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTXcodeBuild string $XCODE_BUILD" "$PLIST"
        $PB -c "Delete :DTCompiler" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTCompiler string com.apple.compilers.llvm.clang.1_0" "$PLIST"
        $PB -c "Delete :DTPlatformBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformBuild string $SDK_BUILD" "$PLIST"
        $PB -c "Delete :BuildMachineOSBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :BuildMachineOSBuild string $(sw_vers -buildVersion)" "$PLIST"
        $PB -c "Delete :MinimumOSVersion" "$PLIST" 2>/dev/null || true
        $PB -c "Add :MinimumOSVersion string 16.0" "$PLIST"

        # UIRequiredDeviceCapabilities (required for App Store)
        $PB -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null || true
        $PB -c "Add :UIRequiredDeviceCapabilities array" "$PLIST"
        $PB -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$PLIST"

        # CFBundleSupportedPlatforms (required: single-element array)
        $PB -c "Delete :CFBundleSupportedPlatforms" "$PLIST" 2>/dev/null || true
        $PB -c "Add :CFBundleSupportedPlatforms array" "$PLIST"
        $PB -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$PLIST"

        # LSSupportsOpeningDocumentsInPlace (required when CFBundleDocumentTypes exists)
        $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
        $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"

        fi

        echo "Using .app: $APP_PATH"
        echo "Contents:"
        ls -la "$APP_PATH/" | head -20

        # ── Step 3: Embed provisioning profile ──
        echo "=== Step 3: Embed provisioning profile ==="
        PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
        [[ -f "$PROFILE_PATH" ]] || { echo "ERROR: Provisioning profile not found: $PROFILE_PATH"; exit 1; }
        if [[ -n "$PROFILE_PATH" ]]; then
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"
          echo "Embedded: $PROFILE_PATH"
        else
          echo "WARNING: No provisioning profile found to embed"
        fi

        # ── Step 4: Code sign ──
        echo "=== Step 4: Code signing ==="

        # Find the signing identity
        SIGN_ID=$(security find-identity -v -p codesigning "$READORI_KEYCHAIN_PATH" | grep "iPhone Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        if [[ -z "$SIGN_ID" ]]; then
          SIGN_ID=$(security find-identity -v -p codesigning "$READORI_KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        fi
        if [[ -z "$SIGN_ID" ]]; then
          echo "ERROR: No distribution signing identity found in keychain"
          security find-identity -v -p codesigning "$READORI_KEYCHAIN_PATH"
          exit 1
        fi
        echo "Signing identity: $SIGN_ID"

        # Build entitlements for codesign — must include application-identifier
        # and match the provisioning profile capabilities
        SIGN_ENTITLEMENTS="/tmp/sign_entitlements.plist"
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict/>\n</plist>\n' > "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :application-identifier string ${ASC_TEAM_ID}.com.readori.app" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${ASC_TEAM_ID}" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :get-task-allow bool false" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :keychain-access-groups array" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :keychain-access-groups:0 string ${ASC_TEAM_ID}.com.readori.app" "$SIGN_ENTITLEMENTS"

        # Check if profile supports iCloud — if so, add iCloud entitlements
        if [[ -n "$PROFILE_PATH" ]]; then
          PROF_ENTS=$(security cms -D -i "$APP_PATH/embedded.mobileprovision" 2>/dev/null || true)
          if echo "$PROF_ENTS" | grep -q "icloud-services"; then
            echo "Profile supports iCloud, adding iCloud entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers array" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers:0 string iCloud.com.readori.app" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services array" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services:0 string CloudDocuments" "$SIGN_ENTITLEMENTS"
          else
            echo "Profile does NOT support iCloud, skipping iCloud entitlements"
          fi
        fi

        echo "=== Entitlements for signing ==="
        cat "$SIGN_ENTITLEMENTS"

        # Sign frameworks/dylibs first (if any)
        find "$APP_PATH" -name "*.framework" -o -name "*.dylib" | while read -r lib; do
          codesign -f -s "$SIGN_ID" --timestamp=none "$lib" 2>&1 || true
        done

        # Sign the app bundle
        codesign -f -s "$SIGN_ID" --entitlements "$SIGN_ENTITLEMENTS" --timestamp=none "$APP_PATH"
        echo "Code signing succeeded"

        # Verify
        codesign -dvv "$APP_PATH" 2>&1
        codesign --verify --strict "$APP_PATH" 2>&1 || echo "WARNING: strict verification failed"

        # ── Step 5: Package IPA ──
        echo "=== Step 5: Package IPA ==="
        PAYLOAD_DIR="$BUILD_ROOT/Payload"
        rm -rf "$PAYLOAD_DIR"
        mkdir -p "$PAYLOAD_DIR"
        cp -R "$APP_PATH" "$PAYLOAD_DIR/"

        IPA_PATH="$EXPORT_DIR/${SCHEME}.ipa"
        cd "$BUILD_ROOT"
        zip -r -q "$IPA_PATH" Payload
        echo "IPA=$IPA_PATH" >> $GITHUB_ENV
        echo "Built: $IPA_PATH ($(du -h "$IPA_PATH" | cut -f1))"

    # ==============================================
    # 12. VERSION TAG
    # ==============================================
    - name: Tag build version
      if: ${{ env.MODE != 'screenshots' }}
      run: |
        SHORT_SHA=$(git -C core_project rev-parse --short HEAD)
        BN="${BUILD_NUMBER:-0}"
        echo "BUILD_TAG=${APP_VERSION:-1.0.0}($BN)-${SHORT_SHA}" >> $GITHUB_ENV

    # ==============================================
    # 12.5 VERIFY APP ICON in .app bundle
    # ==============================================
    - name: Verify App Icon in bundle
      if: ${{ env.MODE == 'testflight' }}
      continue-on-error: true
      run: |
        APP_BUNDLE=$(find build -maxdepth 3 -name "*.app" -type d | head -1)
        if [[ -z "$APP_BUNDLE" ]]; then
          echo "WARNING: No .app bundle found for icon verification"
          exit 0
        fi
        echo "=== App Icon Verification ==="
        echo "Bundle: $APP_BUNDLE"
        # Check for icon files at app root
        ICON_COUNT=$(find "$APP_BUNDLE" -maxdepth 1 -name "AppIcon*" -o -name "icon-*" | wc -l)
        echo "Icon files at root: $ICON_COUNT"
        find "$APP_BUNDLE" -maxdepth 1 -name "AppIcon*" -o -name "icon-*" | sort
        # Check for Assets.car (compiled asset catalog with AppIcon)
        if [[ -f "$APP_BUNDLE/Assets.car" ]]; then
          echo "Assets.car: PRESENT ($(stat -f%z "$APP_BUNDLE/Assets.car" 2>/dev/null || echo 'size unknown') bytes)"
          # List AppIcon entries in asset catalog
          xcrun --sdk iphoneos assetutil --info "$APP_BUNDLE/Assets.car" 2>/dev/null | \
            python3 -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            icons = [e for e in data if 'AppIcon' in str(e.get('Name','')) or 'icon' in str(e.get('Name','')).lower()]
            if icons:
                print(f'AppIcon entries in Assets.car: {len(icons)}')
                for i in icons[:5]:
                    print(f'  {i.get(\"Name\",\"?\")}  {i.get(\"RenditionName\",\"\")}  {i.get(\"SizeOnDisk\",\"\")}')
            else:
                print('WARNING: No AppIcon entries found in Assets.car!')
        except: print('Could not parse Assets.car info')
        " || echo "assetutil not available"
        else
          echo "WARNING: Assets.car NOT FOUND in app bundle!"
        fi

    # ==============================================
    # 13. UPLOAD TO TESTFLIGHT
    # ==============================================
    - name: Upload to TestFlight
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      run: |
        IPA=$(find build -name "*.ipa" | head -1)
        echo "Uploading: $IPA  |  tag: ${BUILD_TAG:-unknown}"
        AUTH_KEY="/tmp/asc_keys/AuthKey_${ASC_KEY_ID}.p8"

        # 🐛 Bug修复：Xcode 26 起 `altool --upload-app` 已被标记为 [DEPRECATED]，
        xcrun altool --upload-package "$IPA" \
          --type ios \
          --apple-id "$ASC_APP_ID" \
          --bundle-id "com.readori.app" \
          --bundle-version "${BUILD_NUMBER}" \
          --bundle-short-version-string "${APP_VERSION}" \
          --apiKey "$ASC_KEY_ID" \
          --apiIssuer "$ASC_ISSUER_ID" \
          2>&1 || {
          echo "altool --upload-package failed, trying legacy --upload-app as last resort..."
          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 || {
            echo "Both upload methods failed. Please upload $IPA manually via Transporter,"
            echo "or verify ASC_APP_ID/ASC_KEY_ID/ASC_ISSUER_ID secrets are correct."
            exit 1
          }
        }

    # ==============================================
    # 14. BETA NOTES — update TestFlight test notes
    # ==============================================
    - name: Update TestFlight beta notes
      if: ${{ env.MODE == 'testflight' }}
      env:
        BETA_NOTES: ${{ inputs.beta_notes }}
        ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      run: |
        set -euo pipefail

        if [[ -z "$BETA_NOTES" ]]; then
          RECENT="$(git -C "$GITHUB_WORKSPACE/core_project" log --oneline -5 2>/dev/null || true)"
          [[ -n "$RECENT" ]] || RECENT="New build"
          BETA_NOTES="$(printf 'Build %s\n\nRecent changes:\n%s' "$BUILD_NUMBER" "$RECENT")"
          echo "Auto-generated beta notes from recent git history"
        fi

        BUILD_ID=""
        for attempt in $(seq 1 30); do
          asc builds list --app-id "$ASC_APP_ID" --output json > /tmp/readori-asc-builds.json 2>/dev/null || printf '[]' > /tmp/readori-asc-builds.json
          BUILD_ID="$(python3 - "$BUILD_NUMBER" /tmp/readori-asc-builds.json <<'PY'
        import json, sys
        target = sys.argv[1]
        path = sys.argv[2]
        try:
            with open(path, encoding='utf-8') as f:
                data = json.load(f)
            builds = data.get('data', []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
            match = next((b for b in builds if isinstance(b, dict) and str(b.get('version', '')) == target), None)
            print(match.get('id', '') if match else '')
        except Exception:
            print('')
        PY
        )"

          if [[ -n "$BUILD_ID" ]]; then
            echo "ASC indexed build ${BUILD_NUMBER} on attempt ${attempt}"
            break
          fi
          echo "Waiting for App Store Connect to index build ${BUILD_NUMBER} (${attempt}/30)..."
          sleep 20
        done
        rm -f /tmp/readori-asc-builds.json

        if [[ -z "$BUILD_ID" ]]; then
          echo "::warning::Build ${BUILD_NUMBER} was not indexed within the polling window; beta notes were not updated"
          exit 0
        fi

        asc builds update-beta-notes \
          --build-id "$BUILD_ID" \
          --locale en-US \
          --notes "$BETA_NOTES" || {
            echo "::warning::Unable to update TestFlight beta notes"
            exit 0
          }
        echo "Beta notes updated for build $BUILD_ID"

    # ==============================================
    # 15. WHAT'S NEW — update version localizations
    # ==============================================
    - name: Update What's New (version localizations)
      if: ${{ env.MODE == 'testflight' }}
      run: |
        set -euo pipefail
        TARGET_VERSION="$APP_VERSION"

        # Always target the exact marketing version requested by workflow input.
        VERSION_ID="$(asc versions list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json 2>/dev/null | \
          python3 - "$TARGET_VERSION" <<'PY'
        import json, sys
        target = sys.argv[1]
        try:
            data = json.load(sys.stdin)
            versions = data.get('data', []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
            match = next((v for v in versions if isinstance(v, dict) and str(v.get('versionString', v.get('version', ''))) == target), None)
            print(match.get('id', '') if match else '')
        except Exception:
            print('')
        PY
        )"

        if [[ -z "$VERSION_ID" ]]; then
          echo "No App Store version $TARGET_VERSION found — creating it"
          VERSION_ID="$(asc versions create \
            --app-id ${{ secrets.ASC_APP_ID }} \
            --version "$TARGET_VERSION" \
            --platform ios \
            --output json 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id', d.get('data',{}).get('id','')))" \
            || true)"
        fi

        if [[ -z "$VERSION_ID" ]]; then
          echo "::warning::Could not get/create App Store version $TARGET_VERSION — skipping What's New"
          exit 0
        fi

        # V2 fix: $GITHUB_ENV is visible only to later steps; export for this step's Python subprocess too.
        export VERSION_ID
        echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
        echo "Version: $TARGET_VERSION ($VERSION_ID)"

        # Fetch localizations and update What's New per locale
        python3 - << 'PYEOF'
        import subprocess, json, os, sys

        version_id = os.environ.get('VERSION_ID', '')
        if not version_id:
            print('No VERSION_ID'); sys.exit(0)

        locale_map = {
            'en-US':   os.environ.get('INPUT_WHATS_NEW_EN', ''),
            'zh-Hans': os.environ.get('INPUT_WHATS_NEW_ZH_HANS', ''),
            'zh-Hant': os.environ.get('INPUT_WHATS_NEW_ZH_HANT', ''),
        }

        r = subprocess.run(
            ['asc', 'version-localizations', 'list', '--version-id', version_id, '--output', 'json'],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'Failed to list localizations: {r.stderr[:200]}'); sys.exit(0)

        try:
            data = json.loads(r.stdout)
            locs = data['data'] if isinstance(data, dict) and 'data' in data else data
        except Exception as e:
            print(f'JSON parse error: {e}'); sys.exit(0)

        for loc in locs:
            locale = loc.get('locale', '')
            loc_id = loc.get('id', '')
            text = locale_map.get(locale, '')
            if text and loc_id:
                res = subprocess.run(
                    ['asc', 'version-localizations', 'update', '--localization-id', loc_id, '--whats-new', text],
                    capture_output=True, text=True
                )
                status = '✓' if res.returncode == 0 else '✗'
                print(f'  {status} {locale}: {text[:60]}')
                if res.returncode != 0:
                    print(f'    error: {res.stderr[:200]}')
        PYEOF
      env:
        INPUT_WHATS_NEW_EN: ${{ github.event.inputs.whats_new_en || 'Bug fixes and performance improvements.' }}
        INPUT_WHATS_NEW_ZH_HANS: ${{ github.event.inputs.whats_new_zh_hans || '修复问题并优化体验。' }}
        INPUT_WHATS_NEW_ZH_HANT: ${{ github.event.inputs.whats_new_zh_hant || '修復問題並優化體驗。' }}

    # ==============================================
    # 15.5 UPDATE APP STORE LISTING METADATA
    # ==============================================
    - name: Update App Store listing metadata
      if: ${{ env.MODE == 'testflight' }}
      continue-on-error: true
      run: |
        set -euo pipefail

        APP_INFO_ID=$(asc app-infos list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json 2>/dev/null | \
          python3 -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            items = data.get('data', []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
            items = [i for i in items if isinstance(i, dict)]
            chosen = next((i for i in items if i.get('isEditable') is True), None)
            if chosen is None:
                chosen = next((i for i in items if str(i.get('state','')).upper() == 'PREPARE_FOR_SUBMISSION'), None)
            if chosen is None:
                chosen = next((i for i in items if i.get('isLive') is True), None)
            if chosen is None and items:
                chosen = items[0]
            print(chosen.get('id','') if chosen else '')
        except Exception:
            print('')
        " || echo "")
        export APP_INFO_ID
        python3 - << 'PYEOF'
        import subprocess, json, os, sys

        app_info_id = os.environ.get('APP_INFO_ID', '')
        if not app_info_id:
            print('No APP_INFO_ID set'); sys.exit(0)

        # Metadata from APP_STORE_METADATA_LOCALE_SNIPPETS.md
        METADATA = {
            'en-US': {
        'name':       'Readori',
        'subtitle':   'Immersive Reading Companion',
        'privacyPolicyUrl': 'https://readori.com/privacy.html',
            },
            'zh-Hans': {
        'name':       'Readori',
        'subtitle':   '\u6c89\u6d78\u5f0f\u9605\u8bfb\u4f34\u4fa3',
        'privacyPolicyUrl': 'https://readori.com/privacy.html',
            },
            'zh-Hant': {
        'name':       'Readori',
        'subtitle':   '\u6c89\u6d78\u5f0f\u95b1\u8b80\u5925\u4f34',
        'privacyPolicyUrl': 'https://readori.com/privacy.html',
            },
        }

        r = subprocess.run(
            ['asc', 'app-info-localizations', 'list', '--app-info-id', app_info_id, '--output', 'json'],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f'Failed to list app-info-localizations: {r.stderr[:200]}'); sys.exit(0)

        try:
            data = json.loads(r.stdout)
            locs = data['data'] if isinstance(data, dict) and 'data' in data else data
        except Exception as e:
            print(f'JSON parse error: {e}'); sys.exit(0)

        for loc in locs:
            locale = loc.get('locale', '')
            loc_id = loc.get('id', '')
            meta = METADATA.get(locale)
            if not meta or not loc_id:
                continue
            args = ['asc', 'app-info-localizations', 'update', '--localization-id', loc_id,
            '--name', meta['name'],
            '--subtitle', meta['subtitle'],
            '--privacy-policy-url', meta['privacyPolicyUrl']]
            res = subprocess.run(args, capture_output=True, text=True)
            status = '\u2713' if res.returncode == 0 else '\u2717'
            print(f'  {status} {locale}: name/subtitle/privacy updated')
            if res.returncode != 0:
                print(f'    error: {res.stderr[:200]}')
        PYEOF

    # ==============================================
    # 16.5 AUTO-CAPTURE SIMULATOR SCREENSHOTS
    # ==============================================
    - name: Auto-capture simulator screenshots
      if: ${{ env.MODE == 'screenshots' }}
      continue-on-error: true
      run: |
        set +e  # best-effort: any single failure here should not fail the whole job
        SCREENSHOTS_DIR="$GITHUB_WORKSPACE/screenshots_captured"
        # 🐛 修复（"截图明明成功了，Upload 那一步却说 core_project/screenshots
        TARGET_DIR="$GITHUB_WORKSPACE/core_project/screenshots"
        BUNDLE_ID="com.readori.app"

        # Skip auto-capture if screenshots already exist
        if [[ -d "$TARGET_DIR" ]] && [[ -n "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]]; then
          echo "Pre-staged screenshots found at $TARGET_DIR — skipping auto-capture"
          exit 0
        fi

        # ---- helper: print "udid|name" for the first available simulator matching any pattern ----
        # 注意：这里故意写成单行 python3 -c 而不是 heredoc/多行脚本——
        # heredoc 的结束标记必须顶格、不能带 YAML 缩进，会把这个 run block 提前截断。
        pick_simulator() {
          python3 -c "import json,subprocess,sys; patterns=sys.argv[1:]; data=json.loads(subprocess.run(['xcrun','simctl','list','devices','available','--json'],capture_output=True,text=True).stdout); all_devs=[d for devs in data.get('devices',{}).values() for d in devs if d.get('isAvailable')]; match=next((d for pat in patterns for d in all_devs if pat in d.get('name','')), None); print((match['udid']+'|'+match['name']) if match else '', end='')" "$@"
        }

        IPHONE_SIM=$(pick_simulator "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 14 Pro Max" "iPhone 13 Pro Max")
        IPAD_SIM=$(pick_simulator "iPad Pro 13-inch (M5)" "iPad Pro 13-inch (M4)" "iPad Pro (12.9-inch) (6th generation)" "iPad Pro (12.9-inch) (5th generation)")

        if [[ -z "$IPHONE_SIM" && -z "$IPAD_SIM" ]]; then
          echo "No suitable iPhone or iPad simulator available — skipping auto-capture"
          exit 0
        fi
        [[ -n "$IPHONE_SIM" ]] && echo "iPhone simulator: $IPHONE_SIM" || echo "No iPhone simulator found"
        [[ -n "$IPAD_SIM"   ]] && echo "iPad simulator:   $IPAD_SIM"   || echo "No iPad simulator found"

        # ---- build once: a simulator .app build is arch/runtime-generic across
        #      iPhone and iPad simulators of the same Xcode/SDK, no need to build twice ----
        BOOT_UDID="${IPHONE_SIM%%|*}"
        [[ -z "$BOOT_UDID" ]] && BOOT_UDID="${IPAD_SIM%%|*}"
        xcrun simctl boot "$BOOT_UDID" 2>/dev/null || true
        sleep 5

        cd "$GITHUB_WORKSPACE/core_project"
        # 🐛 Bug 修复（"后台没收到截图"的根本原因）：
        INFOPLIST_ABS="$GITHUB_WORKSPACE/core_project/Readori/Supporting/Info.plist"
        # 🐛 修复（"No simulator .app found" 但日志里完全看不到任何错误信息）：
        BUILD_LOG="/tmp/sim_build.log"
        xcodebuild build \
          -scheme                    "$SCHEME" \
          -sdk                       iphonesimulator \
          -destination               "platform=iOS Simulator,id=$BOOT_UDID" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -onlyUsePackageVersionsFromResolvedFile \
          GENERATE_INFOPLIST_FILE=NO \
          INFOPLIST_FILE="$INFOPLIST_ABS" \
          READORI_SOCIAL_WORKER_ENDPOINT="$READORI_SOCIAL_WORKER_ENDPOINT" \
          READORI_API_SECRET="$READORI_API_SECRET" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ENABLE_TESTABILITY=NO \
          CONFIGURATION_BUILD_DIR="/tmp/sim_build" \
          > "$BUILD_LOG" 2>&1
        BUILD_RC=$?
        grep -E "error:|Build succeeded|BUILD FAILED" "$BUILD_LOG" || true

        # 🐛 彻底修复（"xcodebuild 明明 BUILD SUCCEEDED、exit=0，却依然
        APP_PATH="/tmp/sim_build/${SCHEME}.app"
        rm -rf "$APP_PATH"
        APP_BINARY="/tmp/sim_build/$SCHEME"
        if [[ ! -f "$APP_BINARY" ]]; then
          echo "No simulator .app found — skipping auto-capture (xcodebuild exit=$BUILD_RC, no bare executable at $APP_BINARY either)"
          echo "---- last 150 lines of $BUILD_LOG ----"
          tail -150 "$BUILD_LOG"
          exit 0
        fi

        mkdir -p "$APP_PATH"
        cp "$APP_BINARY" "$APP_PATH/$SCHEME"
        chmod +x "$APP_PATH/$SCHEME"
        cp "$INFOPLIST_ABS" "$APP_PATH/Info.plist"

        /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $SCHEME" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION:-1.0.0}" "$APP_PATH/Info.plist" || true
        if [[ -n "$READORI_SOCIAL_WORKER_ENDPOINT" ]]; then
          /usr/bin/plutil -replace READORI_SOCIAL_WORKER_ENDPOINT -string "$READORI_SOCIAL_WORKER_ENDPOINT" "$APP_PATH/Info.plist" || true
        fi
        if [[ -n "$READORI_API_SECRET" ]]; then
          /usr/bin/plutil -replace READORI_API_SECRET -string "$READORI_API_SECRET" "$APP_PATH/Info.plist" || true
        fi
        /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$APP_PATH/Info.plist" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"

        # 应用内实际显示的图片/图标（书架封面占位图等）
        ASSETS_CAR=$(find /tmp/sim_build -maxdepth 1 -name "Assets.car" | head -1)
        [[ -n "$ASSETS_CAR" ]] && cp "$ASSETS_CAR" "$APP_PATH/Assets.car"

        # SPM 资源包：.lproj（多语种截图必须）、Fonts 等
        for RESOURCE_DIR in "/tmp/sim_build/${SCHEME}_${SCHEME}.bundle" "/tmp/sim_build/Readori_Readori.bundle"; do
          if [[ -d "$RESOURCE_DIR" ]]; then
            cp -R "$RESOURCE_DIR" "$APP_PATH/" || true
            for LPROJ in "$RESOURCE_DIR"/*.lproj; do
              if [[ -d "$LPROJ" ]]; then
                LPROJ_NAME=$(basename "$LPROJ")
                [[ "$LPROJ_NAME" == old_* ]] && continue
                cp -R "$LPROJ" "$APP_PATH/$LPROJ_NAME"
              fi
            done
            if [[ -d "$RESOURCE_DIR/Fonts" ]]; then
              cp -R "$RESOURCE_DIR/Fonts" "$APP_PATH/Fonts"
            fi
          fi
        done

        echo "Wrapped simulator .app at: $APP_PATH"
        ls -d "$APP_PATH"/*.lproj 2>/dev/null || echo "WARNING: No .lproj directories at app root — localized screenshots will not work!"

        LOCALES="en-US"

        # 🐛 彻底修复（iPhone/iPad 自动截图此前一直不正常的两个根因）：

        # ---- helper: capture the bookshelf/explore/settings screens for one device ----
        capture_for_device() {
          UDID="$1"; DISPLAY_NAME="$2"; DISPLAY_TYPE="$3"
          echo "=== Capturing for $DISPLAY_NAME ($DISPLAY_TYPE) udid=$UDID ==="
          xcrun simctl boot "$UDID" 2>/dev/null || true
          sleep 8
          if ! xcrun simctl install "$UDID" "$APP_PATH"; then
            echo "install failed for $DISPLAY_NAME — skipping this device"
            return
          fi

          for LOCALE in $LOCALES; do
            OUT_DIR="$SCREENSHOTS_DIR/$LOCALE/$DISPLAY_TYPE"
            mkdir -p "$OUT_DIR"

            APPLE_LANG="en"; APPLE_LOCALE="en_US"
            case "$LOCALE" in
              zh-Hans) APPLE_LANG="zh-Hans"; APPLE_LOCALE="zh_CN" ;;
              zh-Hant) APPLE_LANG="zh-Hant"; APPLE_LOCALE="zh_TW" ;;
            esac

            capture_one() {
              TAB="$1"; FILE="$2"
              # 每张截图都用目标 Tab + 目标语种重新启动一次 App，跳过引导页
              # 并直接停在指定 Tab 上——不点任何坐标，天然对 iPhone/iPad、
              # 底部 Tab 栏/侧边栏布局都成立。
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              SIMCTL_CHILD_READORI_SCREENSHOT_MODE=1 \
              SIMCTL_CHILD_READORI_SCREENSHOT_TAB="$TAB" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID" \
                -AppleLanguages "($APPLE_LANG)" -AppleLocale "$APPLE_LOCALE" 2>/dev/null || true
              # "reader" 启动后要多做一次本地文件导入 + 后台分章解析才能打开阅读器，
              # 比单纯切 Tab 慢，多给几秒缓冲。
              if [[ "$TAB" == "reader" ]]; then
                sleep 9
              else
                sleep 6
              fi
              xcrun simctl io "$UDID" screenshot "$FILE" 2>/dev/null || true
              # 明显失败帧（文件几乎是空的）重试一次；不做真正的图像内容校验，
              # 只拦截"压根没截到东西"这种最常见的失败模式。
              if [[ ! -s "$FILE" ]] || [[ $(wc -c < "$FILE" 2>/dev/null || echo 0) -lt 2048 ]]; then
                echo "  WARNING: $FILE looks invalid, retrying once..."
                sleep 2
                xcrun simctl io "$UDID" screenshot "$FILE" 2>/dev/null || true
              fi
            }

            capture_one "bookshelf"       "$OUT_DIR/01_bookshelf.png"
            capture_one "reader"          "$OUT_DIR/02_reader.png"
            capture_one "explore"         "$OUT_DIR/03_explore.png"
            capture_one "settings"        "$OUT_DIR/04_settings.png"
            capture_one "pro"             "$OUT_DIR/05_pro.png"
            capture_one "personalization" "$OUT_DIR/06_personalization.png"
          done

          xcrun simctl shutdown "$UDID" 2>/dev/null || true
        }

        if [[ -n "$IPHONE_SIM" ]]; then
          capture_for_device "${IPHONE_SIM%%|*}" "${IPHONE_SIM##*|}" "APP_IPHONE_67"
        else
          echo "Skipping iPhone screenshots (no simulator available)"
        fi

        if [[ -n "$IPAD_SIM" ]]; then
          # iPad Pro 13" (M4): 2064x2752 px @2x → 1032x1376 pt logical resolution
          capture_for_device "${IPAD_SIM%%|*}" "${IPAD_SIM##*|}" "APP_IPAD_PRO_3GEN_129"
        else
          echo "Skipping iPad screenshots — WARNING: App Store requires iPad screenshots for apps that support iPad"
        fi

        # Move captured screenshots to expected location
        if [[ -n "$(ls -A "$SCREENSHOTS_DIR" 2>/dev/null)" ]]; then
          mv "$SCREENSHOTS_DIR" "$TARGET_DIR"
          echo "Auto-captured screenshots saved to $TARGET_DIR"
          find "$TARGET_DIR" -name '*.png' | sort
        else
          echo "WARNING: no screenshots were captured"
        fi

    - name: Validate captured screenshots
      if: ${{ env.MODE == 'screenshots' }}
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/core_project/screenshots/en-US"
        IPHONE_DIR="$ROOT/APP_IPHONE_67"
        IPAD_DIR="$ROOT/APP_IPAD_PRO_3GEN_129"

        validate_set() {
          local dir="$1"
          local label="$2"
          [[ -d "$dir" ]] || { echo "::error::$label screenshot directory missing: $dir"; exit 1; }
          local count
          count="$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          [[ "$count" -eq 6 ]] || { echo "::error::$label requires exactly 6 screenshots; found $count"; exit 1; }
          while IFS= read -r png; do
            [[ -s "$png" ]] || { echo "::error::Empty screenshot: $png"; exit 1; }
            width="$(sips -g pixelWidth "$png" 2>/dev/null | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$png" 2>/dev/null | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || { echo "::error::Unable to read screenshot dimensions: $png"; exit 1; }
            if (( width < 1000 || height < 1000 )); then
              echo "::error::Screenshot dimensions look invalid: ${width}x${height} $png"
              exit 1
            fi
          done < <(find "$dir" -maxdepth 1 -type f -name '*.png' | sort)
          echo "$label screenshots: PASS ($count files)"
        }

        validate_set "$IPHONE_DIR" "iPhone"
        validate_set "$IPAD_DIR" "iPad"

    # ==============================================
    # 16.6 PUBLISH SCREENSHOTS AS BUILD ARTIFACT
    # ==============================================
    - name: Publish captured screenshots as build artifact
      if: ${{ env.MODE == 'screenshots' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: app-store-screenshots
        path: core_project/screenshots/
        if-no-files-found: error
        retention-days: 14

    # ==============================================
    # 18. SUBSCRIPTION GROUPS — diagnostic list
    # ==============================================
    - name: List subscription groups (diagnostic)
      if: ${{ env.MODE == 'testflight' }}
      continue-on-error: true
      run: |
        echo "=== Subscription Groups ==="
        asc subscription-groups list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json | \
          python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        groups = data['data'] if isinstance(data, dict) and 'data' in data else (data if isinstance(data, list) else [])
        for g in groups:
            if isinstance(g, dict):
                print(f\"  {g.get('referenceName','?')}  id={g.get('id','?')}\")
            else:
                print(f'  {g}')
        " || echo "(no subscription groups or error)"

    # ==============================================
    # 19. UPLOAD IPA ARTIFACT
    # ==============================================
    - name: Upload IPA artifact
      if: ${{ env.MODE != 'screenshots' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: readori-${{ env.BUILD_TAG || github.run_number }}
        retention-days: 7
        if-no-files-found: error
        path: |
          build/*.ipa
          build/export/*.ipa

    # ==============================================
    # 20. CLEANUP EPHEMERAL SIGNING MATERIAL
    # ==============================================
    - name: Clean up signing material
      if: ${{ always() && env.MODE == 'testflight' }}
      run: |
        set +e
        rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
        rm -rf /tmp/asc_keys
        rm -f /tmp/asc_api_key.json /tmp/sign_entitlements.plist \
          /tmp/readori-match-profile.plist
        if [[ -n "${PROFILE_UUID:-}" ]]; then
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
        fi
        if [[ -n "${READORI_KEYCHAIN_PATH:-}" && -f "$READORI_KEYCHAIN_PATH" ]]; then
          security delete-keychain "$READORI_KEYCHAIN_PATH" >/dev/null 2>&1 || true
        fi
        echo "Ephemeral signing material cleaned"
