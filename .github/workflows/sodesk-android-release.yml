# RemoHop Android release: a signed App Bundle (AAB) for Google Play, optionally uploaded to a
# Play testing track.
#
# Public CI repository -> source repository: env SOURCE_REPOSITORY.
#
#   build  : JDK 17 + Android SDK + Go from go.mod -> mobile/android/build.sh bundleRelease, signed
#            with the upload key (Play App Signing re-signs for users). Checks the bundle's
#            signature, package name and both Go core ABIs. Nothing leaves the runner unless
#            ARTIFACT=encrypted (see below).
#   upload : build, then upload the bundle to the Play track TRACK through the Android Publisher
#            API with the service account, as a draft release (status DRAFT by default: an app that
#            has never been published only accepts drafts). Google requires the very first bundle
#            of a new app to be uploaded by hand in Play Console; use ARTIFACT=encrypted for that.
#   screenshots : the store listing's phone screenshots only (no build, no bundle, tracks and releases
#            untouched; the listing's text is never sent). Takes either the posters committed in the
#            source repository at REF (SHOTS_RUN_ID=repo: mobile/android/store/screenshots/<locale>/
#            <n>-<scene>.jpg|png) or the artifact remohop-play-screenshots of a successful
#            sodesk-android.yml run on main with SCREENSHOTS=true|only (en-US/*.png, zh-CN/*.png, the
#            raw captures), checks the images against Play's rules, then in one Play edit, per
#            language: deletes the listing's phone screenshots, uploads the new ones in file-name
#            order, and commits the edit. The images' Play URLs go to the job summary.
#
# Request file ci-requests/sodesk-android-release.env (plain KEY=VALUE, parsed with strict patterns,
# never executed); a push to main that changes it starts a run:
#
#   REF=main                 # source branch, tag or SHA (build and upload; screenshots with SHOTS_RUN_ID=repo)
#   MODE=build               # build | upload | screenshots
#   SHOTS_RUN_ID=latest      # screenshots only: repo = the posters committed at REF in
#                            # mobile/android/store/screenshots; or the sodesk-android.yml run whose
#                            # artifact to upload (its numeric id), or latest (default): the newest such artifact
#   SHOTS_LANGS=en-US,zh-CN  # screenshots only: which listings to replace (default both; each must
#                            # already exist on Play)
#   VERSION_NAME=0.1.0       # optional; default 0.1.0
#   VERSION_CODE=1001        # optional; default 1000 + this workflow's run number (monotonic)
#   TRACK=internal           # upload only: internal (default) | alpha | beta
#   STATUS=draft             # upload only: draft (default) | completed (only the track's release status)
#   ARTIFACT=none            # none (default) | plain: keep the signed AAB as a 1-day artifact
#                            # (for the first, hand-made upload in Play Console) | encrypted: the same,
#                            # AES-256 encrypted (openssl enc -aes-256-cbc -pbkdf2 -iter 200000)
#                            # with the upload keystore password, so the public artifact is useless
#                            # without that password. Decrypt:
#                            #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in remohop.aab.enc -out remohop.aab
#
# Secrets (repository secrets of this CI repo): TARGET_REPO_PAT (read the source),
# ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
# ANDROID_UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON (upload and screenshots). The screenshots job
# reads the other run's artifact with this run's GITHUB_TOKEN (actions: read, this repository only).
#
# Safety rules (public repo, public logs): no pull_request triggers; third-party actions pinned to
# commit SHAs; the keystore is written to a 0600 file under RUNNER_TEMP and deleted at the end;
# passwords reach Gradle through environment variables, never the command line or the log; the
# service account key is only read by openssl to sign the OAuth assertion; access tokens are masked.
name: RemoHop Android release

run-name: RemoHop Android release · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-android-release.env)' || inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source repository branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      mode:
        description: 'build = signed AAB only; upload = also upload to a Play track; screenshots = store listing phone screenshots from a sodesk-android.yml run'
        required: true
        default: 'build'
        type: choice
        options: [build, upload, screenshots]
      shots_run_id:
        description: 'screenshots only: repo = the posters committed at ref (mobile/android/store/screenshots), or a sodesk-android.yml run id whose remohop-play-screenshots artifact to upload, or latest'
        required: false
        default: 'latest'
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-android-release.env']

permissions:
  contents: read

concurrency:
  group: remohop-android-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: readori/RemoHop
  PRIVATE_SOURCE_PATH: source
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  EXPECTED_APP_ID: com.remohop.app

jobs:
  # Which job runs: the request's MODE (strictly parsed; the jobs validate the rest themselves).
  request:
    name: Read the request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-android-release.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            REQ="$RUNNER_TEMP/request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-android-release.env at this commit.'; exit 64; }
            MODE="$(sed -n 's/^MODE=//p' "$REQ" | head -n 1 | tr -d '\r')"
          else
            MODE="$INPUT_MODE"
          fi
          MODE="${MODE:-build}"
          [[ "$MODE" =~ ^(build|upload|screenshots)$ ]] || { echo '::error::MODE must be build, upload or screenshots.'; exit 64; }
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"

  release:
    name: Signed AAB
    needs: request
    if: needs.request.outputs.mode != 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          RUN_NUMBER: ${{ github.run_number }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-android-release.env
          HAVE_PAT: ${{ secrets.TARGET_REPO_PAT != '' }}
          HAVE_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          get() { sed -n "s/^$1=//p" "$REQ" | head -n 1 | tr -d '\r'; }
          if [[ "$EVENT_NAME" == 'push' ]]; then
            REQ="$RUNNER_TEMP/request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-android-release.env at this commit.'; exit 64; }
            SOURCE_REF="$(get REF)"; MODE="$(get MODE)"; VNAME="$(get VERSION_NAME)"; VCODE="$(get VERSION_CODE)"
            TRACK="$(get TRACK)"; STATUS="$(get STATUS)"; ARTIFACT="$(get ARTIFACT)"
          else
            SOURCE_REF="$INPUT_REF"; MODE="$INPUT_MODE"; VNAME=''; VCODE=''; TRACK=''; STATUS=''; ARTIFACT=''
          fi
          MODE="${MODE:-build}"; VNAME="${VNAME:-0.1.0}"; VCODE="${VCODE:-$((1000 + RUN_NUMBER))}"
          TRACK="${TRACK:-internal}"; STATUS="${STATUS:-draft}"; ARTIFACT="${ARTIFACT:-none}"
          [[ "$MODE" == build || "$MODE" == upload ]] || { echo '::error::MODE must be build or upload.'; exit 64; }
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || { echo '::error::bad REF'; exit 64; }
          [[ "$VNAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::VERSION_NAME must be X.Y.Z'; exit 64; }
          [[ "$VCODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo '::error::VERSION_CODE must be a positive integer'; exit 64; }
          [[ "$TRACK" =~ ^(internal|alpha|beta)$ ]] || { echo '::error::TRACK must be internal, alpha or beta'; exit 64; }
          [[ "$STATUS" =~ ^(draft|completed)$ ]] || { echo '::error::STATUS must be draft or completed'; exit 64; }
          [[ "$ARTIFACT" =~ ^(none|plain|encrypted)$ ]] || { echo '::error::ARTIFACT must be none, plain or encrypted'; exit 64; }
          [[ "$HAVE_PAT" == true ]] || { echo '::error::Missing secret TARGET_REPO_PAT.'; exit 78; }
          [[ "$HAVE_KEYSTORE" == true ]] || { echo '::error::Missing one of the ANDROID_UPLOAD_* secrets.'; exit 78; }
          [[ "$MODE" != upload || "$HAVE_PLAY" == true ]] || { echo '::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON.'; exit 78; }
          { echo "SOURCE_REF=$SOURCE_REF"; echo "MODE=$MODE"; echo "VNAME=$VNAME"; echo "VCODE=$VCODE"
            echo "TRACK=$TRACK"; echo "STATUS=$STATUS"; echo "ARTIFACT=$ARTIFACT"; } >> "$GITHUB_ENV"
          echo "mode=$MODE · ref=$SOURCE_REF · version $VNAME ($VCODE) · track=$TRACK/$STATUS · artifact=$ARTIFACT"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check layout
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          for f in mobile/android/build.sh mobile/android/app/build.gradle.kts mobile/android/gradle/wrapper/gradle-wrapper.properties; do
            [[ -f "$f" ]] || { echo "::error::$f is missing."; exit 66; }
          done
          grep -q "applicationId = \"$EXPECTED_APP_ID\"" mobile/android/app/build.gradle.kts || { echo "::error::applicationId must be $EXPECTED_APP_ID"; exit 65; }
          grep -q '^distributionSha256Sum=' mobile/android/gradle/wrapper/gradle-wrapper.properties || { echo '::error::Gradle wrapper must pin distributionSha256Sum.'; exit 65; }
          C="$(git rev-parse HEAD)"
          { echo '### RemoHop Android release'; echo; echo "- Source: \`$SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`)"; echo "- Version: $VNAME ($VCODE)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.PRIVATE_SOURCE_PATH }}/go.mod
          cache: false

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKM" ]] || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 69; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || { tail -20 "$RUNNER_TEMP/sdkmanager.log"; echo '::error::sdkmanager failed.'; exit 1; }
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"; } >> "$GITHUB_ENV"

      - name: Write the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KS="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$KS"
          [[ -s "$KS" ]] || { echo '::error::ANDROID_UPLOAD_KEYSTORE_BASE64 decoded to nothing.'; exit 65; }
          echo "KS=$KS" >> "$GITHUB_ENV"

      - name: gomobile bind + Gradle bundleRelease (signed with the upload key)
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.console=plain
          SIGN_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Android Gradle Plugin's injected signing properties. The values come from the
          # environment (masked secrets); the runner is ephemeral and the command line is not logged.
          SIGN=("-Pandroid.injected.signing.store.file=$KS"
                "-Pandroid.injected.signing.store.password=$SIGN_STORE_PASSWORD"
                "-Pandroid.injected.signing.key.alias=$SIGN_KEY_ALIAS"
                "-Pandroid.injected.signing.key.password=$SIGN_KEY_PASSWORD")
          LOG="$RUNNER_TEMP/android-release.log"
          if ! bash build.sh bundleRelease "${SIGN[@]}" "-Premohop.versionCode=$VCODE" "-Premohop.versionName=$VNAME" > "$LOG" 2>&1; then
            grep -E '^e: |error:|FAILED|R8|What went wrong' "$LOG" | grep -viE 'password|keystore' | cut -c1-400 | head -n 60
            grep -E -A12 'What went wrong' "$LOG" | grep -viE 'password' | cut -c1-400 | head -n 40
            echo '::error::Release build failed.'
            exit 1
          fi
          AAB="$PWD/app/build/outputs/bundle/release/app-release.aab"
          [[ -f "$AAB" ]] || { echo '::error::app-release.aab was not produced.'; exit 65; }
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Check the bundle
        run: |
          set -euo pipefail
          unzip -l "$AAB" | grep -q 'base/lib/arm64-v8a/libgojni.so' || { echo '::error::AAB has no arm64 Go core.'; exit 65; }
          unzip -l "$AAB" | grep -q 'base/lib/x86_64/libgojni.so' || { echo '::error::AAB has no x86_64 Go core.'; exit 65; }
          unzip -l "$AAB" | grep -q 'base/assets/remohop-mobile.js' || { echo '::error::AAB has no injected script.'; exit 65; }
          # Signed with a real key (not the debug key) and the signature verifies.
          OUT="$(jarsigner -verify -verbose:summary -certs "$AAB" 2>&1 || true)"
          grep -q 'jar verified' <<<"$OUT" || { echo "$OUT" | tail -5; echo '::error::AAB signature does not verify.'; exit 65; }
          if grep -q 'CN=Android Debug' <<<"$OUT"; then echo '::error::AAB is signed with the debug key.'; exit 65; fi
          SIGNER="$(grep -m1 -oE 'X\.509, [^]]+' <<<"$OUT" | cut -c1-120 || true)"
          SIZE="$(du -h "$AAB" | cut -f1)"
          SHA="$(sha256sum "$AAB" | cut -c1-16)"
          echo "AAB $SIZE · sha256 $SHA… · signer: $SIGNER"
          echo "- Signed AAB: $SIZE · sha256 \`$SHA…\` · signer: $SIGNER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Google Play
        if: env.MODE == 'upload'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          SA="$RUNNER_TEMP/sa.json"; printf '%s' "$PLAY_JSON" > "$SA"
          KEY="$RUNNER_TEMP/sa.pem"
          EMAIL="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));open(sys.argv[2],"w").write(d["private_key"]);print(d["client_email"])' "$SA" "$KEY")"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW="$(date +%s)"
          HDR="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          CLAIMS="$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 1800))" | b64url)"
          SIG="$(printf '%s.%s' "$HDR" "$CLAIMS" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)"
          rm -f "$KEY" "$SA"
          TOKEN="$(curl -fsS --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$HDR.$CLAIMS.$SIG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')" \
            || { echo '::error::Could not get a Google access token (service account key or clock).'; exit 1; }
          echo "::add-mask::$TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$EXPECTED_APP_ID"
          call() { # method url [curl args...]; prints the body, fails with Google's message
            local m="$1" u="$2"; shift 2
            local out code
            out="$(curl -sS --max-time 600 -X "$m" -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "$u" "$@")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [[ "$code" != 2* ]]; then
              python3 -c 'import json,sys
          try: e=json.loads(sys.argv[1])["error"]; print("Play API %s: %s" % (e.get("code"), e.get("message","")[:400]))
          except Exception: print("Play API HTTP", sys.argv[2])' "$out" "$code"
              return 1
            fi
            printf '%s' "$out"
          }
          EDIT="$(call POST "$API/edits" -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')" \
            || { echo '::error::Could not open a Play edit. A new app needs its first bundle uploaded by hand in Play Console (use ARTIFACT=encrypted), and the service account needs access to the app.'; exit 1; }
          UP="$(call POST "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$EXPECTED_APP_ID/edits/$EDIT/bundles?uploadType=media" \
            -H 'Content-Type: application/octet-stream' --data-binary "@$AAB" | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')" \
            || { echo '::error::Bundle upload failed.'; exit 1; }
          BODY="$(printf '{"track":"%s","releases":[{"name":"%s (%s)","versionCodes":["%s"],"status":"%s"}]}' "$TRACK" "$VNAME" "$UP" "$UP" "$STATUS")"
          call PUT "$API/edits/$EDIT/tracks/$TRACK" -H 'Content-Type: application/json' -d "$BODY" > /dev/null || { echo '::error::Track update failed.'; exit 1; }
          call POST "$API/edits/$EDIT:commit" > /dev/null || { echo '::error::Commit of the Play edit failed.'; exit 1; }
          echo "Uploaded version code $UP to track $TRACK ($STATUS)."
          echo "- Play: version code $UP uploaded to **$TRACK** as $STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the bundle for a hand upload
        if: env.ARTIFACT == 'encrypted'
        env:
          PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          PASS="$PASS" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS -in "$AAB" -out "$RUNNER_TEMP/out/remohop-$VNAME-$VCODE.aab.enc"
          echo "- Encrypted AAB kept as a 1-day artifact (decrypt with the upload keystore password)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the encrypted bundle (1 day)
        if: env.ARTIFACT == 'encrypted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-android-aab-encrypted
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Keep the signed bundle (1 day)
        if: env.ARTIFACT == 'plain'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-android-${{ env.VNAME }}-${{ env.VCODE }}-aab
          path: ${{ env.AAB }}
          retention-days: 1
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sa.pem"

  # MODE=screenshots: the store listing's phone screenshots from a sodesk-android.yml run's artifact.
  # No source checkout and no build here: this job runs no project code, it only moves checked images.
  screenshots:
    name: Play listing screenshots
    needs: request
    if: needs.request.outputs.mode == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHOTS_RUN_ID: ${{ inputs.shots_run_id }}
          INPUT_REF: ${{ inputs.ref }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-android-release.env
          HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            REQ="$RUNNER_TEMP/request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-android-release.env at this commit.'; exit 64; }
            RUN_ID="$(sed -n 's/^SHOTS_RUN_ID=//p' "$REQ" | head -n 1 | tr -d '\r')"
            LANGS="$(sed -n 's/^SHOTS_LANGS=//p' "$REQ" | head -n 1 | tr -d '\r')"
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
          else
            RUN_ID="$INPUT_SHOTS_RUN_ID"; LANGS=''; SOURCE_REF="$INPUT_REF"
          fi
          SOURCE_REF="${SOURCE_REF:-main}"
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || { echo '::error::bad REF'; exit 64; }
          RUN_ID="${RUN_ID:-latest}"
          LANGS="${LANGS:-en-US,zh-CN}"
          [[ "$LANGS" =~ ^(en-US|zh-CN)(,(en-US|zh-CN))?$ ]] || { echo '::error::SHOTS_LANGS must be en-US, zh-CN or en-US,zh-CN.'; exit 64; }
          echo "SHOTS_LANGS=${LANGS//,/ }" >> "$GITHUB_ENV"
          [[ "$RUN_ID" == latest || "$RUN_ID" == repo || "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo '::error::SHOTS_RUN_ID must be repo, latest or a run id (digits).'; exit 64; }
          [[ "$HAVE_PLAY" == true ]] || { echo '::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON.'; exit 78; }
          echo "SHOTS_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "SHOTS_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          if [[ "$RUN_ID" == repo ]]; then echo "screenshots from: $SOURCE_REPOSITORY@$SOURCE_REF mobile/android/store/screenshots · listings: $LANGS"
          else echo "screenshots from: run $RUN_ID · listings: $LANGS"; fi

      # SHOTS_RUN_ID=repo: only the posters' folder of the source repository (sparse, no history);
      # nothing in it is run.
      - name: Checkout the committed posters
        if: env.SHOTS_RUN_ID == 'repo'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SHOTS_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: shots-src
          fetch-depth: 1
          sparse-checkout: mobile/android/store/screenshots
          persist-credentials: false

      - name: Take the committed posters
        if: env.SHOTS_RUN_ID == 'repo'
        run: |
          set -euo pipefail
          SRC=shots-src/mobile/android/store/screenshots
          OUT="$RUNNER_TEMP/shots"; rm -rf "$OUT"; mkdir -p "$OUT"
          # Only the expected names, as regular files (no links, no other paths).
          python3 - "$SRC" "$OUT" <<'PY'
          import os, re, shutil, sys
          src, out = sys.argv[1:]
          bad, n = [], 0
          for loc in ('en-US', 'zh-CN'):
              d = os.path.join(src, loc)
              if not os.path.isdir(d) or os.path.islink(d):
                  continue
              os.makedirs(os.path.join(out, loc), exist_ok=True)
              for f in sorted(os.listdir(d)):
                  p = os.path.join(d, f)
                  if not re.fullmatch(r'[1-8]-[a-z]{2,20}\.(png|jpg)', f) or os.path.islink(p) or not os.path.isfile(p):
                      bad.append(f'{loc}/{f}'); continue
                  shutil.copyfile(p, os.path.join(out, loc, f)); n += 1
          if bad:
              print('unexpected files in mobile/android/store/screenshots:', bad[:5]); sys.exit(1)
          print(f'{n} committed posters')
          PY
          git -C shots-src log -1 --format='source commit %H (%cs)'
          echo "SHOTS_DIR=$OUT" >> "$GITHUB_ENV"
          echo "SHOTS_SOURCE_RUN=" >> "$GITHUB_ENV"

      - name: Fetch the screenshots artifact
        if: env.SHOTS_RUN_ID != 'repo'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_NAME: remohop-play-screenshots
          SOURCE_WORKFLOW: .github/workflows/sodesk-android.yml
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          gh_get() { curl -fsSL --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"; }
          W="$RUNNER_TEMP/shots-dl"; rm -rf "$W"; mkdir -p "$W"
          if [[ "$SHOTS_RUN_ID" == latest ]]; then
            gh_get "$API/actions/artifacts?name=$ARTIFACT_NAME&per_page=30" -o "$W/list.json"
          else
            gh_get "$API/actions/runs/$SHOTS_RUN_ID/artifacts?name=$ARTIFACT_NAME&per_page=30" -o "$W/list.json"
          fi
          # The newest unexpired artifact of that name from a run on main.
          read -r ART_ID RUN_ID URL < <(python3 - "$W/list.json" <<'PY'
          import json, sys
          arts = [a for a in json.load(open(sys.argv[1])).get('artifacts', [])
                  if not a.get('expired') and (a.get('workflow_run') or {}).get('head_branch') == 'main']
          arts.sort(key=lambda a: a.get('created_at', ''), reverse=True)
          if arts:
              a = arts[0]
              print(a['id'], a['workflow_run']['id'], a['archive_download_url'])
          PY
          ) || true
          [[ -n "${ART_ID:-}" ]] || { echo "::error::No unexpired $ARTIFACT_NAME artifact found (run $SHOTS_RUN_ID). Run sodesk-android.yml with SCREENSHOTS=true or only first."; exit 66; }
          # It must come from a successful run of the Android workflow on main of this repository.
          gh_get "$API/actions/runs/$RUN_ID" -o "$W/run.json"
          python3 - "$W/run.json" "$SOURCE_WORKFLOW" "$REPO" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          ok = (r.get('path') == sys.argv[2] and r.get('head_branch') == 'main' and r.get('conclusion') == 'success'
                and r.get('event') in ('push', 'workflow_dispatch') and (r.get('repository') or {}).get('full_name') == sys.argv[3])
          print('source run %s: %s on %s, %s, %s (%s)' % (r.get('id'), r.get('path'), r.get('head_branch'), r.get('event'), r.get('conclusion'), r.get('html_url')))
          sys.exit(0 if ok else 1)
          PY
          gh_get "$URL" -o "$W/shots.zip"
          # Extract only the expected names (no paths of the archive's own choosing).
          OUT="$RUNNER_TEMP/shots"; rm -rf "$OUT"; mkdir -p "$OUT"
          python3 - "$W/shots.zip" "$OUT" <<'PY'
          import os, re, struct, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1]); out = sys.argv[2]
          names = [n for n in z.namelist() if not n.endswith('/')]
          bad = [n for n in names if not re.fullmatch(r'(en-US|zh-CN)/[1-8]-[a-z]{2,20}\.png', n)]
          if bad:
              print('unexpected files in the artifact:', bad[:5]); sys.exit(1)
          for n in names:
              b = z.read(n)
              os.makedirs(os.path.join(out, os.path.dirname(n)), exist_ok=True)
              open(os.path.join(out, n), 'wb').write(b)
          PY
          rm -f "$W/shots.zip"
          echo "SHOTS_DIR=$OUT" >> "$GITHUB_ENV"
          echo "SHOTS_SOURCE_RUN=$RUN_ID" >> "$GITHUB_ENV"

      - name: Check the images against Play's rules
        run: |
          set -euo pipefail
          # Phone screenshots: PNG (opaque) or JPEG, each side 320-3840 px, at most 2:1, 8 MB, 2-8 per language.
          python3 - "$SHOTS_DIR" <<'PY'
          import os, struct, sys
          out = sys.argv[1]
          def jpeg_size(b):
              i = 2
              while i + 9 < len(b):
                  if b[i] != 0xFF: return None
                  m, n = b[i + 1], struct.unpack('>H', b[i + 2:i + 4])[0]
                  if 0xC0 <= m <= 0xCF and m not in (0xC4, 0xC8, 0xCC):
                      h, w = struct.unpack('>HH', b[i + 5:i + 9]); return w, h
                  i += 2 + n
              return None
          err = 0
          for loc in ('en-US', 'zh-CN'):
              d = os.path.join(out, loc)
              files = sorted(os.listdir(d)) if os.path.isdir(d) else []
              if not 2 <= len(files) <= 8:
                  print(f'{loc}: {len(files)} screenshots (Play takes 2 to 8)'); err += 1
              for f in files:
                  b = open(os.path.join(d, f), 'rb').read()
                  if f.endswith('.png') and b[:8] == b'\x89PNG\r\n\x1a\n':
                      w, h, depth, ctype = struct.unpack('>IIBB', b[16:26]); opaque = ctype in (0, 2)
                  elif f.endswith('.jpg') and b[:3] == b'\xff\xd8\xff' and jpeg_size(b):
                      (w, h), opaque = jpeg_size(b), True
                  else:
                      print(f'{loc}/{f}: not a PNG or JPEG'); err += 1; continue
                  ok = 320 <= min(w, h) and max(w, h) <= 3840 and max(w, h) <= 2 * min(w, h) and len(b) <= 8 * 1024 * 1024 and opaque
                  print(f'{loc}/{f}: {w}x{h}, {len(b) // 1024} KB: {"OK" if ok else "REJECTED"}')
                  err += 0 if ok else 1
          sys.exit(1 if err else 0)
          PY

      - name: Replace the Play listing's phone screenshots
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          SA="$RUNNER_TEMP/sa.json"; printf '%s' "$PLAY_JSON" > "$SA"
          KEY="$RUNNER_TEMP/sa.pem"
          EMAIL="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));open(sys.argv[2],"w").write(d["private_key"]);print(d["client_email"])' "$SA" "$KEY")"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW="$(date +%s)"
          HDR="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          CLAIMS="$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 1800))" | b64url)"
          SIG="$(printf '%s.%s' "$HDR" "$CLAIMS" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)"
          rm -f "$KEY" "$SA"
          TOKEN="$(curl -fsS --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$HDR.$CLAIMS.$SIG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')" \
            || { echo '::error::Could not get a Google access token (service account key or clock).'; exit 1; }
          echo "::add-mask::$TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$EXPECTED_APP_ID"
          UPLOAD="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$EXPECTED_APP_ID"
          call() { # method url [curl args...]; prints the body, fails with Google's message
            local m="$1" u="$2"; shift 2
            local out code
            out="$(curl -sS --max-time 300 -X "$m" -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "$u" "$@")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [[ "$code" != 2* ]]; then
              python3 -c 'import json,sys
          try: e=json.loads(sys.argv[1])["error"]; print("Play API %s: %s" % (e.get("code"), e.get("message","")[:400]))
          except Exception: print("Play API HTTP", sys.argv[2])' "$out" "$code"
              return 1
            fi
            printf '%s' "$out"
          }
          EDIT="$(call POST "$API/edits" -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')" \
            || { echo '::error::Could not open a Play edit (the service account needs access to the app).'; exit 1; }
          COMMITTED=false
          # An edit left open on failure is deleted, so nothing half-done is kept.
          trap '[[ "$COMMITTED" == true ]] || call DELETE "$API/edits/$EDIT" > /dev/null 2>&1 || true' EXIT
          SUMMARY="$RUNNER_TEMP/shots-summary.md"; : > "$SUMMARY"
          # The store listing languages Play has for the app (all must exist before anything changes).
          if ! LANGS="$(call GET "$API/edits/$EDIT/listings")"; then echo "$LANGS"; echo '::error::Could not read the store listings.'; exit 1; fi
          LANGS="$(python3 -c 'import json,sys;print(" ".join(sorted(l.get("language","") for l in json.loads(sys.argv[1]).get("listings",[]))))' "$LANGS")"
          echo "Play store listings: ${LANGS:-none}"
          for LOC in $SHOTS_LANGS; do
            [[ " $LANGS " == *" $LOC "* ]] || { echo "::error::Play has no $LOC store listing (listings: ${LANGS:-none}). Add that language to the main store listing in Play Console (or fix the code here), then rerun."; exit 1; }
          done
          for LOC in $SHOTS_LANGS; do
            call DELETE "$API/edits/$EDIT/listings/$LOC/phoneScreenshots" > /dev/null || { echo "::error::Could not delete the $LOC phone screenshots."; exit 1; }
            n=0
            for f in $(ls "$SHOTS_DIR/$LOC" | sort); do
              case "$f" in *.jpg) TYPE=image/jpeg ;; *) TYPE=image/png ;; esac
              R="$(call POST "$UPLOAD/edits/$EDIT/listings/$LOC/phoneScreenshots?uploadType=media" -H "Content-Type: $TYPE" --data-binary "@$SHOTS_DIR/$LOC/$f")" \
                || { echo "::error::Upload of $LOC/$f failed."; exit 1; }
              n=$((n + 1))
              echo "$LOC/$f uploaded"
            done
            # What the listing now holds, as Play reports it.
            call GET "$API/edits/$EDIT/listings/$LOC/phoneScreenshots" | python3 -c 'import json,sys
          imgs=json.load(sys.stdin).get("images",[])
          loc=sys.argv[1]; want=int(sys.argv[2])
          print("%s: %d phone screenshots in the edit" % (loc, len(imgs)))
          with open(sys.argv[3],"a") as s:
              s.write("- %s: %d phone screenshots: %s\n" % (loc, len(imgs), " ".join("[%d](%s)" % (i+1, im.get("url","")) for i, im in enumerate(imgs))))
          for i, im in enumerate(imgs): print("  %d. %s" % (i+1, im.get("url","")))
          sys.exit(0 if len(imgs)==want else 1)' "$LOC" "$n" "$SUMMARY" || { echo "::error::The $LOC listing does not hold the $n uploaded screenshots."; exit 1; }
          done
          if ! OUT="$(call POST "$API/edits/$EDIT:commit")"; then
            echo "$OUT"
            # Apps under managed publishing / with rejected updates need this flag; retry once with it.
            if grep -q 'changesNotSentForReview' <<<"$OUT"; then
              call POST "$API/edits/$EDIT:commit?changesNotSentForReview=true" > /dev/null || { echo '::error::Commit of the Play edit failed.'; exit 1; }
              echo '::notice::Committed with changesNotSentForReview=true: send the changes for review in Play Console.'
            else
              echo '::error::Commit of the Play edit failed.'; exit 1
            fi
          fi
          COMMITTED=true
          echo "Play edit committed: phone screenshots replaced for $SHOTS_LANGS."
          { echo '### RemoHop Play listing screenshots'; echo
            if [[ -n "$SHOTS_SOURCE_RUN" ]]; then echo "- From run [$SHOTS_SOURCE_RUN](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$SHOTS_SOURCE_RUN) (artifact remohop-play-screenshots)"
            else echo "- From $SOURCE_REPOSITORY@$SHOTS_REF, mobile/android/store/screenshots (committed posters)"; fi
            cat "$SUMMARY"
            echo '- Tracks and releases unchanged; listing text unchanged.'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/sa.pem"
