# Radio Android (Hourwave, com.readori.radio). Installed from the FEAT-50 draft
# (readori/Radio docs/ops/radio-android.yml.draft), workflow_dispatch only.
#
#   verify : pnpm install -> mobile typecheck / lint / test -> expo prebuild -> player Kotlin tests
#            and lint -> debug APK (arm64). Nothing leaves the runner.
#   bundle : the same checks, then a release .aab signed with Hourwave's upload key, and bundle checks
#            (targetSdk 36, mediaPlayback FGS, permission allow-list, 16 KB pages, signature).
#            Nothing leaves the runner unless aab_pubkey is given (see below).
#   internal : bundle, then upload it to the Play internal track as a draft release through the Android
#            Publisher API (secret PLAY_SERVICE_ACCOUNT_JSON; token masked, key file deleted at once).
#   play-check : only opens and deletes a Play edit, to check the API accepts the app.
#
# aab_pubkey (bundle only, for the first hand-made upload in Play Console): base64 of an RSA public
# key PEM. The .aab is encrypted with a random AES-256 key, that key is wrapped with the RSA public key,
# and both go up as a 1-day artifact, so only the holder of the matching private key can open it.
#
# Public-log rules (readori/Radio CLAUDE.md): no private file contents in logs, errors only, secrets
# only in the steps that need them. Secrets: TARGET_REPO_PAT (checkout), RADIO_ANDROID_UPLOAD_*
# (Hourwave's own upload key; NOT RemoHop's ANDROID_UPLOAD_*).
#
# Version (docs/design/android-atlas-plan.md §6): versionName = version (same as iOS),
# versionCode = major*1000000 + minor*10000 + patch*100 + build_number (1..99).

name: Radio Android
run-name: Radio Android · ${{ inputs.mode }} · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = checks + debug build; bundle = checks + signed .aab; internal = bundle + Play internal track (draft); play-check = only open and delete a Play edit'
        type: choice
        options: [verify, bundle, internal, play-check]
        default: verify
      ref:
        description: 'Branch, tag or SHA of readori/Radio'
        required: true
        type: string
      version:
        description: 'versionName x.y.z (same as iOS)'
        required: false
        default: '1.0.1'
        type: string
      build_number:
        description: 'Build number 1..99'
        required: false
        default: '1'
        type: string
      aab_pubkey:
        description: 'bundle only: base64 RSA public key PEM; set = encrypted 1-day .aab artifact'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: radio-android-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.mode != 'play-check'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Inputs
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build_number }}
          HAS_PAT: ${{ secrets.TARGET_REPO_PAT != '' }}
        run: |
          set -euo pipefail
          [[ "$HAS_PAT" == true ]] || { echo '::error::Missing TARGET_REPO_PAT.'; exit 78; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::version must be x.y.z'; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] && (( BUILD >= 1 && BUILD <= 99 )) || { echo '::error::build_number 1..99'; exit 1; }

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ inputs.ref }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: radio
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        working-directory: radio
        run: |
          corepack enable
          pnpm install --frozen-lockfile --reporter=silent

      - name: Typecheck, lint, test (errors only)
        working-directory: radio
        run: pnpm turbo run typecheck lint test --filter=@hourwave/mobile --output-logs=errors-only

      - name: Version
        working-directory: radio/apps/mobile
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 100 + BUILD ))
          jq --arg v "$VERSION" --argjson c "$CODE" '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "versionName=$VERSION versionCode=$CODE"

      - name: Prebuild Android
        working-directory: radio/apps/mobile
        run: CI=1 npx expo prebuild -p android --clean --no-install > /dev/null

      - name: Kotlin unit tests + lint (player module)
        working-directory: radio/apps/mobile/android
        run: |
          ./gradlew --no-daemon -q :hourwave-player:testDebugUnitTest :hourwave-player:lintDebug > "$RUNNER_TEMP/k.log" 2>&1 \
            || { grep -E "^e: |FAILED|error:|expected:|What went wrong" -A3 "$RUNNER_TEMP/k.log" | head -60; exit 1; }

      - name: Debug build (verify)
        if: inputs.mode == 'verify'
        working-directory: radio/apps/mobile/android
        run: |
          ./gradlew --no-daemon -q assembleDebug -PreactNativeArchitectures=arm64-v8a > "$RUNNER_TEMP/d.log" 2>&1 \
            || { grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$RUNNER_TEMP/d.log" | head -60; exit 1; }
          ls -l app/build/outputs/apk/debug/*.apk | awk '{print $5, $NF}'

      - name: Signed release bundle
        if: inputs.mode == 'bundle' || inputs.mode == 'internal'
        working-directory: radio/apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.RADIO_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RADIO_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADIO_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RADIO_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]] || { echo '::error::Missing RADIO_ANDROID_UPLOAD_* secrets.'; exit 78; }
          umask 077
          KS="$RUNNER_TEMP/upload.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          ./gradlew --no-daemon -q :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" > "$RUNNER_TEMP/b.log" 2>&1 \
            || { rm -f "$KS"; grep -E "^e: |error:|FAILURE|What went wrong" -A3 "$RUNNER_TEMP/b.log" | head -60; exit 1; }
          rm -f "$KS"

      - name: Bundle checks (manifest, 16 KB pages, signature)
        if: inputs.mode == 'bundle' || inputs.mode == 'internal'
        working-directory: radio/apps/mobile/android
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          curl -sSfLo "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          MANIFEST=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB")
          grep -q 'package="com.readori.radio"' <<<"$MANIFEST" || { echo '::error::package is not com.readori.radio'; exit 1; }
          grep -q 'android:targetSdkVersion="36"' <<<"$MANIFEST" || { echo '::error::targetSdk is not 36'; exit 1; }
          grep -Eq 'foregroundServiceType="(mediaPlayback|0x0*2|2)"' <<<"$MANIFEST" || { echo '::error::no mediaPlayback FGS'; grep -o 'foregroundServiceType="[^"]*"' <<<"$MANIFEST" || true; exit 1; }
          ALLOWED='INTERNET|FOREGROUND_SERVICE|FOREGROUND_SERVICE_MEDIA_PLAYBACK|WAKE_LOCK|ACCESS_NETWORK_STATE|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          EXTRA=$(grep -o 'uses-permission[^>]*android:name="[^"]*"' <<<"$MANIFEST" | sed 's/.*name="//;s/"//;s/.*\.//' | grep -Ev "^($ALLOWED)$" || true)
          [ -z "$EXTRA" ] || { echo "::error::unexpected permissions: $EXTRA"; exit 1; }
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle="$AAB" | grep -q PAGE_ALIGNMENT_16K || { echo '::error::bundle not 16 KB aligned'; exit 1; }
          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | tail -1)
          mkdir -p "$RUNNER_TEMP/so" && unzip -qo "$AAB" 'base/lib/arm64-v8a/*' 'base/lib/x86_64/*' -d "$RUNNER_TEMP/so"
          BAD=0
          for so in "$RUNNER_TEMP"/so/base/lib/*/*.so; do
            if "$READELF" -lW "$so" | awk '$1=="LOAD"{print $NF}' | grep -qv '0x4000'; then echo "::error::not 16 KB: $(basename "$so")"; BAD=1; fi
          done
          [ "$BAD" = 0 ]
          jarsigner -verify "$AAB" > /dev/null || { echo '::error::bundle signature does not verify'; exit 1; }
          rm -rf "$RUNNER_TEMP/so"
          ls -l "$AAB" | awk '{print "bundle checks passed,", $5, "bytes"}'

      - name: Encrypt the bundle for one recipient
        if: (inputs.mode == 'bundle' || inputs.mode == 'internal') && inputs.aab_pubkey != ''
        working-directory: radio/apps/mobile/android
        env:
          PUB: ${{ inputs.aab_pubkey }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "$PUB" | base64 -d > "$RUNNER_TEMP/pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/pub.pem" -noout || { echo '::error::aab_pubkey is not a public key PEM'; exit 1; }
          openssl rand 32 > "$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/k" -out "$RUNNER_TEMP/out/hourwave.key.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:"$RUNNER_TEMP/k" \
            -in app/build/outputs/bundle/release/app-release.aab -out "$RUNNER_TEMP/out/hourwave.aab.enc"
          rm -f "$RUNNER_TEMP/k"

      - name: Upload the encrypted bundle (1 day)
        if: (inputs.mode == 'bundle' || inputs.mode == 'internal') && inputs.aab_pubkey != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hourwave-aab-encrypted
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      - name: Upload to Play internal testing (draft)
        if: inputs.mode == 'internal'
        working-directory: radio/apps/mobile/android
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VNAME: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          AAB=app/build/outputs/bundle/release/app-release.aab
          umask 077
          SA="$RUNNER_TEMP/sa.json"; printf '%s' "$PLAY_JSON" > "$SA"
          KEY="$RUNNER_TEMP/sa.pem"
          EMAIL="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));open(sys.argv[2],"w").write(d["private_key"]);print(d["client_email"])' "$SA" "$KEY")"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW="$(date +%s)"
          HDR="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          CLAIMS="$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 1800))" | b64url)"
          SIG="$(printf '%s.%s' "$HDR" "$CLAIMS" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)"
          rm -f "$KEY" "$SA"
          TOKEN="$(curl -fsS --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$HDR.$CLAIMS.$SIG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')" \
            || { echo '::error::Could not get a Google access token (service account key or clock).'; exit 1; }
          echo "::add-mask::$TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.readori.radio"
          call() { # method url [curl args...]; prints the body, fails with Google's message on stderr (so it reaches the log when stdout is captured or dropped)
            local m="$1" u="$2"; shift 2
            local out code
            out="$(curl -sS --max-time 600 -X "$m" -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "$u" "$@")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [[ "$code" != 2* ]]; then
              python3 -c 'import json,sys
          try: e=json.loads(sys.argv[1])["error"]; print("Play API %s: %s" % (e.get("code"), e.get("message","")[:400]))
          except Exception: print("Play API HTTP", sys.argv[2])' "$out" "$code" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          EDIT="$(call POST "$API/edits" -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')" \
            || { echo '::error::Could not open a Play edit.'; exit 1; }
          UP="$(call POST "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.readori.radio/edits/$EDIT/bundles?uploadType=media" \
            -H 'Content-Type: application/octet-stream' --data-binary "@$AAB" | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')" \
            || { echo '::error::Bundle upload failed.'; exit 1; }
          BODY="$(printf '{"track":"internal","releases":[{"name":"%s (%s)","versionCodes":["%s"],"status":"draft"}]}' "$VNAME" "$UP" "$UP")"
          call PUT "$API/edits/$EDIT/tracks/internal" -H 'Content-Type: application/json' -d "$BODY" > /dev/null || { echo '::error::Track update failed.'; exit 1; }
          call POST "$API/edits/$EDIT:commit" > /dev/null || { echo '::error::Commit of the Play edit failed.'; exit 1; }
          echo "Uploaded version code $UP to internal (draft)."

  play-check:
    if: inputs.mode == 'play-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open and delete a Play edit
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          SA="$RUNNER_TEMP/sa.json"; printf '%s' "$PLAY_JSON" > "$SA"
          KEY="$RUNNER_TEMP/sa.pem"
          EMAIL="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));open(sys.argv[2],"w").write(d["private_key"]);print(d["client_email"])' "$SA" "$KEY")"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW="$(date +%s)"
          HDR="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          CLAIMS="$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' "$EMAIL" "$NOW" "$((NOW + 1800))" | b64url)"
          SIG="$(printf '%s.%s' "$HDR" "$CLAIMS" | openssl dgst -sha256 -sign "$KEY" -binary | b64url)"
          rm -f "$KEY" "$SA"
          TOKEN="$(curl -fsS --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$HDR.$CLAIMS.$SIG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')" \
            || { echo '::error::Could not get a Google access token (service account key or clock).'; exit 1; }
          echo "::add-mask::$TOKEN"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.readori.radio"
          call() { # method url [curl args...]; prints the body, fails with Google's message on stderr (so it reaches the log when stdout is captured or dropped)
            local m="$1" u="$2"; shift 2
            local out code
            out="$(curl -sS --max-time 600 -X "$m" -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "$u" "$@")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [[ "$code" != 2* ]]; then
              python3 -c 'import json,sys
          try: e=json.loads(sys.argv[1])["error"]; print("Play API %s: %s" % (e.get("code"), e.get("message","")[:400]))
          except Exception: print("Play API HTTP", sys.argv[2])' "$out" "$code" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          EDIT="$(call POST "$API/edits" -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')" \
            || { echo '::error::Could not open a Play edit.'; exit 1; }
          call DELETE "$API/edits/$EDIT" > /dev/null || true
          echo 'Play edit opened and deleted: the API accepts com.readori.radio.'
