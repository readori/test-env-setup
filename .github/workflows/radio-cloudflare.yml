# Radio (Hourwave) Cloudflare Workers in one workflow: the API Worker (+ catalog snapshot), the Web
# static site and the catalog ingest Worker. Merged 2026-11-21 from radio-api.yml, radio-web.yml
# and radio-ingest.yml (owner: too many single workflow files). Public CI repository -> private
# source readori/Radio; the private repo keeps no workflows.
#
# Pick `service`; `mode` and `target` must fit it (that service's first step refuses the rest):
#   api    : dry-run | d1-check | provision | deploy | snapshot | all | rollback | secrets; staging or production
#   web    : dry-run | deploy | rollback; staging or production
#   ingest : dry-run | deploy | status; staging only
# Every job runs only for its service. Every production write job names the `radio-production`
# environment literally, so nothing in it runs before the product owner approves.
#
# ======== service api (was radio-api.yml) ========
# Radio (Hourwave) API Worker + catalog snapshot, for staging and production (OPS-10b).
# Public CI repository -> private source readori/Radio. The private repo keeps no workflows.
#
# Two jobs, as in paobuwan-worker.yml:
#   validate (no approval): install, bundle with `wrangler deploy --dry-run`, and read-only checks.
#            production also: the `radio-production` environment must exist with required
#            reviewers (else the run fails: a job naming a missing environment would create an
#            unprotected one), resources are only looked up (never created), the D1 is only read,
#            and the custom domain's current owner is reported.
#   deploy-staging / deploy-production: every write. deploy-production names the environment
#            `radio-production` literally, so nothing in it runs before the product owner approves.
#            Both check out the exact commit validate resolved.
#
# Modes:
#   dry-run  : validate only, no Cloudflare credentials.
#   d1-check : validate + read the D1 (tables, recorded migrations). staging creates missing
#              resources here as before; production only looks them up.
#   provision: production only. Creates exactly the resources named in `create` (comma list; each
#              must be a resource name of env.production in workers/api/wrangler.jsonc), nothing else.
#   deploy   : D1 migrations (UTC time written to the summary first, for Time Travel), deploy the
#              API Worker, health check (+ catalog snapshot read-back unless first_rollout), App
#              Store endpoints answer 400 to an empty body. If the deploy succeeded but a check
#              failed, `wrangler rollback` restores the previous Worker version (D1 is NOT rolled
#              back), except with first_rollout (there is no previous version).
#   snapshot : import the catalog from Radio Browser (counts only in the log), upload it to the
#              environment's R2 bucket (shards first, manifest last), read it back through the Worker.
#              Land polygons: Natural Earth admin-0 map units 1:50m (public domain), pinned commit,
#              SHA-256 checked.
#   all      : deploy, then snapshot.
#   rollback : `wrangler rollback` of the API Worker to its previous version (D1 untouched).
#   secrets  : API-03 Worker secrets for Sign in with Apple, set with `wrangler secret put` from
#              stdin (values never printed): APPLE_TEAM_ID (ASC_TEAM_ID), APPLE_SIWA_KEY_ID and
#              APPLE_SIWA_PRIVATE_KEY (the team's APNS key, checked to be the same team), and a new
#              random BETTER_AUTH_SECRET only when the Worker has none (a rerun never rotates it).
#              Uses `wrangler versions secret put`: a new Worker version, NOT deployed; the next
#              mode deploy ships it (new versions keep the secrets).
#
# Name-agnostic: Worker, D1, R2 names and the production custom domain are read from
# workers/api/wrangler.jsonc of the checked-out ref and masked (never printed).
# Secrets: TARGET_REPO_PAT (checkout only), CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (only on
# steps that call Cloudflare). Nothing is uploaded as an Actions artifact.
#
# ======== service web (was radio-web.yml) ========
# Radio (Hourwave) Web: build the Next.js static export (apps/web) and deploy it to Cloudflare as
# the static-assets-only Worker named in apps/web/wrangler.jsonc (env staging or production).
# Public CI repository -> private source readori/Radio. The private repo keeps no workflows.
#
# Two jobs, as in paobuwan-worker.yml:
#   validate (no approval): install, build the static export with the target's API address,
#            bundle with `wrangler deploy --dry-run`. production also: the `radio-production`
#            environment must exist with required reviewers, RADIO_PRODUCTION_API must equal the
#            custom domain of env.production in workers/api/wrangler.jsonc, and the current owner of
#            the site's custom domain is reported (read-only).
#   deploy-staging / deploy-production (mode deploy | rollback): rebuild the exact validated
#            commit (no artifacts), deploy, check the site. deploy-production names the environment
#            `radio-production` literally, so nothing in it runs before the product owner approves.
#
# production deploy and the custom domain: the site's domain may still be attached to the staging
# web Worker. Right before `wrangler deploy` the approved job detaches it, but only when it is
# attached to exactly the staging web Worker of this config; any other owner stops the run. If the
# deploy then fails (or, on the first rollout, the site check fails), the domain is attached back
# to the staging web Worker. Otherwise a failed check rolls back to the previous version.
# The site has no Worker script: it only serves files, so it can never proxy or cache audio.
#
# Safety rules (public repo, public logs): workflow_dispatch only; actions pinned to SHAs;
# TARGET_REPO_PAT only in checkout, not persisted; Cloudflare secrets only on the steps that call
# Cloudflare; account id, workers.dev subdomain, Worker names and domains are masked; build and
# wrangler output go to files and only error codes are printed; no artifacts.
#
# ======== service ingest (was radio-ingest.yml) ========
# Radio (Hourwave) catalog ingest Worker, staging (DATA-02 S6; plan reports/oracle-batch-plan §4/§5).
#
#   dry-run : bundle only (wrangler deploy --dry-run), no credentials.
#   deploy  : cron-slot check -> provision (queue find-or-create, D1/R2 ids) -> pending D1 migrations
#             (only 0004 may be pending; anything else stops) -> deploy -> three secrets via stdin
#             -> status. The staging config ships INGEST_DRY_RUN=true.
#   status  : ingest_runs counts only.
#
# Public-log rules: workflow_dispatch only; no `set -x`; resource names are read from the config and
# masked; wrangler output goes to temp files and only error codes / redacted error lines are printed;
# hostnames, ids and station data are never printed; secrets only on the steps that need them;
# no artifacts, no cache.

name: Radio Cloudflare

run-name: Radio Cloudflare · ${{ inputs.service }} · ${{ inputs.mode }} · ${{ inputs.target }} · ${{ inputs.ref }}${{ inputs.first_rollout && ' · first rollout' || '' }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'api (API Worker + catalog snapshot) | web (static site) | ingest (catalog ingest Worker, staging only)'
        required: true
        default: api
        type: choice
        options: [api, web, ingest]
      ref:
        description: 'Private readori/Radio branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      mode:
        description: 'api: dry-run | d1-check | provision | deploy | snapshot | all | rollback | secrets · web: dry-run | deploy | rollback · ingest: dry-run | deploy | status'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, d1-check, provision, deploy, snapshot, all, rollback, secrets, status]
      target:
        description: 'staging | production (production writes wait for radio-production approval; ingest is staging only)'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      create:
        description: 'api provision only: comma list of exact resource names to create (D1 and/or R2 of env.production)'
        required: false
        default: ''
        type: string
      first_rollout:
        description: 'api or web production deploy (api also all) only: the first deploy (api: no snapshot read-back, no automatic rollback; web: no previous version, the domain goes back to staging on failure)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: radio-cloudflare-${{ inputs.service }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.ref }}
  MODE: ${{ inputs.mode }}
  TARGET_ENV: ${{ inputs.target }}
  CREATE: ${{ inputs.create }}
  FIRST_ROLLOUT: ${{ inputs.first_rollout && 'true' || 'false' }}
  WRANGLER_SEND_METRICS: 'false'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ================= service api =================
  # ========================================================================
  # 1. Validate (no approval, no writes for production)
  # ========================================================================
  api_validate:
    name: API · Validate (${{ inputs.mode }}, ${{ inputs.target }})
    if: inputs.service == 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }
          case "$TARGET_ENV" in staging|production) ;; *) echo "::error::Unsupported target: $TARGET_ENV"; exit 64 ;; esac
          case "$MODE" in dry-run|d1-check|provision|deploy|snapshot|all|rollback|secrets) ;; *) echo "::error::Unsupported mode: $MODE"; exit 64 ;; esac
          if [[ "$MODE" == provision ]]; then
            [[ "$TARGET_ENV" == production ]] || { echo '::error::provision is for production only (staging creates missing resources on deploy)'; exit 64; }
            [[ "$CREATE" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]] || { echo '::error::create must be a comma list of resource names'; exit 64; }
          else
            [[ -z "$CREATE" ]] || { echo '::error::create is only for mode provision'; exit 64; }
          fi
          if [[ "$FIRST_ROLLOUT" == true ]]; then
            [[ "$TARGET_ENV" == production && ( "$MODE" == deploy || "$MODE" == all ) ]] || { echo '::error::first_rollout is only for a production deploy or all'; exit 64; }
          fi
          echo "request OK: mode=$MODE target=$TARGET_ENV first_rollout=$FIRST_ROLLOUT"

      - name: Production gate exists (radio-production has required reviewers)
        if: inputs.target == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A job that names a missing environment silently creates an unprotected one, so the
          # production run stops here unless the gate is really there.
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/radio-production" || echo 000)"
          [[ "$code" == 200 ]] || { echo "::error::cannot read environment radio-production (HTTP $code); production is refused"; exit 1; }
          node -e '
            const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const rules = (e.protection_rules ?? []).filter((r) => r.type === "required_reviewers");
            const reviewers = rules.flatMap((r) => r.reviewers ?? []);
            if (reviewers.length === 0) { console.error("::error::radio-production has no required reviewers; production is refused"); process.exit(1); }
            console.log(`radio-production: ${reviewers.length} required reviewer(s)`);
          ' "$body"
          echo '- production gate: `radio-production` has required reviewers' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Pin the source commit
        id: source
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::cannot resolve the source commit'; exit 1; }
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Private source commit: ${sha:0:8} (the deploy job checks out exactly this commit)"

      - &api_node_step
        name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - &api_install_step
        name: Install dependencies and build packages/core (no credentials in this step)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ -f workers/api/wrangler.jsonc ]] || { echo '::error::workers/api is missing at this ref'; exit 66; }
          corepack enable
          pnpm install --frozen-lockfile --reporter=silent
          pnpm --filter ./packages/core build

      - &api_names_step
        name: Resolve Worker, D1, R2 names and the custom domain from the wrangler config (not printed)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/names.mjs" <<'JS'
          // Usage: node names.mjs <wrangler.jsonc> <env|-> <worker|db|bucket|domain>
          // Prints one resource name (or the env's single custom domain) read from the wrangler
          // config of the checked-out ref. Errors never echo config content.
          import { readFileSync } from 'node:fs';

          function jsonc(text) {
            let out = '';
            let inString = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (inString) {
                out += c;
                if (c === '\\') out += text[++i];
                else if (c === '"') inString = false;
              } else if (c === '"') {
                inString = true;
                out += c;
              } else if (c === '/' && text[i + 1] === '/') {
                while (i < text.length && text[i] !== '\n') i++;
                out += '\n';
              } else if (c === '/' && text[i + 1] === '*') {
                i += 2;
                while (i < text.length && !(text[i] === '*' && text[i + 1] === '/')) i++;
                i++;
              } else out += c;
            }
            return JSON.parse(out.replace(/,(\s*[}\]])/g, '$1'));
          }

          const [file, env, kind] = process.argv.slice(2);
          let name;
          try {
            const top = jsonc(readFileSync(file, 'utf8'));
            const sect = env === '-' ? top : (top.env ?? {})[env] ?? {};
            if (kind === 'worker') name = sect.name ?? (env === '-' ? top.name : `${top.name}-${env}`);
            else if (kind === 'db') name = (sect.d1_databases ?? [])[0]?.database_name;
            else if (kind === 'bucket') name = (sect.r2_buckets ?? [])[0]?.bucket_name;
            else if (kind === 'domain') {
              const domains = (sect.routes ?? []).filter((r) => r.custom_domain === true);
              name = domains.length === 1 ? domains[0].pattern : undefined;
            }
          } catch {
            console.error(`::error::cannot read the ${kind} name from the wrangler config`);
            process.exit(1);
          }
          const valid = kind === 'domain' ? /^[a-z0-9][a-z0-9.-]{1,252}[a-z0-9]$/ : /^[a-z0-9][a-z0-9-]{0,62}$/;
          if (!valid.test(name ?? '')) {
            console.error(`::error::no valid ${kind} in the wrangler config`);
            process.exit(1);
          }
          process.stdout.write(name);
          JS
          api="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc "$TARGET_ENV" worker)"
          db="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc "$TARGET_ENV" db)"
          bucket="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc "$TARGET_ENV" bucket)"
          # Masked so later steps (provision output, summaries) never print them either.
          for n in "$api" "$db" "$bucket"; do echo "::add-mask::$n"; done
          { echo "API_WORKER=$api"; echo "DB_NAME=$db"; echo "BUCKET_NAME=$bucket"; } >> "$GITHUB_ENV"
          if [[ "$TARGET_ENV" == production ]]; then
            # production has workers.dev off: health and the App Store check use the custom domain.
            domain="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc production domain)"
            echo "::add-mask::$domain"
            echo "API_DOMAIN=$domain" >> "$GITHUB_ENV"
          fi
          echo 'resource names resolved (not printed)'

      - name: Bundle (wrangler dry-run, no credentials)
        shell: bash
        working-directory: source/workers/api
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if ! pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --env "$TARGET_ENV" > "$log" 2>&1; then
            echo 'dry-run failed; error codes only (private source lines are never printed):'
            { grep -oE 'TS[0-9]{4,5}|\[ERROR\]|ERR_[A-Z_]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          echo "dry-run bundle OK ($(du -sk "$RUNNER_TEMP/bundle" | cut -f1) KiB)"
          echo "- dry-run bundle (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"
          node scripts/provision.mjs --env "$TARGET_ENV" --plan | tee -a "$GITHUB_STEP_SUMMARY"

      - &api_mask_subdomain_step
        name: Mask the account id and workers.dev subdomain
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          sub="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ -n "$sub" ]] || { echo '::error::No workers.dev subdomain on the account'; exit 1; }
          echo "::add-mask::$sub"
          echo 'subdomain masked'

      - name: Custom domain owner (production, read-only)
        if: inputs.target == 'production' && inputs.mode != 'dry-run'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains?hostname=$API_DOMAIN" || echo 000)"
          if [[ "$code" != 200 ]]; then
            echo "::warning::cannot list Workers custom domains (HTTP $code); owner of the API domain unknown"
            exit 0
          fi
          owner="$(node -e '
            const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const hits = (j.result ?? []).filter((d) => d.hostname === process.env.API_DOMAIN);
            if (hits.length === 0) console.log("none");
            else if (hits.every((d) => d.service === process.env.API_WORKER)) console.log("this");
            else console.log("other");
          ' "$body")"
          case "$owner" in
            none) msg='API custom domain: not attached yet (the first deploy attaches it)' ;;
            this) msg='API custom domain: attached to this API Worker' ;;
            *) msg='API custom domain: attached to ANOTHER Worker' ;;
          esac
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$owner" == other && ( "$MODE" == deploy || "$MODE" == all ) ]]; then
            echo '::error::the API custom domain belongs to another Worker; detach it in the Cloudflare dashboard first'
            exit 1
          fi

      - name: Look up (staging - create) the resources
        if: inputs.mode == 'd1-check' || (inputs.target == 'production' && inputs.mode != 'dry-run' && inputs.mode != 'provision')
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # production: find-only (provision.mjs creates nothing without --create).
          node scripts/provision.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      - &api_d1_helper_step
        name: Write the D1 helper (no credentials in this step)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/d1.mjs" <<'JS'
          // Usage: node d1.mjs check | migrate   (cwd: source/workers/api, wrangler.generated.json present)
          // Prints table names, migration file names, counts and error codes only. The raw wrangler
          // output is never printed (it contains ids).
          import { execFileSync } from 'node:child_process';
          import { readdirSync, readFileSync } from 'node:fs';

          const phase = process.argv[2];
          const env = process.env.TARGET_ENV;
          // The one-off repairs below are for the old staging D1 only. production is a new D1:
          // a repair condition there means something is wrong, so it stops instead.
          const repairAllowed = env === 'staging';
          const DB = process.env.DB_NAME; // from the ref's wrangler config (step above)
          if (!/^[a-z0-9][a-z0-9-]{0,62}$/.test(DB ?? '')) {
            console.error('::error::DB_NAME is not set');
            process.exit(1);
          }
          const MIGRATIONS = '../../packages/db/migrations';
          const CODES = /ERR_[A-Z_]+|SQLITE_[A-Z_]+|code: \d+|\[ERROR\]/g;

          function wrangler(args) {
            try {
              return execFileSync('pnpm', ['exec', 'wrangler', ...args], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
                maxBuffer: 64 * 1024 * 1024,
              });
            } catch (error) {
              const text = `${error.stdout ?? ''}${error.stderr ?? ''}`;
              const codes = [...new Set(text.match(CODES) ?? [])];
              console.error(`::error::wrangler ${args.slice(0, 2).join(' ')} failed; codes only: ${codes.join(' ') || 'none found'}`);
              process.exit(1);
            }
          }

          function sql(command) {
            const out = wrangler(['d1', 'execute', DB, '--remote', '--env', env, '--config', 'wrangler.generated.json', '--json', '--command', command]);
            try {
              return JSON.parse(out.slice(out.indexOf('[')))[0]?.results ?? [];
            } catch {
              console.error('::error::unparseable wrangler output');
              process.exit(1);
            }
          }

          const tableNames = () =>
            sql("SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name").map((r) => r.name);

          function check() {
            const tables = tableNames();
            console.log(`tables (${tables.length}): ${tables.join(', ')}`);
            if (tables.includes('d1_migrations')) {
              const names = sql('SELECT name FROM d1_migrations ORDER BY id').map((r) => r.name);
              console.log(`d1_migrations: present, recorded: ${names.join(', ') || 'none'}`);
            } else console.log('d1_migrations: absent');
            if (tables.includes('entitlements')) {
              const n = Number(sql('SELECT count(*) AS n FROM entitlements')[0]?.n);
              console.log(`entitlements rows: ${n}`);
              if (n !== 0) {
                console.error('::error::entitlements is not empty (or unreadable); stopping before any change');
                process.exit(1);
              }
            } else console.log('entitlements: table absent');
            return tables;
          }

          const tables = check();
          if (phase === 'check') process.exit(0);

          const files = readdirSync(MIGRATIONS).filter((f) => f.endsWith('.sql')).sort();
          if (!files.every((f) => /^[0-9A-Za-z_.-]+\.sql$/.test(f))) {
            console.error('::error::unexpected migration file name');
            process.exit(1);
          }
          const recorded = new Set(tables.includes('d1_migrations') ? sql('SELECT name FROM d1_migrations').map((r) => r.name) : []);
          // One-off staging repair: an earlier run recorded 0005_accounts.sql without running it.
          // Its own tables are missing, so unrecord it and let apply run it; its guard aborts the
          // whole file if the old users / devices / favorites tables hold a row.
          if (recorded.has('0005_accounts.sql') && !tables.includes('auth_accounts')) {
            if (!repairAllowed) {
              console.error(`::error::0005_accounts.sql is recorded but auth_accounts is missing (${env}); not repairing outside staging`);
              process.exit(1);
            }
            console.log('0005_accounts.sql recorded but not applied (auth_accounts missing): unrecording it');
            sql("DELETE FROM d1_migrations WHERE name = '0005_accounts.sql'");
            recorded.delete('0005_accounts.sql');
          }
          // Staging: a migration that is not recorded but ALL of whose tables already exist was
          // applied by hand: record it instead of running it again ("table already exists").
          const baseline = files.filter((f) => !recorded.has(f)).filter((f) => {
            const created = [...readFileSync(`${MIGRATIONS}/${f}`, 'utf8').matchAll(/CREATE TABLE `([^`]+)`/g)].map((m) => m[1]);
            return created.length > 0 && created.every((t) => tables.includes(t));
          });
          if (baseline.length > 0) {
            if (!repairAllowed) {
              console.error(`::error::tables of unrecorded migrations already exist (${baseline.join(', ')}, ${env}); not recording them outside staging`);
              process.exit(1);
            }
            console.log(`already present, recorded without running: ${baseline.join(', ')}`);
            sql('CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)');
            for (const f of baseline) sql(`INSERT OR IGNORE INTO d1_migrations (name) VALUES ('${f}')`);
          }

          wrangler(['d1', 'migrations', 'apply', DB, '--remote', '--env', env, '--config', 'wrangler.generated.json']);

          const after = sql('SELECT name FROM d1_migrations ORDER BY id').map((r) => r.name);
          const missing = files.filter((f) => !after.includes(f));
          console.log(`migrations recorded after apply: ${after.join(', ')}`);
          const tables2 = tableNames();
          console.log(`tables after apply (${tables2.length}): ${tables2.join(', ')}`);
          const wanted = ['store_transactions', 'store_devices', 'recognize_uses', ...(files.includes('0005_accounts.sql') ? ['auth_accounts', 'auth_sessions'] : [])];
          const bad = [...missing.map((f) => `not recorded: ${f}`), ...wanted.filter((t) => !tables2.includes(t)).map((t) => `missing table: ${t}`), ...(tables2.includes('entitlements') ? ['entitlements still exists'] : [])];
          if (bad.length > 0) {
            console.error(`::error::migration state is not what was expected: ${bad.join('; ')}`);
            process.exit(1);
          }
          console.log('migration state OK');
          JS

      - name: D1 read-only check
        if: inputs.mode == 'd1-check' || (inputs.target == 'production' && (inputs.mode == 'deploy' || inputs.mode == 'all'))
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/d1.mjs" check | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$TARGET_ENV" == production && "$MODE" != d1-check ]]; then
            echo '- Next: waiting for `radio-production` approval before the deploy job.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ========================================================================
  # 2. Writes. Same steps for both targets (YAML anchor); only production waits for approval.
  # ========================================================================
  api_deploy_staging:
    name: API · Write (${{ inputs.mode }}, staging)
    needs: api_validate
    if: inputs.service == 'api' && inputs.target == 'staging' && (inputs.mode == 'deploy' || inputs.mode == 'snapshot' || inputs.mode == 'all' || inputs.mode == 'rollback' || inputs.mode == 'secrets')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ needs.api_validate.outputs.source_commit }}
    steps: &api_write_steps
      - name: Checkout the validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Confirm the commit
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo '::error::checked-out commit is not the validated one'; exit 1; }
          echo "Private source commit: ${SOURCE_COMMIT:0:8} (validated)"

      - *api_node_step
      - *api_install_step
      - *api_names_step

      - name: Mask the account id and workers.dev subdomain
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          sub="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ -n "$sub" ]] || { echo '::error::No workers.dev subdomain on the account'; exit 1; }
          echo "::add-mask::$sub"
          echo "WORKERS_SUBDOMAIN=$sub" >> "$GITHUB_ENV"
          echo 'subdomain masked'

      - name: Create the listed production resources (provision)
        if: inputs.mode == 'provision'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENV" == production ]] || { echo '::error::provision is for production only'; exit 64; }
          # Every listed name must be exactly one of env.production's D1 / R2 names.
          for n in ${CREATE//,/ }; do
            [[ "$n" == "$DB_NAME" || "$n" == "$BUCKET_NAME" ]] || { echo '::error::create lists a name that is not a resource of env.production'; exit 64; }
          done
          node scripts/provision.mjs --env production --create "$CREATE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Look up (staging - create) the resources
        if: inputs.mode == 'deploy' || inputs.mode == 'all' || inputs.mode == 'rollback' || inputs.mode == 'secrets'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/provision.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign in with Apple Worker secrets (mode secrets; values never printed)
        if: inputs.mode == 'secrets'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SIWA_TEAM: ${{ secrets.ASC_TEAM_ID }}
          KEY_TEAM: ${{ secrets.APNS_TEAM_ID }}
          SIWA_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          SIWA_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SIWA_TEAM" && -n "$SIWA_KEY_ID" && -n "$SIWA_PRIVATE_KEY" ]] || { echo '::error::a Sign in with Apple source secret is empty'; exit 1; }
          [[ "$KEY_TEAM" == "$SIWA_TEAM" ]] || { echo '::error::the APNS key belongs to another team than the app; not used'; exit 1; }
          cfg=(--config wrangler.generated.json --env "$TARGET_ENV")
          # Names only (never values). A failed listing stops here: guessing "none" would rotate the auth secret.
          if ! names="$(pnpm exec wrangler secret list "${cfg[@]}" --format json 2>/dev/null)"; then
            names="$(pnpm exec wrangler secret list "${cfg[@]}" 2>/dev/null)" || { echo '::error::cannot list the Worker secrets'; exit 1; }
          fi
          put() {
            local log="$RUNNER_TEMP/secret-put.log"
            if ! printf '%s' "$2" | ./node_modules/.bin/wrangler versions secret put "$1" "${cfg[@]}" > "$log" 2>&1; then
              # Plain words only: every token holding a digit or - . / @ : _ (names, hosts, ids) becomes #.
              { grep -oE 'code: [0-9]+' "$log" || true; } | sort -u | head -5
              grep -vE '^\s*$' "$log" | sed -E 's/[^ ]*[-./@:0-9_][^ ]*/#/g' | cut -c1-120 | head -12
              rm -f "$log"; echo "::error::secret put $1 failed"; exit 1
            fi
            rm -f "$log"
            echo "- $1: set" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if grep -qw 'BETTER_AUTH_SECRET' <<< "$names"; then
            echo '- BETTER_AUTH_SECRET: kept (already set)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            put BETTER_AUTH_SECRET "$(openssl rand -base64 32)"
          fi
          put APPLE_TEAM_ID "$SIWA_TEAM"
          put APPLE_SIWA_KEY_ID "$SIWA_KEY_ID"
          put APPLE_SIWA_PRIVATE_KEY "$SIWA_PRIVATE_KEY"

      - *api_d1_helper_step

      - name: D1 check (stops if entitlements is not empty)
        if: inputs.mode == 'provision' || inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/d1.mjs" check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: D1 migrations (UTC time recorded first, for Time Travel)
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "- D1 state before migrations (UTC, for Time Travel restore): \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" | tee -a "$GITHUB_STEP_SUMMARY"
          node "$RUNNER_TEMP/d1.mjs" migrate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy API Worker
        id: deploy
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g; s#https?://[^ ]+#<url>#g'; }
          if ! pnpm exec wrangler deploy --config wrangler.generated.json --env "$TARGET_ENV" > "$log" 2>&1; then
            echo 'deploy failed; error codes only:'
            { grep -oE 'TS[0-9]{4,5}|\[ERROR\]|ERR_[A-Z_]+|code: [0-9]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            echo 'Cloudflare API messages:'
            { grep -E '\[code: [0-9]+\]' "$log" || true; } | redact | cut -c1-240 | sort -u | head -5
            exit 1
          fi
          { grep -E 'Uploaded|Deployed|Current Version' "$log" || true; } | redact
          echo "- deploy API Worker (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        id: health
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The first production rollout has no snapshot yet: /health itself does not need one.
          if [[ "$FIRST_ROLLOUT" == true ]]; then
            node scripts/health.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/health.mjs --env "$TARGET_ENV" --snapshot | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: App Store endpoints answer 400 to an empty body
        id: appstore
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" == production ]]; then base="https://${API_DOMAIN}"; else base="https://${API_WORKER}.${WORKERS_SUBDOMAIN}.workers.dev"; fi
          failed=0
          for path in /entitlements/verify /appstore/notifications; do
            code=000
            for i in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' --data '{}' "${base}${path}" || echo 000)"
              [[ "$code" == 400 ]] && break
              sleep 10
            done
            echo "POST ${path} with an empty body -> ${code}" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$code" == 400 ]] || { echo "::error::expected 400 from ${path}"; failed=1; }
          done
          exit "$failed"

      - name: Roll back the API Worker when a post-deploy check fails
        if: failure() && steps.deploy.outcome == 'success' && (steps.health.outcome == 'failure' || steps.appstore.outcome == 'failure') && env.FIRST_ROLLOUT != 'true'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: &api_rollback_script |
          set -uo pipefail
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g; s#https?://[^ ]+#<url>#g'; }
          log="$(mktemp)"
          pnpm exec wrangler rollback --config wrangler.generated.json --env "$TARGET_ENV" \
            --message "Rollback from public CI (radio-cloudflare.yml api, ${MODE})" > "$log" 2>&1
          status=$?
          { grep -E 'rolled back|Rolled back|Worker Version|SUCCESS|\[ERROR\]|code: [0-9]+' "$log" || true; } | redact | cut -c1-200 | head -10
          if [[ "$status" -ne 0 ]]; then
            echo '::error::Worker rollback failed; roll back from the Cloudflare Deployments page.'
            exit "$status"
          fi
          echo "- API Worker rolled back to its previous version (D1 NOT rolled back)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '::warning::API Worker code was rolled back; D1 migrations were not. Restore D1 with Time Travel to the UTC time in the summary if needed.'

      - name: Roll back the API Worker (mode rollback)
        if: inputs.mode == 'rollback'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: *api_rollback_script

      - name: Fetch Natural Earth land polygons (public domain; pinned commit, checksum checked)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        env:
          NE_URL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_50m_admin_0_map_units.geojson
          NE_SHA256: b8d421aca6e9e08e8cdf09cc26af111cc3e0deba4fe915611d58ade71e8a4db0
        run: |
          set -euo pipefail
          # The same file the size budget of the points index was measured with. A different file
          # moves country-level points, so the checksum must match or nothing is imported.
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/ne-land.geojson" "$NE_URL"
          echo "$NE_SHA256  $RUNNER_TEMP/ne-land.geojson" | sha256sum -c - > /dev/null \
            || { echo '::error::Natural Earth file does not match the pinned checksum'; exit 1; }

      - name: Import catalog from Radio Browser (no credentials; counts only)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        run: |
          set -euo pipefail
          # Output goes to the step summary: totals, hidden counts, shard count. No station data.
          node scripts/import-catalog.mjs --land "$RUNNER_TEMP/ne-land.geojson" --out "$RUNNER_TEMP/snapshot-out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot to R2 (shards first, manifest last)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          node scripts/upload-snapshot.mjs --dir "$RUNNER_TEMP/snapshot-out" --bucket "$BUCKET_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read the snapshot back through the Worker
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/health.mjs --env "$TARGET_ENV" --snapshot | tee -a "$GITHUB_STEP_SUMMARY"

  api_deploy_production:
    name: API · Write (${{ inputs.mode }}, production, approved)
    needs: api_validate
    if: inputs.service == 'api' && inputs.target == 'production' && (inputs.mode == 'provision' || inputs.mode == 'deploy' || inputs.mode == 'snapshot' || inputs.mode == 'all' || inputs.mode == 'rollback' || inputs.mode == 'secrets')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Literal name: the job does not start until a required reviewer approves (validate checked
    # the rule exists). Never the unprotected `production` environment.
    environment: radio-production
    env:
      SOURCE_COMMIT: ${{ needs.api_validate.outputs.source_commit }}
    steps: *api_write_steps

  # ================= service web =================
  # ========================================================================
  # 1. Validate (no approval, no writes)
  # ========================================================================
  web_validate:
    name: Web · Validate (${{ inputs.mode }}, ${{ inputs.target }})
    if: inputs.service == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }
          case "$MODE" in dry-run|deploy|rollback) ;; *) echo "::error::Unsupported mode for web: $MODE"; exit 64 ;; esac
          [[ -z "$CREATE" ]] || { echo '::error::create is only for service api, mode provision'; exit 64; }
          case "$TARGET_ENV" in staging|production) ;; *) echo "::error::Unsupported target: $TARGET_ENV"; exit 64 ;; esac
          if [[ "$FIRST_ROLLOUT" == true ]]; then
            [[ "$TARGET_ENV" == production && "$MODE" == deploy ]] || { echo '::error::first_rollout is only for a production deploy'; exit 64; }
          fi
          echo "request OK: mode=$MODE target=$TARGET_ENV first_rollout=$FIRST_ROLLOUT"

      - name: Production gate exists (radio-production has required reviewers)
        if: inputs.target == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A job that names a missing environment silently creates an unprotected one, so the
          # production run stops here unless the gate is really there.
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/radio-production" || echo 000)"
          [[ "$code" == 200 ]] || { echo "::error::cannot read environment radio-production (HTTP $code); production is refused"; exit 1; }
          node -e '
            const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const rules = (e.protection_rules ?? []).filter((r) => r.type === "required_reviewers");
            const reviewers = rules.flatMap((r) => r.reviewers ?? []);
            if (reviewers.length === 0) { console.error("::error::radio-production has no required reviewers; production is refused"); process.exit(1); }
            console.log(`radio-production: ${reviewers.length} required reviewer(s)`);
          ' "$body"
          echo '- production gate: `radio-production` has required reviewers' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Pin the source commit
        id: source
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::cannot resolve the source commit'; exit 1; }
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Private source commit: ${sha:0:8} (the deploy job builds exactly this commit)"

      - &web_node_step
        name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - &web_install_step
        name: Install dependencies (no credentials in this step)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ -f apps/web/wrangler.jsonc && -f apps/web/package.json ]] || { echo '::error::apps/web is missing at this ref'; exit 66; }
          # Shown in the site's diagnostics log header.
          echo "NEXT_PUBLIC_MERIDIAN_SOURCE_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_HOURWAVE_SOURCE_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          corepack enable
          log="$RUNNER_TEMP/install.log"
          if ! pnpm install --frozen-lockfile --reporter=silent > "$log" 2>&1; then
            echo 'pnpm install failed; error codes only:'
            { grep -oE 'ERR_PNPM_[A-Z_]+|ERR_[A-Z_]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          echo 'pnpm install: PASS'

      - &web_names_step
        name: Resolve Worker names and custom domains from the wrangler configs (not printed)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/names.mjs" <<'JS'
          // Usage: node names.mjs <wrangler.jsonc> <env|-> <worker|db|bucket|domain>
          // Prints one resource name (or the env's single custom domain) read from the wrangler
          // config of the checked-out ref. Errors never echo config content.
          import { readFileSync } from 'node:fs';

          function jsonc(text) {
            let out = '';
            let inString = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (inString) {
                out += c;
                if (c === '\\') out += text[++i];
                else if (c === '"') inString = false;
              } else if (c === '"') {
                inString = true;
                out += c;
              } else if (c === '/' && text[i + 1] === '/') {
                while (i < text.length && text[i] !== '\n') i++;
                out += '\n';
              } else if (c === '/' && text[i + 1] === '*') {
                i += 2;
                while (i < text.length && !(text[i] === '*' && text[i + 1] === '/')) i++;
                i++;
              } else out += c;
            }
            return JSON.parse(out.replace(/,(\s*[}\]])/g, '$1'));
          }

          const [file, env, kind] = process.argv.slice(2);
          let name;
          try {
            const top = jsonc(readFileSync(file, 'utf8'));
            const sect = env === '-' ? top : (top.env ?? {})[env] ?? {};
            if (kind === 'worker') name = sect.name ?? (env === '-' ? top.name : `${top.name}-${env}`);
            else if (kind === 'db') name = (sect.d1_databases ?? [])[0]?.database_name;
            else if (kind === 'bucket') name = (sect.r2_buckets ?? [])[0]?.bucket_name;
            else if (kind === 'domain') {
              const domains = (sect.routes ?? []).filter((r) => r.custom_domain === true);
              name = domains.length === 1 ? domains[0].pattern : undefined;
            }
          } catch {
            console.error(`::error::cannot read the ${kind} name from the wrangler config`);
            process.exit(1);
          }
          const valid = kind === 'domain' ? /^[a-z0-9][a-z0-9.-]{1,252}[a-z0-9]$/ : /^[a-z0-9][a-z0-9-]{0,62}$/;
          if (!valid.test(name ?? '')) {
            console.error(`::error::no valid ${kind} in the wrangler config`);
            process.exit(1);
          }
          process.stdout.write(name);
          JS
          web="$(node "$RUNNER_TEMP/names.mjs" apps/web/wrangler.jsonc "$TARGET_ENV" worker)"
          api="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc "$TARGET_ENV" worker)"
          for n in "$web" "$api"; do echo "::add-mask::$n"; done
          { echo "WEB_WORKER=$web"; echo "API_WORKER=$api"; } >> "$GITHUB_ENV"
          if [[ "$TARGET_ENV" == production ]]; then
            staging_web="$(node "$RUNNER_TEMP/names.mjs" apps/web/wrangler.jsonc staging worker)"
            web_domain="$(node "$RUNNER_TEMP/names.mjs" apps/web/wrangler.jsonc production domain)"
            api_domain="$(node "$RUNNER_TEMP/names.mjs" workers/api/wrangler.jsonc production domain)"
            for n in "$staging_web" "$web_domain" "$api_domain"; do echo "::add-mask::$n"; done
            { echo "STAGING_WEB_WORKER=$staging_web"; echo "WEB_DOMAIN=$web_domain"; echo "API_DOMAIN=$api_domain"; } >> "$GITHUB_ENV"
          fi
          echo 'Worker names resolved (not printed)'

      - &web_mask_subdomain_step
        name: Mask the account id and workers.dev subdomain
        if: inputs.mode != 'dry-run' || inputs.target == 'production'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          sub="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ -n "$sub" ]] || { echo '::error::No workers.dev subdomain on the account'; exit 1; }
          echo "::add-mask::$sub"
          echo "WORKERS_SUBDOMAIN=$sub" >> "$GITHUB_ENV"
          echo 'subdomain masked'

      - &web_api_base_step
        name: Resolve and mask the API base URL (NEXT_PUBLIC_*_API) and the site URL
        if: inputs.mode != 'dry-run' || inputs.target == 'production'
        shell: bash
        env:
          STAGING_API: ${{ secrets.RADIO_STAGING_API }}
          PRODUCTION_API: ${{ secrets.RADIO_PRODUCTION_API }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" == production ]]; then
            API_BASE="${PRODUCTION_API%/}"
            # The secret cannot be read, so check it against the ref's config (neither is printed).
            [[ "$API_BASE" == "https://${API_DOMAIN}" ]] || { echo '::error::RADIO_PRODUCTION_API is not https://<custom domain of env.production in workers/api/wrangler.jsonc>'; exit 1; }
            echo "HOURWAVE_TARGET=production" >> "$GITHUB_ENV"
            WEB_URL="https://${WEB_DOMAIN}"
          else
            # RADIO_STAGING_API wins when set; otherwise the staging API Worker deployed by this workflow (service api).
            API_BASE="${STAGING_API%/}"
            [[ -n "$API_BASE" ]] || API_BASE="https://${API_WORKER}.${WORKERS_SUBDOMAIN}.workers.dev"
            WEB_URL="https://${WEB_WORKER}.${WORKERS_SUBDOMAIN}.workers.dev"
          fi
          echo "::add-mask::$API_BASE"
          {
            echo "NEXT_PUBLIC_MERIDIAN_API=$API_BASE"
            echo "NEXT_PUBLIC_HOURWAVE_API=$API_BASE"
            echo "API_BASE=$API_BASE"
            echo "WEB_URL=$WEB_URL"
          } >> "$GITHUB_ENV"
          echo 'API base and site URL resolved (masked)'

      - &web_build_step
        name: Build static export
        if: inputs.mode != 'rollback'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"
          # Builds apps/web and its workspace dependencies. Next inlines NEXT_PUBLIC_*_API; with
          # HOURWAVE_TARGET=production the build itself refuses a missing/staging/local API address.
          if ! pnpm turbo run build --filter=./apps/web... --output-logs=errors-only > "$log" 2>&1; then
            echo 'build failed; error codes only (private source lines are never printed):'
            { grep -oE 'TS[0-9]{4,5}|ERR_[A-Z_]+|Type error|Module not found|Failed to compile|Error occurred prerendering|production build needs|must be https|must be the production API' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          [[ -f apps/web/dist/index.html ]] || { echo '::error::apps/web/dist/index.html was not produced'; exit 1; }
          echo "turbo build: PASS ($(find apps/web/dist -type f | wc -l) files, $(du -sk apps/web/dist | cut -f1) KiB)"
          echo "- static export (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle (wrangler dry-run, no credentials)
        if: inputs.mode != 'rollback'
        shell: bash
        working-directory: source/apps/web
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dry-run.log"
          if ! pnpm exec wrangler deploy --dry-run --env "$TARGET_ENV" --outdir "$RUNNER_TEMP/bundle" > "$log" 2>&1; then
            echo 'dry-run failed; error codes only:'
            { grep -oE '\[ERROR\]|ERR_[A-Z_]+|code: [0-9]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          echo 'wrangler dry-run: PASS'
          echo "- wrangler dry-run (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Custom domain owners (production, read-only)
        if: inputs.target == 'production'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          owner() { # <hostname> <expected service> <staging service or ->
            local body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains?hostname=$1" || echo 000)"
            [[ "$code" == 200 ]] || { echo "unknown(HTTP $code)"; return; }
            node -e '
              const [file, host, mine, staging] = process.argv.slice(1);
              const hits = (JSON.parse(require("fs").readFileSync(file, "utf8")).result ?? []).filter((d) => d.hostname === host);
              if (hits.length === 0) console.log("none");
              else if (hits.length > 1) console.log("several");
              else if (hits[0].service === mine) console.log("production");
              else if (hits[0].service === staging) console.log("staging");
              else console.log("other");
            ' "$body" "$1" "$2" "$3"
          }
          web="$(owner "$WEB_DOMAIN" "$WEB_WORKER" "$STAGING_WEB_WORKER")"
          api="$(owner "$API_DOMAIN" "$API_WORKER" -)"
          echo "site custom domain attached to: $web" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "API custom domain attached to: $api" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" == deploy ]]; then
            case "$web" in production|staging|none) ;; *) echo '::error::the site domain is attached to something other than the staging or production web Worker (or unreadable); not deploying'; exit 1 ;; esac
            [[ "$api" == production ]] || echo '::warning::the production API custom domain is not on the production API Worker yet; the site will load but list no stations'
            echo '- Next: waiting for `radio-production` approval before the deploy job.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ========================================================================
  # 2. Writes. Same steps for both targets (YAML anchor); only production waits for approval.
  # ========================================================================
  web_deploy_staging:
    name: Web · Deploy (${{ inputs.mode }}, staging)
    needs: web_validate
    if: inputs.service == 'web' && inputs.target == 'staging' && (inputs.mode == 'deploy' || inputs.mode == 'rollback')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ needs.web_validate.outputs.source_commit }}
    steps: &web_write_steps
      - name: Checkout the validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Confirm the commit
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo '::error::checked-out commit is not the validated one'; exit 1; }
          echo "Private source commit: ${SOURCE_COMMIT:0:8} (validated)"

      - *web_node_step
      - *web_install_step
      - *web_names_step
      - *web_mask_subdomain_step
      - *web_api_base_step
      - *web_build_step

      - name: Detach the site domain from the staging web Worker (production)
        id: detach
        if: inputs.target == 'production' && inputs.mode == 'deploy'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains?hostname=$WEB_DOMAIN" || echo 000)"
          [[ "$code" == 200 ]] || { echo "::error::cannot list Workers custom domains (HTTP $code); nothing changed"; exit 1; }
          read -r state id zone < <(node -e '
            const [file, host, mine, staging] = process.argv.slice(1);
            const hits = (JSON.parse(require("fs").readFileSync(file, "utf8")).result ?? []).filter((d) => d.hostname === host);
            if (hits.length === 0) console.log("none - -");
            else if (hits.length > 1) console.log("several - -");
            else if (hits[0].service === mine) console.log("production - -");
            else if (hits[0].service === staging) {
              const okId = /^[A-Za-z0-9_-]{8,64}$/.test(String(hits[0].id ?? ""));
              const okZone = /^[A-Za-z0-9_-]{8,64}$/.test(String(hits[0].zone_id ?? ""));
              if (okId && okZone) console.log(`staging ${hits[0].id} ${hits[0].zone_id}`);
              else console.log(`badid id=${okId ? "ok" : "bad"} zone=${okZone ? "ok" : "bad"}`);
            }
            else console.log("other - -");
          ' "$body" "$WEB_DOMAIN" "$WEB_WORKER" "$STAGING_WEB_WORKER")
          echo "site custom domain attached to: $state"
          case "$state" in
            none|production) echo "detached=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            staging) ;;
            badid*) echo "::error::the staging binding has an unexpected id format ($id $zone); nothing changed"; exit 1 ;;
            *) echo '::error::the site domain is attached to something other than the staging or production web Worker; nothing changed'; exit 1 ;;
          esac
          echo "::add-mask::$id"; echo "::add-mask::$zone"
          echo "WEB_DOMAIN_ZONE=$zone" >> "$GITHUB_ENV"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains/$id" || echo 000)"
          [[ "$code" == 200 || "$code" == 204 ]] || { echo "::error::detach failed (HTTP $code); nothing changed"; exit 1; }
          echo "detached=true" >> "$GITHUB_OUTPUT"
          echo "- site domain detached from the staging web Worker at $(date -u +%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy the web Worker
        id: deploy
        if: inputs.mode == 'deploy'
        shell: bash
        working-directory: source/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/deploy.log"
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g; s#https?://[^ ]+#<url>#g'; }
          if ! pnpm exec wrangler deploy --env "$TARGET_ENV" > "$log" 2>&1; then
            echo 'deploy failed; error codes only:'
            { grep -oE '\[ERROR\]|ERR_[A-Z_]+|code: [0-9]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            echo 'Cloudflare API messages:'
            { grep -E '\[code: [0-9]+\]' "$log" || true; } | redact | cut -c1-240 | sort -u | head -5
            exit 1
          fi
          { grep -E 'Uploaded|Deployed|Current Version|assets' "$log" || true; } | redact
          echo "- deploy web Worker (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the site and the API
        id: check
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          code() { local c rc=0; c="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1")" || rc=$?; if (( rc == 0 )); then echo "$c"; else echo "000 (curl exit $rc)"; fi; }
          # A newly attached custom domain can take a few minutes (DNS, certificate).
          tries=6; [[ "$TARGET_ENV" == production ]] && tries=24
          # First rollout: the domain just moved Workers; its certificate took about 5 minutes once, so wait up to 15 for the first path.
          first_tries=$tries; [[ "$FIRST_ROLLOUT" == true ]] && first_tries=90
          fail=0
          for path in / /en/ /zh/ /takedown/ /en/legal/privacy/; do
            c=000
            n=$tries; [[ "$path" == / ]] && n=$first_tries
            for i in $(seq "$n"); do c="$(code "${WEB_URL}${path}")"; [[ "$c" == 200 ]] && break; sleep 10; done
            echo "site ${path}: HTTP $c"
            echo "- site \`${path}\`: HTTP $c" >> "$GITHUB_STEP_SUMMARY"
            [[ "$c" == 200 ]] || fail=1
          done
          c="$(code "${API_BASE}/health")"
          echo "api /health: HTTP $c"
          echo "- api \`/health\`: HTTP $c" >> "$GITHUB_STEP_SUMMARY"
          # The catalog manifest, fetched the way the page does (cross-origin from the site).
          hdr="$(mktemp)"
          m="$(curl -s -o /dev/null -D "$hdr" -w '%{http_code}' --max-time 20 -H "Origin: ${WEB_URL}" "${API_BASE}/snapshot/manifest.json" || echo 000)"
          if grep -qi '^access-control-allow-origin:' "$hdr"; then cors=yes; else cors=no; fi
          rm -f "$hdr"
          echo "api /snapshot/manifest.json: HTTP $m, CORS for the site: $cors"
          echo "- api \`/snapshot/manifest.json\`: HTTP $m, CORS: $cors" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$c" != 200 || "$m" != 200 || "$cors" != yes ]]; then
            if [[ "$TARGET_ENV" == production ]]; then
              echo '::error::the production site cannot read the catalog (API /health, manifest or CORS)'; fail=1
            else
              echo "::warning::The catalog is not readable from the site (run service api deploy/snapshot, or check CORS_ORIGINS)."
            fi
          fi
          (( fail == 0 )) || { echo '::error::The site check failed.'; exit 1; }

      - name: Put the site domain back on the staging web Worker
        if: failure() && steps.detach.outputs.detached == 'true' && (steps.deploy.outcome == 'failure' || (steps.check.outcome == 'failure' && env.FIRST_ROLLOUT == 'true'))
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains"
          body="$(mktemp)"
          curl -sS -o "$body" -H "Authorization: Bearer $CF_TOKEN" "$api?hostname=$WEB_DOMAIN"
          # Remove a binding the failed deploy may have made, then attach the staging web Worker.
          for id in $(node -e '
            const [file, host, staging] = process.argv.slice(1);
            for (const d of JSON.parse(require("fs").readFileSync(file, "utf8")).result ?? [])
              if (d.hostname === host && d.service !== staging && /^[A-Za-z0-9_-]{8,64}$/.test(String(d.id ?? ""))) console.log(d.id);
          ' "$body" "$WEB_DOMAIN" "$STAGING_WEB_WORKER"); do
            echo "::add-mask::$id"
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$api/$id"
          done
          payload="$(node -e 'console.log(JSON.stringify({ hostname: process.argv[1], service: process.argv[2], zone_id: process.argv[3], environment: "production" }))' "$WEB_DOMAIN" "$STAGING_WEB_WORKER" "$WEB_DOMAIN_ZONE")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' --data "$payload" "$api" || echo 000)"
          if [[ "$code" == 200 ]]; then
            echo '- site domain attached back to the staging web Worker' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::could not attach the site domain back to the staging web Worker (HTTP $code); attach it in the Cloudflare dashboard"
            exit 1
          fi

      - name: Roll back the web Worker when the site check fails
        if: failure() && steps.deploy.outcome == 'success' && steps.check.outcome == 'failure' && env.FIRST_ROLLOUT != 'true' && inputs.mode == 'deploy'
        shell: bash
        working-directory: source/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: &web_rollback_script |
          set -uo pipefail
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g; s#https?://[^ ]+#<url>#g'; }
          log="$(mktemp)"
          pnpm exec wrangler rollback --env "$TARGET_ENV" \
            --message "Rollback from public CI (radio-cloudflare.yml web, ${MODE})" > "$log" 2>&1
          status=$?
          { grep -E 'rolled back|Rolled back|Worker Version|SUCCESS|\[ERROR\]|code: [0-9]+' "$log" || true; } | redact | cut -c1-200 | head -10
          if [[ "$status" -ne 0 ]]; then
            echo '::error::web Worker rollback failed; roll back from the Cloudflare Deployments page.'
            exit "$status"
          fi
          echo "- web Worker rolled back to its previous version" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roll back the web Worker (mode rollback)
        id: manual_rollback
        if: inputs.mode == 'rollback'
        shell: bash
        working-directory: source/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: *web_rollback_script

  web_deploy_production:
    name: Web · Deploy (${{ inputs.mode }}, production, approved)
    needs: web_validate
    if: inputs.service == 'web' && inputs.target == 'production' && (inputs.mode == 'deploy' || inputs.mode == 'rollback')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Literal name: the job does not start until a required reviewer approves (validate checked
    # the rule exists). Never the unprotected `production` environment.
    environment: radio-production
    env:
      SOURCE_COMMIT: ${{ needs.web_validate.outputs.source_commit }}
    steps: *web_write_steps

  # ================= service ingest =================
  ingest:
    name: Ingest · Worker (${{ inputs.mode }}, staging)
    if: inputs.service == 'ingest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_ENV: staging
    steps:
      - name: Validate request
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }
          case "$MODE" in dry-run|deploy|status) ;; *) echo "::error::Unsupported mode for ingest: $MODE"; exit 64 ;; esac
          [[ "$REQUESTED_TARGET" == staging ]] || { echo '::error::ingest is staging only'; exit 64; }
          [[ -z "$CREATE" && "$FIRST_ROLLOUT" != true ]] || { echo '::error::create and first_rollout are not for ingest'; exit 64; }

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and bundle (no credentials in this step)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ -f workers/catalog-ingest/wrangler.jsonc ]] || { echo '::error::workers/catalog-ingest is missing at this ref'; exit 66; }
          echo "Private source commit: $(git rev-parse --short=8 HEAD)"
          corepack enable
          pnpm install --frozen-lockfile --reporter=silent
          log="$(mktemp)"
          if ! pnpm turbo run build --filter=@hourwave/catalog-ingest... --output-logs=none > "$log" 2>&1; then
            echo 'build failed; error codes only (private source lines are never printed):'
            { grep -oE 'TS[0-9]{4,5}|\[ERROR\]|ERR_[A-Z_]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          echo "- bundle: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve names from the wrangler config (masked)
        shell: bash
        working-directory: source/workers/catalog-ingest
        run: |
          set -euo pipefail
          # The ingest config is plain JSON (no comments).
          read -r worker db bucket queue < <(node -e '
            const c = JSON.parse(require("fs").readFileSync("wrangler.jsonc", "utf8"));
            const e = (c.env || {})[process.argv[1]] || {};
            const w = e.name || `${c.name}-${process.argv[1]}`;
            const d = ((e.d1_databases || [])[0] || {}).database_name || "";
            const b = ((e.r2_buckets || [])[0] || {}).bucket_name || "";
            const q = (((e.queues || {}).producers || [])[0] || {}).queue || "";
            const ok = (s) => /^[a-z0-9][a-z0-9-]{0,62}$/.test(s);
            if (![w, d, b, q].every(ok)) { console.error("::error::no valid worker/db/bucket/queue name in the config"); process.exit(1); }
            console.log(w, d, b, q);' "$TARGET_ENV")
          # Masked so the provision output and summaries never print them either.
          for n in "$worker" "$db" "$bucket" "$queue"; do echo "::add-mask::$n"; done
          { echo "INGEST_WORKER=$worker"; echo "DB_NAME=$db"; } >> "$GITHUB_ENV"
          echo 'names resolved (not printed)'

      - name: Cron Trigger slots (Workers Free allows 5 per account)
        if: inputs.mode == 'deploy' || inputs.mode == 'status'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts"
          scripts="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api" | jq -r 'if .success then .result[].id else empty end')"
          [[ -n $scripts ]] || { echo '::error::could not list Worker scripts'; exit 1; }
          used=0; mine=0
          while read -r s; do
            [[ $s =~ ^[A-Za-z0-9_-]{1,63}$ ]] || continue
            n="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "$api/$s/schedules" | jq -r 'if .success then (.result.schedules // [] | length) else 0 end')"
            [[ $n =~ ^[0-9]+$ ]] || n=0
            if [[ $s == "$INGEST_WORKER" ]]; then mine=$n; else used=$((used + n)); fi
          done <<< "$scripts"
          echo "cron_triggers_other_workers=$used cron_triggers_this_worker=$mine" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $MODE == status ]] && exit 0
          (( used + 1 <= 5 )) || { echo '::error::no free Cron Trigger slot (5 per account on Workers Free); ask the owner'; exit 1; }

      - name: Provision (queue find-or-create, D1/R2 ids)
        if: inputs.mode == 'deploy'
        shell: bash
        working-directory: source/workers/catalog-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          # Prints names (masked) and created/exists only; writes wrangler.generated.json.
          node scripts/provision.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: D1 migrations (only 0004 may be pending)
        if: inputs.mode == 'deploy'
        shell: bash
        working-directory: source/workers/catalog-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g'; }
          if ! pnpm exec wrangler d1 migrations list "$DB_NAME" --remote \
               --config wrangler.generated.json --env "$TARGET_ENV" > "$log" 2>&1 < /dev/null; then
            grep -E 'ERROR|✘|[Ee]rror' "$log" | redact | head -20; exit 1
          fi
          pending="$(grep -oE '[0-9]{4}_[a-z0-9_]+\.sql' "$log" | sort -u || true)"
          if [[ -z "$pending" ]]; then echo "- D1 migrations: none pending" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # `migrations apply` applies EVERY pending file; 0005 (API-03 accounts) belongs to its own task.
          unexpected="$(echo "$pending" | grep -vx '0004_catalog_ingest.sql' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::unexpected pending migrations: $(echo $unexpected | tr '\n' ' ') - apply them from their own task"
            exit 1
          fi
          # 0004 aborts by itself unless stations / station_streams / stream_health are empty.
          if ! pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote \
               --config wrangler.generated.json --env "$TARGET_ENV" > "$log" 2>&1 < /dev/null; then
            grep -E 'ERROR|✘|[Ee]rror|CHECK' "$log" | redact | head -20; exit 1
          fi
          echo "- D1 migrations: applied $(echo $pending | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: inputs.mode == 'deploy'
        shell: bash
        working-directory: source/workers/catalog-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g'; }
          # Before the secrets: `secret put` needs the Worker. Without them the cron does nothing.
          if ! pnpm exec wrangler deploy --config wrangler.generated.json --env "$TARGET_ENV" > "$log" 2>&1 < /dev/null; then
            grep -E 'ERROR|✘|[Ee]rror' "$log" | redact | head -30; exit 1
          fi
          echo "- deploy: OK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Secrets (stdin only)
        if: inputs.mode == 'deploy'
        shell: bash
        working-directory: source/workers/catalog-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BATCH_HOST: ${{ secrets.HOURWAVE_BATCH_HOST }}
          BATCH_ID: ${{ secrets.HOURWAVE_BATCH_ACCESS_CLIENT_ID }}
          BATCH_SECRET: ${{ secrets.HOURWAVE_BATCH_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for v in BATCH_HOST BATCH_ID BATCH_SECRET; do
            [[ -n "${!v}" ]] || { echo "::error::missing secret for $v"; exit 1; }
          done
          host="${BATCH_HOST#https://}"; host="${host%%/*}"
          echo "::add-mask::$host"
          [[ $host =~ ^[A-Za-z0-9.-]{1,253}$ ]] || { echo '::error::HOURWAVE_BATCH_HOST is not a hostname'; exit 1; }
          put() {
            printf '%s' "$2" | pnpm exec wrangler secret put "$1" \
              --config wrangler.generated.json --env "$TARGET_ENV" > /dev/null 2>&1 \
              || { echo "::error::secret put $1 failed"; exit 1; }
            echo "- secret $1: set" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          put BATCH_ORIGIN "https://$host"
          put BATCH_ACCESS_CLIENT_ID "$BATCH_ID"
          put BATCH_ACCESS_CLIENT_SECRET "$BATCH_SECRET"

      - name: Status (ingest_runs counts only)
        if: inputs.mode == 'deploy' || inputs.mode == 'status'
        shell: bash
        working-directory: source/workers/catalog-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          [[ -f wrangler.generated.json ]] || node scripts/provision.mjs --env "$TARGET_ENV" > /dev/null 2>&1 \
            || { echo '::error::provision (lookup) failed'; exit 1; }
          out="$(mktemp)"
          q="SELECT product, run_id, status, reason, json_extract(stats,'\$.chunksApplied') AS chunks,
               json_extract(stats,'\$.rowsWritten') AS rows, json_extract(stats,'\$.wouldWrite') AS would,
               json_extract(stats,'\$.diffMsMax') AS diff_ms_max
             FROM ingest_runs ORDER BY run_id DESC LIMIT 6"
          if pnpm exec wrangler d1 execute "$DB_NAME" --remote --json \
               --config wrangler.generated.json --env "$TARGET_ENV" --command "$q" > "$out" 2> /dev/null < /dev/null; then
            n="$(jq '.[0].results | length' "$out" 2> /dev/null || echo 0)"
            echo "ingest_runs_rows=$n" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r '.[0].results[] | "product=\(.product) run=\(.run_id) status=\(.status) chunks=\(.chunks // 0) rows=\(.rows // 0) would=\(.would // 0) diff_ms_max=\(.diff_ms_max // 0) reason=\((.reason // "none") | gsub("[^A-Za-z0-9:._ -]"; "_") | .[0:80])"' "$out" \
              | grep -E '^product=(catalog|health) ' | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'status query failed (0004 not applied yet?)'
          fi
          # While INGEST_DRY_RUN=true these must all be 0 (dry run writes only ingest_* bookkeeping).
          q2="SELECT (SELECT count(*) FROM stations) AS st, (SELECT count(*) FROM station_streams) AS ss, (SELECT count(*) FROM stream_health) AS sh"
          if pnpm exec wrangler d1 execute "$DB_NAME" --remote --json \
               --config wrangler.generated.json --env "$TARGET_ENV" --command "$q2" > "$out" 2> /dev/null < /dev/null; then
            jq -r '.[0].results[0] | "data_rows stations=\(.st) station_streams=\(.ss) stream_health=\(.sh)"' "$out" \
              | grep -E '^data_rows stations=[0-9]+ station_streams=[0-9]+ stream_health=[0-9]+$' | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'data count query failed'
          fi
          rm -f "$out"

      - name: CPU and outcomes, last 24 h (Workers Analytics; numbers only)
        if: inputs.mode == 'status' || inputs.mode == 'deploy'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          body="$(jq -n --arg a "$CF_ACCOUNT" --arg s "$INGEST_WORKER" --arg t "$since" '{
            query: "query($a:String!,$s:String!,$t:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:20,filter:{scriptName:$s,datetime_geq:$t}){sum{requests errors subrequests} quantiles{cpuTimeP50 cpuTimeP99 cpuTimeP999} dimensions{status}}}}}",
            variables: {a: $a, s: $s, t: $t}}')"
          out="$(mktemp)"
          if ! curl -sS -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' \
               --data "$body" https://api.cloudflare.com/client/v4/graphql > "$out" 2> /dev/null; then
            echo 'analytics=unreachable'; rm -f "$out"; exit 0
          fi
          if jq -e '.errors | length > 0' "$out" > /dev/null 2>&1; then
            echo "analytics=error $(jq -r '.errors[0].extensions.code // "unknown"' "$out" | tr -cd 'A-Za-z0-9_' | cut -c1-40)"
            rm -f "$out"; exit 0
          fi
          # cpuTime is in microseconds; the Free plan limit is 10 ms per invocation.
          jq -r '.data.viewer.accounts[0].workersInvocationsAdaptive[]? |
              "status=\(.dimensions.status) invocations=\(.sum.requests) errors=\(.sum.errors) subrequests=\(.sum.subrequests) cpu_p50_ms=\((.quantiles.cpuTimeP50 // 0) / 1000) cpu_p99_ms=\((.quantiles.cpuTimeP99 // 0) / 1000) cpu_p999_ms=\((.quantiles.cpuTimeP999 // 0) / 1000)"' "$out" \
            | grep -E '^status=[A-Za-z]{1,40} invocations=[0-9]+ ' | tee -a "$GITHUB_STEP_SUMMARY" || echo 'invocations=0'
          rm -f "$out"
