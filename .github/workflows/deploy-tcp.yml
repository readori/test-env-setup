name: Deploy Tcpwaybill Private Source

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch, tag, or commit SHA
        required: true
        default: main
        type: string
      confirm:
        description: Type DEPLOY tcpxunine to confirm production deployment
        required: true
        default: DEPLOY tcpxunine
        type: string
      reset_admin_password:
        description: Reset the local admin password to INITIAL_ADMIN_PASSWORD and revoke existing admin sessions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tcpxunine-production
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: readori/Tcpwaybill
  WORKER_NAME: tcpxunine
  CUSTOM_DOMAIN: tcp.xunine.com
  SECURITY_RESOURCE_MODE: preserve
  ROUTING_RESOURCE_MODE: preserve-existing-custom-domain
  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
  INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME || vars.INITIAL_ADMIN_USERNAME || 'admin' }}
  CI: true

jobs:
  deploy:
    name: Build private source and deploy tcpxunine
    if: ${{ inputs.confirm == 'DEPLOY tcpxunine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Intentionally no GitHub Environment binding here. Repository Secrets are authoritative
    # for the public runner, avoiding same-name Environment Secret precedence surprises.

    defaults:
      run:
        shell: bash
        working-directory: source

    steps:
      - name: Verify deployment secrets
        working-directory: ${{ github.workspace }}
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in TARGET_REPO_PAT CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN INITIAL_ADMIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing GitHub Actions secret::${name} is missing from this public CI repository."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "::notice::Required deployment secrets are available."

      - name: Checkout private source repository
        uses: actions/checkout@v6
        with:
          repository: readori/Tcpwaybill
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Record private source revision
        run: |
          echo "::notice::Source repository: ${SOURCE_REPOSITORY}"
          echo "::notice::Source ref requested: ${{ inputs.source_ref }}"
          echo "::notice::Source commit: $(git rev-parse HEAD)"

      - name: Verify private source deployment contract
        run: |
          set -euo pipefail
          if [[ ! -f .deployment-contract.json ]]; then
            echo "::error title=Private source is stale::The checked-out ${SOURCE_REPOSITORY}@${{ inputs.source_ref }} does not contain .deployment-contract.json. Update the private repository to the current integration release before deploying."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const contract = JSON.parse(fs.readFileSync('.deployment-contract.json', 'utf8'));
          const expected = {
            contract: 'tcpxunine-production-v32',
            release: 'fix32-driver-operations-deep-audit',
            source_repository: 'readori/Tcpwaybill',
            worker_name: 'tcpxunine',
            custom_domain: 'tcp.xunine.com',
            security_resource_mode: 'preserve',
            authentication_mode: 'local-username-password',
            workers_dev: false,
            routing_resource_mode: 'preserve-existing-custom-domain',
            website_integration: 'xunine.com-v2',
            i18n_mode: 'en-US+zh-CN',
            driver_compliance_mode: 'masked-last4',
            address_autocomplete_mode: 'google-places-server-proxy-la',
            waybill_document_mode: 'single-page-driver-compliance-v2',
            app_entry_mode: 'unified-role-aware-responsive-app',
            mobile_layout_mode: 'drawer-sidebar-breakpoint-1000',
            driver_operations_mode: 'lifecycle-documents-tasks-incidents-offline-conflicts',
            offline_conflict_mode: 'signed-replay-reviewed',
            compliance_document_mode: 'r2-magic-byte-retained',
            offline_signing_mode: 'es256-detached-client-server-verified',
            device_identity_mode: 'random-persistent-or-volatile-fail-safe',
            waybill_inspection_mode: 'canonical-immutable-compliance-snapshot',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (contract[key] !== value) {
              throw new Error(`Private source contract mismatch: ${key} expected ${JSON.stringify(value)}, got ${JSON.stringify(contract[key])}`);
            }
          }
          const auth = fs.readFileSync('worker/lib/local-session.ts', 'utf8');
          const password = fs.readFileSync('worker/lib/password.ts', 'utf8');
          const migration = fs.readFileSync('migrations/0003_local_accounts.sql', 'utf8');
          if (!password.includes('PASSWORD_ITERATIONS = 100_000') || !password.includes('MAX_RUNTIME_PBKDF2_ITERATIONS = 100_000')) {
            throw new Error('Private source is stale: fix32 Cloudflare auth runtime profile is missing.');
          }
          for (const marker of ['AUTH_DB_READ_FAILED', 'AUTH_SESSION_WRITE_FAILED']) {
            if (!auth.includes(marker)) throw new Error(`Private source is stale: missing fix32 auth stage ${marker}.`);
          }
          for (const marker of ['tcpwaybill_session', 'loginWithPassword', 'authenticateLocalSession']) {
            if (!auth.includes(marker)) throw new Error(`Private source is stale: missing local auth marker ${marker}.`);
          }
          if (!migration.includes('CREATE TABLE local_accounts') || !migration.includes('CREATE TABLE local_sessions')) {
            throw new Error('Private source is stale: local authentication migration is missing.');
          }
          const webMigration = fs.readFileSync('migrations/0004_xunine_web_integration.sql', 'utf8');
          const worker = fs.readFileSync('worker/index.ts', 'utf8');
          if (!webMigration.includes('CREATE TABLE booking_web_details') || !webMigration.includes('CREATE TABLE public_leads')) {
            throw new Error('Private source is stale: XUNINE website migration is missing.');
          }
          for (const marker of ['/public/reservations/lookup', '/public/leads', '/admin/leads']) {
            if (!worker.includes(marker)) throw new Error(`Private source is stale: missing ${marker}.`);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const script of ['admin-credential:verify-remote', 'admin-login:verify-production', 'release:verify', 'i18n:verify', 'driver-compliance:verify', 'address-autocomplete:verify', 'waybill-single-page:verify', 'mobile-role-print:verify', 'fix32-d1:verify', 'fix32-operations:verify', 'api-surface:verify', 'typescript-structure:verify', 'public-cors:verify']) {
            if (!pkg.scripts?.[script]) throw new Error(`Private source is stale: missing fix32 script ${script}.`);
          }
          for (const requiredFile of ['migrations/0005_driver_vehicle_compliance_details.sql', 'migrations/0006_address_autocomplete.sql', 'src/pages/DriverCompliancePage.tsx', 'src/components/AddressAutocomplete.tsx', 'src/offline/signature.ts', 'scripts/verify-i18n-coverage.mjs', 'scripts/verify-driver-compliance.mjs', 'scripts/verify-address-autocomplete.mjs', 'scripts/verify-fix32-d1.py', 'scripts/verify-fix32-operations.mjs', 'scripts/verify-api-surface.mjs', 'scripts/verify-typescript-structure.mjs', 'migrations/0008_driver_operations_and_audit.sql', 'worker/lib/public-cors.ts', 'scripts/verify-public-cors.mjs', 'src/pages/PublicManagePage.tsx']) {
            if (!fs.existsSync(requiredFile)) throw new Error(`Private source is stale: missing fix32 file ${requiredFile}.`);
          }
          const handlers = fs.readFileSync('worker/api/handlers.ts', 'utf8');
          const driversPage = fs.readFileSync('src/pages/DriversPage.tsx', 'utf8');
          const reservationDetail = fs.readFileSync('src/pages/ReservationDetailPage.tsx', 'utf8');
          const openapi = fs.readFileSync('docs/openapi.yaml', 'utf8');
          for (const marker of ['listDriverVehicleAuthorizations', 'updateDriverVehicleAuthorizations', 'VEHICLE_NOT_AUTHORIZED']) {
            if (!handlers.includes(marker)) throw new Error(`Private source is stale: missing driver/vehicle authorization marker ${marker}.`);
          }
          for (const marker of ['vehicle-authorizations', 'authorizedVehicles']) {
            if (!driversPage.includes(marker)) throw new Error(`Private source is stale: Drivers UI missing ${marker}.`);
          }
          for (const marker of ['vehicle-authorizations', 'authorizedVehicleIds', 'assignableVehicles']) {
            if (!reservationDetail.includes(marker)) throw new Error(`Private source is stale: dispatch authorization UI missing ${marker}.`);
          }
          for (const marker of ['/admin/drivers/{driver_id}/vehicle-authorizations:', 'DriverVehicleAuthorizationWrite:', 'DriverVehicleAuthorizationResponse:']) {
            if (!openapi.includes(marker)) throw new Error(`Private source is stale: OpenAPI missing ${marker}.`);
          }
          for (const marker of ['/public/address/autocomplete', '/public/address/resolve', '/admin/settings/address-autocomplete']) {
            if (!worker.includes(marker)) throw new Error(`Private source is stale: missing address route ${marker}.`);
          }
          const addressWorker = fs.readFileSync('worker/lib/address-places.ts', 'utf8');
          for (const marker of ['places.googleapis.com/v1/places:autocomplete', 'locationRestriction', 'X-Goog-Api-Key', 'address_lookup_rate_limits', 'enforcePublicApiOrigin', 'publicApiCorsOrigin']) {
            if (!addressWorker.includes(marker)) throw new Error(`Private source is stale: address provider missing ${marker}.`);
          }
          const publicCors = fs.readFileSync('worker/lib/public-cors.ts', 'utf8');
          for (const marker of ['XUNINE_PUBLIC_ORIGIN = "https://xunine.com"', 'PUBLIC_ORIGIN_BLOCKED', 'publicApiPreflight', 'content-type, idempotency-key']) {
            if (!publicCors.includes(marker)) throw new Error(`Private source is stale: shared public CORS missing ${marker}.`);
          }
          if (publicCors.includes('https://www.xunine.com') || publicCors.includes('access-control-allow-origin", "*"')) {
            throw new Error('Private source is stale: public CORS must allow only canonical https://xunine.com in production and must never use wildcard origins.');
          }
          if (!fs.existsSync('migrations/0007_waybill_print_profile_v2.sql')) throw new Error('Private source is stale: missing Waybill print profile migration.');
          const waybill = fs.readFileSync('worker/lib/waybill.ts', 'utf8');
          const waybillUi = fs.readFileSync('src/components/WaybillDocument.tsx', 'utf8');
          for (const marker of ['driverLicenseNumberLast4', 'vehicleInsurancePolicyLast4', 'Insurance & Vehicle Compliance / 保险与车辆合规', '@page{size:Letter']) {
            if (!waybill.includes(marker)) throw new Error(`Private source is stale: missing Waybill marker ${marker}.`);
          }
          for (const marker of ['driverLicense', 'insuranceExpiration', 'registrationExpiration', 'inspectionDue', 'data-print-density']) {
            if (!waybillUi.includes(marker)) throw new Error(`Private source is stale: missing Waybill UI marker ${marker}.`);
          }
          const canonical = fs.readFileSync('worker/lib/canonical.ts', 'utf8');
          const offlineSignature = fs.readFileSync('src/offline/signature.ts', 'utf8');
          for (const marker of ['verifyOfflinePayloadSignature', 'ECDSA', 'P-256']) {
            if (!canonical.includes(marker)) throw new Error(`Private source is stale: missing offline server signature marker ${marker}.`);
          }
          for (const marker of ['verifyOfflineBundleSignature', 'getVerifiedCachedOfflineBundle', 'crypto.subtle.verify']) {
            if (!offlineSignature.includes(marker)) throw new Error(`Private source is stale: missing offline client signature marker ${marker}.`);
          }
          console.log(`::notice::Private source contract verified: ${contract.contract} + fix32 operations + ES256 offline authorization + responsive mobile admin + unified /app + one-page compliance Waybill`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/normalize-cloudflare-env.mjs

      - name: Verify fixed production identity
        run: npm run production-identity:verify

      - name: Verify pinned toolchain contract
        run: npm run toolchain:verify

      - name: Ensure dependency lock matches package contract
        run: npm run lock:ensure

      - name: Verify dependency lock exists
        run: |
          test -s package-lock.json || { echo "::error::package-lock.json was not generated."; exit 1; }
          node -e "const l=require('./package-lock.json'); if (!l.lockfileVersion || !l.packages?.['']) process.exit(1); console.log('package-lock.json verified, lockfileVersion=' + l.lockfileVersion)"

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Generate CI Wrangler config
        run: npm run config:ci

      - name: Quality gate
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Reuse and verify existing Cloudflare resources
        run: npm run cf:bootstrap

      - name: Synchronize and verify runtime secrets before deploy
        run: npm run cf:sync-secrets

      - name: Generate production Wrangler config
        run: npm run config:production

      - name: Verify generated production safety policy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const expected = {
            worker: process.env.WORKER_NAME,
            domain: process.env.CUSTOM_DOMAIN,
          };
          if (config.name !== expected.worker) throw new Error(`Worker mismatch: ${config.name}`);
          if (config.workers_dev !== false) throw new Error('workers_dev must be false.');
          if (config.preview_urls !== false) throw new Error('preview_urls must be false.');
          if (config.vars?.APP_ENV !== 'production') throw new Error('APP_ENV must be production.');
          if (config.vars?.DEV_AUTH_BYPASS !== 'false') throw new Error('DEV_AUTH_BYPASS must be false.');
          if (config.routes !== undefined || config.route !== undefined) {
            throw new Error('Preserve-only production config must not publish Wrangler routes.');
          }
          if (!config.d1_databases?.[0]?.database_id || !config.r2_buckets?.[0]?.bucket_name) {
            throw new Error('Cloudflare storage bindings are incomplete.');
          }
          NODE

      - name: Validate production types and build
        env:
          TCP_WAYBILL_WRANGLER_MODE: production
        run: npm run typecheck && npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Bootstrap inactive technical tenant
        run: |
          npm run cf:bootstrap-tenant
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file=.cloudflare/bootstrap-tenant.sql

      - name: Bootstrap or recover local owner account
        env:
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          RESET_INITIAL_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}
        run: |
          npm run cf:bootstrap-local-owner
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file=.cloudflare/bootstrap-local-owner.sql

      - name: Verify remote D1 administrator account / explicit reset
        env:
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          RESET_INITIAL_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}
        run: npm run admin-credential:verify-remote

      - name: Verify Vite-generated deploy configuration
        run: npm run vite-output:verify

      - name: Deploy Worker and assets without mutating Custom Domain
        env:
          WRANGLER_OUTPUT_FILE_PATH: .cloudflare/wrangler-output.ndjson
        run: npx wrangler deploy

      - name: Verify deployed Worker and version
        run: npm run deploy-output:verify

      - name: Verify preserved Custom Domain after deploy
        run: npm run cf:verify-domain

      - name: Verify local username/password edge behavior
        run: npm run auth-edge:verify

      - name: Verify production administrator login after explicit reset
        if: ${{ inputs.reset_admin_password == true }}
        env:
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: npm run admin-login:verify-production

      - name: Production health check
        run: npm run health:production

      - name: Deployment summary
        run: |
          node <<'NODE'
          const b = require('./.cloudflare/bootstrap.json');
          console.log(`Worker: ${b.worker_name}`);
          console.log(`Custom Domain: https://${b.custom_domain}`);
          console.log(`Version ID: ${process.env.DEPLOYED_WORKER_VERSION}`);
          console.log(`D1: ${b.d1_database_name}`);
          console.log(`R2: ${b.r2_bucket_name}`);
          console.log('Authentication: local username/password');
          console.log('Turnstile: reused without mutation');
          console.log('workers.dev: disabled; Custom Domain preserved outside Wrangler routes');
          NODE

      - name: Remove private deployment state
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf source/.cloudflare source/wrangler.jsonc
