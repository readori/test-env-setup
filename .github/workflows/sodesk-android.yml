# RemoHop Android app CI (controller app: native shell + WebView on an in-process Go gateway).
#
# Public CI repository -> source repository: env SOURCE_REPOSITORY. Copy this file to .github/workflows/ in the CI repo.
#
#   verify : JDK 17 + Android SDK (platform 36, build-tools 36.0.0, NDK r28c) + Go from go.mod ->
#            mobile/android/build.sh (gomobile bind of mobile/remohopcore -> app/libs/remohopcore.aar,
#            then Gradle): assembleDebug, JVM unit tests, lint, the instrumented test APK; then
#            (optional, on by default) the instrumented tests on an x86_64 emulator using the
#            runner's KVM: the smoke test, and HostSessionTest, which drives the real app
#            against a real `remohop host` started on the runner (built here from the checked-out
#            source, fixed random password read from a file, reachable at 10.0.2.2:PORT from
#            the emulator): pair, terminal, files + download hand-over, clipboard bridge,
#            desktop tab, rotation, recreate, background. Also runs the Go tests of
#            internal/mobile and mobile/remohopcore.
#   screenshots (request key SCREENSHOTS=true|only): Google Play phone screenshots of the real app on a
#            1080x1920 (9:16) emulator, connected to a second `remohop host` on the runner that has a
#            demo home directory (/home/demo, files with made-up content). StoreScreenshotsTest runs
#            once per store language (en -> en-US, zh -> zh-CN; the app's own language setting),
#            with a clean status bar (System UI demo mode: 9:41, full battery and signal). The PNGs
#            (opaque RGB, no alpha) are checked for Play's size and aspect rules and kept as the
#            7-day artifact remohop-play-screenshots (<locale>/<n>-<screen>.png). The Play upload is
#            done by sodesk-android-release.yml MODE=screenshots, which takes this run's artifact.
#            true = after the instrumented tests, only = instead of them.
#
# No signing, no Play credentials, no keystore. The APK stays on the runner; the only artifact is
# the screenshots of SCREENSHOTS mode (pictures of the app's screens with the demo host's files,
# no secrets: the host password is never typed into a field that is captured).
#
# Triggers: workflow_dispatch, or a push to main that changes ci-requests/sodesk-android.env
# (how the project's AI engineer requests a run). Only people with push access to this repo can
# trigger; never pull_request. The request file is plain KEY=VALUE text, parsed with strict
# patterns and never executed:
#
#   REF=main          # source repository branch, tag or SHA
#   EMULATOR=true     # optional; true (default) or false
#   SCREENSHOTS=false # optional; false (default), true (instrumented tests, then screenshots) or only
#
# Safety rules (public repo, public logs): no pull_request triggers; third-party actions pinned
# to commit SHAs; TARGET_REPO_PAT is used only by the checkout step and not persisted; build and
# test output is limited to results and the tail of failures; private files are never printed.
# The host's password is random per run, kept in a 0600 file under RUNNER_TEMP, masked in the log,
# handed to the test as an instrumentation argument and never echoed; the app's gateway URL (it
# carries an access token) is never logged by the test. The host is stopped at the end of the job.
name: RemoHop Android

run-name: RemoHop Android · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-android.env)' || format('verify · {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = debug build, unit tests, lint (+ emulator tests). Signed builds come later.'
        required: true
        default: 'verify'
        type: choice
        options: [verify]
      ref:
        description: 'Source repository branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      emulator:
        description: 'Also run the instrumented tests (smoke + real host end to end) on an Android emulator (KVM)'
        required: true
        default: true
        type: boolean
      screenshots:
        description: 'Google Play phone screenshots (en-US, zh-CN) as a 7-day artifact: false, true (after the tests) or only (instead of them)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true', 'only']
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-android.env']

permissions:
  contents: read

concurrency:
  group: remohop-android-${{ inputs.ref || 'request' }}
  cancel-in-progress: true

env:
  # Source repository (public since the open-source release).
  SOURCE_REPOSITORY: readori/RemoHop
  PRIVATE_SOURCE_PATH: source
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  EMULATOR_API: '34'
  EXPECTED_APP_ID: com.remohop.app
  # The host the emulator test connects to (10.0.2.2 is the runner's loopback as the emulator sees it).
  E2E_HOST_PORT: '21118'
  E2E_FILE_NAME: remohop-e2e.txt
  # The screenshots host (SCREENSHOTS mode): its own port, password and demo home directory.
  SHOTS_HOST_PORT: '21119'
  SHOTS_HOME: /home/demo

jobs:
  android:
    name: Build RemoHop Android
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        id: request
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_EMULATOR: ${{ inputs.emulator }}
          INPUT_SCREENSHOTS: ${{ inputs.screenshots }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-android.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/remohop-android-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-android.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
            EMULATOR="$(sed -n 's/^EMULATOR=//p' "$REQ" | head -n 1 | tr -d '\r')"
            EMULATOR="${EMULATOR:-true}"
            SCREENSHOTS="$(sed -n 's/^SCREENSHOTS=//p' "$REQ" | head -n 1 | tr -d '\r')"
            MODE=verify
          else
            SOURCE_REF="$INPUT_REF"
            EMULATOR="$INPUT_EMULATOR"
            SCREENSHOTS="$INPUT_SCREENSHOTS"
            MODE="$INPUT_MODE"
          fi
          SCREENSHOTS="${SCREENSHOTS:-false}"
          [[ "$MODE" == 'verify' ]] || { echo "::error::Unsupported mode: $MODE"; exit 64; }
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ "$EMULATOR" == 'true' || "$EMULATOR" == 'false' ]] || { echo '::error::EMULATOR must be true or false.'; exit 64; }
          [[ "$SCREENSHOTS" =~ ^(false|true|only)$ ]] || { echo '::error::SCREENSHOTS must be false, true or only.'; exit 64; }
          [[ -n "${TARGET_REPO_PAT:-}" ]] || {
            echo '::error::Missing public CI credential: TARGET_REPO_PAT (it must have read access to the source repository, env SOURCE_REPOSITORY).'
            exit 78
          }
          # tests: the instrumented tests; device: an emulator (and the hosts) for the tests and/or the screenshots.
          TESTS=false; [[ "$EMULATOR" == 'true' && "$SCREENSHOTS" != 'only' ]] && TESTS=true
          SHOTS=false; [[ "$SCREENSHOTS" != 'false' ]] && SHOTS=true
          DEVICE=false; [[ "$TESTS" == 'true' || "$SHOTS" == 'true' ]] && DEVICE=true
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          { echo "emulator=$TESTS"; echo "screenshots=$SHOTS"; echo "device=$DEVICE"; } >> "$GITHUB_OUTPUT"
          echo "Trigger: $EVENT_NAME · mode: $MODE · ref: $SOURCE_REF · instrumented tests: $TESTS · screenshots: $SCREENSHOTS"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Detect project layout (fail fast)
        id: layout
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          C="$(git rev-parse HEAD)"
          { echo '### RemoHop Android · verify'; echo; echo "- Source: \`$SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`)"; } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f mobile/android/build.sh ]]; then
            echo '::notice::mobile/android/build.sh is not on this ref: the Android app is not there yet. Nothing to verify.'
            echo '- Result: skipped, no Android app at this ref' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in go.mod mobile/go.mod mobile/remohopcore/remohopcore.go mobile/shared/remohop-mobile.js \
                   mobile/android/gradlew mobile/android/gradle/wrapper/gradle-wrapper.properties mobile/android/app/build.gradle.kts; do
            [[ -f "$f" ]] || { echo "::error::$f is missing."; exit 66; }
          done
          grep -q "applicationId = \"$EXPECTED_APP_ID\"" mobile/android/app/build.gradle.kts || { echo "::error::applicationId must be $EXPECTED_APP_ID"; exit 65; }
          # The wrapper must download a checksum-pinned Gradle.
          grep -q '^distributionSha256Sum=' mobile/android/gradle/wrapper/gradle-wrapper.properties || { echo '::error::gradle-wrapper.properties must pin distributionSha256Sum.'; exit 65; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Source ${C:0:8} · layout: PASS"

      - name: Set up JDK 17
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (version from go.mod)
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.PRIVATE_SOURCE_PATH }}/go.mod
          cache: false

      - name: Install Android SDK packages
        if: steps.layout.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # ubuntu-latest ships the SDK and its command-line tools; add exactly what the app needs.
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKM" ]] || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 69; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION" "platform-tools" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || { tail -20 "$RUNNER_TEMP/sdkmanager.log"; echo '::error::sdkmanager failed.'; exit 1; }
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"; } >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME · NDK $ANDROID_NDK_VERSION"

      - name: Go tests of the mobile core
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          go version
          go vet ./internal/mobile
          go test -count=1 ./internal/mobile 2>&1 | cut -c1-2000 | tail -n 200
          (cd mobile && go vet ./... && go test -count=1 ./... 2>&1 | cut -c1-2000 | tail -n 100)
          echo '- Go: internal/mobile and mobile/remohopcore tests PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22 (browser test driver)
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Headless-browser test of the injected script (phone viewport)
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          [[ -f mobile/shared/test/phone_test.mjs ]] || { echo '::notice::no phone_test.mjs on this ref; skipped.'; exit 0; }
          command -v google-chrome >/dev/null || { echo '::notice::no Chrome on this runner; skipped.'; exit 0; }
          # Harness and the real gateway page against an in-process host (no screenshots kept).
          REMOHOP_BROWSER_TEST=1 go test -count=1 -run TestPhoneBrowser -v ./internal/mobile 2>&1 | cut -c1-400 | tail -n 80
          echo '- Phone-viewport browser test: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: gomobile bind + Gradle (debug APK, unit tests, lint, test APK)
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.console=plain
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          if ! bash build.sh assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest > "$LOG" 2>&1; then
            grep -E '^e: |error:|FAILED|Lint found|tests completed' "$LOG" | cut -c1-400 | head -n 60
            # The cause follows the "What went wrong" line (build output only: no secrets in it).
            grep -E -A12 'What went wrong' "$LOG" | cut -c1-400 | head -n 50
            echo '::error::Android build failed.'
            exit 1
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$APK" ]] || { echo '::error::Debug APK was not produced.'; exit 65; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so' || { echo '::error::APK has no arm64 Go core.'; exit 65; }
          unzip -l "$APK" | grep -q 'lib/x86_64/libgojni.so' || { echo '::error::APK has no x86_64 Go core.'; exit 65; }
          unzip -l "$APK" | grep -q 'assets/remohop-mobile.js' || { echo '::error::APK has no injected script.'; exit 65; }
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          PKG="$("$AAPT" dump packagename "$APK")"
          [[ "$PKG" == "$EXPECTED_APP_ID" ]] || { echo "::error::Package name mismatch: $PKG"; exit 65; }
          TESTS="$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f'{t} tests, {f} failed')
          PY
          )"
          SIZE="$(du -h "$APK" | cut -f1)"
          echo "Debug APK: $SIZE · JVM unit tests: $TESTS · lint: PASS"
          echo "- Debug APK ($PKG): $SIZE · JVM unit tests: $TESTS · lint: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for the emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build remohop and start a host for the emulator test
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          REMOHOP="$RUNNER_TEMP/remohop"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$REMOHOP" ./cmd/remohop
          HCFG="$RUNNER_TEMP/remohop-host-config"
          FILES="$RUNNER_TEMP/remohop-e2e-files"
          rm -rf "$HCFG" "$FILES"
          mkdir -p "$HCFG" "$FILES"
          chmod 700 "$HCFG"
          # The file the test lists and downloads. Keep in step with HostSessionTest.FILE_TEXT.
          printf 'remohop android e2e payload 7f3a\n' > "$FILES/$E2E_FILE_NAME"
          # Random per run, masked, kept in a private file; never on a command line.
          umask 077
          PWFILE="$RUNNER_TEMP/remohop-host-password"
          openssl rand -hex 16 > "$PWFILE"
          echo "::add-mask::$(cat "$PWFILE")"
          # `remohop host passwd` reads the password from stdin when it is not a terminal
          # (printf is a shell builtin: nothing appears in a process list).
          export REMOHOP_CONFIG_DIR="$HCFG" SHELL=/bin/bash
          PW="$(cat "$PWFILE")"
          printf '%s\n%s\n' "$PW" "$PW" | "$REMOHOP" host passwd > /dev/null
          unset PW
          # No rendezvous server: the emulator dials 10.0.2.2:PORT directly. Bound to all interfaces
          # because the emulator's NAT reaches the runner through its loopback and its own address.
          setsid nohup "$REMOHOP" host --no-signal --listen "0.0.0.0:$E2E_HOST_PORT" > "$RUNNER_TEMP/remohop-host.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/remohop-host.pid"
          for i in $(seq 1 60); do
            grep -q 'RemoHop host ready' "$RUNNER_TEMP/remohop-host.log" 2>/dev/null && break
            kill -0 "$(cat "$RUNNER_TEMP/remohop-host.pid")" 2>/dev/null || break
            sleep 0.5
          done
          if ! grep -q 'RemoHop host ready' "$RUNNER_TEMP/remohop-host.log" 2>/dev/null; then
            sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 20
            echo '::error::remohop host did not start.'
            exit 1
          fi
          echo "remohop host is up on UDP $E2E_HOST_PORT (pid $(cat "$RUNNER_TEMP/remohop-host.pid")), fixed password set, test file prepared"

      - name: Start an Android emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        timeout-minutes: 15
        env:
          # Play phone screenshots must be at most 2:1; the classic Pixel profile is 1080x1920 (9:16).
          AVD_DEVICE: ${{ steps.request.outputs.screenshots == 'true' && 'pixel' || 'pixel_6' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          IMG="system-images;android-${EMULATOR_API};google_apis;x86_64"
          { yes || true; } | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$IMG" > "$RUNNER_TEMP/sdk-emu.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/sdk-emu.log"; exit 1; }
          echo "system image installed"
          # One AVD directory for avdmanager and the emulator: the build may
          # have set ANDROID_USER_HOME/ANDROID_SDK_HOME, which the two read
          # differently.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$IMG" -d "$AVD_DEVICE" --force > "$RUNNER_TEMP/avd-create.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/avd-create.log"; exit 1; }
          echo "AVDs: $("$SDK/emulator/emulator" -list-avds | tr '\n' ' ') (device profile $AVD_DEVICE)"
          # Its own session, so it outlives this step (the tests and the screenshots are later steps).
          setsid nohup "$SDK/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 < /dev/null &
          ADB="$SDK/platform-tools/adb"
          echo "emulator started; waiting for the device"
          timeout 300 "$ADB" wait-for-device || { echo '::error::no device after 5 min'; tail -n 40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "device visible; waiting for boot"
          for i in $(seq 1 180); do
            [[ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] || { echo '::error::emulator did not boot'; tail -n 30 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "booted after about $((i * 2)) s"
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global "$s" 0; done
          # Keep the screen on and unlocked: the test needs a resumed, focused activity.
          "$ADB" shell svc power stayon true > /dev/null 2>&1 || true
          "$ADB" shell input keyevent 224 > /dev/null 2>&1 || true
          "$ADB" shell wm dismiss-keyguard > /dev/null 2>&1 || true
          "$ADB" shell input keyevent 82 > /dev/null 2>&1 || true
          # The emulator's own launcher sometimes hangs and its "not responding" dialog takes the
          # focus from the app under test; hide system error dialogs for the test run.
          "$ADB" shell settings put global hide_error_dialogs 1 > /dev/null 2>&1 || true
          echo "screen: $(timeout 10 "$ADB" shell wm size 2>/dev/null | tr -d '\r' | tail -n 1)"

      - name: Instrumented tests on an emulator (smoke + real host end to end, no uploads)
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.emulator == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          # The host started in an earlier step: address as the emulator sees the runner, password from the private file.
          E2E_PW="$(cat "$RUNNER_TEMP/remohop-host-password")"
          echo "::add-mask::$E2E_PW"
          kill -0 "$(cat "$RUNNER_TEMP/remohop-host.pid")" 2>/dev/null || { echo '::error::remohop host is not running.'; exit 1; }
          "$ADB" logcat -c > /dev/null 2>&1 || true
          rc=0
          timeout 900 ./gradlew --no-daemon -Dorg.gradle.console=plain connectedDebugAndroidTest \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_host=10.0.2.2:$E2E_HOST_PORT" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_password=$E2E_PW" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_dir=$RUNNER_TEMP/remohop-e2e-files" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_file=$E2E_FILE_NAME" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_background_seconds=10" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_require=true" \
            > "$RUNNER_TEMP/connected.log" 2>&1 || rc=$?
          unset E2E_PW
          [[ $rc -eq 124 ]] && echo '::error::connectedDebugAndroidTest timed out after 15 min' && tail -n 40 "$RUNNER_TEMP/connected.log"
          # Progress lines of the end-to-end test (its own tag; it never logs URLs or passwords).
          echo '--- HostSessionTest progress (logcat tag RemoHopE2E) ---'
          timeout 30 "$ADB" logcat -d -s RemoHopE2E:I 2>/dev/null | grep -v '^--------' | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | cut -c1-300 | tail -n 40 || true
          if [[ $rc -ne 0 ]]; then
            echo '--- window focus at failure ---'
            timeout 30 "$ADB" shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | cut -c1-200 | head -n 4 || true
          fi
          if [[ $rc -ne 0 ]]; then
            grep -E 'FAILED|Tests? .*failed|What went wrong|AssertionError|Exception|timed out' "$RUNNER_TEMP/connected.log" | cut -c1-400 | head -n 40
            exit 1
          fi
          grep -E 'Finished [0-9]+ tests|BUILD SUCCESSFUL' "$RUNNER_TEMP/connected.log" | tail -n 3
          # A skipped host test would be a false green: it must have run and passed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ran = skipped = failed = 0
          for p in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(p).getroot().iter('testcase'):
                  if tc.get('name') != 'hostSessionEndToEnd':
                      continue
                  ran += 1
                  skipped += 1 if tc.find('skipped') is not None else 0
                  failed += 1 if (tc.find('failure') is not None or tc.find('error') is not None) else 0
          print(f'HostSessionTest.hostSessionEndToEnd: ran={ran} skipped={skipped} failed={failed}')
          sys.exit(0 if ran == 1 and skipped == 0 and failed == 0 else 1)
          PY

      # SCREENSHOTS mode. A second remohop host whose home is a demo directory (made-up files), so the
      # terminal and the Files tab show something meaningful; the app connects to it with a per-run
      # password (typed into the form after the connect screen was captured). StoreScreenshotsTest
      # captures each screen with UiAutomation into the app's external files directory; the PNGs are
      # pulled, checked against Play's rules and kept as an artifact for sodesk-android-release.yml.
      - name: Google Play screenshots (en-US, zh-CN) on the emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.screenshots == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          REMOHOP="$RUNNER_TEMP/remohop"
          [[ -f "$APP_APK" && -f "$TEST_APK" && -x "$REMOHOP" ]] || { echo '::error::debug APK, test APK or remohop binary missing.'; exit 65; }
          grep -rq 'class StoreScreenshotsTest' app/src/androidTest || { echo '::error::StoreScreenshotsTest is not on this ref.'; exit 66; }

          # The demo home directory: the files the terminal and the Files tab show (made-up content).
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$SHOTS_HOME"
          D="$SHOTS_HOME/Documents"
          mkdir -p "$D/Invoices" "$D/Photos" "$D/Projects"
          printf 'RemoHop demo files\n' > "$D/README.txt"
          printf '# Weekly sync\n\n- Ship 1.0 to the store\n- New screenshots\n' > "$D/meeting-notes.md"
          printf 'month,orders,revenue\nJul,182,9310\nAug,205,10422\nSep,231,11870\n' > "$D/sales-q3.csv"
          head -c 48213 /dev/urandom > "$D/budget-2026.xlsx"
          head -c 1843307 /dev/urandom > "$D/presentation.pdf"
          head -c 7340032 /dev/urandom > "$D/backup-2026-11.tar.gz"
          STAMPS=('2026-11-03 09:12' '2026-11-21 18:40' '2026-11-12 11:05' '2026-11-23 16:27' '2026-11-02 08:55' '2026-11-19 10:31' '2026-11-23 09:41' '2026-11-17 14:08' '2026-10-28 13:22')
          i=0
          for f in "$D"/*; do touch -d "${STAMPS[$((i % ${#STAMPS[@]}))]}" "$f"; i=$((i + 1)); done
          # A login shell reads ~/.bash_profile: a short prompt and coloured ls.
          printf '%s\n' "PS1='\\[\\e[1;32m\\]demo@remohop\\[\\e[0m\\]:\\[\\e[1;34m\\]\\w\\[\\e[0m\\]\\\$ '" "alias ls='ls --color=auto'" > "$SHOTS_HOME/.bash_profile"

          # The screenshots host: own config, port and random password (masked, 0600 file, never echoed).
          HCFG="$RUNNER_TEMP/remohop-shots-config"
          rm -rf "$HCFG"; mkdir -p "$HCFG"; chmod 700 "$HCFG"
          umask 077
          PWFILE="$RUNNER_TEMP/remohop-shots-password"
          openssl rand -hex 16 > "$PWFILE"
          echo "::add-mask::$(cat "$PWFILE")"
          PW="$(cat "$PWFILE")"
          printf '%s\n%s\n' "$PW" "$PW" | REMOHOP_CONFIG_DIR="$HCFG" SHELL=/bin/bash "$REMOHOP" host passwd > /dev/null
          HLOG="$RUNNER_TEMP/remohop-shots-host.log"
          HOME="$SHOTS_HOME" SHELL=/bin/bash REMOHOP_CONFIG_DIR="$HCFG" setsid nohup "$REMOHOP" host --no-signal --listen "0.0.0.0:$SHOTS_HOST_PORT" > "$HLOG" 2>&1 < /dev/null &
          SHOTS_PID=$!
          cleanup() {
            kill "$SHOTS_PID" 2>/dev/null || true
            shred -u "$PWFILE" 2>/dev/null || rm -f "$PWFILE"
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null && break
            kill -0 "$SHOTS_PID" 2>/dev/null || break
            sleep 0.5
          done
          grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null || { sed -E 's/^( *Password: ).*/\1<hidden>/' "$HLOG" | cut -c1-300 | tail -n 20; echo '::error::the screenshots host did not start.'; exit 1; }
          echo "screenshots host up on UDP $SHOTS_HOST_PORT (home $SHOTS_HOME)"

          # A clean status bar (System UI demo mode) and gesture navigation (a thin bar, no buttons).
          "$ADB" shell settings put global sysui_demo_allowed 1 > /dev/null 2>&1 || true
          demo() { "$ADB" shell am broadcast -a com.android.systemui.demo -e command "$@" > /dev/null 2>&1 || true; }
          demo enter
          demo clock -e hhmm 0941
          demo battery -e level 100 -e plugged false -e powersave false
          demo network -e wifi show -e level 4 -e fully true
          demo network -e mobile show -e datatype none -e level 4 -e fully true
          demo notifications -e visible false
          demo status -e bluetooth hide -e alarm hide -e volume hide -e location hide -e mute hide -e speakerphone hide -e zen hide -e sync hide -e tty hide -e eri hide
          "$ADB" shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural > /dev/null 2>&1 || true
          echo "screen: $(timeout 10 "$ADB" shell wm size 2>/dev/null | tr -d '\r' | tail -n 1)"

          "$ADB" install -r -t -g "$APP_APK" > "$RUNNER_TEMP/shots-install.log" 2>&1 \
            && "$ADB" install -r -t "$TEST_APK" >> "$RUNNER_TEMP/shots-install.log" 2>&1 \
            || { tail -n 10 "$RUNNER_TEMP/shots-install.log"; echo '::error::installing the APKs failed.'; exit 1; }

          W="$RUNNER_TEMP/remohop-shots"; OUT="$RUNNER_TEMP/remohop-play-screenshots"
          rm -rf "$W" "$OUT"; mkdir -p "$W" "$OUT"
          DEVDIR="/sdcard/Android/data/$EXPECTED_APP_ID/files/store-shots"
          for L in en zh; do
            [[ "$L" == zh ]] && LOC=zh-CN || LOC=en-US
            "$ADB" logcat -c > /dev/null 2>&1 || true
            rc=0
            timeout 600 "$ADB" shell am instrument -w \
              -e class com.remohop.app.StoreScreenshotsTest -e remohop_shots 1 -e remohop_shots_lang "$L" \
              -e remohop_host "10.0.2.2:$SHOTS_HOST_PORT" -e remohop_password "$PW" \
              -e remohop_dir "$D" -e remohop_file README.txt \
              "$EXPECTED_APP_ID.test/androidx.test.runner.AndroidJUnitRunner" > "$W/instrument-$L.log" 2>&1 || rc=$?
            echo "--- $LOC: StoreScreenshotsTest progress (logcat tag RemoHopShots) ---"
            timeout 30 "$ADB" logcat -d -s RemoHopShots:I 2>/dev/null | grep -v '^--------' | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | cut -c1-300 | tail -n 30 || true
            if [[ $rc -ne 0 ]] || ! grep -q '^OK (1 test)' "$W/instrument-$L.log"; then
              grep -E 'FAILURES|AssertionError|Exception|Error|Tests run|OK \(|Process crashed' "$W/instrument-$L.log" | cut -c1-400 | head -n 20 || true
              echo '--- window focus ---'
              timeout 30 "$ADB" shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | cut -c1-200 | head -n 4 || true
              echo "::error::StoreScreenshotsTest ($LOC) failed (exit $rc)."
              exit 1
            fi
            if ! "$ADB" pull "$DEVDIR/$L" "$W/" > /dev/null 2>&1; then
              # Fallback: read the app's own directory as the app (debuggable build).
              mkdir -p "$W/$L"
              "$ADB" exec-out run-as "$EXPECTED_APP_ID" tar -cf - -C "$DEVDIR" "$L" | tar -xf - -C "$W" || { echo "::error::could not pull the $LOC screenshots."; exit 1; }
            fi
            mkdir -p "$OUT/$LOC"
            cp "$W/$L/"*.png "$OUT/$LOC/"
            echo "$LOC: $(ls "$OUT/$LOC" | tr '\n' ' ')"
          done

          # The test marks its bitmaps opaque, so the PNGs should be RGB; if one still has an alpha
          # channel, flatten it (Pillow, installed only then).
          ALPHA="$(python3 -c 'import sys;print(" ".join(p for p in sys.argv[1:] if open(p,"rb").read(26)[25] in (4, 6)))' "$OUT"/*/*.png)"
          if [[ -n "$ALPHA" ]]; then
            echo "flattening the alpha channel of: $ALPHA"
            python3 -m pip install --quiet --disable-pip-version-check pillow > /dev/null 2>&1 || { echo '::error::pip install pillow failed.'; exit 1; }
            python3 -c 'import sys
          from PIL import Image
          for p in sys.argv[1:]: Image.open(p).convert("RGB").save(p, optimize=True)' $ALPHA
          fi

          # Play's rules for phone screenshots: PNG or JPEG, each side 320-3840 px, at most 2:1, 8 MB;
          # here also exactly 9:16 and opaque (RGB, no alpha channel); at least 2 and at most 8 per
          # language, the same screens in both languages.
          python3 - "$OUT" <<'PY'
          import os, struct, sys
          out = sys.argv[1]
          sets, bad = {}, 0
          for loc in ('en-US', 'zh-CN'):
              names = sorted(n for n in os.listdir(os.path.join(out, loc)) if n.endswith('.png'))
              sets[loc] = names
              for n in names:
                  b = open(os.path.join(out, loc, n), 'rb').read()
                  if b[:8] != b'\x89PNG\r\n\x1a\n' or b[12:16] != b'IHDR':
                      print(f'{loc}/{n}: not a PNG'); bad += 1; continue
                  w, h, depth, ctype = struct.unpack('>IIBB', b[16:26])
                  ok = (320 <= min(w, h) and max(w, h) <= 3840 and max(w, h) <= 2 * min(w, h)
                        and w * 16 == h * 9 and depth == 8 and ctype == 2 and len(b) <= 8 * 1024 * 1024)
                  kind = {2: 'RGB', 6: 'RGBA'}.get(ctype, f'colour type {ctype}')
                  print(f'{loc}/{n}: {w}x{h} {kind} {depth}-bit, {len(b) // 1024} KB: {"OK" if ok else "REJECTED"}')
                  bad += 0 if ok else 1
              missing = {'1-connect.png', '2-terminal.png', '3-files.png', '5-settings.png'} - set(names)
              if missing:
                  print(f'{loc}: missing {sorted(missing)}'); bad += 1
              if not 2 <= len(names) <= 8:
                  print(f'{loc}: {len(names)} screenshots (Play takes 2 to 8)'); bad += 1
          if sets['en-US'] != sets['zh-CN']:
              print('the two languages have different screens'); bad += 1
          sys.exit(1 if bad else 0)
          PY
          N="$(ls "$OUT/en-US" | wc -l)"
          SIZE="$(python3 -c 'import struct,sys;b=open(sys.argv[1],"rb").read(26);print("%dx%d"%struct.unpack(">II",b[16:24]))' "$OUT/en-US/1-connect.png")"
          echo "Play screenshots: $N per language (en-US, zh-CN), $SIZE"
          echo "- Play phone screenshots: $N per language (en-US, zh-CN), $SIZE PNG, kept as the 7-day artifact \`remohop-play-screenshots\` (upload: sodesk-android-release.yml MODE=screenshots SHOTS_RUN_ID=${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Play screenshots (7 days)
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.screenshots == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-play-screenshots
          path: ${{ runner.temp }}/remohop-play-screenshots/
          retention-days: 7
          if-no-files-found: error

      - name: Stop the emulator
        if: always() && steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          timeout 30 "$SDK/platform-tools/adb" emu kill > /dev/null 2>&1 || true
          echo 'emulator stopped'

      - name: Stop the RemoHop host
        if: always() && steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/remohop-host.pid" ]]; then
            PID="$(cat "$RUNNER_TEMP/remohop-host.pid")"
            if kill -0 "$PID" 2>/dev/null; then
              if [[ "${{ job.status }}" == 'failure' ]]; then
                echo '--- remohop host log, tail ---'
                sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 25
              fi
              kill "$PID" 2>/dev/null || true
              sleep 1
              kill -9 "$PID" 2>/dev/null || true
              echo "remohop host stopped"
            else
              echo 'remohop host had already exited'
              sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 25 || true
            fi
          fi
          shred -u "$RUNNER_TEMP/remohop-host-password" 2>/dev/null || rm -f "$RUNNER_TEMP/remohop-host-password"

      - name: Summary
        if: success() && steps.layout.outputs.ready == 'true'
        run: |
          {
            [[ "${{ steps.request.outputs.emulator }}" == 'true' ]] && echo "- Instrumented tests on API $EMULATOR_API x86_64 emulator (smoke + real host: pair, terminal, files, download, clipboard, desktop, rotate, recreate, background): PASS"
            echo "- Java: \`$(java -version 2>&1 | head -1)\` · Go: \`$(go version | cut -d' ' -f3)\`"
            if [[ "${{ steps.request.outputs.screenshots }}" == 'true' ]]; then echo '- No signing; artifact: the Play screenshots only.'; else echo '- No signing; nothing uploaded.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
