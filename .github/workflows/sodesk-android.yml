# RemoHop Android app CI (controller app: native shell + WebView on an in-process Go gateway).
#
# Public CI repository -> source repository: env SOURCE_REPOSITORY. Copy this file to .github/workflows/ in the CI repo.
#
#   verify : JDK 17 + Android SDK (platform 36, build-tools 36.0.0, NDK r28c) + Go from go.mod ->
#            mobile/android/build.sh (gomobile bind of mobile/remohopcore -> app/libs/remohopcore.aar,
#            then Gradle): assembleDebug, JVM unit tests, lint, the instrumented test APK; then
#            (optional, on by default) the instrumented tests on an x86_64 emulator using the
#            runner's KVM: the smoke test, and HostSessionTest, which drives the real app
#            against a real `remohop host` started on the runner (built here from the checked-out
#            source, fixed random password read from a file, reachable at 10.0.2.2:PORT from
#            the emulator): pair, terminal, files + download hand-over, clipboard bridge,
#            desktop tab, rotation, recreate, background. Also runs the Go tests of
#            internal/mobile and mobile/remohopcore.
#   screenshots (request key SCREENSHOTS=true|only): Google Play phone screenshots of the real app on a
#            1080x1920 (9:16) emulator, connected to a second `remohop host` on the runner, set up as a
#            demo machine: host name studio-pc, user demo with a home of made-up files (/home/demo),
#            and an Xvfb + Xfce desktop the host streams (apt: xvfb xfce4 ffmpeg xclip wmctrl). The
#            app connects to studio-pc:PORT when the emulator resolves it. StoreScreenshotsTest runs
#            once per store language (en -> en-US, zh -> zh-CN; the app's own language setting),
#            with a clean status bar (System UI demo mode: 9:41, full battery and signal). The PNGs
#            (opaque RGB, no alpha) are checked for Play's size and aspect rules and kept as the
#            7-day artifact remohop-play-screenshots (<locale>/<n>-<screen>.png). The Play upload is
#            done by sodesk-android-release.yml MODE=screenshots, which takes this run's artifact.
#            true = after the instrumented tests, only = instead of them.
#   fgs video (request key FGS_VIDEO=true|only): the Google Play demo video of the app's
#            FOREGROUND_SERVICE_SPECIAL_USE declaration, on the same 1080x1920 emulator. A third
#            `remohop host` (its own port and password, a small demo home directory) and FgsDemoTest:
#            open the app, connect (Remember off), terminal output, Home, the notification shade with
#            the ongoing "Connected to <host>" notification, its Disconnect action, back in the app the
#            session has ended. Recorded with `screenrecord` (clean status bar: demo mode; touches
#            shown; animations on), checked with ffprobe, with one frame per step (PNG, OCR'd into the
#            log), a contact sheet and a GIF preview, kept as the artifact remohop-fgs-demo-video.
#            true = after the instrumented tests, only = instead of them (with SCREENSHOTS too).
#
# No signing, no Play credentials, no keystore. The APK stays on the runner; the only artifacts are
# the screenshots of SCREENSHOTS mode and the video of FGS_VIDEO mode (the app's screens with the
# demo hosts' files, no secrets: the host password is typed into a password field, shown as dots,
# and never into a field that is captured as text).
#
# Triggers: workflow_dispatch, or a push to main that changes ci-requests/sodesk-android.env
# (how the project's AI engineer requests a run). Only people with push access to this repo can
# trigger; never pull_request. The request file is plain KEY=VALUE text, parsed with strict
# patterns and never executed:
#
#   REF=main          # source repository branch, tag or SHA
#   EMULATOR=true     # optional; true (default) or false
#   SCREENSHOTS=false # optional; false (default), true (instrumented tests, then screenshots) or only
#   FGS_VIDEO=false   # optional; false (default), true (instrumented tests, then the FGS demo video) or only
#
# Safety rules (public repo, public logs): no pull_request triggers; third-party actions pinned
# to commit SHAs; TARGET_REPO_PAT is used only by the checkout step and not persisted; build and
# test output is limited to results and the tail of failures; private files are never printed.
# The host's password is random per run, kept in a 0600 file under RUNNER_TEMP, masked in the log,
# handed to the test as an instrumentation argument and never echoed; the app's gateway URL (it
# carries an access token) is never logged by the test. The host is stopped at the end of the job.
name: RemoHop Android

run-name: RemoHop Android · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-android.env)' || format('verify · {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = debug build, unit tests, lint (+ emulator tests). Signed builds come later.'
        required: true
        default: 'verify'
        type: choice
        options: [verify]
      ref:
        description: 'Source repository branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      emulator:
        description: 'Also run the instrumented tests (smoke + real host end to end) on an Android emulator (KVM)'
        required: true
        default: true
        type: boolean
      screenshots:
        description: 'Google Play phone screenshots (en-US, zh-CN) as a 7-day artifact: false, true (after the tests) or only (instead of them)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true', 'only']
      fgs_video:
        description: 'Google Play foreground-service demo video as an artifact: false, true (after the tests) or only (instead of them)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true', 'only']
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-android.env']

permissions:
  contents: read

concurrency:
  group: remohop-android-${{ inputs.ref || 'request' }}
  cancel-in-progress: true

env:
  # Source repository (public since the open-source release).
  SOURCE_REPOSITORY: readori/RemoHop
  PRIVATE_SOURCE_PATH: source
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  EMULATOR_API: '34'
  EXPECTED_APP_ID: com.remohop.app
  # The host the emulator test connects to (10.0.2.2 is the runner's loopback as the emulator sees it).
  E2E_HOST_PORT: '21118'
  E2E_FILE_NAME: remohop-e2e.txt
  # The screenshots host (SCREENSHOTS mode): its own port, password and demo home directory.
  SHOTS_HOST_PORT: '21119'
  SHOTS_HOME: /home/demo
  SHOTS_HOSTNAME: studio-pc
  # The FGS demo video host (FGS_VIDEO mode): its own port, password and demo home directory.
  FGS_HOST_PORT: '21120'

jobs:
  android:
    name: Build RemoHop Android
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        id: request
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_EMULATOR: ${{ inputs.emulator }}
          INPUT_SCREENSHOTS: ${{ inputs.screenshots }}
          INPUT_FGS_VIDEO: ${{ inputs.fgs_video }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-android.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/remohop-android-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-android.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
            EMULATOR="$(sed -n 's/^EMULATOR=//p' "$REQ" | head -n 1 | tr -d '\r')"
            EMULATOR="${EMULATOR:-true}"
            SCREENSHOTS="$(sed -n 's/^SCREENSHOTS=//p' "$REQ" | head -n 1 | tr -d '\r')"
            FGS_VIDEO="$(sed -n 's/^FGS_VIDEO=//p' "$REQ" | head -n 1 | tr -d '\r')"
            MODE=verify
          else
            SOURCE_REF="$INPUT_REF"
            EMULATOR="$INPUT_EMULATOR"
            SCREENSHOTS="$INPUT_SCREENSHOTS"
            FGS_VIDEO="$INPUT_FGS_VIDEO"
            MODE="$INPUT_MODE"
          fi
          SCREENSHOTS="${SCREENSHOTS:-false}"
          FGS_VIDEO="${FGS_VIDEO:-false}"
          [[ "$MODE" == 'verify' ]] || { echo "::error::Unsupported mode: $MODE"; exit 64; }
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ "$EMULATOR" == 'true' || "$EMULATOR" == 'false' ]] || { echo '::error::EMULATOR must be true or false.'; exit 64; }
          [[ "$SCREENSHOTS" =~ ^(false|true|only)$ ]] || { echo '::error::SCREENSHOTS must be false, true or only.'; exit 64; }
          [[ "$FGS_VIDEO" =~ ^(false|true|only)$ ]] || { echo '::error::FGS_VIDEO must be false, true or only.'; exit 64; }
          [[ -n "${TARGET_REPO_PAT:-}" ]] || {
            echo '::error::Missing public CI credential: TARGET_REPO_PAT (it must have read access to the source repository, env SOURCE_REPOSITORY).'
            exit 78
          }
          # tests: the instrumented tests; device: an emulator (and the hosts) for the tests, the screenshots and/or the video.
          TESTS=false; [[ "$EMULATOR" == 'true' && "$SCREENSHOTS" != 'only' && "$FGS_VIDEO" != 'only' ]] && TESTS=true
          SHOTS=false; [[ "$SCREENSHOTS" != 'false' ]] && SHOTS=true
          VIDEO=false; [[ "$FGS_VIDEO" != 'false' ]] && VIDEO=true
          DEVICE=false; [[ "$TESTS" == 'true' || "$SHOTS" == 'true' || "$VIDEO" == 'true' ]] && DEVICE=true
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          { echo "emulator=$TESTS"; echo "screenshots=$SHOTS"; echo "fgsvideo=$VIDEO"; echo "device=$DEVICE"; } >> "$GITHUB_OUTPUT"
          echo "Trigger: $EVENT_NAME · mode: $MODE · ref: $SOURCE_REF · instrumented tests: $TESTS · screenshots: $SCREENSHOTS · fgs video: $FGS_VIDEO"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Detect project layout (fail fast)
        id: layout
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          C="$(git rev-parse HEAD)"
          { echo '### RemoHop Android · verify'; echo; echo "- Source: \`$SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`)"; } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f mobile/android/build.sh ]]; then
            echo '::notice::mobile/android/build.sh is not on this ref: the Android app is not there yet. Nothing to verify.'
            echo '- Result: skipped, no Android app at this ref' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in go.mod mobile/go.mod mobile/remohopcore/remohopcore.go mobile/shared/remohop-mobile.js \
                   mobile/android/gradlew mobile/android/gradle/wrapper/gradle-wrapper.properties mobile/android/app/build.gradle.kts; do
            [[ -f "$f" ]] || { echo "::error::$f is missing."; exit 66; }
          done
          grep -q "applicationId = \"$EXPECTED_APP_ID\"" mobile/android/app/build.gradle.kts || { echo "::error::applicationId must be $EXPECTED_APP_ID"; exit 65; }
          # The wrapper must download a checksum-pinned Gradle.
          grep -q '^distributionSha256Sum=' mobile/android/gradle/wrapper/gradle-wrapper.properties || { echo '::error::gradle-wrapper.properties must pin distributionSha256Sum.'; exit 65; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Source ${C:0:8} · layout: PASS"

      - name: Set up JDK 17
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go (version from go.mod)
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.PRIVATE_SOURCE_PATH }}/go.mod
          cache: false

      - name: Install Android SDK packages
        if: steps.layout.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # ubuntu-latest ships the SDK and its command-line tools; add exactly what the app needs.
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKM" ]] || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 69; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION" "platform-tools" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || { tail -20 "$RUNNER_TEMP/sdkmanager.log"; echo '::error::sdkmanager failed.'; exit 1; }
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"; } >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME · NDK $ANDROID_NDK_VERSION"

      - name: Go tests of the mobile core
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          go version
          go vet ./internal/mobile
          go test -count=1 ./internal/mobile 2>&1 | cut -c1-2000 | tail -n 200
          (cd mobile && go vet ./... && go test -count=1 ./... 2>&1 | cut -c1-2000 | tail -n 100)
          echo '- Go: internal/mobile and mobile/remohopcore tests PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 22 (browser test driver)
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Headless-browser test of the injected script (phone viewport)
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          [[ -f mobile/shared/test/phone_test.mjs ]] || { echo '::notice::no phone_test.mjs on this ref; skipped.'; exit 0; }
          command -v google-chrome >/dev/null || { echo '::notice::no Chrome on this runner; skipped.'; exit 0; }
          # Harness and the real gateway page against an in-process host (no screenshots kept).
          REMOHOP_BROWSER_TEST=1 go test -count=1 -run TestPhoneBrowser -v ./internal/mobile 2>&1 | cut -c1-400 | tail -n 80
          echo '- Phone-viewport browser test: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: gomobile bind + Gradle (debug APK, unit tests, lint, test APK)
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.console=plain
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          if ! bash build.sh assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest > "$LOG" 2>&1; then
            grep -E '^e: |error:|FAILED|Lint found|tests completed' "$LOG" | cut -c1-400 | head -n 60
            # The cause follows the "What went wrong" line (build output only: no secrets in it).
            grep -E -A12 'What went wrong' "$LOG" | cut -c1-400 | head -n 50
            # Lint's own findings (errors only) from its XML report: id, message, file:line.
            for r in app/build/reports/lint-results-debug.xml; do
              [[ -f "$r" ]] || continue
              python3 - "$r" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for i in ET.parse(sys.argv[1]).getroot().iter('issue'):
              if i.get('severity') not in ('Error', 'Fatal'):
                  continue
              loc = i.find('location')
              where = '' if loc is None else '%s:%s' % (loc.get('file', '').split('/source/', 1)[-1], loc.get('line', '?'))
              print('lint %s [%s] %s: %s' % (i.get('severity'), i.get('id'), where, i.get('message', '')[:300]))
          PY
            done
            echo '::error::Android build failed.'
            exit 1
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$APK" ]] || { echo '::error::Debug APK was not produced.'; exit 65; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so' || { echo '::error::APK has no arm64 Go core.'; exit 65; }
          unzip -l "$APK" | grep -q 'lib/x86_64/libgojni.so' || { echo '::error::APK has no x86_64 Go core.'; exit 65; }
          unzip -l "$APK" | grep -q 'assets/remohop-mobile.js' || { echo '::error::APK has no injected script.'; exit 65; }
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          PKG="$("$AAPT" dump packagename "$APK")"
          [[ "$PKG" == "$EXPECTED_APP_ID" ]] || { echo "::error::Package name mismatch: $PKG"; exit 65; }
          TESTS="$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f'{t} tests, {f} failed')
          PY
          )"
          SIZE="$(du -h "$APK" | cut -f1)"
          echo "Debug APK: $SIZE · JVM unit tests: $TESTS · lint: PASS"
          echo "- Debug APK ($PKG): $SIZE · JVM unit tests: $TESTS · lint: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for the emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build remohop and start a host for the emulator test
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          REMOHOP="$RUNNER_TEMP/remohop"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$REMOHOP" ./cmd/remohop
          HCFG="$RUNNER_TEMP/remohop-host-config"
          FILES="$RUNNER_TEMP/remohop-e2e-files"
          rm -rf "$HCFG" "$FILES"
          mkdir -p "$HCFG" "$FILES"
          chmod 700 "$HCFG"
          # The file the test lists and downloads. Keep in step with HostSessionTest.FILE_TEXT.
          printf 'remohop android e2e payload 7f3a\n' > "$FILES/$E2E_FILE_NAME"
          # Random per run, masked, kept in a private file; never on a command line.
          umask 077
          PWFILE="$RUNNER_TEMP/remohop-host-password"
          openssl rand -hex 16 > "$PWFILE"
          echo "::add-mask::$(cat "$PWFILE")"
          # `remohop host passwd` reads the password from stdin when it is not a terminal
          # (printf is a shell builtin: nothing appears in a process list).
          export REMOHOP_CONFIG_DIR="$HCFG" SHELL=/bin/bash
          PW="$(cat "$PWFILE")"
          printf '%s\n%s\n' "$PW" "$PW" | "$REMOHOP" host passwd > /dev/null
          unset PW
          # No rendezvous server: the emulator dials 10.0.2.2:PORT directly. Bound to all interfaces
          # because the emulator's NAT reaches the runner through its loopback and its own address.
          setsid nohup "$REMOHOP" host --no-signal --listen "0.0.0.0:$E2E_HOST_PORT" > "$RUNNER_TEMP/remohop-host.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/remohop-host.pid"
          for i in $(seq 1 60); do
            grep -q 'RemoHop host ready' "$RUNNER_TEMP/remohop-host.log" 2>/dev/null && break
            kill -0 "$(cat "$RUNNER_TEMP/remohop-host.pid")" 2>/dev/null || break
            sleep 0.5
          done
          if ! grep -q 'RemoHop host ready' "$RUNNER_TEMP/remohop-host.log" 2>/dev/null; then
            sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 20
            echo '::error::remohop host did not start.'
            exit 1
          fi
          echo "remohop host is up on UDP $E2E_HOST_PORT (pid $(cat "$RUNNER_TEMP/remohop-host.pid")), fixed password set, test file prepared"

      - name: Start an Android emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        timeout-minutes: 15
        env:
          # Play phone screenshots must be at most 2:1; the classic Pixel profile is 1080x1920 (9:16),
          # also the size the FGS demo video is recorded at.
          AVD_DEVICE: ${{ (steps.request.outputs.screenshots == 'true' || steps.request.outputs.fgsvideo == 'true') && 'pixel' || 'pixel_6' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          IMG="system-images;android-${EMULATOR_API};google_apis;x86_64"
          { yes || true; } | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$IMG" > "$RUNNER_TEMP/sdk-emu.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/sdk-emu.log"; exit 1; }
          echo "system image installed"
          # One AVD directory for avdmanager and the emulator: the build may
          # have set ANDROID_USER_HOME/ANDROID_SDK_HOME, which the two read
          # differently.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$IMG" -d "$AVD_DEVICE" --force > "$RUNNER_TEMP/avd-create.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/avd-create.log"; exit 1; }
          echo "AVDs: $("$SDK/emulator/emulator" -list-avds | tr '\n' ' ') (device profile $AVD_DEVICE)"
          # Its own session, so it outlives this step (the tests and the screenshots are later steps).
          setsid nohup "$SDK/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 < /dev/null &
          ADB="$SDK/platform-tools/adb"
          echo "emulator started; waiting for the device"
          timeout 300 "$ADB" wait-for-device || { echo '::error::no device after 5 min'; tail -n 40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "device visible; waiting for boot"
          for i in $(seq 1 180); do
            [[ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && break
            sleep 2
          done
          [[ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] || { echo '::error::emulator did not boot'; tail -n 30 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "booted after about $((i * 2)) s"
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global "$s" 0; done
          # Keep the screen on and unlocked: the test needs a resumed, focused activity.
          "$ADB" shell svc power stayon true > /dev/null 2>&1 || true
          "$ADB" shell input keyevent 224 > /dev/null 2>&1 || true
          "$ADB" shell wm dismiss-keyguard > /dev/null 2>&1 || true
          "$ADB" shell input keyevent 82 > /dev/null 2>&1 || true
          # The emulator's own launcher sometimes hangs and its "not responding" dialog takes the
          # focus from the app under test; hide system error dialogs for the test run.
          "$ADB" shell settings put global hide_error_dialogs 1 > /dev/null 2>&1 || true
          echo "screen: $(timeout 10 "$ADB" shell wm size 2>/dev/null | tr -d '\r' | tail -n 1)"

      - name: Instrumented tests on an emulator (smoke + real host end to end, no uploads)
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.emulator == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          # The host started in an earlier step: address as the emulator sees the runner, password from the private file.
          E2E_PW="$(cat "$RUNNER_TEMP/remohop-host-password")"
          echo "::add-mask::$E2E_PW"
          kill -0 "$(cat "$RUNNER_TEMP/remohop-host.pid")" 2>/dev/null || { echo '::error::remohop host is not running.'; exit 1; }
          "$ADB" logcat -c > /dev/null 2>&1 || true
          rc=0
          timeout 900 ./gradlew --no-daemon -Dorg.gradle.console=plain connectedDebugAndroidTest \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_host=10.0.2.2:$E2E_HOST_PORT" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_password=$E2E_PW" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_dir=$RUNNER_TEMP/remohop-e2e-files" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_file=$E2E_FILE_NAME" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_background_seconds=10" \
            "-Pandroid.testInstrumentationRunnerArguments.remohop_require=true" \
            > "$RUNNER_TEMP/connected.log" 2>&1 || rc=$?
          unset E2E_PW
          [[ $rc -eq 124 ]] && echo '::error::connectedDebugAndroidTest timed out after 15 min' && tail -n 40 "$RUNNER_TEMP/connected.log"
          # Progress lines of the end-to-end test (its own tag; it never logs URLs or passwords).
          echo '--- HostSessionTest progress (logcat tag RemoHopE2E) ---'
          timeout 30 "$ADB" logcat -d -s RemoHopE2E:I 2>/dev/null | grep -v '^--------' | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | cut -c1-300 | tail -n 40 || true
          if [[ $rc -ne 0 ]]; then
            echo '--- window focus at failure ---'
            timeout 30 "$ADB" shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | cut -c1-200 | head -n 4 || true
          fi
          if [[ $rc -ne 0 ]]; then
            grep -E 'FAILED|Tests? .*failed|What went wrong|AssertionError|Exception|timed out' "$RUNNER_TEMP/connected.log" | cut -c1-400 | head -n 40
            exit 1
          fi
          grep -E 'Finished [0-9]+ tests|BUILD SUCCESSFUL' "$RUNNER_TEMP/connected.log" | tail -n 3
          # A skipped host test would be a false green: it must have run and passed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ran = skipped = failed = 0
          for p in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(p).getroot().iter('testcase'):
                  if tc.get('name') != 'hostSessionEndToEnd':
                      continue
                  ran += 1
                  skipped += 1 if tc.find('skipped') is not None else 0
                  failed += 1 if (tc.find('failure') is not None or tc.find('error') is not None) else 0
          print(f'HostSessionTest.hostSessionEndToEnd: ran={ran} skipped={skipped} failed={failed}')
          sys.exit(0 if ran == 1 and skipped == 0 and failed == 0 else 1)
          PY

      # SCREENSHOTS mode. A second remohop host on a demo machine (user demo, made-up files, an Xvfb
      # desktop), so every tab shows something meaningful; the app connects to it with a per-run
      # password (typed into the form after the connect screen was captured). StoreScreenshotsTest
      # captures each screen with UiAutomation into the app's external files directory; the PNGs are
      # pulled, checked against Play's rules and kept as an artifact for sodesk-android-release.yml.
      - name: Google Play screenshots (en-US, zh-CN) on the emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.screenshots == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          REMOHOP="$RUNNER_TEMP/remohop"
          [[ -f "$APP_APK" && -f "$TEST_APK" && -x "$REMOHOP" ]] || { echo '::error::debug APK, test APK or remohop binary missing.'; exit 65; }
          grep -rq 'class StoreScreenshotsTest' app/src/androidTest || { echo '::error::StoreScreenshotsTest is not on this ref.'; exit 66; }

          # The demo machine, as a user's computer would look: its own name (studio-pc, which the
          # emulator resolves through the runner's resolver), a user "demo" whose home holds made-up
          # files, and an Xvfb desktop (Xfce: a file manager, an editor and a terminal) that the
          # host streams. Nothing in it is real data.
          sudo apt-get update -q > "$RUNNER_TEMP/shots-apt.log" 2>&1 \
            && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
              xvfb xfce4 xfconf xfce4-settings xfce4-terminal mousepad greybird-gtk-theme elementary-xfce-icon-theme dbus-x11 ffmpeg feh xclip wmctrl fonts-dejavu-core >> "$RUNNER_TEMP/shots-apt.log" 2>&1 \
            || { tail -n 20 "$RUNNER_TEMP/shots-apt.log" | cut -c1-300; echo '::error::installing the demo desktop failed.'; exit 1; }
          IP="$(hostname -I | awk '{print $1}')"
          sudo hostnamectl set-hostname "$SHOTS_HOSTNAME" > /dev/null 2>&1 || sudo hostname "$SHOTS_HOSTNAME"
          echo "$IP $SHOTS_HOSTNAME" | sudo tee -a /etc/hosts > /dev/null
          id demo > /dev/null 2>&1 || sudo useradd -m -d "$SHOTS_HOME" -s /bin/bash demo
          asdemo() { sudo -u demo -H env HOME="$SHOTS_HOME" SHELL=/bin/bash DISPLAY=:99 "$@"; }

          # The demo home directory: the files the terminal, the Files tab and the desktop show.
          STAGE="$RUNNER_TEMP/shots-home"; rm -rf "$STAGE"; D="$STAGE/Documents"
          mkdir -p "$D/Invoices" "$D/Photos" "$D/Projects/website" "$D/Projects/app"
          printf 'RemoHop demo files\n' > "$D/README.txt"
          printf '# Weekly sync\n\n- Ship 1.0 to the store\n- New screenshots for Android and iOS\n- Plan the 1.1 roadmap\n\n## Next steps\n\n1. Final review on Thursday\n2. Send the press kit\n' > "$D/meeting-notes.md"
          printf 'month,orders,revenue\nJul,182,9310\nAug,205,10422\nSep,231,11870\n' > "$D/sales-q3.csv"
          head -c 48213 /dev/urandom > "$D/budget-2026.xlsx"
          head -c 1843307 /dev/urandom > "$D/presentation.pdf"
          head -c 7340032 /dev/urandom > "$D/backup-2026-11.tar.gz"
          STAMPS=('2026-11-03 09:12' '2026-11-21 18:40' '2026-11-12 11:05' '2026-11-23 16:27' '2026-11-02 08:55' '2026-11-19 10:31' '2026-11-23 09:41' '2026-11-17 14:08' '2026-10-28 13:22')
          i=0
          for f in "$D"/*; do touch -d "${STAMPS[$((i % ${#STAMPS[@]}))]}" "$f"; i=$((i + 1)); done
          # A login shell reads ~/.bash_profile: the usual coloured prompt (demo@studio-pc), and an ls
          # that fits a phone-wide terminal (coloured, human sizes, no owner/group columns, short dates).
          printf '%s\n' "PS1='\\[\\e[1;32m\\]\\u@\\h\\[\\e[0m\\]:\\[\\e[1;34m\\]\\w\\[\\e[0m\\]\\\$ '" \
            "alias ls=\"ls --color=auto -h -gG --time-style='+%b %d'\"" > "$STAGE/.bash_profile"
          sudo cp -a "$STAGE/." "$SHOTS_HOME/"
          sudo chown -R demo:demo "$SHOTS_HOME"
          # /home's default ACL would add a '+' to every mode string.
          sudo setfacl -R -b "$SHOTS_HOME" 2>/dev/null || true
          D="$SHOTS_HOME/Documents"

          # The desktop: Xvfb (16:9), Xfce's window manager and panel and a wallpaper, as demo on one D-Bus
          # session (no session manager, no first-run dialogs), and three windows placed by hand.
          Xvfb :99 -screen 0 1280x720x24 -ac -nolisten tcp > "$RUNNER_TEMP/shots-xvfb.log" 2>&1 &
          XVFB_PID=$!
          for _ in $(seq 1 50); do [[ -S /tmp/.X11-unix/X99 ]] && break; sleep 0.2; done
          DESK=/tmp/remohop-demo-desktop.sh
          cat > "$DESK" <<'SH'
          #!/bin/bash
          export XDG_CURRENT_DESKTOP=XFCE XDG_RUNTIME_DIR=/tmp/xdg-demo
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          # The panel's default layout, so it does not ask on its first start.
          C="$HOME/.config/xfce4/xfconf/xfce-perchannel-xml"; mkdir -p "$C"
          [[ -f /etc/xdg/xfce4/panel/default.xml ]] && cp /etc/xdg/xfce4/panel/default.xml "$C/xfce4-panel.xml"
          eval "$(dbus-launch --sh-syntax)"
          # The settings daemon on this bus (D-Bus activation alone did not start it here).
          for x in /usr/lib/*/xfce4/xfconf/xfconfd /usr/lib/xfce4/xfconf/xfconfd /usr/libexec/xfce4/xfconf/xfconfd /usr/libexec/xfconfd; do [[ -x "$x" ]] && { "$x" > /dev/null 2>&1 & break; }; done
          sleep 1
          xfsettingsd > /dev/null 2>&1 &
          sleep 1
          xfconf-query -c xsettings -p /Net/ThemeName -n -t string -s Greybird
          xfconf-query -c xsettings -p /Net/IconThemeName -n -t string -s elementary-xfce
          xfconf-query -c xfwm4 -p /general/theme -n -t string -s Greybird
          xfwm4 > /dev/null 2>&1 &
          sleep 1
          # A plain wallpaper (a gradient made here), set on the root window.
          ffmpeg -v error -f lavfi -i 'gradients=s=1280x720:c0=0x0e3b43:c1=0x3a9d8f:nb_colors=2:x0=0:y0=720:x1=1280:y1=0:type=linear' -frames:v 1 -y /tmp/xdg-demo/wall.png \
            && feh --no-fehbg --bg-fill /tmp/xdg-demo/wall.png
          # The panel only with its settings daemon (without it, it shows as an empty box).
          pgrep -u "$(id -u)" -x xfconfd > /dev/null && { xfce4-panel > /dev/null 2>&1 & }
          sleep 3
          cd "$HOME/Documents"
          thunar "$HOME/Documents" > /dev/null 2>&1 &
          mousepad meeting-notes.md > /dev/null 2>&1 &
          xfce4-terminal --working-directory="$HOME/Documents" -x bash -c "ls -lh -gG --color=auto --time-style='+%b %d'; exec bash -l" > /dev/null 2>&1 &
          sleep 5
          wmctrl -r Thunar -e 0,30,52,640,420
          wmctrl -r Mousepad -e 0,600,64,-1,-1
          wmctrl -r Terminal -e 0,320,330,680,340
          wmctrl -a Terminal
          echo "$(pgrep -l -u "$(id -u)" 'xfconfd|xfsettingsd|xfwm4|xfce4-panel' | awk '{print $2}' | tr '\n' ' ')| windows: $(wmctrl -l | awk '{$1=$2=$3=""; print}' | sed 's/^ *//' | tr '\n' ';' | cut -c1-200)"
          SH
          chmod 755 "$DESK"
          echo "demo desktop: $(asdemo timeout 60 "$DESK" 2> "$RUNNER_TEMP/shots-desktop.log")"
          [[ -s "$RUNNER_TEMP/shots-desktop.log" ]] && { echo '--- desktop start, messages ---'; cut -c1-200 "$RUNNER_TEMP/shots-desktop.log" | tail -n 15; }

          # The screenshots host, run as demo with the desktop: own config, port and random password
          # (masked, 0600 file, never echoed).
          sudo install -m 755 "$REMOHOP" /usr/local/bin/remohop
          HCFG=/var/tmp/remohop-shots-config
          sudo rm -rf "$HCFG"; sudo install -d -o demo -g demo -m 700 "$HCFG"
          umask 077
          PWFILE="$RUNNER_TEMP/remohop-shots-password"
          openssl rand -hex 16 > "$PWFILE"
          echo "::add-mask::$(cat "$PWFILE")"
          PW="$(cat "$PWFILE")"
          printf '%s\n%s\n' "$PW" "$PW" | asdemo REMOHOP_CONFIG_DIR="$HCFG" /usr/local/bin/remohop host passwd > /dev/null
          HLOG="$RUNNER_TEMP/remohop-shots-host.log"
          asdemo REMOHOP_CONFIG_DIR="$HCFG" setsid /usr/local/bin/remohop host --no-signal --listen "0.0.0.0:$SHOTS_HOST_PORT" > "$HLOG" 2>&1 < /dev/null &
          SHOTS_PID=$!
          cleanup() {
            sudo pkill -u demo 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
            shred -u "$PWFILE" 2>/dev/null || rm -f "$PWFILE"
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null && break
            kill -0 "$SHOTS_PID" 2>/dev/null || break
            sleep 0.5
          done
          grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null || { sed -E 's/^( *Password: ).*/\1<hidden>/' "$HLOG" | cut -c1-300 | tail -n 20; echo '::error::the screenshots host did not start.'; exit 1; }
          echo "screenshots host up on UDP $SHOTS_HOST_PORT (user demo, home $SHOTS_HOME, display :99)"
          # The app connects by the machine's name when the emulator resolves it, else by the address.
          TARGET="10.0.2.2:$SHOTS_HOST_PORT"
          RESOLVED="$(timeout 20 "$ADB" shell ping -c 1 -W 2 "$SHOTS_HOSTNAME" 2>&1 | head -n 1 | tr -d '\r' || true)"
          if [[ "$RESOLVED" =~ ^PING\ [^\ ]+\ \(([0-9.]+)\) ]]; then
            TARGET="$SHOTS_HOSTNAME:$SHOTS_HOST_PORT"; echo "the emulator resolves $SHOTS_HOSTNAME to ${BASH_REMATCH[1]}: target $TARGET"
          else
            echo "::warning::the emulator does not resolve $SHOTS_HOSTNAME ($(cut -c1-120 <<<"$RESOLVED")); target $TARGET"
          fi

          # A clean status bar (System UI demo mode) and gesture navigation (a thin bar, no buttons).
          "$ADB" shell settings put global sysui_demo_allowed 1 > /dev/null 2>&1 || true
          demo() { "$ADB" shell am broadcast -a com.android.systemui.demo -e command "$@" > /dev/null 2>&1 || true; }
          demo enter
          demo clock -e hhmm 0941
          demo battery -e level 100 -e plugged false -e powersave false
          demo network -e wifi show -e level 4 -e fully true
          demo network -e mobile show -e datatype none -e level 4 -e fully true
          demo notifications -e visible false
          demo status -e bluetooth hide -e alarm hide -e volume hide -e location hide -e mute hide -e speakerphone hide -e zen hide -e sync hide -e tty hide -e eri hide
          "$ADB" shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural > /dev/null 2>&1 || true
          # No "Viewing full screen" hint over the full-screen desktop (a user sees it once).
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed > /dev/null 2>&1 || true
          echo "screen: $(timeout 10 "$ADB" shell wm size 2>/dev/null | tr -d '\r' | tail -n 1)"

          "$ADB" install -r -t -g "$APP_APK" > "$RUNNER_TEMP/shots-install.log" 2>&1 \
            && "$ADB" install -r -t "$TEST_APK" >> "$RUNNER_TEMP/shots-install.log" 2>&1 \
            || { tail -n 10 "$RUNNER_TEMP/shots-install.log"; echo '::error::installing the APKs failed.'; exit 1; }

          W="$RUNNER_TEMP/remohop-shots"; OUT="$RUNNER_TEMP/remohop-play-screenshots"
          rm -rf "$W" "$OUT"; mkdir -p "$W" "$OUT"
          DEVDIR="/sdcard/Android/data/$EXPECTED_APP_ID/files/store-shots"
          for L in en zh; do
            [[ "$L" == zh ]] && LOC=zh-CN || LOC=en-US
            # Something on the host's clipboard for the Clipboard tab to fetch (made up, in the pass's language).
            if [[ "$L" == zh ]]; then CLIP='会议改到周四上午 10:30，4B 会议室。议程见 Documents/meeting-notes.md'
            else CLIP='Meeting moved to Thursday 10:30, room 4B. Agenda: Documents/meeting-notes.md'; fi
            printf '%s' "$CLIP" | timeout 10 sudo -u demo -H env DISPLAY=:99 xclip -selection clipboard > /dev/null 2>&1 || echo "::warning::could not set the host's clipboard"
            "$ADB" logcat -c > /dev/null 2>&1 || true
            rc=0
            timeout 600 "$ADB" shell am instrument -w \
              -e class com.remohop.app.StoreScreenshotsTest -e remohop_shots 1 -e remohop_shots_lang "$L" \
              -e remohop_host "$TARGET" -e remohop_password "$PW" \
              -e remohop_dir "$D" -e remohop_file README.txt \
              "$EXPECTED_APP_ID.test/androidx.test.runner.AndroidJUnitRunner" > "$W/instrument-$L.log" 2>&1 || rc=$?
            echo "--- $LOC: StoreScreenshotsTest progress (logcat tag RemoHopShots) ---"
            timeout 30 "$ADB" logcat -d -s RemoHopShots:I 2>/dev/null | grep -v '^--------' | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | cut -c1-300 | tail -n 30 || true
            if [[ $rc -ne 0 ]] || ! grep -q '^OK (1 test)' "$W/instrument-$L.log"; then
              grep -E 'FAILURES|AssertionError|Exception|Error|Tests run|OK \(|Process crashed' "$W/instrument-$L.log" | cut -c1-400 | head -n 20 || true
              # A crash: Android's crash buffer (Java and native) and the Go core's log, with any
              # gateway access token in a URL redacted.
              echo '--- crash buffer / Go log (tail) ---'
              { timeout 30 "$ADB" logcat -d -b crash 2>/dev/null; timeout 30 "$ADB" logcat -d -s GoLog:* 2>/dev/null | grep -E 'panic|fatal|goroutine|\.go:[0-9]+' ; } \
                | sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_=-]{16,}#\1<token>#g; s#([?&](t|token|k)=)[A-Za-z0-9_=-]+#\1<token>#g' | grep -v '^--------' | cut -c1-300 | tail -n 60 || true
              # Why the system ended the process, if it did (low memory killer, ANR, signal).
              echo '--- process end (ActivityManager / lowmemorykiller) ---'
              timeout 30 "$ADB" logcat -d 2>/dev/null | grep -E "$EXPECTED_APP_ID" | grep -iE 'has died|Killing|lowmemorykiller|lmkd|ANR in|Force stopping|signal [0-9]+|Fatal signal|WebView.*(crash|gone)' \
                | sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_=-]{16,}#\1<token>#g' | cut -c1-300 | tail -n 20 || true
              echo "memory: $(timeout 10 "$ADB" shell cat /proc/meminfo 2>/dev/null | grep -E 'MemTotal|MemAvailable' | tr -s ' \r\n' ' ')"
              echo '--- window focus ---'
              timeout 30 "$ADB" shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | cut -c1-200 | head -n 4 || true
              echo "::error::StoreScreenshotsTest ($LOC) failed (exit $rc)."
              exit 1
            fi
            if ! "$ADB" pull "$DEVDIR/$L" "$W/" > /dev/null 2>&1; then
              # Fallback: read the app's own directory as the app (debuggable build).
              mkdir -p "$W/$L"
              "$ADB" exec-out run-as "$EXPECTED_APP_ID" tar -cf - -C "$DEVDIR" "$L" | tar -xf - -C "$W" || { echo "::error::could not pull the $LOC screenshots."; exit 1; }
            fi
            mkdir -p "$OUT/$LOC"
            cp "$W/$L/"*.png "$OUT/$LOC/"
            echo "$LOC: $(ls "$OUT/$LOC" | tr '\n' ' ')"
          done

          # The test marks its bitmaps opaque, so the PNGs should be RGB; if one still has an alpha
          # channel, flatten it (Pillow, installed only then).
          ALPHA="$(python3 -c 'import sys;print(" ".join(p for p in sys.argv[1:] if open(p,"rb").read(26)[25] in (4, 6)))' "$OUT"/*/*.png)"
          if [[ -n "$ALPHA" ]]; then
            echo "flattening the alpha channel of: $ALPHA"
            python3 -m pip install --quiet --disable-pip-version-check pillow > /dev/null 2>&1 || { echo '::error::pip install pillow failed.'; exit 1; }
            python3 -c 'import sys
          from PIL import Image
          for p in sys.argv[1:]: Image.open(p).convert("RGB").save(p, optimize=True)' $ALPHA
          fi

          # Play's rules for phone screenshots: PNG or JPEG, each side 320-3840 px, at most 2:1, 8 MB;
          # here also exactly 9:16 (16:9 for the landscape desktop) and opaque (RGB, no alpha channel); at least 2 and at most 8 per
          # language, the same screens in both languages.
          python3 - "$OUT" <<'PY'
          import os, struct, sys
          out = sys.argv[1]
          sets, bad = {}, 0
          for loc in ('en-US', 'zh-CN'):
              names = sorted(n for n in os.listdir(os.path.join(out, loc)) if n.endswith('.png'))
              sets[loc] = names
              for n in names:
                  b = open(os.path.join(out, loc, n), 'rb').read()
                  if b[:8] != b'\x89PNG\r\n\x1a\n' or b[12:16] != b'IHDR':
                      print(f'{loc}/{n}: not a PNG'); bad += 1; continue
                  w, h, depth, ctype = struct.unpack('>IIBB', b[16:26])
                  ok = (320 <= min(w, h) and max(w, h) <= 3840 and max(w, h) <= 2 * min(w, h)
                        and (w * 16 == h * 9 or w * 9 == h * 16) and depth == 8 and ctype == 2 and len(b) <= 8 * 1024 * 1024)
                  kind = {2: 'RGB', 6: 'RGBA'}.get(ctype, f'colour type {ctype}')
                  print(f'{loc}/{n}: {w}x{h} {kind} {depth}-bit, {len(b) // 1024} KB: {"OK" if ok else "REJECTED"}')
                  bad += 0 if ok else 1
              missing = {'1-connect.png', '2-terminal.png', '3-files.png', '5-settings.png'} - set(names)
              if missing:
                  print(f'{loc}: missing {sorted(missing)}'); bad += 1
              if not 2 <= len(names) <= 8:
                  print(f'{loc}: {len(names)} screenshots (Play takes 2 to 8)'); bad += 1
          if sets['en-US'] != sets['zh-CN']:
              print('the two languages have different screens'); bad += 1
          sys.exit(1 if bad else 0)
          PY
          N="$(ls "$OUT/en-US" | wc -l)"
          SIZE="$(python3 -c 'import struct,sys;b=open(sys.argv[1],"rb").read(26);print("%dx%d"%struct.unpack(">II",b[16:24]))' "$OUT/en-US/1-connect.png")"
          echo "Play screenshots: $N per language (en-US, zh-CN), $SIZE"
          echo "- Play phone screenshots: $N per language (en-US, zh-CN), $SIZE PNG, kept as the 7-day artifact \`remohop-play-screenshots\` (upload: sodesk-android-release.yml MODE=screenshots SHOTS_RUN_ID=${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Play screenshots (7 days)
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.screenshots == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-play-screenshots
          path: ${{ runner.temp }}/remohop-play-screenshots/
          retention-days: 7
          if-no-files-found: error

      # FGS_VIDEO mode. The Play Console video for the FOREGROUND_SERVICE_SPECIAL_USE declaration:
      # FgsDemoTest drives the flow while `screenrecord` records the screen. A third remohop host with
      # a small demo home directory (made-up files), its own port and per-run password. The test logs
      # each step with the device's uptime; the recording's own start uptime maps them onto the video,
      # and one frame per step is extracted (and OCR'd into this log, so the run shows what is on screen).
      - name: Google Play foreground-service demo video on the emulator
        if: steps.layout.outputs.ready == 'true' && steps.request.outputs.fgsvideo == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/android
        timeout-minutes: 20
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ADB="$SDK/platform-tools/adb"
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          REMOHOP="$RUNNER_TEMP/remohop"
          [[ -f "$APP_APK" && -f "$TEST_APK" && -x "$REMOHOP" ]] || { echo '::error::debug APK, test APK or remohop binary missing.'; exit 65; }
          grep -rq 'class FgsDemoTest' app/src/androidTest || { echo '::error::FgsDemoTest is not on this ref.'; exit 66; }
          W="$RUNNER_TEMP/remohop-fgs"; OUT="$RUNNER_TEMP/remohop-fgs-demo-video"
          rm -rf "$W" "$OUT"; mkdir -p "$W" "$OUT/frames"

          # The demo home directory: what the terminal lists (made-up content).
          VH="$RUNNER_TEMP/remohop-video-home"
          rm -rf "$VH"; mkdir -p "$VH/Documents/Projects" "$VH/Documents/Photos"
          D="$VH/Documents"
          printf 'RemoHop demo files\n' > "$D/README.txt"
          printf '# Weekly sync\n\n- Ship 1.0 to the store\n' > "$D/meeting-notes.md"
          printf 'month,orders,revenue\nJul,182,9310\nAug,205,10422\nSep,231,11870\n' > "$D/sales-q3.csv"
          head -c 1843307 /dev/urandom > "$D/presentation.pdf"
          STAMPS=('2026-11-03 09:12' '2026-11-21 18:40' '2026-11-12 11:05' '2026-11-23 16:27' '2026-11-02 08:55' '2026-11-19 10:31')
          i=0
          for f in "$D"/*; do touch -d "${STAMPS[$((i % ${#STAMPS[@]}))]}" "$f"; i=$((i + 1)); done
          printf '%s\n' "PS1='\\[\\e[1;32m\\]demo@remohop\\[\\e[0m\\]:\\[\\e[1;34m\\]\\w\\[\\e[0m\\]\\\$ '" \
            "alias ls=\"ls --color=auto -h -gG --time-style='+%b %d'\"" > "$VH/.bash_profile"
          setfacl -R -b "$VH" 2>/dev/null || true

          # The video host: own config, port and random password (masked, 0600 file, never echoed).
          HCFG="$RUNNER_TEMP/remohop-fgs-config"
          rm -rf "$HCFG"; mkdir -p "$HCFG"; chmod 700 "$HCFG"
          PWFILE="$RUNNER_TEMP/remohop-fgs-password"
          (umask 077; openssl rand -hex 16 > "$PWFILE")
          echo "::add-mask::$(cat "$PWFILE")"
          PW="$(cat "$PWFILE")"
          printf '%s\n%s\n' "$PW" "$PW" | REMOHOP_CONFIG_DIR="$HCFG" SHELL=/bin/bash "$REMOHOP" host passwd > /dev/null
          HLOG="$RUNNER_TEMP/remohop-fgs-host.log"
          HOME="$VH" SHELL=/bin/bash REMOHOP_CONFIG_DIR="$HCFG" setsid nohup "$REMOHOP" host --no-signal --listen "0.0.0.0:$FGS_HOST_PORT" > "$HLOG" 2>&1 < /dev/null &
          FGS_PID=$!
          REC_PID=''
          cleanup() {
            [[ -n "$REC_PID" ]] && kill "$REC_PID" 2>/dev/null || true
            kill "$FGS_PID" 2>/dev/null || true
            shred -u "$PWFILE" 2>/dev/null || rm -f "$PWFILE"
            "$ADB" shell settings put system show_touches 0 > /dev/null 2>&1 || true
            for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global "$s" 0 > /dev/null 2>&1 || true; done
            "$ADB" shell am broadcast -a com.android.systemui.demo -e command exit > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null && break
            kill -0 "$FGS_PID" 2>/dev/null || break
            sleep 0.5
          done
          grep -q 'RemoHop host ready' "$HLOG" 2>/dev/null || { sed -E 's/^( *Password: ).*/\1<hidden>/' "$HLOG" | cut -c1-300 | tail -n 20; echo '::error::the video host did not start.'; exit 1; }
          echo "video host up on UDP $FGS_HOST_PORT (demo home)"

          # ffmpeg (ffprobe, frames, GIF) and tesseract (frame text into the log), if the image lacks them.
          if ! command -v ffmpeg > /dev/null || ! command -v tesseract > /dev/null; then
            sudo apt-get update -qq > /dev/null 2>&1 || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg tesseract-ocr > "$W/apt.log" 2>&1 || { tail -n 10 "$W/apt.log"; echo '::warning::installing ffmpeg/tesseract failed; the video is kept without checks.'; }
          fi

          # The screen as a user sees it: animations on, touches shown, a clean status bar (System UI
          # demo mode, notification icons visible), gesture navigation.
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global "$s" 1 > /dev/null 2>&1 || true; done
          "$ADB" shell settings put system show_touches 1 > /dev/null 2>&1 || true
          "$ADB" shell settings put global sysui_demo_allowed 1 > /dev/null 2>&1 || true
          demo() { "$ADB" shell am broadcast -a com.android.systemui.demo -e command "$@" > /dev/null 2>&1 || true; }
          demo enter
          demo clock -e hhmm 0941
          demo battery -e level 100 -e plugged false -e powersave false
          demo network -e wifi show -e level 4 -e fully true
          demo network -e mobile show -e datatype none -e level 4 -e fully true
          demo notifications -e visible true
          demo status -e bluetooth hide -e alarm hide -e volume hide -e location hide -e mute hide -e speakerphone hide -e zen hide -e sync hide -e tty hide -e eri hide
          "$ADB" shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural > /dev/null 2>&1 || true
          "$ADB" shell cmd statusbar collapse > /dev/null 2>&1 || true
          echo "screen: $(timeout 10 "$ADB" shell wm size 2>/dev/null | tr -d '\r' | tail -n 1)"

          "$ADB" install -r -t -g "$APP_APK" > "$W/install.log" 2>&1 \
            && "$ADB" install -r -t "$TEST_APK" >> "$W/install.log" 2>&1 \
            || { tail -n 10 "$W/install.log"; echo '::error::installing the APKs failed.'; exit 1; }
          "$ADB" shell input keyevent KEYCODE_HOME > /dev/null 2>&1 || true
          # The emulator's own notifications ("Serial console enabled", the physical keyboard) are not
          # part of the demo: snooze what can be snoozed (keys hold '|', hence the inner quotes).
          SN=0
          while read -r k; do
            [[ -n "$k" && "$k" != *"|$EXPECTED_APP_ID|"* ]] || continue
            "$ADB" shell -n "cmd notification snooze --for 3600000 '$k'" > /dev/null 2>&1 && SN=$((SN + 1)) || true
          done < <("$ADB" shell -n cmd notification list 2>/dev/null | tr -d '\r')
          echo "snoozed $SN other notification(s); still posted: $("$ADB" shell -n cmd notification list 2>/dev/null | tr -d '\r' | grep -c . || true)"
          sleep 2
          "$ADB" logcat -c > /dev/null 2>&1 || true

          # Record (screenrecord stops by itself after 3 minutes; the demo takes well under one). The
          # first output line is the device uptime at the start, the zero of the video's timeline.
          "$ADB" shell rm -f /sdcard/fgs.mp4 > /dev/null 2>&1 || true
          "$ADB" shell 'cat /proc/uptime; exec screenrecord --bit-rate 6000000 --size 1080x1920 /sdcard/fgs.mp4' > "$W/screenrecord.log" 2>&1 &
          REC_PID=$!
          sleep 2
          "$ADB" shell pidof screenrecord > /dev/null 2>&1 || { cat "$W/screenrecord.log" | cut -c1-300 | tail -n 10; echo '::error::screenrecord did not start.'; exit 1; }
          rc=0
          timeout 170 "$ADB" shell am instrument -w \
            -e class com.remohop.app.FgsDemoTest -e remohop_fgs_demo 1 \
            -e remohop_host "10.0.2.2:$FGS_HOST_PORT" -e remohop_password "$PW" \
            -e remohop_dir "'~/Documents'" -e remohop_file README.txt \
            "$EXPECTED_APP_ID.test/androidx.test.runner.AndroidJUnitRunner" > "$W/instrument.log" 2>&1 || rc=$?
          unset PW
          sleep 1
          # SIGINT lets screenrecord finish the MP4 (moov atom); then wait for it to exit.
          "$ADB" shell 'pkill -INT screenrecord || kill -2 $(pidof screenrecord)' > /dev/null 2>&1 || true
          for _ in $(seq 1 30); do kill -0 "$REC_PID" 2>/dev/null || break; sleep 0.5; done
          kill "$REC_PID" 2>/dev/null || true
          REC_PID=''
          sleep 1
          VIDEO="$OUT/remohop-fgs-demo.mp4"
          "$ADB" pull /sdcard/fgs.mp4 "$VIDEO" > /dev/null 2>&1 || echo '::warning::could not pull the recording.'

          echo '--- FgsDemoTest progress (logcat tag RemoHopFgs) ---'
          timeout 30 "$ADB" logcat -d -s RemoHopFgs:I 2>/dev/null | grep -v '^--------' | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | cut -c1-400 | tail -n 40 | tee "$W/progress.log" || true
          ok=true
          if [[ $rc -ne 0 ]] || ! grep -q '^OK (1 test)' "$W/instrument.log" || ! grep -q 'stage end ' "$W/progress.log"; then
            ok=false
            grep -E 'FAILURES|AssertionError|Exception|Error|Tests run|OK \(|Process crashed' "$W/instrument.log" | cut -c1-400 | head -n 20 || true
            echo '--- crash buffer (tail) ---'
            timeout 30 "$ADB" logcat -d -b crash 2>/dev/null | sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_=-]{16,}#\1<token>#g' | grep -v '^--------' | cut -c1-300 | tail -n 30 || true
            echo '--- window focus ---'
            timeout 30 "$ADB" shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | cut -c1-200 | head -n 4 || true
          fi

          # The video: container, codec, size, length; one frame per step; a contact sheet; a GIF.
          if [[ -s "$VIDEO" ]] && command -v ffprobe > /dev/null; then
            INFO="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" | tr '\n' ' ')"
            echo "video: $INFO"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
            SIZE="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$VIDEO")"
            UP0="$(head -n 1 "$W/screenrecord.log" | awk '{print $1}')"
            # The steps on the raw recording's timeline ("stage <name> uptime=<ms>" minus its start),
            # then the published cut: from the home screen just before the first step to the end.
            sed -nE 's/.*stage ([a-z-]+) uptime=([0-9]+).*/\1 \2/p' "$W/progress.log" > "$W/stages.txt"
            python3 - "$W/stages.txt" "$UP0" "$DUR" > "$W/plan.txt" <<'PY'
          import sys
          rows = [l.split() for l in open(sys.argv[1]) if l.strip()]
          up0, dur = float(sys.argv[2]), float(sys.argv[3])
          t = [max(0.0, int(u) / 1000 - up0) for _, u in rows]
          # The test shows the home screen for 1.5 s before its first step: open on it.
          start = min(max(t[0] - 1.2, 0.0), dur) if t else 0.0
          print('start %.2f' % start)
          for i, (name, _) in enumerate(rows):
              # A representative frame: halfway to the next step (or 2 s on for the last).
              mid = (t[i] + t[i + 1]) / 2 if i + 1 < len(t) else t[i] + 2
              print('%s %.1f %.2f' % (name, max(0.0, t[i] - start), min(max(mid - start, 0.0), dur - start - 0.5)))
          PY
            START="$(sed -n 's/^start //p' "$W/plan.txt")"
            RAW="$OUT/remohop-fgs-demo-raw.mp4"
            mv "$VIDEO" "$RAW"
            # Re-encoded at a constant 30 fps (H.264 high, yuv420p, faststart): what video sites expect.
            if ! ffmpeg -nostdin -v error -y -ss "$START" -i "$RAW" -c:v libx264 -preset slow -crf 18 -r 30 -pix_fmt yuv420p -movflags +faststart -an "$VIDEO"; then
              echo '::warning::the cut failed; publishing the raw recording.'; cp "$RAW" "$VIDEO"; START=0
            fi
            INFO="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO" | tr '\n' ' ')"
            echo "published video (cut at ${START}s of the raw recording): $INFO"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
            SIZE="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$VIDEO")"
            : > "$OUT/chapters.txt"
            n=0
            while read -r name t ft; do
              n=$((n + 1))
              printf '%5ss  %s\n' "$t" "$name" >> "$OUT/chapters.txt"
              f="$OUT/frames/$(printf '%02d' "$n")-$name.png"
              ffmpeg -nostdin -v error -y -ss "$ft" -i "$VIDEO" -frames:v 1 "$f" || true
              [[ -s "$f" ]] || { echo "frame ${ft}s ($name): none"; continue; }
              if command -v tesseract > /dev/null; then
                TXT="$({ tesseract "$f" - --psm 11 2>/dev/null || true; } | tr -s ' \n\r\t' ' ' | cut -c1-360)"
                echo "frame ${ft}s ($name): ${TXT}"
              fi
            done < <(grep -v '^start ' "$W/plan.txt")
            echo '--- steps on the published video timeline ---'
            cat "$OUT/chapters.txt"
            ffmpeg -nostdin -v error -y -i "$VIDEO" -vf 'fps=1/2,scale=216:-1,tile=8x3' -frames:v 1 "$OUT/contact-sheet.png" || true
            ffmpeg -nostdin -v error -y -i "$VIDEO" -vf 'fps=8,scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse' "$OUT/remohop-fgs-demo-preview.gif" || true
            echo "$INFO" > "$OUT/video-info.txt"
            ls -l "$OUT" "$OUT/frames" | awk 'NR>1{print $5, $NF}'
            echo "- FGS demo video: ${SIZE}, $(printf '%.1f' "$DUR") s, kept as the artifact \`remohop-fgs-demo-video\` (remohop-fgs-demo.mp4, a GIF preview, one frame per step, chapters.txt)" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -s "$VIDEO" ]]; then
            echo "- FGS demo video: $(du -h "$VIDEO" | cut -f1), kept as the artifact \`remohop-fgs-demo-video\` (not checked: no ffprobe)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::no recording.'; ok=false
          fi
          [[ "$ok" == 'true' ]] || { echo "::error::FgsDemoTest failed (exit $rc); the recording so far is in the artifact."; exit 1; }

      - name: Keep the FGS demo video
        if: always() && steps.layout.outputs.ready == 'true' && steps.request.outputs.fgsvideo == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-fgs-demo-video
          path: ${{ runner.temp }}/remohop-fgs-demo-video/
          # Capped to the repository's maximum artifact retention (download it from the run page in time).
          retention-days: 90
          if-no-files-found: warn

      - name: Stop the emulator
        if: always() && steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          timeout 30 "$SDK/platform-tools/adb" emu kill > /dev/null 2>&1 || true
          echo 'emulator stopped'

      - name: Stop the RemoHop host
        if: always() && steps.layout.outputs.ready == 'true' && steps.request.outputs.device == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/remohop-host.pid" ]]; then
            PID="$(cat "$RUNNER_TEMP/remohop-host.pid")"
            if kill -0 "$PID" 2>/dev/null; then
              if [[ "${{ job.status }}" == 'failure' ]]; then
                echo '--- remohop host log, tail ---'
                sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 25
              fi
              kill "$PID" 2>/dev/null || true
              sleep 1
              kill -9 "$PID" 2>/dev/null || true
              echo "remohop host stopped"
            else
              echo 'remohop host had already exited'
              sed -E 's/^( *Password: ).*/\1<hidden>/' "$RUNNER_TEMP/remohop-host.log" | cut -c1-300 | tail -n 25 || true
            fi
          fi
          shred -u "$RUNNER_TEMP/remohop-host-password" 2>/dev/null || rm -f "$RUNNER_TEMP/remohop-host-password"

      - name: Summary
        if: success() && steps.layout.outputs.ready == 'true'
        run: |
          {
            [[ "${{ steps.request.outputs.emulator }}" == 'true' ]] && echo "- Instrumented tests on API $EMULATOR_API x86_64 emulator (smoke + real host: pair, terminal, files, download, clipboard, desktop, rotate, recreate, background): PASS"
            echo "- Java: \`$(java -version 2>&1 | head -1)\` · Go: \`$(go version | cut -d' ' -f3)\`"
            A=''
            [[ "${{ steps.request.outputs.screenshots }}" == 'true' ]] && A='the Play screenshots'
            [[ "${{ steps.request.outputs.fgsvideo }}" == 'true' ]] && A="${A:+$A and }the FGS demo video"
            if [[ -n "$A" ]]; then echo "- No signing; artifacts: $A only."; else echo '- No signing; nothing uploaded.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
