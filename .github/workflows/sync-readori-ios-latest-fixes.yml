name: One-shot · Sync Readori iOS latest fixes

on:
  push:
    branches:
      - main
    paths:
      - "sync/readori-ios-latest-fixes.part*"
      - ".github/workflows/sync-readori-ios-latest-fixes.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-sync-readori-ios-latest-fixes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout public sync payload
        uses: actions/checkout@v6

      - name: Configure existing private-repo SSH key
        env:
          PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_KEY:-}" || { echo "::error::PRIVATE_REPO_KEY is required"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$PRIVATE_REPO_KEY" > ~/.ssh/app_key
          chmod 600 ~/.ssh/app_key
          cat > ~/.ssh/config <<'EOF'
          Host github-app
            HostName github.com
            User git
            IdentityFile ~/.ssh/app_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Reassemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat sync/readori-ios-latest-fixes.part00 \
              sync/readori-ios-latest-fixes.part01 \
              sync/readori-ios-latest-fixes.part02 \
              sync/readori-ios-latest-fixes.part03 \
              sync/readori-ios-latest-fixes.part04 \
              sync/readori-ios-latest-fixes.part05 > /tmp/readori-ios.patch.gz.b64
          echo "6e8c02a9f5e780cd91c41cc3abd21c5a4d3c97b95fd9d8848be74ab14bd097bc  /tmp/readori-ios.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/readori-ios.patch.gz.b64 | gzip -dc > /tmp/readori-ios.patch
          echo "40ea4afa52b5c175f1e48d85487f9344def4d76479d3fe7c56519867919fc85f  /tmp/readori-ios.patch" | sha256sum -c -
          test -s /tmp/readori-ios.patch

      - name: Clone private iOS source and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=30 git@github-app:readori/readori.git private-ios
          cd private-ios
          git fetch origin master --depth=30
          git checkout -B agent/ios-mimo-ai-tts-fixes-20260818 origin/master
          git apply --check /tmp/readori-ios.patch
          git apply /tmp/readori-ios.patch
          git diff --check
          git diff --stat

          grep -q 'static let defaultVoice = "mimo_default"' Readori/Services/TTS/TTSProviderType.swift
          grep -q 'MIMO_TOKEN_PLAN_KEY_NOT_SUPPORTED_FOR_APP_TTS' Readori/Services/TTS/TTSProviderType.swift
          grep -q 'var mimoVoice: String?' Readori/Services/TTSService.swift
          grep -q 'showMiMoTTSGuide' Readori/UI/Reader/ReaderTTSSettingsView.swift
          grep -q 'ReadoriBoardFreeForm' Readori/UI/Reader/AINarrationSettingsViews.swift
          echo "Patch contract checks: PASS"

      - name: Commit and push private iOS branch
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          set -euo pipefail
          cd private-ios
          git config user.name "readori-sync"
          git config user.email "readori-sync@users.noreply.github.com"
          git add \
            Readori/Services/TTS/TTSProviderType.swift \
            Readori/Services/TTSService.swift \
            Readori/UI/Reader/AINarrationSettingsViews.swift \
            Readori/UI/Reader/ReaderTTSSettingsView.swift \
            Readori/Resources/en.lproj/Localizable.strings \
            Readori/Resources/zh-Hans.lproj/Localizable.strings \
            Readori/Resources/zh-Hant.lproj/Localizable.strings
          git diff --cached --check
          git commit -m "Sync iOS MiMo and narration fixes"

          BRANCH="agent/ios-mimo-ai-tts-fixes-20260818"
          if [[ -n "${TARGET_REPO_PAT:-}" ]]; then
            if git push "https://x-access-token:${TARGET_REPO_PAT}@github.com/readori/readori.git" "HEAD:refs/heads/${BRANCH}"; then
              echo "Push via existing TARGET_REPO_PAT: PASS"
              exit 0
            fi
            echo "::warning::TARGET_REPO_PAT push failed; retrying existing PRIVATE_REPO_KEY"
          fi

          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Push via existing PRIVATE_REPO_KEY: PASS"
