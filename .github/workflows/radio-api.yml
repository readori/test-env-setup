# DRAFT for the PUBLIC CI repository readori/test-env-setup, as .github/workflows/radio-api.yml.
# It is not a workflow here: the private repo keeps no workflows (CLAUDE.md). The main session
# reviews it and copies it over. Modeled on radio-cloudflare.yml (same safety rules).
#
#   dry-run  : install, bundle the API Worker with `wrangler deploy --dry-run` (no credentials).
#   d1-check : provision, then ONLY read the D1: table names, recorded migrations and the row count
#              of the old `entitlements` table (stops if it is not empty). Writes nothing.
#   deploy   : provision (finds the existing D1 + snapshots bucket), the same D1 check, D1
#              migrations (`wrangler d1 migrations apply`, tables that already exist are recorded
#              in d1_migrations first), deploy meridian-api-<env>, GET /health, and a check that
#              the two App Store endpoints answer 400 to an empty body.
#   snapshot : import the catalog from Radio Browser (no credentials; counts only in the log),
#              upload it to R2 (shards first, manifest last), then read it back through the Worker.
#              The import needs land polygons for the globe points (DATA-10): Natural Earth
#              admin-0 map units 1:50m (public domain), fetched from a pinned commit of
#              nvkelso/natural-earth-vector and checked against a SHA-256 before use.
#   all      : deploy, then snapshot.
#
# Secrets needed: TARGET_REPO_PAT, CLOUDFLARE_API_TOKEN (must be allowed to write R2 objects in
# the account), CLOUDFLARE_ACCOUNT_ID. No new secret.
# The import prints only counts (no station names, no URLs, no hosts). Nothing is uploaded as an
# Actions artifact.
name: Radio API

run-name: Radio API · ${{ inputs.mode }} · staging · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Private readori/Radio branch, tag, or SHA'
        required: true
        default: 'main'
        type: string
      mode:
        description: 'dry-run | d1-check (read-only) | deploy | snapshot (import + upload to R2) | all'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, d1-check, deploy, snapshot, all]

permissions:
  contents: read

concurrency:
  group: radio-api-staging
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.ref }}
  MODE: ${{ inputs.mode }}
  TARGET_ENV: staging
  WRANGLER_SEND_METRICS: 'false'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  api:
    name: API Worker + catalog snapshot (${{ inputs.mode }}, staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo '::error::ref must be a branch, tag or SHA (no leading -)'; exit 64; }

      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/Radio
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies and build @meridian/core (no credentials in this step)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          [[ -f workers/api/wrangler.jsonc ]] || { echo '::error::workers/api is missing at this ref'; exit 66; }
          echo "Private source commit: $(git rev-parse --short=8 HEAD)"
          corepack enable
          pnpm install --frozen-lockfile --reporter=silent
          pnpm --filter @meridian/core build

      - name: Bundle (wrangler dry-run, no credentials)
        shell: bash
        working-directory: source/workers/api
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if ! pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --env "$TARGET_ENV" > "$log" 2>&1; then
            echo 'dry-run failed; error codes only (private source lines are never printed):'
            { grep -oE 'TS[0-9]{4,5}|\[ERROR\]|ERR_[A-Z_]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          echo "dry-run bundle OK ($(du -sk "$RUNNER_TEMP/bundle" | cut -f1) KiB)"
          echo "- dry-run bundle (${TARGET_ENV}): OK" >> "$GITHUB_STEP_SUMMARY"
          node scripts/provision.mjs --env "$TARGET_ENV" --plan | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mask workers.dev subdomain
        if: inputs.mode != 'dry-run'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          sub="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ -n "$sub" ]] || { echo '::error::No workers.dev subdomain on the account'; exit 1; }
          echo "::add-mask::$sub"
          echo 'subdomain masked'

      - name: Provision meridian-staging-* resources
        if: inputs.mode == 'deploy' || inputs.mode == 'all' || inputs.mode == 'd1-check'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/provision.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the D1 helper (no credentials in this step)
        if: inputs.mode == 'deploy' || inputs.mode == 'all' || inputs.mode == 'd1-check'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/d1.mjs" <<'JS'
          // Usage: node d1.mjs check | migrate   (cwd: source/workers/api, wrangler.generated.json present)
          // Prints table names, migration file names, counts and error codes only. The raw wrangler
          // output is never printed (it contains ids).
          import { execFileSync } from 'node:child_process';
          import { readdirSync, readFileSync } from 'node:fs';

          const phase = process.argv[2];
          const env = process.env.TARGET_ENV;
          const DB = `meridian-${env}-db`;
          const MIGRATIONS = '../../packages/db/migrations';
          const CODES = /ERR_[A-Z_]+|SQLITE_[A-Z_]+|code: \d+|\[ERROR\]/g;

          function wrangler(args) {
            try {
              return execFileSync('pnpm', ['exec', 'wrangler', ...args], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
                maxBuffer: 64 * 1024 * 1024,
              });
            } catch (error) {
              const text = `${error.stdout ?? ''}${error.stderr ?? ''}`;
              const codes = [...new Set(text.match(CODES) ?? [])];
              console.error(`::error::wrangler ${args.slice(0, 2).join(' ')} failed; codes only: ${codes.join(' ') || 'none found'}`);
              process.exit(1);
            }
          }

          function sql(command) {
            const out = wrangler(['d1', 'execute', DB, '--remote', '--env', env, '--config', 'wrangler.generated.json', '--json', '--command', command]);
            try {
              return JSON.parse(out.slice(out.indexOf('[')))[0]?.results ?? [];
            } catch {
              console.error('::error::unparseable wrangler output');
              process.exit(1);
            }
          }

          const tableNames = () =>
            sql("SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name").map((r) => r.name);

          function check() {
            const tables = tableNames();
            console.log(`tables (${tables.length}): ${tables.join(', ')}`);
            if (tables.includes('d1_migrations')) {
              const names = sql('SELECT name FROM d1_migrations ORDER BY id').map((r) => r.name);
              console.log(`d1_migrations: present, recorded: ${names.join(', ') || 'none'}`);
            } else console.log('d1_migrations: absent');
            if (tables.includes('entitlements')) {
              const n = Number(sql('SELECT count(*) AS n FROM entitlements')[0]?.n);
              console.log(`entitlements rows: ${n}`);
              if (n !== 0) {
                console.error('::error::entitlements is not empty (or unreadable); stopping before any change');
                process.exit(1);
              }
            } else console.log('entitlements: table absent');
            return tables;
          }

          const tables = check();
          if (phase === 'check') process.exit(0);

          const files = readdirSync(MIGRATIONS).filter((f) => f.endsWith('.sql')).sort();
          if (!files.every((f) => /^[0-9A-Za-z_.-]+\.sql$/.test(f))) {
            console.error('::error::unexpected migration file name');
            process.exit(1);
          }
          const recorded = new Set(tables.includes('d1_migrations') ? sql('SELECT name FROM d1_migrations').map((r) => r.name) : []);
          // A migration that is not recorded but whose tables already exist was applied by hand:
          // record it instead of running it again ("table already exists"). 0003 only drops, so it
          // has no CREATE TABLE and always runs; it is idempotent.
          const baseline = files.filter((f) => !recorded.has(f)).filter((f) => {
            const created = [...readFileSync(`${MIGRATIONS}/${f}`, 'utf8').matchAll(/CREATE TABLE `([^`]+)`/g)].map((m) => m[1]);
            return created.some((t) => tables.includes(t));
          });
          if (baseline.length > 0) {
            console.log(`already present, recorded without running: ${baseline.join(', ')}`);
            sql('CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL)');
            for (const f of baseline) sql(`INSERT OR IGNORE INTO d1_migrations (name) VALUES ('${f}')`);
          }

          wrangler(['d1', 'migrations', 'apply', DB, '--remote', '--env', env, '--config', 'wrangler.generated.json']);

          const after = sql('SELECT name FROM d1_migrations ORDER BY id').map((r) => r.name);
          const missing = files.filter((f) => !after.includes(f));
          console.log(`migrations recorded after apply: ${after.join(', ')}`);
          const tables2 = tableNames();
          console.log(`tables after apply (${tables2.length}): ${tables2.join(', ')}`);
          const wanted = ['store_transactions', 'store_devices', 'recognize_uses'];
          const bad = [...missing.map((f) => `not recorded: ${f}`), ...wanted.filter((t) => !tables2.includes(t)).map((t) => `missing table: ${t}`), ...(tables2.includes('entitlements') ? ['entitlements still exists'] : [])];
          if (bad.length > 0) {
            console.error(`::error::migration state is not what was expected: ${bad.join('; ')}`);
            process.exit(1);
          }
          console.log('migration state OK');
          JS

      - name: D1 pre-check (read-only; stops if entitlements is not empty)
        if: inputs.mode == 'deploy' || inputs.mode == 'all' || inputs.mode == 'd1-check'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/d1.mjs" check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: D1 migrations (wrangler d1 migrations apply)
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/d1.mjs" migrate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy API Worker
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          redact() { sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<id>/g; s/[0-9a-fA-F]{32}/<id>/g'; }
          if ! pnpm exec wrangler deploy --config wrangler.generated.json --env "$TARGET_ENV" > "$log" 2>&1; then
            echo 'deploy failed; error codes only:'
            { grep -oE 'TS[0-9]{4,5}|[ERROR]|ERR_[A-Z_]+|code: [0-9]+' "$log" || echo 'no error code found'; } | sort | uniq -c | head -20
            exit 1
          fi
          { grep -E 'Uploaded|Deployed|Current Version' "$log" || true; } | redact
          echo "- deploy meridian-api-${TARGET_ENV}: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/health.mjs --env "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: App Store endpoints answer 400 to an empty body
        if: inputs.mode == 'deploy' || inputs.mode == 'all'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_ACCOUNT"
          sub="$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ -n "$sub" ]] || { echo '::error::No workers.dev subdomain on the account'; exit 1; }
          echo "::add-mask::$sub"
          base="https://meridian-api-${TARGET_ENV}.${sub}.workers.dev"
          failed=0
          for path in /entitlements/verify /appstore/notifications; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "${base}${path}" || echo 000)"
            echo "POST ${path} with an empty body -> ${code}" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$code" == 400 ]] || { echo "::error::expected 400 from ${path}"; failed=1; }
          done
          exit "$failed"

      - name: Fetch Natural Earth land polygons (public domain; pinned commit, checksum checked)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        env:
          NE_URL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_50m_admin_0_map_units.geojson
          NE_SHA256: b8d421aca6e9e08e8cdf09cc26af111cc3e0deba4fe915611d58ade71e8a4db0
        run: |
          set -euo pipefail
          # The same file the size budget of the points index was measured with. A different file
          # moves country-level points, so the checksum must match or nothing is imported.
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/ne-land.geojson" "$NE_URL"
          echo "$NE_SHA256  $RUNNER_TEMP/ne-land.geojson" | sha256sum -c - > /dev/null \
            || { echo '::error::Natural Earth file does not match the pinned checksum'; exit 1; }

      - name: Import catalog from Radio Browser (no credentials; counts only)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        run: |
          set -euo pipefail
          # Output goes to the step summary: totals, hidden counts, shard count. No station data.
          node scripts/import-catalog.mjs --land "$RUNNER_TEMP/ne-land.geojson" --out "$RUNNER_TEMP/snapshot-out" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot to R2 (shards first, manifest last)
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          node scripts/upload-snapshot.mjs --dir "$RUNNER_TEMP/snapshot-out" --bucket "meridian-${TARGET_ENV}-snapshots" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read the snapshot back through the Worker
        if: inputs.mode == 'snapshot' || inputs.mode == 'all'
        shell: bash
        working-directory: source/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/health.mjs --env "$TARGET_ENV" --snapshot | tee -a "$GITHUB_STEP_SUMMARY"
