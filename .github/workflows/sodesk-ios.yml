# RemoHop iOS app CI (controller app: SwiftUI shell + WKWebView on an in-process Go gateway).
#
# Public CI repository -> source repository: env SOURCE_REPOSITORY. Copy this file to .github/workflows/ in the CI repo.
#
#   verify : Xcode 26.x + Go from go.mod -> mobile/ios/build-xcframework.sh (gomobile bind
#            -target=ios,iossimulator of mobile/remohopcore -> mobile/ios/build/Remohopcore.xcframework)
#            -> simulator build of mobile/ios/RemoHop.xcodeproj with no signing -> xcodebuild test of
#            RemoHopTests on an iOS simulator. Also runs the Go tests of internal/mobile on macOS.
#            Then the end-to-end test: a `remohop host` is started on the runner (loopback only, a
#            random one-run password) and RemoHopTests/GatewayE2ETests runs inside the app on the
#            simulator: connect form -> connect to the host by address and password -> a command
#            in the terminal -> the Files tab lists a host directory.
#
#   verify mode uses no Apple credentials: no signing, no Match, no App Store Connect.
#
#   profile    : ONE-TIME setup. Registers the bundle ID com.remohop.app with the App Store
#                Connect API if it is missing, then writes an App Store provisioning profile for
#                it to the shared Match repo (readori/readori-certificates), signed by the
#                EXISTING shared Apple Distribution identity (never creates certificates, never
#                touches other apps' profiles). Needs confirm=WRITE. No source checkout.
#   testflight : Xcode 26.x + Go -> gomobile xcframework (as verify) -> Match (readonly) -> signed
#                archive of the RemoHop scheme (generic iOS device, manual signing, Apple
#                Distribution + the Match profile) -> IPA -> altool validate -> altool upload.
#                CFBundleVersion = build_number input, or (empty) latest TestFlight build + 1.
#                The marketing version (CFBundleShortVersionString) stays whatever the Xcode
#                project says.
#
#   metadata   : App Store Connect listing from versioned files in the source repo,
#                mobile/ios/fastlane/{metadata/<locale>/*.txt, metadata/review_information, age_rating.json}
#                (fastlane deliver, API key only): name, subtitle, description, keywords, promotional text,
#                support/marketing/privacy URLs, copyright, categories, age rating, App Review contact and
#                notes (+ committed screenshots, if any). Refuses to upload while any file still holds a
#                TODO-REPLACE placeholder (including the website domain). Never submits for review, never
#                releases, no binary upload. Export compliance and the App Privacy label are NOT set here.
#   screenshots: Go + gomobile, then the real app on 6.9" / 6.5" iPhone and 13" iPad simulators connected to
#                a remohop host on the runner (GatewayE2ETests/testScreenshots) -> JPEGs -> deliver (screenshots
#                only, same no-submit flags), locales en-US and zh-Hans.
#   capture    : capture only, NOTHING is uploaded and no Apple credential is used: the real app on the
#                simulators named by DEVICES (iphone69, ipad13; default ipad13), in a session with a remohop
#                host on the runner that has a made-up home directory (/Users/demo) and its real macOS
#                desktop (ffmpeg, Screen Recording granted through TCC as in sodesk-e2e-macos.yml).
#                RemoHopTests/GatewayE2ETests/testStoreScreens stops at desktop, terminal, files and the
#                connect screen (saved, named host), once per store language. The PNGs are kept as the
#                7-day artifact remohop-ios-capture (<device>/<locale>/<n>-<screen>.png) for the poster
#                build in mobile/ios/store-art. Push requests need [sodesk-ios-capture] in the commit
#                message (own concurrency group, never cancelled, cancels nothing).
#
# Triggers: workflow_dispatch (modes verify, profile, testflight, metadata, screenshots), or a push to main that
# changes ci-requests/sodesk-ios.env (how the project's AI engineer requests a run; verify by
# default). Never pull_request. The request file is plain KEY=VALUE text, parsed with strict
# patterns and never executed:
#
#   REF=main          # source repository branch, tag or SHA
#   MODE=testflight   # optional: verify (default), profile, testflight, metadata, screenshots or capture;
#                     # profile/testflight/metadata/screenshots also need [sodesk-ios-release] in the commit
#                     # message (never cancelled); capture needs [sodesk-ios-capture]
#   DEVICES=ipad13    # capture only, optional: comma list of iphone69, ipad13 (default ipad13)
#   CONFIRM=WRITE     # profile only
#   BUILD=12          # testflight only, optional (default: latest TestFlight build + 1)
#
# Secrets: TARGET_REPO_PAT (source checkout + Match repo), and for profile/testflight
# MATCH_PASSWORD, ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY, ASC_TEAM_ID.
#
# Safety rules (public repo, public logs): third-party actions pinned to commit SHAs (only
# GitHub-owned actions are used; fastlane comes from a pinned gem); TARGET_REPO_PAT is not
# persisted by the checkout; xcodebuild always -quiet; private source files are never printed
# beyond compiler errors; the signed IPA never leaves the runner (no artifacts); signing
# material is created only after the private-source build scripts (gomobile bind) ran, and is
# removed at the end. The end-to-end step prints results and failure tails only: never the host
# password (masked) or a gateway URL (its token is redacted from anything printed).
name: RemoHop iOS

run-name: RemoHop iOS · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-ios.env)' || format('{0} · {1}{2}', inputs.mode, inputs.ref, inputs.build_number && format(' · build {0}', inputs.build_number) || '') }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = simulator build + tests + end-to-end, no signing; profile = one-time signing setup (needs confirm=WRITE); testflight = signed build + upload; metadata = App Store listing text/categories/age rating/review info; screenshots = generate in simulators and upload; capture = generate the store screens in simulators, artifact only, no upload'
        required: true
        default: 'verify'
        type: choice
        options: [verify, profile, testflight, metadata, screenshots, capture]
      ref:
        description: 'Source repository branch, tag, or SHA (not used by profile)'
        required: true
        default: 'main'
        type: string
      build_number:
        description: 'testflight: build number (CFBundleVersion). Empty = latest TestFlight build + 1.'
        required: false
        default: ''
        type: string
      devices:
        description: 'capture mode only: comma list of iphone69, ipad13'
        required: false
        default: 'ipad13'
        type: string
      confirm:
        description: 'profile mode only: type WRITE'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-ios.env']

permissions:
  contents: read

# verify runs of the same ref cancel each other; profile and testflight never cancel a running
# run (an upload or a Match write must not be cut off).
# A push whose commit message carries [sodesk-ios-release] is a release request (MODE=profile or
# testflight in the request file) and, like a dispatched release, is never cancelled.
# A capture run (MODE=capture with [sodesk-ios-capture], or a dispatched capture) has a group of its own:
# it uploads nothing, so it neither waits for nor cancels release or verify runs.
concurrency:
  group: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[sodesk-ios-capture]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'capture')) && 'remohop-ios-capture' || (((github.event_name == 'push' && contains(github.event.head_commit.message, '[sodesk-ios-release]')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify')) && 'remohop-ios-release' || format('remohop-ios-{0}', inputs.ref || 'request')) }}
  cancel-in-progress: ${{ !((github.event_name == 'push' && (contains(github.event.head_commit.message, '[sodesk-ios-release]') || contains(github.event.head_commit.message, '[sodesk-ios-capture]'))) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify')) }}

env:
  # Source repository (public since the open-source release).
  SOURCE_REPOSITORY: readori/RemoHop
  PRIVATE_SOURCE_PATH: source
  # Same identifier as the Android app. Replaces com.readori.sodesk (the old App Store record).
  EXPECTED_BUNDLE_ID: com.remohop.app
  # Apple ID of the App Store Connect record for com.remohop.app; empty = not checked yet.
  # Fill in once the record exists.
  EXPECTED_APPLE_ID: '6838609056'
  BUNDLE_ID_NAME: RemoHop
  XCODE_MAJOR_WANTED: '26'
  MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
  MATCH_GIT_BRANCH: main
  FASTLANE_VERSION: '2.238.0'
  CI: '1'
  LANG: en_US.UTF-8

jobs:
  ios:
    name: Build RemoHop iOS
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          CONFIRM: ${{ inputs.confirm }}
          INPUT_DEVICES: ${{ inputs.devices }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-ios.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/remohop-ios-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-ios.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
            # Optional release request: MODE=profile|testflight, CONFIRM=WRITE (profile), BUILD=N.
            MODE="$(sed -n 's/^MODE=//p' "$REQ" | head -n 1 | tr -d '\r')"; MODE="${MODE:-verify}"
            CONFIRM="$(sed -n 's/^CONFIRM=//p' "$REQ" | head -n 1 | tr -d '\r')"
            BUILD_NUMBER_INPUT="$(sed -n 's/^BUILD=//p' "$REQ" | head -n 1 | tr -d '\r')"
            DEVICES="$(sed -n 's/^DEVICES=//p' "$REQ" | head -n 1 | tr -d '\r')"
            if [[ "$MODE" == capture ]]; then
              [[ "$HEAD_MESSAGE" == *'[sodesk-ios-capture]'* ]] || { echo '::error::a capture request (MODE=capture) needs [sodesk-ios-capture] in the commit message (its own concurrency group).'; exit 64; }
            elif [[ "$MODE" != verify && "$HEAD_MESSAGE" != *'[sodesk-ios-release]'* ]]; then
              echo '::error::a release request (MODE=profile/testflight) needs [sodesk-ios-release] in the commit message, so it is never cancelled.'; exit 64
            fi
          else
            SOURCE_REF="$INPUT_REF"
            MODE="$INPUT_MODE"
            DEVICES="$INPUT_DEVICES"
          fi
          case "$MODE" in verify|profile|testflight|metadata|screenshots|capture) ;; *) echo "::error::Unsupported mode: $MODE"; exit 64 ;; esac
          DEVICES="${DEVICES:-ipad13}"
          [[ "$DEVICES" =~ ^(iphone69|ipad13)(,(iphone69|ipad13))?$ ]] || { echo '::error::DEVICES must be a comma list of iphone69, ipad13.'; exit 64; }
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ -n "${TARGET_REPO_PAT:-}" ]] || { echo '::error::Missing secret TARGET_REPO_PAT (read access to the source repository, env SOURCE_REPOSITORY).'; exit 78; }
          if [[ -n "$BUILD_NUMBER_INPUT" ]]; then
            [[ "$MODE" == 'testflight' ]] || { echo '::error::build_number is only used by testflight mode.'; exit 64; }
            [[ "$BUILD_NUMBER_INPUT" =~ ^[1-9][0-9]{0,8}$ ]] || { echo '::error::build_number must be a whole number.'; exit 64; }
          fi
          if [[ "$MODE" == 'profile' && "$CONFIRM" != 'WRITE' ]]; then
            echo '::error::profile mode writes to the shared Match repo: set confirm=WRITE.'; exit 64
          fi
          # capture uses no Apple credential (nothing is signed or uploaded).
          if [[ "$MODE" != 'verify' && "$MODE" != 'capture' ]]; then
            missing=0
            for name in MATCH_PASSWORD ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY ASC_TEAM_ID; do
              [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name"; missing=1; }
            done
            (( missing == 0 )) || exit 78
          fi
          {
            echo "SOURCE_REF=$SOURCE_REF"
            echo "MODE=$MODE"
            echo "BUILD_NUMBER_INPUT=$BUILD_NUMBER_INPUT"
            echo "DEVICES=$DEVICES"
          } >> "$GITHUB_ENV"
          echo "Trigger: $EVENT_NAME · mode: $MODE · ref: $SOURCE_REF · build: ${BUILD_NUMBER_INPUT:-auto}"

      - name: Checkout source
        if: env.MODE != 'profile'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify source layout
        id: layout
        if: env.MODE != 'profile'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          C="$(git rev-parse HEAD)"
          echo "SOURCE_SHORT_SHA=${C:0:8}" >> "$GITHUB_ENV"
          { echo "### RemoHop iOS · $MODE"; echo; echo "- Source: \`$SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`)"; } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f mobile/ios/RemoHop.xcodeproj/project.pbxproj ]]; then
            [[ "$MODE" == 'verify' ]] || { echo '::error::mobile/ios is not on this ref; nothing to build.'; exit 66; }
            echo '::notice::mobile/ios is not on this ref: nothing to verify.'
            echo '- Result: skipped, no iOS app at this ref' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in go.mod mobile/go.mod mobile/remohopcore/remohopcore.go mobile/shared/remohop-mobile.js mobile/ios/build-xcframework.sh \
                   mobile/ios/RemoHop.xcodeproj/xcshareddata/xcschemes/RemoHop.xcscheme; do
            [[ -f "$f" ]] || { echo "::error::$f is missing."; exit 66; }
          done
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $EXPECTED_BUNDLE_ID;" mobile/ios/RemoHop.xcodeproj/project.pbxproj || { echo "::error::bundle ID must be $EXPECTED_BUNDLE_ID"; exit 65; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Source ${C:0:8} · layout: PASS"

      # metadata mode: the listing files must be complete and free of placeholders before any
      # credential is touched. Prints file names and problems only, never file contents.
      - name: Check App Store listing files
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'metadata'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/ios/fastlane
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          root = 'metadata'
          problems, placeholders, domain_placeholders = [], [], []
          def read(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return f.read().strip()
              except OSError:
                  problems.append(f'missing file: {path}')
                  return None
          limits = {'name': 30, 'subtitle': 30, 'description': 4000, 'keywords': 100, 'promotional_text': 170}
          for loc in ('en-US', 'zh-Hans'):
              for field, limit in limits.items():
                  v = read(f'{root}/{loc}/{field}.txt')
                  if v is not None and 'TODO-REPLACE' not in v and (not v or len(v) > limit):
                      problems.append(f'{root}/{loc}/{field}.txt: must be 1..{limit} characters (is {len(v)})')
              for field in ('support_url', 'marketing_url', 'privacy_url'):
                  v = read(f'{root}/{loc}/{field}.txt')
                  if v is not None and 'TODO-REPLACE' not in v and not re.fullmatch(r'https://[^\s/]+(/\S*)?', v):
                      problems.append(f'{root}/{loc}/{field}.txt: must be one https URL')
          # Review contact name, phone and the notes (demo host) are personal or secret: they may be
          # left out of the repo and filled in App Store Connect; deliver leaves missing files alone.
          for field in ('first_name', 'last_name', 'phone_number', 'email_address', 'notes'):
              p = f'{root}/review_information/{field}.txt'
              if not os.path.exists(p):
                  continue
              v = read(p)
              if v is not None and not v:
                  problems.append(f'{p}: empty')
          v = read(f'{root}/copyright.txt')
          if v is not None and not v:
              problems.append(f'{root}/copyright.txt: empty')
          v = read(f'{root}/primary_category.txt')
          if v is not None and not re.fullmatch(r'[A-Z_]+', v) and 'TODO-REPLACE' not in v:
              problems.append(f'{root}/primary_category.txt: must be a category id such as UTILITIES')
          try:
              ar = json.load(open('age_rating.json'))
              if not ar or any(not isinstance(x, int) or x < 0 or x > 2 for x in ar.values()):
                  problems.append('age_rating.json: values must be 0, 1 or 2')
          except Exception as e:
              problems.append(f'age_rating.json: not valid JSON ({type(e).__name__})')
          ec = ''
          try:
              for line in open('export-compliance.env', encoding='utf-8'):
                  if line.startswith('USES_NON_EXEMPT_ENCRYPTION='):
                      ec = line.split('=', 1)[1].strip()
          except OSError:
              pass
          if ec not in ('', 'YES', 'NO'):
              problems.append('export-compliance.env: USES_NON_EXEMPT_ENCRYPTION must be empty, YES or NO')
          for d, _, files in os.walk(root):
              for fn in files:
                  p = os.path.join(d, fn)
                  try:
                      t = open(p, encoding='utf-8').read()
                  except Exception:
                      continue
                  if 'TODO-REPLACE-DOMAIN' in t:
                      domain_placeholders.append(p)
                  if 'TODO-REPLACE' in t:
                      placeholders.append(p)
          if domain_placeholders:
              print('::error::The website domain is still the placeholder in: ' + ', '.join(sorted(domain_placeholders)))
          rest = sorted(set(placeholders) - set(domain_placeholders))
          if rest:
              print('::error::Placeholder text (TODO-REPLACE) is still in: ' + ', '.join(rest))
          for p in problems:
              print('::error::' + p)
          if problems or placeholders:
              print('::error::Nothing was uploaded. Replace the placeholders / fix the files in mobile/ios/fastlane and run metadata again.')
              sys.exit(65)
          print('Listing files: complete, no placeholders.')
          print('Export compliance config: ' + (ec or 'not set (answer it in App Store Connect)'))
          PY

      - name: Select Xcode 26.x
        if: steps.layout.outputs.ready == 'true' || env.MODE == 'profile'
        run: |
          set -euo pipefail
          XCODE_APP=''; BEST=''
          for app in /Applications/Xcode*.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            case "$app" in *[Bb]eta*) continue ;; esac
            v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [[ "${v%%.*}" == "$XCODE_MAJOR_WANTED" ]] || continue
            if [[ -z "$BEST" ]] || [[ "$(printf '%s\n%s\n' "$BEST" "$v" | sort -V | tail -1)" == "$v" ]]; then BEST="$v"; XCODE_APP="$app"; fi
          done
          [[ -n "$XCODE_APP" ]] || { echo "::error::No Xcode ${XCODE_MAJOR_WANTED}.x on this runner."; ls -1 /Applications | grep '^Xcode' || true; exit 69; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Set up Go (version from go.mod)
        if: steps.layout.outputs.ready == 'true' && env.MODE != 'metadata'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.PRIVATE_SOURCE_PATH }}/go.mod
          cache: false

      - name: Go tests of the mobile core (macOS)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          go version
          go test -count=1 ./internal/mobile 2>&1 | cut -c1-2000 | tail -n 100
          (cd mobile && go test -count=1 ./... 2>&1 | cut -c1-2000 | tail -n 50)

      - name: gomobile bind (Remohopcore.xcframework)
        if: steps.layout.outputs.ready == 'true' && env.MODE != 'metadata'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/gomobile.log"
          bash mobile/ios/build-xcframework.sh > "$LOG" 2>&1 || { grep -iE 'error|undefined|cannot' "$LOG" | cut -c1-400 | head -n 40; echo '::error::gomobile bind failed.'; exit 1; }
          XCF=mobile/ios/build/Remohopcore.xcframework
          [[ -f "$XCF/Info.plist" ]] || { echo '::error::XCFramework was not produced.'; exit 65; }
          echo "XCFramework: $(du -sh "$XCF" | cut -f1) · slices: $(ls "$XCF" | grep -v Info.plist | tr '\n' ' ')"

      - name: Build for iOS Simulator (no signing)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/DerivedData-remohop"
          xcodebuild build -quiet \
            -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
          APP="$(find "$DD/Build/Products" -maxdepth 2 -type d -name 'RemoHop.app' -print -quit)"
          [[ -n "$APP" ]] || { echo '::error::Simulator .app was not produced.'; exit 65; }
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          [[ "$BID" == "$EXPECTED_BUNDLE_ID" ]] || { echo "::error::Bundle ID mismatch: $BID"; exit 65; }
          test -f "$APP/remohop-mobile.js" || { echo '::error::App bundle has no remohop-mobile.js (injected script not embedded).'; exit 65; }
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Info.plist" | grep -q true || { echo '::error::ATS local networking exception missing.'; exit 65; }
          SIZE="$(du -sh "$APP" | cut -f1)"
          echo "Simulator build OK: RemoHop.app · $SIZE"
          echo "- Simulator build ($BID): $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests on an iOS simulator
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          # The newest available iPhone simulator on this runner.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt:
                  continue
              ver = tuple(int(x) for x in rt.rsplit("iOS-", 1)[-1].split("-") if x.isdigit())
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      if best is None or ver > best[0]:
                          best = (ver, dev["udid"], dev["name"])
          print(best[1] if best else "")
          ')"
          [[ -n "$UDID" ]] || { echo '::error::No iPhone simulator available.'; xcrun simctl list runtimes | head -20; exit 69; }
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          RES="$RUNNER_TEMP/RemoHopTests.xcresult"
          set +e
          xcodebuild test -quiet \
            -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-remohop-test" -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xctest.log" 2>&1
          st=$?
          set -e
          grep -E "Executed [0-9]+ tests?|error:|failed|XCTAssert" "$RUNNER_TEMP/xctest.log" | cut -c1-400 | tail -n 40 || true
          [[ "$st" -eq 0 ]] || { echo '::error::xcodebuild test failed.'; exit 1; }
          echo '- Unit tests (RemoHopTests) on the iOS simulator: PASS' >> "$GITHUB_STEP_SUMMARY"

      # The app on the simulator against a real host: the simulator shares the Mac's network, so
      # 127.0.0.1 is the runner. The host listens on loopback only, with a password made for this
      # run; the test gets address, password and directory through TEST_RUNNER_* variables (and a
      # private file as a fallback), never through the log.
      - name: End-to-end on the simulator (app to remohop host on this Mac)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set +e -uo pipefail
          if [[ ! -f mobile/ios/RemoHopTests/GatewayE2ETests.swift ]]; then
            echo '::notice::no GatewayE2ETests on this ref; skipped.'
            echo '- End-to-end (app to host): skipped, not on this ref' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          redact() { sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_-]{16,}#\1<token>#g' | cut -c1-400; }
          W="$RUNNER_TEMP/remohop-ios-e2e"
          rm -rf "$W"; mkdir -p "$W/host" "$W/cli" "$W/files"
          CGO_ENABLED=0 go build -trimpath -o "$W/remohop" ./cmd/remohop || { echo '::error::building remohop for the host failed.'; exit 1; }
          printf 'hello from the host\n' > "$W/files/hello.txt"
          PORT=$((20000 + RANDOM % 10000)); TARGET="127.0.0.1:$PORT"
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          REMOHOP_CONFIG_DIR="$W/host" "$W/remohop" host --no-signal --listen "$TARGET" --password "$PW" > "$W/host.log" 2>&1 < /dev/null &
          HOST_PID=$!
          CFG=/tmp/remohop-ios-e2e.json
          cleanup() { kill "$HOST_PID" 2>/dev/null || true; rm -f "$CFG"; }
          trap cleanup EXIT
          for _ in $(seq 1 100); do grep -q 'host ready' "$W/host.log" 2>/dev/null && break; sleep 0.2; done
          grep -q 'host ready' "$W/host.log" || { echo '::error::remohop host did not start.'; tail -n 5 "$W/host.log" | redact; exit 1; }
          if REMOHOP_CONFIG_DIR="$W/cli" REMOHOP_PASSWORD="$PW" "$W/remohop" "$TARGET" ping -c 1 > "$W/ping.log" 2>&1; then
            echo "host: remohop host on $TARGET answers a client on this Mac"
          else
            echo '::error::the host does not answer a client on this Mac.'; tail -n 5 "$W/ping.log" | redact; exit 1
          fi
          ( umask 077; E2E_TARGET="$TARGET" E2E_PASSWORD="$PW" E2E_DIR="$W/files" python3 -c '
          import json, os
          print(json.dumps({"target": os.environ["E2E_TARGET"], "password": os.environ["E2E_PASSWORD"], "dir": os.environ["E2E_DIR"]}))
          ' > "$CFG" )
          RES="$RUNNER_TEMP/RemoHopE2E.xcresult"; rm -rf "$RES"
          LOG="$RUNNER_TEMP/xce2e.log"
          TEST_RUNNER_REMOHOP_E2E_TARGET="$TARGET" TEST_RUNNER_REMOHOP_E2E_PASSWORD="$PW" TEST_RUNNER_REMOHOP_E2E_DIR="$W/files" \
          xcodebuild test -quiet \
            -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:RemoHopTests/GatewayE2ETests/testConnectTerminalFiles \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-remohop-test" -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1
          st=$?
          # What happened to the one test: Passed, Failed or Skipped (a skip is not a pass).
          OUTCOME="$(xcrun xcresulttool get test-results tests --path "$RES" 2>/dev/null | python3 -c '
          import json, sys
          def walk(n):
              if n.get("nodeType") == "Test Case" and "testConnectTerminalFiles" in n.get("name", ""):
                  return n.get("result") or "unknown"
              for c in n.get("children", []):
                  r = walk(c)
                  if r:
                      return r
              return None
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          r = None
          for n in d.get("testNodes", []):
              r = walk(n)
              if r:
                  break
          print(r or "unknown")
          ' || true)"
          if [[ "$OUTCOME" == 'unknown' || -z "$OUTCOME" ]]; then
            if grep -Eq "testConnectTerminalFiles\]' passed" "$LOG"; then OUTCOME=Passed
            elif grep -Eq "testConnectTerminalFiles\]' skipped|with 1 test skipped" "$LOG"; then OUTCOME=Skipped
            elif grep -Eq "Executed 1 test, with 0 failures" "$LOG"; then OUTCOME=Passed
            fi
          fi
          echo "GatewayE2ETests.testConnectTerminalFiles: ${OUTCOME:-unknown} (xcodebuild exit $st)"
          if [[ "$st" -ne 0 || "$OUTCOME" != 'Passed' ]]; then
            grep -E "error:|failed|XCTAssert|caught error|timed out|Executed [0-9]+ tests?" "$LOG" | redact | tail -n 40 || true
            echo '--- host log (warnings and errors) ---'
            grep -Ei 'warn|error|refus|denied|fail' "$W/host.log" | redact | tail -n 15 || true
            echo '::error::the end-to-end test on the simulator did not pass.'
            echo "- End-to-end (app on the simulator to remohop host on the Mac): **${OUTCOME:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          grep -E "Executed [0-9]+ tests?" "$LOG" | tail -n 1 | cut -c1-200 || true
          echo '- End-to-end (app on the simulator to remohop host on the Mac: connect, terminal command, Files listing): PASS' >> "$GITHUB_STEP_SUMMARY"

      # screenshots mode: the real app on simulators of the App Store sizes, connected to a remohop host on
      # this Mac (loopback, one-run password) like the end-to-end test. GatewayE2ETests/testScreenshots
      # walks the app to three screens and the script below captures each with `simctl io screenshot`.
      # Runs before any signing material exists (it executes private-source code).
      - name: Generate App Store screenshots (simulators, app to remohop host on this Mac)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'screenshots'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set +e -uo pipefail
          redact() { sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_-]{16,}#\1<token>#g' | cut -c1-400; }
          W="$RUNNER_TEMP/remohop-shots"; OUT="$RUNNER_TEMP/remohop-shots-out"
          rm -rf "$W" "$OUT"; mkdir -p "$W/host" "$W/cli" "$W/files" "$OUT"
          CGO_ENABLED=0 go build -trimpath -o "$W/remohop" ./cmd/remohop || { echo '::error::building remohop for the host failed.'; exit 1; }
          printf 'hello from the host\n' > "$W/files/hello.txt"
          printf 'notes\n' > "$W/files/notes.md"; printf 'a,b,c\n1,2,3\n' > "$W/files/report.csv"; mkdir -p "$W/files/projects" "$W/files/photos"
          PORT=$((20000 + RANDOM % 10000)); TARGET="127.0.0.1:$PORT"
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          REMOHOP_CONFIG_DIR="$W/host" "$W/remohop" host --no-signal --listen "$TARGET" --password "$PW" > "$W/host.log" 2>&1 < /dev/null &
          HOST_PID=$!
          SIMS=()
          cleanup() {
            kill "$HOST_PID" 2>/dev/null || true
            for u in ${SIMS[@]+"${SIMS[@]}"}; do xcrun simctl shutdown "$u" >/dev/null 2>&1; xcrun simctl delete "$u" >/dev/null 2>&1; done
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do grep -q 'host ready' "$W/host.log" 2>/dev/null && break; sleep 0.2; done
          grep -q 'host ready' "$W/host.log" || { echo '::error::remohop host did not start.'; tail -n 5 "$W/host.log" | redact; exit 1; }

          # App Store sizes: key | device names in order of preference | pixel size
          SETS=(
            # App Store Connect needs only the largest iPhone (6.9") and iPad (13") sets;
            # it scales them down for the smaller sizes.
            'iphone69|iPhone 17 Pro Max,iPhone 16 Pro Max|1320x2868'
            'ipad13|iPad Pro 13-inch (M5),iPad Pro 13-inch (M4)|2064x2752'
          )
          DD="$RUNNER_TEMP/DerivedData-remohop-shots"
          made=0
          for set in "${SETS[@]}"; do
            IFS='|' read -r KEY NAMES SIZE <<< "$set"
            PICK="$(xcrun simctl list devicetypes -j > "$W/types.json"; xcrun simctl list runtimes -j > "$W/runtimes.json"; python3 - "$W/types.json" "$W/runtimes.json" "$NAMES" <<'PY'
          import json, sys
          types = json.load(open(sys.argv[1]))['devicetypes']
          runtimes = [r for r in json.load(open(sys.argv[2]))['runtimes'] if r.get('isAvailable') and r.get('platform', 'iOS') == 'iOS']
          def ver(r):
              return tuple(int(x) for x in r['version'].split('.') if x.isdigit())
          for name in sys.argv[3].split(','):
              for t in types:
                  if t['name'] != name:
                      continue
                  ok = [r for r in runtimes if any(d['identifier'] == t['identifier'] for d in r.get('supportedDeviceTypes', []))]
                  if ok:
                      best = max(ok, key=ver)
                      print(t['identifier'], best['identifier'], name.replace(' ', '_'))
                      raise SystemExit(0)
          PY
            )"
            if [[ -z "$PICK" ]]; then echo "::warning::$KEY: none of [$NAMES] is available on this runner; skipped."; continue; fi
            read -r TYPE_ID RUNTIME_ID DEVNAME <<< "$PICK"
            UDID="$(xcrun simctl create "remohop-shot-$KEY" "$TYPE_ID" "$RUNTIME_ID" 2>/dev/null)"
            [[ -n "$UDID" ]] || { echo "::warning::$KEY: could not create a simulator; skipped."; continue; }
            SIMS+=("$UDID")
            xcrun simctl boot "$UDID" >/dev/null 2>&1
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || { echo "::warning::$KEY: simulator did not boot; skipped."; continue; }
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --operatorName '' >/dev/null 2>&1
            echo "$KEY: ${DEVNAME//_/ } ($SIZE)"
            setok=1
            # One pass per store language: the app is switched to that language
            # (TEST_RUNNER_REMOHOP_SHOTS_LANG), so the zh-Hans page shows Chinese screens.
            for LANGCODE in en zh; do
              [[ "$LANGCODE" == zh ]] && LOC=zh-Hans || LOC=en-US
              # The simulator's system language; the app follows it (its default).
              if [[ "$LANGCODE" == zh ]]; then SYSLANGS=(zh-Hans en); SYSLOCALE=zh_CN; else SYSLANGS=(en); SYSLOCALE=en_US; fi
              xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "${SYSLANGS[@]}" >/dev/null 2>&1
              xcrun simctl spawn "$UDID" defaults write -g AppleLocale "$SYSLOCALE" >/dev/null 2>&1
              xcrun simctl shutdown "$UDID" >/dev/null 2>&1
              xcrun simctl boot "$UDID" >/dev/null 2>&1
              xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || { echo "::warning::$KEY/$LANGCODE: simulator did not reboot."; setok=0; break; }
              xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --operatorName '' >/dev/null 2>&1
              S="$W/s-$KEY-$LANGCODE"; rm -rf "$S"; mkdir -p "$S"
              LOG="$RUNNER_TEMP/xcshots-$KEY-$LANGCODE.log"
              TEST_RUNNER_REMOHOP_E2E_TARGET="$TARGET" TEST_RUNNER_REMOHOP_E2E_PASSWORD="$PW" TEST_RUNNER_REMOHOP_E2E_DIR="$W/files" \
              TEST_RUNNER_REMOHOP_SHOTS_DIR="$S" TEST_RUNNER_REMOHOP_SHOTS_LANG="$LANGCODE" \
              xcodebuild test -quiet \
                -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Debug \
                -destination "platform=iOS Simulator,id=$UDID" \
                -only-testing:RemoHopTests/GatewayE2ETests/testScreenshots \
                -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1 &
              XPID=$!
              got=0
              for name in 1-connect 2-terminal 3-files; do
                for _ in $(seq 1 1200); do
                  [[ -f "$S/$name.ready" ]] && break
                  kill -0 "$XPID" 2>/dev/null || break
                  sleep 0.25
                done
                [[ -f "$S/$name.ready" ]] || break
                xcrun simctl io "$UDID" screenshot --type=png "$S/$name.png" >/dev/null 2>&1
                touch "$S/$name.done"
                got=$((got + 1))
              done
              wait "$XPID"; st=$?
              if [[ "$got" -ne 3 ]]; then
                echo "::warning::$KEY/$LANGCODE: only $got of 3 screens were captured (xcodebuild exit $st)."
                grep -E "error:|failed|XCTAssert|caught error|timed out|skipped" "$LOG" | redact | tail -n 15 || true
                echo "--- xcodebuild log (tail) ---"; tail -n 40 "$LOG" | redact || true
                setok=0; break
              fi
              for name in 1-connect 2-terminal 3-files; do
                W_PX="$(sips -g pixelWidth "$S/$name.png" 2>/dev/null | awk '/pixelWidth/{print $2}')"; H_PX="$(sips -g pixelHeight "$S/$name.png" 2>/dev/null | awk '/pixelHeight/{print $2}')"
                [[ "${W_PX}x${H_PX}" == "$SIZE" ]] || { echo "::warning::$KEY/$LANGCODE/$name: ${W_PX}x${H_PX}, expected $SIZE; set dropped."; setok=0; break; }
              done
              [[ "$setok" -eq 1 ]] || break
              mkdir -p "$W/out-$KEY/$LOC"
              for name in 1-connect 2-terminal 3-files; do
                # JPEG: no alpha channel, which App Store Connect requires.
                sips -s format jpeg -s formatOptions 95 "$S/$name.png" --out "$W/out-$KEY/$LOC/$KEY-$name.jpg" >/dev/null 2>&1
              done
            done
            [[ "$setok" -eq 1 ]] || continue
            for LOC in en-US zh-Hans; do mkdir -p "$OUT/$LOC"; cp "$W/out-$KEY/$LOC/"*.jpg "$OUT/$LOC/"; done
            made=$((made + 1))
            echo "$KEY: 3 screenshots OK (en-US and zh-Hans)"
          done
          trap - EXIT; cleanup
          [[ "$made" -gt 0 ]] || { echo '::error::no screenshot set was produced.'; exit 1; }
          echo "SHOTS_OUT=$OUT" >> "$GITHUB_ENV"
          echo "SHOT_SETS=$made" >> "$GITHUB_ENV"

      # capture mode: the store screens of the real app, kept as an artifact. Nothing is uploaded
      # anywhere and no Apple credential exists in this job (the keychain/API-key steps skip capture).
      # The host on this Mac has a made-up home directory and shows this Mac's real desktop (a Finder
      # and a TextEdit window on the demo files). The host's password is random per run and masked.
      - name: Install ffmpeg for the host's desktop (capture)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'capture'
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg > "$RUNNER_TEMP/brew-ffmpeg.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/brew-ffmpeg.log" | cut -c1-300; echo '::error::brew install ffmpeg failed.'; exit 1; }
          ffmpeg -hide_banner -version | head -n 1
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Resolution|UI Looks like' | sed 's/^ */  display: /' | head -n 4 || true

      - name: Capture the store screens (simulators, app to remohop host on this Mac; no upload)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'capture'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set +e -uo pipefail
          redact() { sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_-]{16,}#\1<token>#g' | cut -c1-400; }
          grep -q 'func testStoreScreens' mobile/ios/RemoHopTests/GatewayE2ETests.swift || { echo '::error::GatewayE2ETests/testStoreScreens is not on this ref.'; exit 66; }
          W="$RUNNER_TEMP/remohop-capture"; OUT="$RUNNER_TEMP/remohop-ios-capture"
          rm -rf "$W" "$OUT"; mkdir -p "$W/host" "$W/cli" "$OUT"
          CGO_ENABLED=0 go build -trimpath -o "$W/remohop" ./cmd/remohop || { echo '::error::building remohop for the host failed.'; exit 1; }

          # The demo home directory (made-up content): what the terminal and the Files tab show.
          DEMO=/Users/demo
          sudo mkdir -p "$DEMO" && sudo chown "$(id -un)" "$DEMO"
          D="$DEMO/Documents"
          mkdir -p "$D/Invoices" "$D/Photos" "$D/Projects/website"
          printf 'RemoHop demo files\n' > "$D/README.txt"
          printf 'Weekly sync\n\n- Ship 1.0 to the App Store\n- New iPad screenshots\n- Plan the 1.1 release\n' > "$D/meeting-notes.txt"
          printf 'month,orders,revenue\nJul,182,9310\nAug,205,10422\nSep,231,11870\n' > "$D/sales-q3.csv"
          head -c 48213 /dev/urandom > "$D/budget-2026.xlsx"
          head -c 1843307 /dev/urandom > "$D/presentation.pdf"
          head -c 7340032 /dev/urandom > "$D/backup-2026-11.tar.gz"
          head -c 2311420 /dev/urandom > "$D/Photos/beach.jpg"; head -c 1904113 /dev/urandom > "$D/Photos/team.jpg"
          printf 'INV-1042,2026-11-02,1250.00\n' > "$D/Invoices/INV-1042.csv"
          # A small project with a made-up history for the terminal.
          (
            cd "$D/Projects/website" && git init -q -b main && printf '<h1>Hello</h1>\n' > index.html && printf 'body{margin:0}\n' > style.css
            n=0
            for msg in 'Initial commit' 'Add the landing page' 'Dark mode styles' 'Pricing section' 'Fix the mobile menu' 'Contact form' 'Update screenshots'; do
              n=$((n + 1)); printf '/* %s */\n' "$msg" >> style.css; git add -A
              GIT_AUTHOR_DATE="2026-11-$((10 + n))T10:0$n:00" GIT_COMMITTER_DATE="2026-11-$((10 + n))T10:0$n:00" \
                git -c user.name=Demo -c user.email=demo@example.com -c commit.gpgsign=false commit -q -m "$msg"
            done
          ) || echo '::warning::demo git history not created'
          STAMPS=('202611030912' '202611211840' '202611121105' '202611231627' '202611020855' '202611191031' '202611230941' '202611171408' '202610281322')
          i=0
          for f in "$D"/*; do touch -t "${STAMPS[$((i % ${#STAMPS[@]}))]}" "$f"; i=$((i + 1)); done
          # The login shell (bash) reads ~/.bash_profile: a short prompt and coloured ls.
          printf '%s\n' "export BASH_SILENCE_DEPRECATION_WARNING=1" \
            "PS1='\\[\\e[1;32m\\]demo@remohop\\[\\e[0m\\]:\\[\\e[1;34m\\]\\w\\[\\e[0m\\]\\\$ '" \
            "export CLICOLOR=1 LSCOLORS=ExGxFxdxCxDxDxBxBxExEx" "alias ls='ls -G'" "cd ~" > "$DEMO/.bash_profile"

          # Screen Recording for the host and ffmpeg (as in sodesk-e2e-macos.yml): copy a granted row.
          FFMPEG="$(command -v ffmpeg)"
          FFREAL="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$FFMPEG")"
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo test -f "$DB" || continue
            for CLIENT in "$W/remohop" "$FFMPEG" "$FFREAL"; do
              [[ "$CLIENT" =~ ^[A-Za-z0-9._/@+-]+$ ]] || continue
              sudo sqlite3 "$DB" "
                CREATE TEMP TABLE t AS SELECT * FROM access WHERE auth_value = 2 ORDER BY (service = 'kTCCServiceScreenCapture') DESC, (client_type = 1) DESC LIMIT 1;
                UPDATE t SET service = 'kTCCServiceScreenCapture', client = '$CLIENT', client_type = 1, auth_value = 2, csreq = NULL,
                  indirect_object_identifier_type = 0, indirect_object_identifier = 'UNUSED', indirect_object_code_identity = NULL;
                INSERT OR REPLACE INTO access SELECT * FROM t;
              " 2>/dev/null || echo "::warning::TCC: could not grant Screen Recording to $(basename "$CLIENT")"
            done
          done

          # This Mac's desktop: a Finder window on the demo documents and a note in TextEdit.
          open "$D" >/dev/null 2>&1
          open -a TextEdit "$D/meeting-notes.txt" >/dev/null 2>&1
          sleep 3

          PORT=$((20000 + RANDOM % 10000))
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          # Signal on (the app connects by ID, as people do); --listen keeps a direct address as a fallback.
          HOME="$DEMO" SHELL=/bin/bash BASH_SILENCE_DEPRECATION_WARNING=1 REMOHOP_CONFIG_DIR="$W/host" \
            "$W/remohop" host --listen "0.0.0.0:$PORT" --password "$PW" > "$W/host.log" 2>&1 < /dev/null &
          HOST_PID=$!
          SIMS=()
          cleanup() {
            kill "$HOST_PID" 2>/dev/null || true
            for u in ${SIMS[@]+"${SIMS[@]}"}; do xcrun simctl shutdown "$u" >/dev/null 2>&1; xcrun simctl delete "$u" >/dev/null 2>&1; done
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do grep -q 'host ready' "$W/host.log" 2>/dev/null && break; sleep 0.2; done
          grep -q 'host ready' "$W/host.log" || { echo '::error::remohop host did not start.'; grep -v Password "$W/host.log" | tail -n 5 | redact; exit 1; }
          TARGET="127.0.0.1:$PORT"
          HID="$(sed -n 's/^ *ID: *//p' "$W/host.log" | head -n 1 | tr -d ' \r')"
          if [[ "$HID" =~ ^[0-9]{6,12}$ ]]; then
            for _ in 1 2 3; do
              if REMOHOP_CONFIG_DIR="$W/cli" REMOHOP_PASSWORD="$PW" "$W/remohop" "$HID" ping -c 1 > "$W/ping.log" 2>&1; then TARGET="$HID"; break; fi
              sleep 5
            done
          fi
          if [[ "$TARGET" == "$HID" ]]; then echo "host: reachable by its ID through the signal server"; else echo "::warning::host: not reachable by ID; using its direct address"; tail -n 3 "$W/ping.log" 2>/dev/null | redact; fi

          SETS=()
          [[ ",$DEVICES," == *,iphone69,* ]] && SETS+=('iphone69|iPhone 17 Pro Max,iPhone 16 Pro Max')
          [[ ",$DEVICES," == *,ipad13,* ]] && SETS+=('ipad13|iPad Pro 13-inch (M5),iPad Pro 13-inch (M4)')
          NAMES=(1-desktop 2-terminal 3-files 4-connect)
          COMMAND='cd ~/Documents && ls -lh && cd Projects/website && git log --oneline --graph --decorate'
          DD="$RUNNER_TEMP/DerivedData-remohop-capture"
          made=0
          for set in "${SETS[@]}"; do
            IFS='|' read -r KEY NAMES_PREF <<< "$set"
            PICK="$(xcrun simctl list devicetypes -j > "$W/types.json"; xcrun simctl list runtimes -j > "$W/runtimes.json"; python3 - "$W/types.json" "$W/runtimes.json" "$NAMES_PREF" <<'PY'
          import json, sys
          types = json.load(open(sys.argv[1]))['devicetypes']
          runtimes = [r for r in json.load(open(sys.argv[2]))['runtimes'] if r.get('isAvailable') and r.get('platform', 'iOS') == 'iOS']
          def ver(r):
              return tuple(int(x) for x in r['version'].split('.') if x.isdigit())
          for name in sys.argv[3].split(','):
              for t in types:
                  if t['name'] != name:
                      continue
                  ok = [r for r in runtimes if any(d['identifier'] == t['identifier'] for d in r.get('supportedDeviceTypes', []))]
                  if ok:
                      best = max(ok, key=ver)
                      print(t['identifier'], best['identifier'], name.replace(' ', '_'))
                      raise SystemExit(0)
          PY
            )"
            if [[ -z "$PICK" ]]; then echo "::warning::$KEY: none of [$NAMES_PREF] is available on this runner; skipped."; continue; fi
            read -r TYPE_ID RUNTIME_ID DEVNAME <<< "$PICK"
            UDID="$(xcrun simctl create "remohop-capture-$KEY" "$TYPE_ID" "$RUNTIME_ID" 2>/dev/null)"
            [[ -n "$UDID" ]] || { echo "::warning::$KEY: could not create a simulator; skipped."; continue; }
            SIMS+=("$UDID")
            echo "$KEY: ${DEVNAME//_/ } · $RUNTIME_ID"
            for LANGCODE in en zh; do
              if [[ "$LANGCODE" == zh ]]; then LOC=zh-Hans; SYSLANGS=(zh-Hans en); SYSLOCALE=zh_CN; ALIAS='工作室 Mac'; else LOC=en-US; SYSLANGS=(en); SYSLOCALE=en_US; ALIAS='Studio Mac'; fi
              xcrun simctl boot "$UDID" >/dev/null 2>&1
              xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1
              xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "${SYSLANGS[@]}" >/dev/null 2>&1
              xcrun simctl spawn "$UDID" defaults write -g AppleLocale "$SYSLOCALE" >/dev/null 2>&1
              xcrun simctl shutdown "$UDID" >/dev/null 2>&1
              xcrun simctl boot "$UDID" >/dev/null 2>&1
              xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || { echo "::warning::$KEY/$LANGCODE: simulator did not boot."; continue; }
              xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --operatorName '' >/dev/null 2>&1
              S="$W/s-$KEY-$LANGCODE"; rm -rf "$S"; mkdir -p "$S"
              LOG="$RUNNER_TEMP/xccapture-$KEY-$LANGCODE.log"
              TEST_RUNNER_REMOHOP_E2E_TARGET="$TARGET" TEST_RUNNER_REMOHOP_E2E_PASSWORD="$PW" TEST_RUNNER_REMOHOP_E2E_DIR="$D" \
              TEST_RUNNER_REMOHOP_SHOTS_DIR="$S" TEST_RUNNER_REMOHOP_SHOTS_LANG="$LANGCODE" \
              TEST_RUNNER_REMOHOP_SHOTS_ALIAS="$ALIAS" TEST_RUNNER_REMOHOP_SHOTS_COMMAND="$COMMAND" \
              xcodebuild test -quiet \
                -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Debug \
                -destination "platform=iOS Simulator,id=$UDID" \
                -only-testing:RemoHopTests/GatewayE2ETests/testStoreScreens \
                -derivedDataPath "$DD" CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1 &
              XPID=$!
              got=0
              for name in "${NAMES[@]}"; do
                for _ in $(seq 1 1600); do
                  [[ -f "$S/$name.ready" ]] && break
                  kill -0 "$XPID" 2>/dev/null || break
                  sleep 0.25
                done
                [[ -f "$S/$name.ready" ]] || break
                xcrun simctl io "$UDID" screenshot --type=png "$S/$name.png" >/dev/null 2>&1
                touch "$S/$name.done"
                got=$((got + 1))
              done
              wait "$XPID"; st=$?
              echo "$KEY/$LOC: $got of ${#NAMES[@]} screens (xcodebuild exit $st)"
              grep -E 'store screens:' "$LOG" | redact | head -n 10 || true
              if [[ "$got" -ne ${#NAMES[@]} || "$st" -ne 0 ]]; then
                grep -E "error:|failed|XCTAssert|caught error|timed out|skipped" "$LOG" | redact | tail -n 15 || true
                echo "--- xcodebuild log (tail) ---"; tail -n 30 "$LOG" | redact || true
              fi
              if [[ "$got" -gt 0 ]]; then
                mkdir -p "$OUT/$KEY/$LOC"
                for name in "${NAMES[@]}"; do
                  [[ -f "$S/$name.png" ]] || continue
                  cp "$S/$name.png" "$OUT/$KEY/$LOC/$name.png"
                  echo "  $LOC/$name.png: $(sips -g pixelWidth -g pixelHeight "$S/$name.png" 2>/dev/null | awk '/pixel/{printf "%s ", $2}')"
                done
                made=$((made + got))
              fi
            done
          done
          # The Mac's own screen as the host saw it (for checking the desktop scene).
          screencapture -x "$OUT/mac-desktop.png" >/dev/null 2>&1 || true
          trap - EXIT; cleanup
          [[ "$made" -gt 0 ]] || { echo '::error::no screen was captured.'; exit 1; }
          echo "CAPTURE_OUT=$OUT" >> "$GITHUB_ENV"
          echo "- Captured $made store screens (devices: $DEVICES; en-US, zh-Hans): artifact \`remohop-ios-capture\`. Nothing uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the captured screens (artifact, 7 days)
        if: always() && env.MODE == 'capture' && env.CAPTURE_OUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remohop-ios-capture
          path: ${{ env.CAPTURE_OUT }}
          retention-days: 7
          if-no-files-found: error

      # ---- profile, testflight, metadata, screenshots: signing material / API key. Created only after all private-source
      # build scripts (gomobile bind above) ran, and removed in the last step. ----
      - name: Install pinned fastlane
        if: env.MODE != 'verify' && env.MODE != 'capture' && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        run: |
          set -euo pipefail
          GH="$RUNNER_TEMP/fastlane-gems"; rm -rf "$GH"; mkdir -p "$GH"
          GEM_HOME="$GH" GEM_PATH="$GH" gem install --no-document fastlane -v "$FASTLANE_VERSION" > /dev/null
          echo "GEM_HOME=$GH" >> "$GITHUB_ENV"; echo "GEM_PATH=$GH" >> "$GITHUB_ENV"; echo "$GH/bin" >> "$GITHUB_PATH"

      - name: Create ephemeral keychain and App Store Connect API key
        if: env.MODE != 'verify' && env.MODE != 'capture' && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="remohop-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"' | xargs)"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          {
            echo "ORIGINAL_DEFAULT_KEYCHAIN=$LOGIN_KEYCHAIN"
            echo "KEYCHAIN_NAME=$KEYCHAIN_NAME"; echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

          ASC_DIR="$RUNNER_TEMP/remohop-asc"; mkdir -p "$ASC_DIR" "$HOME/.appstoreconnect/private_keys"
          python3 - "$ASC_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          raw = os.environ['ASC_PRIVATE_KEY'].strip().replace('\\n', '\n')
          key = raw if 'PRIVATE KEY' in raw else base64.b64decode(''.join(raw.split())).decode('utf-8').strip()
          if 'PRIVATE KEY' not in key:
              raise SystemExit('ASC_PRIVATE_KEY is not a .p8 key')
          kid = os.environ['ASC_KEY_ID']
          d = Path(sys.argv[1])
          for p in (d / f'AuthKey_{kid}.p8', Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{kid}.p8'):
              p.write_text(key + '\n', encoding='utf-8'); os.chmod(p, 0o600)
          (d / 'api-key.json').write_text(json.dumps({'key_id': kid, 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': key, 'in_house': False}), encoding='utf-8')
          os.chmod(d / 'api-key.json', 0o600)
          PY
          echo "ASC_API_KEY_JSON=$ASC_DIR/api-key.json" >> "$GITHUB_ENV"
          echo "ASC_P8_PATH=$ASC_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_AUTH=$MATCH_AUTH" >> "$GITHUB_ENV"

      # ---- profile mode: one-time bundle ID + App Store profile for com.remohop.app only ----
      - name: Register bundle ID if missing (App Store Connect API)
        if: env.MODE == 'profile'
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'spaceship'
          require 'json'
          k = JSON.parse(File.read(ENV.fetch('ASC_API_KEY_JSON')))
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(key_id: k['key_id'], issuer_id: k['issuer_id'], key: k['key'])
          id = ENV.fetch('EXPECTED_BUNDLE_ID')
          found = Spaceship::ConnectAPI::BundleId.find(id)
          if found
            puts "Bundle ID already registered: #{id}"
          else
            Spaceship::ConnectAPI::BundleId.create(name: ENV.fetch('BUNDLE_ID_NAME'), identifier: id, platform: 'IOS')
            puts "Bundle ID registered: #{id}"
          end
          RUBY

      - name: Write App Store profile to Match (existing shared Distribution identity only)
        if: env.MODE == 'profile'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          COMMON=(--git_url "$MATCH_GIT_URL" --git_branch "$MATCH_GIT_BRANCH" --git_basic_authorization "$MATCH_AUTH"
                  --team_id "$ASC_TEAM_ID" --api_key_path "$ASC_API_KEY_JSON"
                  --keychain_name "$KEYCHAIN_NAME" --keychain_password "$KEYCHAIN_PASSWORD")
          echo 'Preflight: shared Distribution identity must already exist in Match...'
          MATCH_READONLY=true fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --readonly true --skip_provisioning_profiles true "${COMMON[@]}" > "$RUNNER_TEMP/match-pre.log" 2>&1 \
            || { tail -5 "$RUNNER_TEMP/match-pre.log"; echo '::error::Match preflight failed.'; exit 65; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution\|iPhone Distribution' \
            || { echo '::error::No shared Distribution identity in Match; refusing to create a certificate.'; exit 78; }
          MATCH_READONLY=false fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --readonly false --force --generate_apple_certs false --skip_confirmation true "${COMMON[@]}" > "$RUNNER_TEMP/match-write.log" 2>&1 \
            || { grep -iE 'error|could not|not found' "$RUNNER_TEMP/match-write.log" | head -10; echo '::error::Match could not write the RemoHop profile.'; exit 65; }
          echo "App Store profile for $EXPECTED_BUNDLE_ID written to Match: PASS"
          echo "- App Store profile for \`$EXPECTED_BUNDLE_ID\` written to the shared Match repo. Next: run mode=testflight." >> "$GITHUB_STEP_SUMMARY"

      # ---- metadata and screenshots modes: App Store Connect listing through fastlane deliver ----
      # Uses the API key only. Never submits for review, never releases, never uploads a binary, shows no
      # HTML preview. Only error lines are printed: the review contact details are in the files.
      - name: Check the App Store Connect app
        if: env.MODE == 'metadata' || env.MODE == 'screenshots'
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'spaceship'
          require 'json'
          k = JSON.parse(File.read(ENV.fetch('ASC_API_KEY_JSON')))
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(key_id: k['key_id'], issuer_id: k['issuer_id'], key: k['key'])
          app = Spaceship::ConnectAPI::App.find(ENV.fetch('EXPECTED_BUNDLE_ID'))
          abort "::error::No App Store Connect app with bundle ID #{ENV['EXPECTED_BUNDLE_ID']} for this API key." unless app
          want = ENV.fetch('EXPECTED_APPLE_ID', '')
          abort "::error::App Store Connect app ID #{app.id} is not the expected #{want}." unless want.empty? || app.id.to_s == want
          puts "App Store Connect app: #{ENV['EXPECTED_BUNDLE_ID']} (Apple ID #{app.id}): OK"
          RUBY

      - name: Upload listing text, categories, age rating and review info (deliver)
        if: env.MODE == 'metadata'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/ios
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/remohop-deliver"; rm -rf "$D"; mkdir -p "$D/metadata" "$D/screenshots"
          cp -R fastlane/metadata/. "$D/metadata/"
          # Committed screenshots (fastlane/screenshots/<locale>/*.jpg|png), if the repo has any.
          SHOTS=true
          if [[ -d fastlane/screenshots ]] && [[ -n "$(find fastlane/screenshots -type f \( -name '*.png' -o -name '*.jpg' \) -print -quit)" ]]; then
            cp -R fastlane/screenshots/. "$D/screenshots/"; SHOTS=false
            echo 'Screenshots: using the committed files in mobile/ios/fastlane/screenshots.'
          else
            echo 'Screenshots: none committed (run mode=screenshots to generate and upload them).'
          fi
          VERSION="$(sed -n 's/.*MARKETING_VERSION = \([0-9][0-9.]*\);.*/\1/p' RemoHop.xcodeproj/project.pbxproj | head -n 1)"
          [[ -n "$VERSION" ]] || { echo '::error::MARKETING_VERSION not found in the project.'; exit 65; }
          LOG="$RUNNER_TEMP/deliver-metadata.log"
          cd "$D"
          set +e
          fastlane deliver --api_key_path "$ASC_API_KEY_JSON" --app_identifier "$EXPECTED_BUNDLE_ID" --app_version "$VERSION" \
            --metadata_path "$D/metadata" --screenshots_path "$D/screenshots" \
            --skip_binary_upload true --skip_screenshots "$SHOTS" --skip_metadata false --overwrite_screenshots true \
            --submit_for_review false --automatic_release false --force true --run_precheck_before_submit false \
            > "$LOG" 2>&1
          st=$?
          set -e
          if [[ "$st" -ne 0 ]]; then
            grep -E '\[!\]|rror|nvalid|nable to|annot|ejected|ould not|not found|ITC|ENTITY' "$LOG" | grep -viE '@|phone|password|demo' | cut -c1-300 | sort -u | head -n 30 || true
            # Where it failed: fastlane's step lines and the deliver/spaceship stack frames (code paths only).
            echo '--- last fastlane steps ---'
            grep -E '^\[[0-9:]+\]: ' "$LOG" | grep -viE '@|phone|password|demo|key' | cut -c1-200 | tail -n 25 || true
            echo '--- stack (deliver/spaceship frames) ---'
            grep -oE '(deliver|spaceship)/lib/[a-z_/]+\.rb:[0-9]+:in [^ ]+' "$LOG" | head -n 15 || true
            echo "::error::fastlane deliver failed (exit $st). If it says there is no editable version, create version $VERSION in App Store Connect (Prepare for Submission) and rerun."
            exit 1
          fi
          # The age rating is answered in App Store Connect: Apple's current questionnaire has
          # questions the API (and fastlane's age_rating.json) does not cover yet.
          echo "Listing uploaded for version $VERSION: name, subtitle, description, keywords, promotional text, URLs, copyright, categories (age rating and review contact: in App Store Connect)."
          echo "- App Store listing text and categories uploaded for version \`$VERSION\` (not submitted). Age rating and review contact: App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          [[ "$SHOTS" == 'true' ]] || echo '- Committed screenshots uploaded.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated screenshots (deliver)
        if: env.MODE == 'screenshots'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}/mobile/ios
        run: |
          set -euo pipefail
          [[ -d "${SHOTS_OUT:-}" ]] || { echo '::error::No screenshots were generated.'; exit 65; }
          D="$RUNNER_TEMP/remohop-deliver"; rm -rf "$D"; mkdir -p "$D/metadata"
          VERSION="$(sed -n 's/.*MARKETING_VERSION = \([0-9][0-9.]*\);.*/\1/p' RemoHop.xcodeproj/project.pbxproj | head -n 1)"
          [[ -n "$VERSION" ]] || { echo '::error::MARKETING_VERSION not found in the project.'; exit 65; }
          LOG="$RUNNER_TEMP/deliver-screenshots.log"
          cd "$D"
          set +e
          fastlane deliver --api_key_path "$ASC_API_KEY_JSON" --app_identifier "$EXPECTED_BUNDLE_ID" --app_version "$VERSION" \
            --metadata_path "$D/metadata" --screenshots_path "$SHOTS_OUT" \
            --skip_binary_upload true --skip_metadata true --skip_screenshots false --overwrite_screenshots true \
            --submit_for_review false --automatic_release false --force true --run_precheck_before_submit false \
            > "$LOG" 2>&1
          st=$?
          set -e
          if [[ "$st" -ne 0 ]]; then
            grep -E '\[!\]|rror|nvalid|nable to|nsupported|annot|ejected|ould not|not found' "$LOG" | cut -c1-300 | sort -u | head -n 30 || true
            echo "::error::fastlane deliver (screenshots) failed (exit $st). If it says there is no editable version, create version $VERSION in App Store Connect and rerun."
            exit 1
          fi
          echo "Screenshots uploaded: $SHOT_SETS size set(s), locales en-US and zh-Hans."
          echo "- App Store screenshots uploaded ($SHOT_SETS size set(s): 6.9\", 6.5\", iPad 13\" as available) for version \`$VERSION\` (not submitted)." >> "$GITHUB_STEP_SUMMARY"

      # ---- testflight mode ----
      - name: Install signing assets with Match (readonly)
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          MATCH_READONLY=true fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --git_url "$MATCH_GIT_URL" --git_branch "$MATCH_GIT_BRANCH" --git_basic_authorization "$MATCH_AUTH" \
            --team_id "$ASC_TEAM_ID" --api_key_path "$ASC_API_KEY_JSON" \
            --keychain_name "$KEYCHAIN_NAME" --keychain_password "$KEYCHAIN_PASSWORD" \
            --shallow_clone true --clone_branch_directly true --readonly true > "$RUNNER_TEMP/match.log" 2>&1 \
            || { grep -iE 'error|could not|no matching' "$RUNNER_TEMP/match.log" | head -10; echo '::error::Readonly Match failed. First run? Run this workflow once with mode=profile, confirm=WRITE.'; exit 65; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          PROFILE_NAME=''
          shopt -s nullglob
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            pl="$RUNNER_TEMP/prof.plist"
            security cms -D -i "$p" > "$pl" 2>/dev/null || continue
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$pl" 2>/dev/null || true)"
            gt="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$pl" 2>/dev/null || echo false)"
            if [[ "$appid" == "$ASC_TEAM_ID.$EXPECTED_BUNDLE_ID" && "$gt" != 'true' ]]; then
              PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$pl")"
            fi
            rm -f "$pl"
          done
          [[ -n "$PROFILE_NAME" ]] || { echo "::error::No App Store profile for $EXPECTED_BUNDLE_ID installed. Run mode=profile, confirm=WRITE once."; exit 65; }
          echo "APPSTORE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile: $PROFILE_NAME"

      - name: Resolve build number
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        run: |
          set -euo pipefail
          set +e
          OUT="$(fastlane run latest_testflight_build_number api_key_path:"$ASC_API_KEY_JSON" app_identifier:"$EXPECTED_BUNDLE_ID" initial_build_number:0 2>&1)"
          st=$?
          set -e
          LATEST="$(printf '%s\n' "$OUT" | sed -n 's/.*Result: \([0-9][0-9]*\).*/\1/p' | tail -1)"
          if [[ "$st" -ne 0 || -z "$LATEST" ]]; then
            printf '%s\n' "$OUT" | grep -iE 'could not find app|no app|not found' | head -3 || true
            echo "::error::Could not read TestFlight builds. Does the App exist in App Store Connect with bundle ID $EXPECTED_BUNDLE_ID, and may the API key read it?"
            exit 1
          fi
          if [[ -n "$BUILD_NUMBER_INPUT" ]]; then
            (( BUILD_NUMBER_INPUT > LATEST )) || { echo "::error::build_number $BUILD_NUMBER_INPUT must be higher than latest $LATEST."; exit 1; }
            BN="$BUILD_NUMBER_INPUT"
          else
            BN=$((LATEST + 1))
          fi
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "Latest TestFlight build: $LATEST → this build: $BN"

      - name: Build signed archive and IPA
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/remohop.xcarchive"; EXPORT_DIR="$RUNNER_TEMP/remohop-export"; OPTS="$RUNNER_TEMP/remohop-export.plist"
          rm -rf "$ARCHIVE" "$EXPORT_DIR"; mkdir -p "$EXPORT_DIR"
          # MARKETING_VERSION is deliberately not overridden: the project's value is kept.
          # Export compliance is the owner's answer (mobile/ios/fastlane/export-compliance.env), never a CI guess:
          # empty = not set in the build (answer it in App Store Connect), YES/NO = ITSAppUsesNonExemptEncryption.
          EC_FILE=mobile/ios/fastlane/export-compliance.env
          EC=''; [[ ! -f "$EC_FILE" ]] || EC="$(sed -n 's/^USES_NON_EXEMPT_ENCRYPTION=//p' "$EC_FILE" | head -n 1 | tr -d '\r \t')"
          EXTRA=()
          case "$EC" in
            YES|NO) EXTRA=("INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=$EC"); echo "Export compliance from export-compliance.env: ITSAppUsesNonExemptEncryption=$EC" ;;
            '') ;;
            *) echo '::error::export-compliance.env: USES_NON_EXEMPT_ENCRYPTION must be empty, YES or NO.'; exit 65 ;;
          esac
          # Full output goes to a log; on failure only the error lines are printed (no secrets in them).
          show_errors() { grep -E 'error:|\*\* (ARCHIVE|EXPORT) FAILED|Error Domain|NSLocalizedDescription|requires a provisioning|No profile|No signing certificate|doesn.t include|Code Sign' "$1" | cut -c1-400 | sort -u | head -n 40 || true; }
          set +e
          xcodebuild archive -quiet \
            -project mobile/ios/RemoHop.xcodeproj -scheme RemoHop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$ASC_TEAM_ID" CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$APPSTORE_PROFILE_NAME" \
            ${EXTRA[@]+"${EXTRA[@]}"} > "$RUNNER_TEMP/remohop-archive.log" 2>&1
          st=$?
          set -e
          if [[ "$st" -ne 0 ]]; then show_errors "$RUNNER_TEMP/remohop-archive.log"; echo "::error::xcodebuild archive failed (exit $st)."; exit 65; fi
          python3 - "$OPTS" <<'PY'
          import os, plistlib, sys
          plistlib.dump({
              "method": "app-store-connect", "destination": "export", "signingStyle": "manual",
              "signingCertificate": "Apple Distribution", "teamID": os.environ["ASC_TEAM_ID"],
              "provisioningProfiles": {os.environ["EXPECTED_BUNDLE_ID"]: os.environ["APPSTORE_PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False, "uploadSymbols": True,
          }, open(sys.argv[1], "wb"))
          PY
          set +e
          xcodebuild -exportArchive -quiet -archivePath "$ARCHIVE" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$OPTS" > "$RUNNER_TEMP/remohop-export.log" 2>&1
          st=$?
          set -e
          if [[ "$st" -ne 0 ]]; then show_errors "$RUNNER_TEMP/remohop-export.log"; echo "::error::xcodebuild -exportArchive failed (exit $st)."; exit 65; fi
          IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$IPA" ]] || { echo '::error::IPA was not exported.'; exit 65; }
          V="$RUNNER_TEMP/remohop-verify"; rm -rf "$V"; mkdir -p "$V"; unzip -q "$IPA" -d "$V"
          APP="$(find "$V/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          PB=/usr/libexec/PlistBuddy
          codesign --verify --deep --strict "$APP"
          [[ "$($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" == "$EXPECTED_BUNDLE_ID" ]] || { echo '::error::Bundle ID mismatch'; exit 65; }
          [[ "$($PB -c 'Print :CFBundleVersion' "$APP/Info.plist")" == "$BUILD_NUMBER" ]] || { echo '::error::Build number mismatch'; exit 65; }
          VERSION="$($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          test -f "$APP/remohop-mobile.js" || { echo '::error::App bundle has no remohop-mobile.js'; exit 65; }
          # What App Store processing needs (a missing piece is rejected by altool validate or processing).
          # The icon name may be a top-level key or sit inside CFBundleIcons (Xcode versions differ); a
          # real problem is reported by altool validate below, so only warn here and show the facts.
          if $PB -c 'Print :CFBundleIconName' "$APP/Info.plist" >/dev/null 2>&1 \
             || $PB -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'App icon: icon name present in Info.plist.'
          else
            echo '::warning::Info.plist has no icon name key (CFBundleIconName / CFBundleIcons); altool validate decides. Icon-related keys:'
            plutil -p "$APP/Info.plist" | grep -i icon | cut -c1-200 || true
          fi
          test -f "$APP/Assets.car" || { echo '::error::Assets.car is missing (asset catalog not compiled).'; ls "$APP" | head -n 40; exit 65; }
          $PB -c 'Print :MinimumOSVersion' "$APP/Info.plist" >/dev/null 2>&1 || { echo '::error::Info.plist has no MinimumOSVersion.'; exit 65; }
          security cms -D -i "$APP/embedded.mobileprovision" > "$V/prov.plist" 2>/dev/null || { echo '::error::No embedded provisioning profile.'; exit 65; }
          [[ "$($PB -c 'Print :Entitlements:get-task-allow' "$V/prov.plist" 2>/dev/null || echo false)" != 'true' ]] || { echo '::error::Profile is a development profile (get-task-allow).'; exit 65; }
          if $PB -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'Export compliance: ITSAppUsesNonExemptEncryption is set in Info.plist.'
          else
            echo '::notice title=Export compliance::Info.plist has no ITSAppUsesNonExemptEncryption. The export-compliance (encryption) question for this build must be answered in App Store Connect (TestFlight, the build, Provide Export Compliance Information) before testers can install it. This workflow does not set the answer.'
            echo "EXPORT_COMPLIANCE_PENDING=1" >> "$GITHUB_ENV"
          fi
          if [[ ! -f "$APP/PrivacyInfo.xcprivacy" ]]; then
            echo '::notice title=Privacy manifest::The app has no PrivacyInfo.xcprivacy. Apple may email warnings (ITMS-91053) if required-reason APIs are used; consider adding one.'
          fi
          rm -rf "$V"
          echo "SIGNED_IPA=$IPA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Signed IPA: $(basename "$IPA") · $(du -h "$IPA" | cut -f1) · $VERSION ($BUILD_NUMBER)"

      - name: Validate and upload to TestFlight (altool)
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          for action in validate-app upload-app; do
            LOG="$RUNNER_TEMP/altool-$action.log"
            set +e
            xcrun altool --$action --file "$SIGNED_IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$LOG" 2>&1
            st=$?
            set -e
            if [[ "$st" -ne 0 ]] || grep -qiE '^[[:space:]]*[*]{3} Error|ERROR ITMS-' "$LOG"; then
              grep -iE 'error|ITMS-|warning|message|reason|description' "$LOG" | cut -c1-500 | head -n 40 || true
              MSG="$(grep -iE 'error|ITMS-|bundle version|message' "$LOG" | head -20 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=altool $action failed::${MSG:-exit $st}"
              exit 1
            fi
            echo "altool $action: OK"
          done
          echo "TestFlight upload accepted: $APP_VERSION ($BUILD_NUMBER)"

      - name: Summary
        if: success() && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        run: |
          {
            echo "- Xcode: \`$(xcodebuild -version | sed -n 1p)\`"
            if [[ "$MODE" == 'testflight' ]]; then
              echo "- TestFlight: \`$EXPECTED_BUNDLE_ID\` $APP_VERSION ($BUILD_NUMBER) uploaded; processing in App Store Connect takes a few minutes."
              [[ -z "${EXPORT_COMPLIANCE_PENDING:-}" ]] || echo '- Export compliance: answer the encryption question for this build in App Store Connect (not set by CI).'
            elif [[ "$MODE" == 'metadata' || "$MODE" == 'screenshots' ]]; then
              echo '- Nothing was submitted for review or released; the privacy label and export compliance are not set by CI (see mobile/ios/fastlane).'
            elif [[ "$MODE" == 'verify' ]]; then
              echo "- Go: \`$(go version | cut -d' ' -f3)\`"
              echo '- No signing; nothing uploaded.'
            elif [[ "$MODE" == 'capture' ]]; then
              echo '- Capture only: no Apple credential used, nothing uploaded to App Store Connect. Screens: artifact remohop-ios-capture.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: |
          set +e
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1
            security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1
          fi
          [[ -n "${KEYCHAIN_NAME:-}" ]] && security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/remohop-asc" "$RUNNER_TEMP/remohop-export" "$RUNNER_TEMP/remohop.xcarchive" "$RUNNER_TEMP/remohop-verify" >/dev/null 2>&1
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8 >/dev/null 2>&1
          true
