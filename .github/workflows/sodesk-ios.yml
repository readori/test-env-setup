# SoDesk iOS app CI (controller app: SwiftUI shell + WKWebView on an in-process Go gateway).
#
# Public CI repository -> source readori/SoDesk. Copy this file to .github/workflows/ in the CI repo.
#
#   verify : Xcode 26.x + Go from go.mod -> mobile/ios/build-xcframework.sh (gomobile bind
#            -target=ios,iossimulator of mobile/sodeskcore -> mobile/ios/build/Sodeskcore.xcframework)
#            -> simulator build of mobile/ios/SoDesk.xcodeproj with no signing -> xcodebuild test of
#            SoDeskTests on an iOS simulator. Also runs the Go tests of internal/mobile on macOS.
#            Then the end-to-end test: an `rds host` is started on the runner (loopback only, a
#            random one-run password) and SoDeskTests/GatewayE2ETests runs inside the app on the
#            simulator: connect form -> connect to the host by address and password -> a command
#            in the terminal -> the Files tab lists a host directory.
#
#   verify mode uses no Apple credentials: no signing, no Match, no App Store Connect.
#
#   profile    : ONE-TIME setup. Registers the bundle ID com.readori.sodesk with the App Store
#                Connect API if it is missing, then writes an App Store provisioning profile for
#                it to the shared Match repo (readori/readori-certificates), signed by the
#                EXISTING shared Apple Distribution identity (never creates certificates, never
#                touches other apps' profiles). Needs confirm=WRITE. No source checkout.
#   testflight : Xcode 26.x + Go -> gomobile xcframework (as verify) -> Match (readonly) -> signed
#                archive of the SoDesk scheme (generic iOS device, manual signing, Apple
#                Distribution + the Match profile) -> IPA -> altool validate -> altool upload.
#                CFBundleVersion = build_number input, or (empty) latest TestFlight build + 1.
#                The marketing version (CFBundleShortVersionString) stays whatever the Xcode
#                project says.
#
# Triggers: workflow_dispatch (modes verify, profile, testflight), or a push to main that
# changes ci-requests/sodesk-ios.env (how the project's AI engineer requests a run; ALWAYS
# verify, never signing). Never pull_request. The request file is plain KEY=VALUE text, parsed
# with strict patterns and never executed:
#
#   REF=main          # readori/SoDesk branch, tag or SHA
#
# Secrets: TARGET_REPO_PAT (source checkout + Match repo), and for profile/testflight
# MATCH_PASSWORD, ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY, ASC_TEAM_ID.
#
# Safety rules (public repo, public logs): third-party actions pinned to commit SHAs (only
# GitHub-owned actions are used; fastlane comes from a pinned gem); TARGET_REPO_PAT is not
# persisted by the checkout; xcodebuild always -quiet; private source files are never printed
# beyond compiler errors; the signed IPA never leaves the runner (no artifacts); signing
# material is created only after the private-source build scripts (gomobile bind) ran, and is
# removed at the end. The end-to-end step prints results and failure tails only: never the host
# password (masked) or a gateway URL (its token is redacted from anything printed).
name: SoDesk iOS

run-name: SoDesk iOS · ${{ github.event_name == 'push' && 'request (ci-requests/sodesk-ios.env)' || format('{0} · {1}{2}', inputs.mode, inputs.ref, inputs.build_number && format(' · build {0}', inputs.build_number) || '') }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = simulator build + tests + end-to-end, no signing; profile = one-time signing setup (needs confirm=WRITE); testflight = signed build + upload'
        required: true
        default: 'verify'
        type: choice
        options: [verify, profile, testflight]
      ref:
        description: 'readori/SoDesk branch, tag, or SHA (not used by profile)'
        required: true
        default: 'main'
        type: string
      build_number:
        description: 'testflight: build number (CFBundleVersion). Empty = latest TestFlight build + 1.'
        required: false
        default: ''
        type: string
      confirm:
        description: 'profile mode only: type WRITE'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: ['ci-requests/sodesk-ios.env']

permissions:
  contents: read

# verify runs of the same ref cancel each other; profile and testflight never cancel a running
# run (an upload or a Match write must not be cut off).
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.mode == 'verify') && format('sodesk-ios-{0}', inputs.ref || 'request') || format('sodesk-ios-{0}', inputs.mode) }}
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.mode == 'verify' }}

env:
  PRIVATE_SOURCE_REPOSITORY: readori/SoDesk
  PRIVATE_SOURCE_PATH: source
  EXPECTED_BUNDLE_ID: com.readori.sodesk
  BUNDLE_ID_NAME: SoDesk
  XCODE_MAJOR_WANTED: '26'
  MATCH_GIT_URL: https://github.com/readori/readori-certificates.git
  MATCH_GIT_BRANCH: main
  FASTLANE_VERSION: '2.238.0'
  CI: '1'
  LANG: en_US.UTF-8

jobs:
  ios:
    name: Build SoDesk iOS
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate request and credentials
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          CONFIRM: ${{ inputs.confirm }}
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci-requests/sodesk-ios.env
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            # Download only the request file of this exact commit (public repo, no credentials).
            REQ="$RUNNER_TEMP/sodesk-ios-request.env"
            curl -fsSL --retry 3 --max-time 30 "$REQUEST_URL" -o "$REQ" || { echo '::error::Could not read ci-requests/sodesk-ios.env at this commit.'; exit 64; }
            # Plain text, read line by line; never sourced or executed.
            SOURCE_REF="$(sed -n 's/^REF=//p' "$REQ" | head -n 1 | tr -d '\r')"
            MODE=verify
          else
            SOURCE_REF="$INPUT_REF"
            MODE="$INPUT_MODE"
          fi
          case "$MODE" in verify|profile|testflight) ;; *) echo "::error::Unsupported mode: $MODE"; exit 64 ;; esac
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ && ${#SOURCE_REF} -le 200 ]] || {
            echo '::error::ref must be a non-empty branch, tag, or SHA (letters, digits, . _ / - only, no leading dash).'
            exit 64
          }
          [[ -n "${TARGET_REPO_PAT:-}" ]] || { echo '::error::Missing secret TARGET_REPO_PAT (read access to readori/SoDesk).'; exit 78; }
          if [[ -n "$BUILD_NUMBER_INPUT" ]]; then
            [[ "$MODE" == 'testflight' ]] || { echo '::error::build_number is only used by testflight mode.'; exit 64; }
            [[ "$BUILD_NUMBER_INPUT" =~ ^[1-9][0-9]{0,8}$ ]] || { echo '::error::build_number must be a whole number.'; exit 64; }
          fi
          if [[ "$MODE" == 'profile' && "$CONFIRM" != 'WRITE' ]]; then
            echo '::error::profile mode writes to the shared Match repo: set confirm=WRITE.'; exit 64
          fi
          if [[ "$MODE" != 'verify' ]]; then
            missing=0
            for name in MATCH_PASSWORD ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY ASC_TEAM_ID; do
              [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name"; missing=1; }
            done
            (( missing == 0 )) || exit 78
          fi
          {
            echo "SOURCE_REF=$SOURCE_REF"
            echo "MODE=$MODE"
            echo "BUILD_NUMBER_INPUT=$BUILD_NUMBER_INPUT"
          } >> "$GITHUB_ENV"
          echo "Trigger: $EVENT_NAME · mode: $MODE · ref: $SOURCE_REF · build: ${BUILD_NUMBER_INPUT:-auto}"

      - name: Checkout source
        if: env.MODE != 'profile'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: readori/SoDesk
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: ${{ env.PRIVATE_SOURCE_PATH }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify source layout
        id: layout
        if: env.MODE != 'profile'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          C="$(git rev-parse HEAD)"
          echo "SOURCE_SHORT_SHA=${C:0:8}" >> "$GITHUB_ENV"
          { echo "### SoDesk iOS · $MODE"; echo; echo "- Source: \`$PRIVATE_SOURCE_REPOSITORY@${C:0:8}\` (ref \`$SOURCE_REF\`)"; } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f mobile/ios/SoDesk.xcodeproj/project.pbxproj ]]; then
            [[ "$MODE" == 'verify' ]] || { echo '::error::mobile/ios is not on this ref; nothing to build.'; exit 66; }
            echo '::notice::mobile/ios is not on this ref: nothing to verify.'
            echo '- Result: skipped, no iOS app at this ref' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in go.mod mobile/go.mod mobile/sodeskcore/sodeskcore.go mobile/shared/sodesk-mobile.js mobile/ios/build-xcframework.sh \
                   mobile/ios/SoDesk.xcodeproj/xcshareddata/xcschemes/SoDesk.xcscheme; do
            [[ -f "$f" ]] || { echo "::error::$f is missing."; exit 66; }
          done
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $EXPECTED_BUNDLE_ID;" mobile/ios/SoDesk.xcodeproj/project.pbxproj || { echo "::error::bundle ID must be $EXPECTED_BUNDLE_ID"; exit 65; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Source ${C:0:8} · layout: PASS"

      - name: Select Xcode 26.x
        if: steps.layout.outputs.ready == 'true' || env.MODE == 'profile'
        run: |
          set -euo pipefail
          XCODE_APP=''; BEST=''
          for app in /Applications/Xcode*.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            case "$app" in *[Bb]eta*) continue ;; esac
            v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)"
            [[ "${v%%.*}" == "$XCODE_MAJOR_WANTED" ]] || continue
            if [[ -z "$BEST" ]] || [[ "$(printf '%s\n%s\n' "$BEST" "$v" | sort -V | tail -1)" == "$v" ]]; then BEST="$v"; XCODE_APP="$app"; fi
          done
          [[ -n "$XCODE_APP" ]] || { echo "::error::No Xcode ${XCODE_MAJOR_WANTED}.x on this runner."; ls -1 /Applications | grep '^Xcode' || true; exit 69; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Set up Go (version from go.mod)
        if: steps.layout.outputs.ready == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ env.PRIVATE_SOURCE_PATH }}/go.mod
          cache: false

      - name: Go tests of the mobile core (macOS)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -o pipefail
          go version
          go test -count=1 ./internal/mobile 2>&1 | cut -c1-2000 | tail -n 100
          (cd mobile && go test -count=1 ./... 2>&1 | cut -c1-2000 | tail -n 50)

      - name: gomobile bind (Sodeskcore.xcframework)
        if: steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/gomobile.log"
          bash mobile/ios/build-xcframework.sh > "$LOG" 2>&1 || { grep -iE 'error|undefined|cannot' "$LOG" | cut -c1-400 | head -n 40; echo '::error::gomobile bind failed.'; exit 1; }
          XCF=mobile/ios/build/Sodeskcore.xcframework
          [[ -f "$XCF/Info.plist" ]] || { echo '::error::XCFramework was not produced.'; exit 65; }
          echo "XCFramework: $(du -sh "$XCF" | cut -f1) · slices: $(ls "$XCF" | grep -v Info.plist | tr '\n' ' ')"

      - name: Build for iOS Simulator (no signing)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/DerivedData-sodesk"
          xcodebuild build -quiet \
            -project mobile/ios/SoDesk.xcodeproj -scheme SoDesk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
          APP="$(find "$DD/Build/Products" -maxdepth 2 -type d -name 'SoDesk.app' -print -quit)"
          [[ -n "$APP" ]] || { echo '::error::Simulator .app was not produced.'; exit 65; }
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          [[ "$BID" == "$EXPECTED_BUNDLE_ID" ]] || { echo "::error::Bundle ID mismatch: $BID"; exit 65; }
          test -f "$APP/sodesk-mobile.js" || { echo '::error::App bundle has no sodesk-mobile.js (injected script not embedded).'; exit 65; }
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Info.plist" | grep -q true || { echo '::error::ATS local networking exception missing.'; exit 65; }
          SIZE="$(du -sh "$APP" | cut -f1)"
          echo "Simulator build OK: SoDesk.app · $SIZE"
          echo "- Simulator build ($BID): $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests on an iOS simulator
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          # The newest available iPhone simulator on this runner.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt:
                  continue
              ver = tuple(int(x) for x in rt.rsplit("iOS-", 1)[-1].split("-") if x.isdigit())
              for dev in devs:
                  if dev.get("isAvailable") and dev["name"].startswith("iPhone"):
                      if best is None or ver > best[0]:
                          best = (ver, dev["udid"], dev["name"])
          print(best[1] if best else "")
          ')"
          [[ -n "$UDID" ]] || { echo '::error::No iPhone simulator available.'; xcrun simctl list runtimes | head -20; exit 69; }
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          RES="$RUNNER_TEMP/SoDeskTests.xcresult"
          set +e
          xcodebuild test -quiet \
            -project mobile/ios/SoDesk.xcodeproj -scheme SoDesk -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-sodesk-test" -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xctest.log" 2>&1
          st=$?
          set -e
          grep -E "Executed [0-9]+ tests?|error:|failed|XCTAssert" "$RUNNER_TEMP/xctest.log" | cut -c1-400 | tail -n 40 || true
          [[ "$st" -eq 0 ]] || { echo '::error::xcodebuild test failed.'; exit 1; }
          echo '- Unit tests (SoDeskTests) on the iOS simulator: PASS' >> "$GITHUB_STEP_SUMMARY"

      # The app on the simulator against a real host: the simulator shares the Mac's network, so
      # 127.0.0.1 is the runner. The host listens on loopback only, with a password made for this
      # run; the test gets address, password and directory through TEST_RUNNER_* variables (and a
      # private file as a fallback), never through the log.
      - name: End-to-end on the simulator (app to rds host on this Mac)
        if: steps.layout.outputs.ready == 'true' && env.MODE == 'verify'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        run: |
          set +e -uo pipefail
          if [[ ! -f mobile/ios/SoDeskTests/GatewayE2ETests.swift ]]; then
            echo '::notice::no GatewayE2ETests on this ref; skipped.'
            echo '- End-to-end (app to host): skipped, not on this ref' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          redact() { sed -E 's#(127\.0\.0\.1:[0-9]+/)[A-Za-z0-9_-]{16,}#\1<token>#g' | cut -c1-400; }
          W="$RUNNER_TEMP/sodesk-ios-e2e"
          rm -rf "$W"; mkdir -p "$W/host" "$W/cli" "$W/files"
          CGO_ENABLED=0 go build -trimpath -o "$W/rds" ./cmd/rds || { echo '::error::building rds for the host failed.'; exit 1; }
          printf 'hello from the host\n' > "$W/files/hello.txt"
          PORT=$((20000 + RANDOM % 10000)); TARGET="127.0.0.1:$PORT"
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          RDS_CONFIG_DIR="$W/host" "$W/rds" host --no-signal --listen "$TARGET" --password "$PW" > "$W/host.log" 2>&1 < /dev/null &
          HOST_PID=$!
          CFG=/tmp/sodesk-ios-e2e.json
          cleanup() { kill "$HOST_PID" 2>/dev/null || true; rm -f "$CFG"; }
          trap cleanup EXIT
          for _ in $(seq 1 100); do grep -q 'host ready' "$W/host.log" 2>/dev/null && break; sleep 0.2; done
          grep -q 'host ready' "$W/host.log" || { echo '::error::rds host did not start.'; tail -n 5 "$W/host.log" | redact; exit 1; }
          if RDS_CONFIG_DIR="$W/cli" RDS_PASSWORD="$PW" "$W/rds" "$TARGET" ping -c 1 > "$W/ping.log" 2>&1; then
            echo "host: rds host on $TARGET answers a client on this Mac"
          else
            echo '::error::the host does not answer a client on this Mac.'; tail -n 5 "$W/ping.log" | redact; exit 1
          fi
          ( umask 077; E2E_TARGET="$TARGET" E2E_PASSWORD="$PW" E2E_DIR="$W/files" python3 -c '
          import json, os
          print(json.dumps({"target": os.environ["E2E_TARGET"], "password": os.environ["E2E_PASSWORD"], "dir": os.environ["E2E_DIR"]}))
          ' > "$CFG" )
          RES="$RUNNER_TEMP/SoDeskE2E.xcresult"; rm -rf "$RES"
          LOG="$RUNNER_TEMP/xce2e.log"
          TEST_RUNNER_SODESK_E2E_TARGET="$TARGET" TEST_RUNNER_SODESK_E2E_PASSWORD="$PW" TEST_RUNNER_SODESK_E2E_DIR="$W/files" \
          xcodebuild test -quiet \
            -project mobile/ios/SoDesk.xcodeproj -scheme SoDesk -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:SoDeskTests/GatewayE2ETests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-sodesk-test" -resultBundlePath "$RES" \
            CODE_SIGNING_ALLOWED=NO > "$LOG" 2>&1
          st=$?
          # What happened to the one test: Passed, Failed or Skipped (a skip is not a pass).
          OUTCOME="$(xcrun xcresulttool get test-results tests --path "$RES" 2>/dev/null | python3 -c '
          import json, sys
          def walk(n):
              if n.get("nodeType") == "Test Case" and "testConnectTerminalFiles" in n.get("name", ""):
                  return n.get("result") or "unknown"
              for c in n.get("children", []):
                  r = walk(c)
                  if r:
                      return r
              return None
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          r = None
          for n in d.get("testNodes", []):
              r = walk(n)
              if r:
                  break
          print(r or "unknown")
          ' || true)"
          if [[ "$OUTCOME" == 'unknown' || -z "$OUTCOME" ]]; then
            if grep -Eq "testConnectTerminalFiles\]' passed" "$LOG"; then OUTCOME=Passed
            elif grep -Eq "testConnectTerminalFiles\]' skipped|with 1 test skipped" "$LOG"; then OUTCOME=Skipped
            elif grep -Eq "Executed 1 test, with 0 failures" "$LOG"; then OUTCOME=Passed
            fi
          fi
          echo "GatewayE2ETests.testConnectTerminalFiles: ${OUTCOME:-unknown} (xcodebuild exit $st)"
          if [[ "$st" -ne 0 || "$OUTCOME" != 'Passed' ]]; then
            grep -E "error:|failed|XCTAssert|caught error|timed out|Executed [0-9]+ tests?" "$LOG" | redact | tail -n 40 || true
            echo '--- host log (warnings and errors) ---'
            grep -Ei 'warn|error|refus|denied|fail' "$W/host.log" | redact | tail -n 15 || true
            echo '::error::the end-to-end test on the simulator did not pass.'
            echo "- End-to-end (app on the simulator to rds host on the Mac): **${OUTCOME:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          grep -E "Executed [0-9]+ tests?" "$LOG" | tail -n 1 | cut -c1-200 || true
          echo '- End-to-end (app on the simulator to rds host on the Mac: connect, terminal command, Files listing): PASS' >> "$GITHUB_STEP_SUMMARY"

      # ---- profile and testflight: signing material. Created only after all private-source
      # build scripts (gomobile bind above) ran, and removed in the last step. ----
      - name: Install pinned fastlane
        if: env.MODE != 'verify' && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        run: |
          set -euo pipefail
          GH="$RUNNER_TEMP/fastlane-gems"; rm -rf "$GH"; mkdir -p "$GH"
          GEM_HOME="$GH" GEM_PATH="$GH" gem install --no-document fastlane -v "$FASTLANE_VERSION" > /dev/null
          echo "GEM_HOME=$GH" >> "$GITHUB_ENV"; echo "GEM_PATH=$GH" >> "$GITHUB_ENV"; echo "$GH/bin" >> "$GITHUB_PATH"

      - name: Create ephemeral keychain and App Store Connect API key
        if: env.MODE != 'verify' && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="sodesk-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          LOGIN_KEYCHAIN="$(security default-keychain -d user | tr -d '"' | xargs)"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          {
            echo "ORIGINAL_DEFAULT_KEYCHAIN=$LOGIN_KEYCHAIN"
            echo "KEYCHAIN_NAME=$KEYCHAIN_NAME"; echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

          ASC_DIR="$RUNNER_TEMP/sodesk-asc"; mkdir -p "$ASC_DIR" "$HOME/.appstoreconnect/private_keys"
          python3 - "$ASC_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          raw = os.environ['ASC_PRIVATE_KEY'].strip().replace('\\n', '\n')
          key = raw if 'PRIVATE KEY' in raw else base64.b64decode(''.join(raw.split())).decode('utf-8').strip()
          if 'PRIVATE KEY' not in key:
              raise SystemExit('ASC_PRIVATE_KEY is not a .p8 key')
          kid = os.environ['ASC_KEY_ID']
          d = Path(sys.argv[1])
          for p in (d / f'AuthKey_{kid}.p8', Path.home() / '.appstoreconnect' / 'private_keys' / f'AuthKey_{kid}.p8'):
              p.write_text(key + '\n', encoding='utf-8'); os.chmod(p, 0o600)
          (d / 'api-key.json').write_text(json.dumps({'key_id': kid, 'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': key, 'in_house': False}), encoding='utf-8')
          os.chmod(d / 'api-key.json', 0o600)
          PY
          echo "ASC_API_KEY_JSON=$ASC_DIR/api-key.json" >> "$GITHUB_ENV"
          echo "ASC_P8_PATH=$ASC_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

          MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_AUTH=$MATCH_AUTH" >> "$GITHUB_ENV"

      # ---- profile mode: one-time bundle ID + App Store profile for com.readori.sodesk only ----
      - name: Register bundle ID if missing (App Store Connect API)
        if: env.MODE == 'profile'
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'spaceship'
          require 'json'
          k = JSON.parse(File.read(ENV.fetch('ASC_API_KEY_JSON')))
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(key_id: k['key_id'], issuer_id: k['issuer_id'], key: k['key'])
          id = ENV.fetch('EXPECTED_BUNDLE_ID')
          found = Spaceship::ConnectAPI::BundleId.find(id)
          if found
            puts "Bundle ID already registered: #{id}"
          else
            Spaceship::ConnectAPI::BundleId.create(name: ENV.fetch('BUNDLE_ID_NAME'), identifier: id, platform: 'IOS')
            puts "Bundle ID registered: #{id}"
          end
          RUBY

      - name: Write App Store profile to Match (existing shared Distribution identity only)
        if: env.MODE == 'profile'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          COMMON=(--git_url "$MATCH_GIT_URL" --git_branch "$MATCH_GIT_BRANCH" --git_basic_authorization "$MATCH_AUTH"
                  --team_id "$ASC_TEAM_ID" --api_key_path "$ASC_API_KEY_JSON"
                  --keychain_name "$KEYCHAIN_NAME" --keychain_password "$KEYCHAIN_PASSWORD")
          echo 'Preflight: shared Distribution identity must already exist in Match...'
          MATCH_READONLY=true fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --readonly true --skip_provisioning_profiles true "${COMMON[@]}" > "$RUNNER_TEMP/match-pre.log" 2>&1 \
            || { tail -5 "$RUNNER_TEMP/match-pre.log"; echo '::error::Match preflight failed.'; exit 65; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution\|iPhone Distribution' \
            || { echo '::error::No shared Distribution identity in Match; refusing to create a certificate.'; exit 78; }
          MATCH_READONLY=false fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --readonly false --force --generate_apple_certs false --skip_confirmation true "${COMMON[@]}" > "$RUNNER_TEMP/match-write.log" 2>&1 \
            || { grep -iE 'error|could not|not found' "$RUNNER_TEMP/match-write.log" | head -10; echo '::error::Match could not write the SoDesk profile.'; exit 65; }
          echo "App Store profile for $EXPECTED_BUNDLE_ID written to Match: PASS"
          echo "- App Store profile for \`$EXPECTED_BUNDLE_ID\` written to the shared Match repo. Next: run mode=testflight." >> "$GITHUB_STEP_SUMMARY"

      # ---- testflight mode ----
      - name: Install signing assets with Match (readonly)
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          MATCH_READONLY=true fastlane match appstore --app_identifier "$EXPECTED_BUNDLE_ID" \
            --git_url "$MATCH_GIT_URL" --git_branch "$MATCH_GIT_BRANCH" --git_basic_authorization "$MATCH_AUTH" \
            --team_id "$ASC_TEAM_ID" --api_key_path "$ASC_API_KEY_JSON" \
            --keychain_name "$KEYCHAIN_NAME" --keychain_password "$KEYCHAIN_PASSWORD" \
            --shallow_clone true --clone_branch_directly true --readonly true > "$RUNNER_TEMP/match.log" 2>&1 \
            || { grep -iE 'error|could not|no matching' "$RUNNER_TEMP/match.log" | head -10; echo '::error::Readonly Match failed. First run? Run this workflow once with mode=profile, confirm=WRITE.'; exit 65; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          PROFILE_NAME=''
          shopt -s nullglob
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            pl="$RUNNER_TEMP/prof.plist"
            security cms -D -i "$p" > "$pl" 2>/dev/null || continue
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$pl" 2>/dev/null || true)"
            gt="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$pl" 2>/dev/null || echo false)"
            if [[ "$appid" == "$ASC_TEAM_ID.$EXPECTED_BUNDLE_ID" && "$gt" != 'true' ]]; then
              PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$pl")"
            fi
            rm -f "$pl"
          done
          [[ -n "$PROFILE_NAME" ]] || { echo "::error::No App Store profile for $EXPECTED_BUNDLE_ID installed. Run mode=profile, confirm=WRITE once."; exit 65; }
          echo "APPSTORE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile: $PROFILE_NAME"

      - name: Resolve build number
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        run: |
          set -euo pipefail
          set +e
          OUT="$(fastlane run latest_testflight_build_number api_key_path:"$ASC_API_KEY_JSON" app_identifier:"$EXPECTED_BUNDLE_ID" initial_build_number:0 2>&1)"
          st=$?
          set -e
          LATEST="$(printf '%s\n' "$OUT" | sed -n 's/.*Result: \([0-9][0-9]*\).*/\1/p' | tail -1)"
          if [[ "$st" -ne 0 || -z "$LATEST" ]]; then
            printf '%s\n' "$OUT" | grep -iE 'could not find app|no app|not found' | head -3 || true
            echo "::error::Could not read TestFlight builds. Does the App exist in App Store Connect with bundle ID $EXPECTED_BUNDLE_ID, and may the API key read it?"
            exit 1
          fi
          if [[ -n "$BUILD_NUMBER_INPUT" ]]; then
            (( BUILD_NUMBER_INPUT > LATEST )) || { echo "::error::build_number $BUILD_NUMBER_INPUT must be higher than latest $LATEST."; exit 1; }
            BN="$BUILD_NUMBER_INPUT"
          else
            BN=$((LATEST + 1))
          fi
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "Latest TestFlight build: $LATEST → this build: $BN"

      - name: Build signed archive and IPA
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        working-directory: ${{ env.PRIVATE_SOURCE_PATH }}
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/sodesk.xcarchive"; EXPORT_DIR="$RUNNER_TEMP/sodesk-export"; OPTS="$RUNNER_TEMP/sodesk-export.plist"
          rm -rf "$ARCHIVE" "$EXPORT_DIR"; mkdir -p "$EXPORT_DIR"
          # MARKETING_VERSION is deliberately not overridden: the project's value is kept.
          xcodebuild archive -quiet \
            -project mobile/ios/SoDesk.xcodeproj -scheme SoDesk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$ASC_TEAM_ID" CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$APPSTORE_PROFILE_NAME"
          python3 - "$OPTS" <<'PY'
          import os, plistlib, sys
          plistlib.dump({
              "method": "app-store-connect", "destination": "export", "signingStyle": "manual",
              "signingCertificate": "Apple Distribution", "teamID": os.environ["ASC_TEAM_ID"],
              "provisioningProfiles": {os.environ["EXPECTED_BUNDLE_ID"]: os.environ["APPSTORE_PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False, "uploadSymbols": True,
          }, open(sys.argv[1], "wb"))
          PY
          xcodebuild -exportArchive -quiet -archivePath "$ARCHIVE" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$OPTS"
          IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$IPA" ]] || { echo '::error::IPA was not exported.'; exit 65; }
          V="$RUNNER_TEMP/sodesk-verify"; rm -rf "$V"; mkdir -p "$V"; unzip -q "$IPA" -d "$V"
          APP="$(find "$V/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          PB=/usr/libexec/PlistBuddy
          codesign --verify --deep --strict "$APP"
          [[ "$($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" == "$EXPECTED_BUNDLE_ID" ]] || { echo '::error::Bundle ID mismatch'; exit 65; }
          [[ "$($PB -c 'Print :CFBundleVersion' "$APP/Info.plist")" == "$BUILD_NUMBER" ]] || { echo '::error::Build number mismatch'; exit 65; }
          VERSION="$($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          test -f "$APP/sodesk-mobile.js" || { echo '::error::App bundle has no sodesk-mobile.js'; exit 65; }
          # What App Store processing needs (a missing piece is rejected by altool validate or processing).
          $PB -c 'Print :CFBundleIconName' "$APP/Info.plist" >/dev/null 2>&1 || { echo '::error::Info.plist has no CFBundleIconName (app icon not compiled in).'; exit 65; }
          test -f "$APP/Assets.car" || { echo '::error::Assets.car is missing (asset catalog not compiled).'; exit 65; }
          $PB -c 'Print :MinimumOSVersion' "$APP/Info.plist" >/dev/null 2>&1 || { echo '::error::Info.plist has no MinimumOSVersion.'; exit 65; }
          security cms -D -i "$APP/embedded.mobileprovision" > "$V/prov.plist" 2>/dev/null || { echo '::error::No embedded provisioning profile.'; exit 65; }
          [[ "$($PB -c 'Print :Entitlements:get-task-allow' "$V/prov.plist" 2>/dev/null || echo false)" != 'true' ]] || { echo '::error::Profile is a development profile (get-task-allow).'; exit 65; }
          if $PB -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'Export compliance: ITSAppUsesNonExemptEncryption is set in Info.plist.'
          else
            echo '::notice title=Export compliance::Info.plist has no ITSAppUsesNonExemptEncryption. The export-compliance (encryption) question for this build must be answered in App Store Connect (TestFlight, the build, Provide Export Compliance Information) before testers can install it. This workflow does not set the answer.'
            echo "EXPORT_COMPLIANCE_PENDING=1" >> "$GITHUB_ENV"
          fi
          if [[ ! -f "$APP/PrivacyInfo.xcprivacy" ]]; then
            echo '::notice title=Privacy manifest::The app has no PrivacyInfo.xcprivacy. Apple may email warnings (ITMS-91053) if required-reason APIs are used; consider adding one.'
          fi
          rm -rf "$V"
          echo "SIGNED_IPA=$IPA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Signed IPA: $(basename "$IPA") · $(du -h "$IPA" | cut -f1) · $VERSION ($BUILD_NUMBER)"

      - name: Validate and upload to TestFlight (altool)
        if: env.MODE == 'testflight' && steps.layout.outputs.ready == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          for action in validate-app upload-app; do
            LOG="$RUNNER_TEMP/altool-$action.log"
            set +e
            xcrun altool --$action --file "$SIGNED_IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$LOG" 2>&1
            st=$?
            set -e
            if [[ "$st" -ne 0 ]] || grep -qiE '^[[:space:]]*[*]{3} Error|ERROR ITMS-' "$LOG"; then
              MSG="$(grep -iE 'error|ITMS-|bundle version|message' "$LOG" | head -20 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=altool $action failed::${MSG:-exit $st}"
              exit 1
            fi
            echo "altool $action: OK"
          done
          echo "TestFlight upload accepted: $APP_VERSION ($BUILD_NUMBER)"

      - name: Summary
        if: success() && (steps.layout.outputs.ready == 'true' || env.MODE == 'profile')
        run: |
          {
            echo "- Xcode: \`$(xcodebuild -version | sed -n 1p)\`"
            if [[ "$MODE" == 'testflight' ]]; then
              echo "- TestFlight: \`$EXPECTED_BUNDLE_ID\` $APP_VERSION ($BUILD_NUMBER) uploaded; processing in App Store Connect takes a few minutes."
              [[ -z "${EXPORT_COMPLIANCE_PENDING:-}" ]] || echo '- Export compliance: answer the encryption question for this build in App Store Connect (not set by CI).'
            elif [[ "$MODE" == 'verify' ]]; then
              echo "- Go: \`$(go version | cut -d' ' -f3)\`"
              echo '- No signing; nothing uploaded.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: |
          set +e
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1
            security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" >/dev/null 2>&1
          fi
          [[ -n "${KEYCHAIN_NAME:-}" ]] && security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1
          rm -rf "$RUNNER_TEMP/sodesk-asc" "$RUNNER_TEMP/sodesk-export" "$RUNNER_TEMP/sodesk.xcarchive" "$RUNNER_TEMP/sodesk-verify" >/dev/null 2>&1
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8 >/dev/null 2>&1
          true
