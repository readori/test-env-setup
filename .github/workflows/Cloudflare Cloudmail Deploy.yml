name: Cloudflare Cloudmail Deploy

run-name: CloudMail public CI ${{ inputs.mode }} @ ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode'
        required: true
        default: deploy-and-migrate
        type: choice
        options:
          - deploy-and-migrate
          - deploy
      source_ref:
        description: 'Private CloudMail branch, tag, or commit SHA'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cloudmail-public-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build private CloudMail source on public runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOURCE_REPOSITORY: readori/CloudMail
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate minimal public CI credentials
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [ -n "${TARGET_REPO_PAT:-}" ] || missing+=("TARGET_REPO_PAT")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing public CI credentials: ${missing[*]}"
            echo "::error::Only these deployment credentials are required in the public repository."
            exit 1
          fi

          echo "::add-mask::$TARGET_REPO_PAT"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

          echo "✅ Public runner mode"
          echo "✅ Private repository Actions are not invoked"
          echo "✅ Application secrets remain stored on Cloudflare"

      - name: Checkout private CloudMail source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/cloudmail-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          git -C "$SOURCE_DIR" init .
          git -C "$SOURCE_DIR" remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$TARGET_REPO_PAT" | base64 | tr -d '\r\n')"
          git -C "$SOURCE_DIR" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --prune --depth=1 origin "$SOURCE_REF"

          git -C "$SOURCE_DIR" checkout --force --detach FETCH_HEAD
          git -C "$SOURCE_DIR" remote set-url origin "https://github.com/${SOURCE_REPOSITORY}.git"

          test -f "$SOURCE_DIR/mail-worker/package.json" || {
            echo "::error::mail-worker/package.json not found in private source"
            find "$SOURCE_DIR" -maxdepth 3 -type f | sed -n '1,160p'
            exit 1
          }

          test -f "$SOURCE_DIR/mail-vue/package.json" || {
            echo "::error::mail-vue/package.json not found in private source"
            exit 1
          }

          echo "Private source commit: $(git -C "$SOURCE_DIR" rev-parse HEAD)"
          echo "✅ Private source checkout completed without running private Actions"

      - name: Set up Node.js 22 and pnpm
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) NODE_ARCH='x64' ;;
            aarch64|arm64) NODE_ARCH='arm64' ;;
            *) echo "::error::Unsupported runner architecture: $ARCH"; exit 1 ;;
          esac

          NODE_VERSION="22.23.2"
          NODE_DIR="$RUNNER_TEMP/node-v${NODE_VERSION}-linux-${NODE_ARCH}"
          ARCHIVE="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz"

          if [ ! -x "$NODE_DIR/bin/node" ]; then
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --location \
              "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}" \
              --output "$ARCHIVE"
            curl --fail --silent --show-error --location \
              "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" \
              --output SHASUMS256.txt
            grep "  ${ARCHIVE}$" SHASUMS256.txt | sha256sum --check --strict
            tar -xJf "$ARCHIVE"
          fi

          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$NODE_DIR/bin:$PATH"

          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@9.15.9
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

          export PATH="$RUNNER_TEMP/pnpm/bin:$PATH"
          node --version
          pnpm --version

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir "$GITHUB_WORKSPACE/cloudmail-source/mail-worker" install --frozen-lockfile
          pnpm --dir "$GITHUB_WORKSPACE/cloudmail-source/mail-vue" install --frozen-lockfile

      - name: Resolve existing Cloudflare Worker configuration
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          WORKER_NAME="$(python3 <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("wrangler.toml").read_text(encoding="utf-8"))
          name = str(data.get("name", "")).strip()
          if not name:
              raise SystemExit("wrangler.toml does not define a Worker name")
          print(name)
          PY
          )"

          # GITHUB_ENV only affects later steps. Export it as well because
          # the Python block below needs WORKER_NAME in this same step.
          export WORKER_NAME
          echo "WORKER_NAME=$WORKER_NAME" >> "$GITHUB_ENV"
          echo "Resolved Worker name: $WORKER_NAME"

          SETTINGS_JSON="$RUNNER_TEMP/cloudmail-worker-settings.json"
          DOMAINS_JSON="$RUNNER_TEMP/cloudmail-worker-domains.json"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            > "$SETTINGS_JSON"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            > "$DOMAINS_JSON"

          python3 - "$SETTINGS_JSON" "$DOMAINS_JSON" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          settings = json.load(open(sys.argv[1], encoding="utf-8"))
          domains = json.load(open(sys.argv[2], encoding="utf-8"))

          if not settings.get("success"):
              raise SystemExit("::error::Unable to read existing Cloudflare Worker settings")

          bindings = settings.get("result", {}).get("bindings") or []

          def one(kind, name):
              matches = [
                  b for b in bindings
                  if isinstance(b, dict)
                  and b.get("type") == kind
                  and b.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"::error::Expected exactly one existing {kind} binding named {name!r}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          d1 = one("d1", "db")
          kv = one("kv_namespace", "kv")

          r2_matches = [
              b for b in bindings
              if isinstance(b, dict)
              and b.get("type") == "r2_bucket"
              and b.get("name") == "r2"
          ]
          email_matches = [
              b for b in bindings
              if isinstance(b, dict)
              and b.get("type") == "send_email"
              and b.get("name") == "email"
          ]

          d1_id = d1.get("database_id") or d1.get("id")
          kv_id = kv.get("namespace_id")

          if not d1_id:
              raise SystemExit("::error::Existing D1 binding db has no database_id")
          if not kv_id:
              raise SystemExit("::error::Existing KV binding kv has no namespace_id")

          r2_bucket = ""
          if r2_matches:
              if len(r2_matches) != 1:
                  raise SystemExit("::error::Multiple R2 bindings named r2 were returned")
              r2_bucket = str(r2_matches[0].get("bucket_name") or "").strip()
              if not r2_bucket:
                  raise SystemExit("::error::Existing R2 binding r2 has no bucket_name")

          worker_name = os.environ["WORKER_NAME"]
          custom_domains = [
              str(item.get("hostname") or "").strip()
              for item in (domains.get("result") or [])
              if isinstance(item, dict)
              and item.get("service") == worker_name
              and str(item.get("hostname") or "").strip()
          ]

          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as fp:
              fp.write(f"RESOLVED_D1_DATABASE_ID={d1_id}\n")
              fp.write(f"RESOLVED_KV_NAMESPACE_ID={kv_id}\n")
              fp.write(f"RESOLVED_R2_BUCKET_NAME={r2_bucket}\n")
              fp.write(f"EXISTING_SEND_EMAIL={'true' if email_matches else 'false'}\n")
              fp.write(f"EXISTING_CUSTOM_DOMAIN={custom_domains[0] if custom_domains else ''}\n")

          # Secrets and dashboard vars are intentionally preserved by Cloudflare/Wrangler.
          # Refuse to deploy if the existing Worker has an uncommon binding that this
          # public-CI renderer does not explicitly preserve.
          safe_types = {
              "d1",
              "kv_namespace",
              "r2_bucket",
              "send_email",
              "secret_text",
              "plain_text",
              "json",
              "ai",
              "assets",
          }
          unexpected = sorted({
              str(b.get("type"))
              for b in bindings
              if isinstance(b, dict)
              and b.get("type")
              and b.get("type") not in safe_types
          })
          if unexpected:
              raise SystemExit(
                  "::error::Existing Worker has binding types that this CI refuses "
                  "to overwrite automatically: " + ", ".join(unexpected)
              )

          preserved_vars = sorted(
              str(b.get("name"))
              for b in bindings
              if isinstance(b, dict)
              and b.get("type") in {"plain_text", "json"}
              and b.get("name")
          )

          print("✅ Existing D1 binding discovered")
          print("✅ Existing KV binding discovered")
          print("✅ Existing R2 binding discovered" if r2_bucket else "ℹ️ No existing R2 binding")
          print("✅ Existing send_email binding discovered" if email_matches else "ℹ️ No send_email binding")
          print("✅ Existing custom domain discovered" if custom_domains else "ℹ️ No custom domain discovered")
          if preserved_vars:
              print("✅ Dashboard variables preserved by keep_vars=true: " + ", ".join(preserved_vars))
          else:
              print("ℹ️ No dashboard plain-text/JSON variables were discovered")
          print("✅ Existing binding set is safe for public-CI preservation")
          PY

      - name: Resolve D1 database name and render deployment config
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          DB_LIST_FILE="$RUNNER_TEMP/cloudmail-d1-list.json"
          pnpm wrangler d1 list --json > "$DB_LIST_FILE"

          D1_DATABASE_NAME="$(
            python3 - "$RESOLVED_D1_DATABASE_ID" "$DB_LIST_FILE" <<'PY'
          import json
          import sys

          wanted = sys.argv[1]
          data = json.load(open(sys.argv[2], encoding="utf-8"))
          for row in data:
              candidate = row.get("uuid") or row.get("id")
              if candidate == wanted:
                  print(row.get("name", ""))
                  break
          PY
          )"

          if [ -z "$D1_DATABASE_NAME" ]; then
            echo "::error::Unable to map the existing D1 binding to a database name"
            exit 1
          fi

          export D1_DATABASE_NAME
          echo "D1_DATABASE_NAME=$D1_DATABASE_NAME" >> "$GITHUB_ENV"
          echo "Resolved D1 database name: $D1_DATABASE_NAME"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          def q(value):
              return json.dumps(str(value), ensure_ascii=False)

          lines = [
              f'name = {q(os.environ["WORKER_NAME"])}',
              'main = "src/index.js"',
              'compatibility_date = "2025-06-04"',
              'keep_vars = true',
              # Routes/custom domains are intentionally dashboard-managed.
              # Cloudflare documents that omitting route/routes prevents Wrangler
              # from overwriting dashboard-managed routes on deploy.
              'workers_dev = false',
              '',
              '[observability]',
              'enabled = true',
              '',
              '[[d1_databases]]',
              'binding = "db"',
              f'database_name = {q(os.environ["D1_DATABASE_NAME"])}',
              f'database_id = {q(os.environ["RESOLVED_D1_DATABASE_ID"])}',
              'migrations_dir = "migrations"',
              '',
              '[[kv_namespaces]]',
              'binding = "kv"',
              f'id = {q(os.environ["RESOLVED_KV_NAMESPACE_ID"])}',
              '',
          ]

          r2 = os.environ.get("RESOLVED_R2_BUCKET_NAME", "").strip()
          if r2:
              lines.extend([
                  '[[r2_buckets]]',
                  'binding = "r2"',
                  f'bucket_name = {q(r2)}',
                  '',
              ])

          lines.extend([
              '[ai]',
              'binding = "ai"',
              '',
              '[assets]',
              'binding = "assets"',
              'directory = "./dist"',
              'not_found_handling = "single-page-application"',
              'run_worker_first = true',
              '',
              '[triggers]',
              'crons = ["0 16 * * *"]',
              '',
          ])

          if os.environ.get("EXISTING_SEND_EMAIL") == "true":
              lines.extend([
                  '[[send_email]]',
                  'name = "email"',
                  '',
              ])

          Path("wrangler-ci.toml").write_text("\n".join(lines), encoding="utf-8")
          print("✅ Generated CI config from existing Cloudflare bindings")
          PY

      - name: Validate and bootstrap D1 migration prerequisites
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          TABLES_JSON="$RUNNER_TEMP/cloudmail-table-list.json"
          TABLES_ERR="$RUNNER_TEMP/cloudmail-table-list.err"

          if ! pnpm wrangler d1 execute "$D1_DATABASE_NAME" \
            --remote \
            --json \
            --config wrangler-ci.toml \
            --command="SELECT name FROM sqlite_schema WHERE type='table' ORDER BY name;" \
            > "$TABLES_JSON" 2> "$TABLES_ERR"; then
            echo "::error::Unable to read the current D1 table list."
            cat "$TABLES_ERR" || true
            cat "$TABLES_JSON" || true
            exit 1
          fi

          BOOTSTRAP_PUSH="$(
            python3 - "$TABLES_JSON" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = []

          def walk(value):
              if isinstance(value, dict):
                  if isinstance(value.get("results"), list):
                      rows.extend(value["results"])
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)

          tables = {
              str(row.get("name", "")).strip()
              for row in rows
              if isinstance(row, dict) and row.get("name")
          }

          core = {
              "user",
              "account",
              "email",
              "attachments",
              "star",
              "role",
              "perm",
              "role_perm",
          }

          missing_core = sorted(core - tables)

          print("D1 tables discovered:", ", ".join(sorted(tables)), file=sys.stderr)

          if missing_core:
              print(
                  "::error::Core CloudMail D1 tables are missing: "
                  + ", ".join(missing_core),
                  file=sys.stderr,
              )
              print(
                  "::error::CI will not auto-create missing core mail/account tables.",
                  file=sys.stderr,
              )
              raise SystemExit(2)

          print("yes" if "push_subscription" not in tables else "no")
          PY
          )" || {
            status=$?
            [ "$status" -eq 2 ] && exit 1
            echo "::error::Unable to parse D1 table list."
            cat "$TABLES_JSON" || true
            exit "$status"
          }

          if [ "$BOOTSTRAP_PUSH" = "yes" ]; then
            echo "ℹ️ Legacy D1 has no push_subscription table; creating the current empty gateway-subscription table."

            cat > "$RUNNER_TEMP/cloudmail-push-bootstrap.sql" <<'SQL'
          CREATE TABLE IF NOT EXISTS push_subscription (
            push_id INTEGER PRIMARY KEY AUTOINCREMENT,
            user_id INTEGER NOT NULL,
            subscription_id TEXT NOT NULL,
            push_secret TEXT NOT NULL,
            account_ref TEXT NOT NULL DEFAULT '',
            installation_id TEXT NOT NULL DEFAULT '',
            preview_mode TEXT NOT NULL DEFAULT 'privateOnly',
            sound_enabled INTEGER NOT NULL DEFAULT 1,
            badge_enabled INTEGER NOT NULL DEFAULT 1,
            quiet_hours_enabled INTEGER NOT NULL DEFAULT 0,
            quiet_start_minutes INTEGER NOT NULL DEFAULT 1320,
            quiet_end_minutes INTEGER NOT NULL DEFAULT 420,
            time_zone TEXT NOT NULL DEFAULT 'UTC',
            create_time TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          CREATE UNIQUE INDEX IF NOT EXISTS idx_push_subscription_user_id_unique
            ON push_subscription(user_id, subscription_id);

          CREATE INDEX IF NOT EXISTS idx_push_subscription_user_created
            ON push_subscription(user_id, create_time DESC);

          CREATE INDEX IF NOT EXISTS idx_push_subscription_user_installation
            ON push_subscription(user_id, installation_id);

          CREATE INDEX IF NOT EXISTS idx_push_subscription_user_account_ref
            ON push_subscription(user_id, account_ref);
          SQL

            if ! pnpm wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --config wrangler-ci.toml \
              --file "$RUNNER_TEMP/cloudmail-push-bootstrap.sql"; then
              echo "::error::Unable to bootstrap push_subscription."
              exit 1
            fi

            echo "✅ Empty push_subscription compatibility table created"
          else
            PUSH_COLUMNS_JSON="$RUNNER_TEMP/cloudmail-push-columns.json"
            PUSH_COLUMNS_ERR="$RUNNER_TEMP/cloudmail-push-columns.err"

            if ! pnpm wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --json \
              --config wrangler-ci.toml \
              --command="SELECT name FROM pragma_table_info('push_subscription') ORDER BY cid;" \
              > "$PUSH_COLUMNS_JSON" 2> "$PUSH_COLUMNS_ERR"; then
              echo "::error::Unable to inspect push_subscription columns."
              cat "$PUSH_COLUMNS_ERR" || true
              cat "$PUSH_COLUMNS_JSON" || true
              exit 1
            fi

            python3 - "$PUSH_COLUMNS_JSON" "$RUNNER_TEMP/cloudmail-push-alters.sql" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = []

          def walk(value):
              if isinstance(value, dict):
                  if isinstance(value.get("results"), list):
                      rows.extend(value["results"])
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)

          columns = {
              str(row.get("name", "")).strip()
              for row in rows
              if isinstance(row, dict)
          }

          required_base = {
              "push_id",
              "user_id",
              "subscription_id",
              "push_secret",
              "account_ref",
              "create_time",
          }

          missing_base = sorted(required_base - columns)
          if missing_base:
              print(
                  "::error::Existing push_subscription table has an incompatible base schema. Missing: "
                  + ", ".join(missing_base)
              )
              raise SystemExit(1)

          additions = {
              "installation_id":
                  "ALTER TABLE push_subscription ADD COLUMN installation_id TEXT NOT NULL DEFAULT '';",
              "preview_mode":
                  "ALTER TABLE push_subscription ADD COLUMN preview_mode TEXT NOT NULL DEFAULT 'privateOnly';",
              "sound_enabled":
                  "ALTER TABLE push_subscription ADD COLUMN sound_enabled INTEGER NOT NULL DEFAULT 1;",
              "badge_enabled":
                  "ALTER TABLE push_subscription ADD COLUMN badge_enabled INTEGER NOT NULL DEFAULT 1;",
              "quiet_hours_enabled":
                  "ALTER TABLE push_subscription ADD COLUMN quiet_hours_enabled INTEGER NOT NULL DEFAULT 0;",
              "quiet_start_minutes":
                  "ALTER TABLE push_subscription ADD COLUMN quiet_start_minutes INTEGER NOT NULL DEFAULT 1320;",
              "quiet_end_minutes":
                  "ALTER TABLE push_subscription ADD COLUMN quiet_end_minutes INTEGER NOT NULL DEFAULT 420;",
              "time_zone":
                  "ALTER TABLE push_subscription ADD COLUMN time_zone TEXT NOT NULL DEFAULT 'UTC';",
          }

          sql = [
              statement
              for name, statement in additions.items()
              if name not in columns
          ]

          Path(sys.argv[2]).write_text("\n".join(sql), encoding="utf-8")

          if sql:
              print("Push compatibility columns to add:")
              for name in additions:
                  if name not in columns:
                      print("  - " + name)
          else:
              print("✅ push_subscription columns already match the current compatibility contract")
          PY

            if [ -s "$RUNNER_TEMP/cloudmail-push-alters.sql" ]; then
              if ! pnpm wrangler d1 execute "$D1_DATABASE_NAME" \
                --remote \
                --config wrangler-ci.toml \
                --file "$RUNNER_TEMP/cloudmail-push-alters.sql"; then
                echo "::error::Unable to add missing push_subscription compatibility columns."
                exit 1
              fi
              echo "✅ Missing push_subscription compatibility columns added"
            fi
          fi

          echo "✅ D1 migration prerequisites are present"

      - name: Verify required Worker secrets already exist on Cloudflare
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          SECRET_LIST="$RUNNER_TEMP/cloudmail-secret-list.json"
          pnpm wrangler secret list \
            --name "$WORKER_NAME" \
            --config wrangler-ci.toml \
            > "$SECRET_LIST"

          python3 - "$SECRET_LIST" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {
              str(item.get("name", "")).strip()
              for item in data
              if isinstance(item, dict)
          }

          required = {
              "jwt_secret",
              "init_secret",
              "config_encryption_key",
          }

          missing = sorted(required - names)
          if missing:
              print("::error::Required application secrets are missing on the existing Cloudflare Worker:")
              for name in missing:
                  print(f"::error::  - {name}")
              print("::error::Set them once in Cloudflare. They do NOT need to be copied into the public GitHub repository.")
              raise SystemExit(1)

          print("✅ Required application secrets already exist on Cloudflare")
          print("✅ Secret values were never downloaded into GitHub Actions")
          PY

      - name: Run backend audit tests
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        run: pnpm audit:test

      - name: Run frontend tests
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-vue
        run: pnpm test

      - name: Build and smoke-test frontend
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-vue
        shell: bash
        run: |
          set -euo pipefail

          # .env.release defines:
          # VITE_OUT_DIR=../mail-worker/dist
          # so the production frontend becomes the Worker's assets directory.
          rm -rf "$GITHUB_WORKSPACE/cloudmail-source/mail-worker/dist"

          pnpm run build

          test -d "$GITHUB_WORKSPACE/cloudmail-source/mail-worker/dist" || {
            echo "::error::Frontend build completed but mail-worker/dist was not created."
            echo "::error::Expected mail-vue/.env.release to set VITE_OUT_DIR=../mail-worker/dist"
            exit 1
          }

          test -s "$GITHUB_WORKSPACE/cloudmail-source/mail-worker/dist/index.html" || {
            echo "::error::mail-worker/dist/index.html is missing or empty after frontend build."
            find "$GITHUB_WORKSPACE/cloudmail-source/mail-worker/dist" -maxdepth 2 -type f -print | sed -n '1,160p'
            exit 1
          }

          echo "✅ Frontend assets built into mail-worker/dist"
          pnpm run e2e:smoke

      - name: Validate Wrangler deployment package after frontend build
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html || {
            echo "::error::Wrangler assets directory does not exist before dry-run: $(pwd)/dist"
            exit 1
          }

          rm -rf .wrangler-dry-run
          pnpm wrangler deploy \
            --dry-run \
            --config wrangler-ci.toml \
            --outdir .wrangler-dry-run

          echo "✅ Wrangler dry-run passed with frontend assets present"

      - name: Capture D1 recovery point before migration
        if: ${{ inputs.mode == 'deploy-and-migrate' }}
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_DIR="$RUNNER_TEMP/cloudmail-d1-recovery"
          mkdir -p "$RECOVERY_DIR"

          pnpm wrangler d1 time-travel info "$D1_DATABASE_NAME" \
            --json \
            --config wrangler-ci.toml \
            > "$RECOVERY_DIR/time-travel.json"

          pnpm wrangler d1 export "$D1_DATABASE_NAME" \
            --remote \
            --skip-confirmation \
            --output "$RECOVERY_DIR/pre-migration.sql" \
            --config wrangler-ci.toml

          test -s "$RECOVERY_DIR/time-travel.json"
          test -s "$RECOVERY_DIR/pre-migration.sql"

          echo "✅ Private runner-local D1 recovery data captured"
          echo "✅ Database export is intentionally not uploaded as an artifact"

      - name: Safely repair legacy ownership mismatches
        if: ${{ inputs.mode == 'deploy-and-migrate' }}
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/cloudmail-safe-repair.sql" <<'SQL'
          -- Only deterministic ownership repairs are performed.
          -- No account, email, or attachment row is deleted here.

          UPDATE email
          SET user_id = (
            SELECT a.user_id
            FROM account a
            WHERE a.account_id = email.account_id
          )
          WHERE EXISTS (
            SELECT 1
            FROM account a
            WHERE a.account_id = email.account_id
              AND a.user_id <> email.user_id
          );

          UPDATE attachments
          SET
            account_id = (
              SELECT e.account_id
              FROM email e
              WHERE e.email_id = attachments.email_id
            ),
            user_id = (
              SELECT e.user_id
              FROM email e
              WHERE e.email_id = attachments.email_id
            )
          WHERE EXISTS (
            SELECT 1
            FROM email e
            WHERE e.email_id = attachments.email_id
              AND (
                e.account_id <> attachments.account_id
                OR e.user_id <> attachments.user_id
              )
          );

          DELETE FROM star
          WHERE NOT EXISTS (
            SELECT 1 FROM email e WHERE e.email_id = star.email_id
          );

          UPDATE star
          SET user_id = (
            SELECT e.user_id
            FROM email e
            WHERE e.email_id = star.email_id
          )
          WHERE EXISTS (
            SELECT 1
            FROM email e
            WHERE e.email_id = star.email_id
              AND e.user_id <> star.user_id
          );

          DELETE FROM role_perm
          WHERE NOT EXISTS (
            SELECT 1 FROM role r WHERE r.role_id = role_perm.role_id
          )
          OR NOT EXISTS (
            SELECT 1 FROM perm p WHERE p.perm_id = role_perm.perm_id
          );

          DELETE FROM push_subscription
          WHERE NOT EXISTS (
            SELECT 1 FROM user u WHERE u.user_id = push_subscription.user_id
          );
          SQL

          pnpm wrangler d1 execute "$D1_DATABASE_NAME" \
            --remote \
            --config wrangler-ci.toml \
            --file "$RUNNER_TEMP/cloudmail-safe-repair.sql"

          echo "✅ Deterministic legacy ownership repairs completed"

      - name: D1 hard-orphan integrity gate
        if: ${{ inputs.mode == 'deploy-and-migrate' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          database_id = os.environ["RESOLVED_D1_DATABASE_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()

          if not account_id or not database_id or not token:
              raise SystemExit("::error::Missing Cloudflare account/database/token for D1 integrity query")

          endpoint = (
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}"
              f"/d1/database/{database_id}/query"
          )

          checks = [
              (
                  "account_without_user",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM account a
                  WHERE NOT EXISTS (
                    SELECT 1 FROM user u WHERE u.user_id = a.user_id
                  )
                  """,
              ),
              (
                  "email_owner_invalid",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM email e
                  WHERE NOT EXISTS (
                    SELECT 1
                    FROM account a
                    WHERE a.account_id = e.account_id
                      AND a.user_id = e.user_id
                  )
                  """,
              ),
              (
                  "attachment_owner_invalid",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM attachments a
                  WHERE NOT EXISTS (
                    SELECT 1
                    FROM email e
                    WHERE e.email_id = a.email_id
                      AND e.account_id = a.account_id
                      AND e.user_id = a.user_id
                  )
                  """,
              ),
              (
                  "star_owner_invalid",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM star s
                  WHERE NOT EXISTS (
                    SELECT 1
                    FROM email e
                    WHERE e.email_id = s.email_id
                      AND e.user_id = s.user_id
                  )
                  """,
              ),
              (
                  "role_perm_invalid",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM role_perm rp
                  WHERE NOT EXISTS (
                    SELECT 1 FROM role r WHERE r.role_id = rp.role_id
                  )
                  OR NOT EXISTS (
                    SELECT 1 FROM perm p WHERE p.perm_id = rp.perm_id
                  )
                  """,
              ),
              (
                  "push_subscription_without_user",
                  """
                  SELECT COUNT(*) AS orphan_count
                  FROM push_subscription ps
                  WHERE NOT EXISTS (
                    SELECT 1 FROM user u WHERE u.user_id = ps.user_id
                  )
                  """,
              ),
          ]

          def query(label, sql):
              payload = json.dumps({"sql": sql.strip()}).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  print(f"::error::D1 REST query failed for {label} with HTTP {exc.code}")
                  print(raw[:6000])
                  raise SystemExit(1)
              except Exception as exc:
                  print(f"::error::D1 REST query transport failure for {label}: {exc}")
                  raise SystemExit(1)

              try:
                  body = json.loads(raw)
              except json.JSONDecodeError:
                  print(f"::error::D1 REST query returned non-JSON data for {label}")
                  print(raw[:6000])
                  raise SystemExit(1)

              if not body.get("success", False):
                  print(f"::error::D1 REST query reported failure for {label}")
                  for item in body.get("errors") or []:
                      if isinstance(item, dict):
                          print(
                              "::error::"
                              + str(item.get("message") or item)
                          )
                      else:
                          print(f"::error::{item}")
                  print(json.dumps(body, ensure_ascii=False)[:6000])
                  raise SystemExit(1)

              results = body.get("result") or []
              if not results:
                  print(f"::error::D1 REST query returned no result object for {label}")
                  print(json.dumps(body, ensure_ascii=False)[:6000])
                  raise SystemExit(1)

              first = results[0] if isinstance(results[0], dict) else {}
              if first.get("success") is False:
                  print(f"::error::D1 SQL execution failed for {label}")
                  print(json.dumps(first, ensure_ascii=False)[:6000])
                  raise SystemExit(1)

              rows = first.get("results") or []
              if not rows or not isinstance(rows[0], dict):
                  print(f"::error::D1 REST query returned no count row for {label}")
                  print(json.dumps(first, ensure_ascii=False)[:6000])
                  raise SystemExit(1)

              try:
                  return int(rows[0].get("orphan_count") or 0)
              except Exception:
                  print(f"::error::Invalid orphan_count returned for {label}: {rows[0]!r}")
                  raise SystemExit(1)

          bad = []
          print("D1 integrity results:")
          for label, sql in checks:
              count = query(label, sql)
              print(f"  {label}: {count}")
              if count:
                  bad.append((label, count))

          if bad:
              print("::error::Hard orphan rows remain. CI will not delete mail/account/attachment rows automatically.")
              for label, count in bad:
                  print(f"::error::{label}={count}")
              raise SystemExit(1)

          print("✅ D1 integrity gate passed")
          PY

      - name: Apply versioned D1 migrations before Worker deploy
        if: ${{ inputs.mode == 'deploy-and-migrate' }}
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm wrangler d1 migrations apply "$D1_DATABASE_NAME" \
            --remote \
            --config wrangler-ci.toml

      - name: Verify D1 runtime schema
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          database_id = os.environ["RESOLVED_D1_DATABASE_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()

          endpoint = (
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}"
              f"/d1/database/{database_id}/query"
          )

          sql = "PRAGMA table_info('email');"
          request = urllib.request.Request(
              endpoint,
              data=json.dumps({"sql": sql}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", "replace")
              print(f"::error::Unable to inspect remote email schema: HTTP {exc.code}")
              print(raw[:6000])
              raise SystemExit(1)

          body = json.loads(raw)
          if not body.get("success", False):
              print("::error::Cloudflare D1 API rejected email schema query.")
              for item in body.get("errors") or []:
                  if isinstance(item, dict):
                      print("::error::" + str(item.get("message") or item))
              print(json.dumps(body, ensure_ascii=False)[:6000])
              raise SystemExit(1)

          results = body.get("result") or []
          if not results or not isinstance(results[0], dict):
              raise SystemExit("::error::No D1 schema result returned for email table")

          rows = results[0].get("results") or []
          columns = {
              str(row.get("name", "")).strip()
              for row in rows
              if isinstance(row, dict)
          }

          required = {
              "email_id",
              "account_id",
              "user_id",
              "subject",
              "content",
              "cc",
              "bcc",
              "recipient",
              "message_id",
              "unread",
              "is_del",
              "deleted_at",
          }

          missing = sorted(required - columns)
          print("Remote email columns: " + ", ".join(sorted(columns)))

          if missing:
              print("::error::D1 schema is not compatible with the current Worker.")
              print("::error::Missing columns: " + ", ".join(missing))
              raise SystemExit(1)

          print("✅ D1 runtime schema is compatible with current Worker")
          PY

      - name: Deploy Worker and frontend without re-uploading application secrets
        id: deploy
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set -euo pipefail

          pnpm wrangler deploy \
            --config wrangler-ci.toml \
            2>&1 | tee deploy.log

          echo "✅ Worker deployed"
          echo "✅ Existing encrypted Worker secrets were left in Cloudflare"

      - name: Post-deploy health check
        id: health
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${EXISTING_CUSTOM_DOMAIN:-}" ]; then
            echo "::warning::No existing Cloudflare Worker custom domain was discovered; skipping HTTP health check."
            exit 0
          fi

          HEALTH_URL="https://${EXISTING_CUSTOM_DOMAIN}/api/health"
          echo "Checking $HEALTH_URL"

          for attempt in $(seq 1 12); do
            code="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$RUNNER_TEMP/cloudmail-health.json" \
                --write-out '%{http_code}' \
                "$HEALTH_URL" || printf '000'
            )"

            if [ "$code" = "200" ]; then
              echo "✅ CloudMail health check passed"
              cat "$RUNNER_TEMP/cloudmail-health.json" || true
              exit 0
            fi

            echo "Health attempt $attempt/12 returned HTTP $code"
            sleep 5
          done

          echo "::error::CloudMail post-deploy health check failed"
          cat "$RUNNER_TEMP/cloudmail-health.json" || true
          exit 1

      - name: Roll back Worker when post-deploy health fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure' }}
        working-directory: ${{ github.workspace }}/cloudmail-source/mail-worker
        shell: bash
        run: |
          set +e
          pnpm wrangler rollback \
            --config wrangler-ci.toml \
            --message "Automatic rollback: public CI post-deploy health check failed"

          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Automatic Worker rollback failed; roll back from Cloudflare Deployments."
            exit "$status"
          fi

          echo "✅ Previous Worker version restored"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CloudMail public CI deployment'
            echo
            echo "- Source repository: \`readori/CloudMail\`"
            echo "- Source ref: \`${{ inputs.source_ref }}\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Private repository Actions used: **No**"
            echo "- Application secret values copied to public GitHub: **No**"
            echo "- Required public credentials: \`TARGET_REPO_PAT\`, \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
