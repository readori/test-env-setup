name: Readori Bot V2

# Runs entirely in the PUBLIC repository readori/test-env-setup.
# No new GitHub Secrets are required.
#
# Existing public-repo secrets used:
#   TARGET_REPO_PAT
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN
#   READORI_SOCIAL_WORKER_ENDPOINT   # optional health check, already exists
#
# Existing Worker secrets (BOT_TOKEN / ADMIN_CHAT_ID / APPLE_IAP_* / PRO_LEASE_* / etc.)
# remain stored on Cloudflare and are NOT copied into this workflow.
# Cloudflare Wrangler deployments preserve existing Worker secrets.

on:
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "readori/readoritgbot branch / tag / SHA"
        required: true
        default: "main"
        type: string
      mode:
        description: "validate = test + dry-run only; deploy = migrations + deploy"
        required: true
        default: "deploy"
        type: choice
        options:
          - validate
          - deploy
      run_migrations:
        description: "Apply remote D1 migrations before deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: readori-bot-cloudflare-production
  cancel-in-progress: false

env:
  BOT_REPOSITORY: readori/readoritgbot
  BOT_DIR: bot
  WORKER_NAME: bot-readori
  D1_DATABASE_NAME: tg-bot-db
  KV_NAMESPACE_TITLE: SENT_RECORDS

jobs:
  bot:
    name: Validate and deploy Readori Bot
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # ============================================================
      # 1. Validate only the secrets that already exist in PUBLIC CI
      # ============================================================
      - name: Validate public CI credentials
        shell: bash
        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${TARGET_REPO_PAT:-}" ]] || missing+=("TARGET_REPO_PAT")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")

          if (( ${#missing[@]} )); then
            echo "::error::Missing existing public-repo secret(s): ${missing[*]}"
            exit 1
          fi

          echo "Public CI credentials: PASS"

      # ============================================================
      # 2. Checkout PRIVATE bot source with existing TARGET_REPO_PAT
      # ============================================================
      - name: Checkout private readori/readoritgbot
        uses: actions/checkout@v6
        with:
          repository: readori/readoritgbot
          ref: ${{ inputs.bot_ref }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          path: bot
          fetch-depth: 1
          persist-credentials: false

      - name: Verify private source
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            package.json
            wrangler.toml.template
            src/index.js
            src/admin/operations.js
            src/tts/index.js
            src/entitlement/index.js
            src/growth/referral.js
            src/growth/voice-pass-og.js
            src/azure-entry.js
            src/azure-regional-entry.js
            migrations/0014_bot_admin_operations.sql
            migrations/0015_remove_example_coupon_seeds.sql
            migrations/0016_growth_referral_voice_pass.sql
            migrations/0017_growth_admin_operations.sql
            scripts/verify-release.mjs
            test/admin-operations.test.js
            test/growth-referral.test.js
          )
          missing=()
          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Private bot source is missing required file(s): ${missing[*]}"
            exit 1
          fi
          grep -Eq '^main[[:space:]]*=[[:space:]]*"src/azure-regional-entry\.js"[[:space:]]*$' wrangler.toml.template || {
            echo "::error::Production entry must remain src/azure-regional-entry.js"
            exit 1
          }
          if grep -Eq '^\[vars\][[:space:]]*$' wrangler.toml.template; then
            echo "::error::Private wrangler template must not contain [vars]; Cloudflare Dashboard is production source of truth."
            exit 1
          fi

          echo "Private repo checkout: PASS"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Short SHA: $(git rev-parse --short HEAD)"

      # ============================================================
      # 3. Node + tests
      # ============================================================
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # This production deployment handles Cloudflare credentials.
          # Disable setup-node automatic package-manager caching so the job
          # does not depend on package-lock.json being committed/present.
          package-manager-cache: false

      - name: Verify Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          [[ "$(node --version)" == v24.* ]] || {
            echo "::error::Expected Node.js 24.x"
            exit 1
          }

      - name: Install dependencies
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Private source self-check
        working-directory: bot
        run: npm run check

      # ============================================================
      # 4. Discover EXISTING Cloudflare resources.
      #    No D1_DATABASE_ID / KV_NAMESPACE_ID GitHub secrets needed.
      # ============================================================
      - name: Discover existing D1 and KV IDs
        id: cloudflare_resources
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          echo "Wrangler:"
          npx wrangler --version

          # ---------- D1 ----------
          # Resolve the existing production D1 by its stable database name.
          D1_JSON="$(npx wrangler d1 list --json)"
          D1_ID="$(
            printf '%s' "$D1_JSON" |
              jq -r --arg name "$D1_DATABASE_NAME" '
                .[]
                | select(.name == $name)
                | (.uuid // .id // empty)
              ' |
              head -n 1
          )"

          if [[ -z "$D1_ID" || "$D1_ID" == "null" ]]; then
            echo "::error::Existing D1 database '$D1_DATABASE_NAME' was not found."
            exit 1
          fi

          # ---------- KV ----------
          # IMPORTANT: SENT_RECORDS is the WORKER BINDING NAME, not necessarily
          # the Cloudflare KV namespace title. Read the already-deployed
          # bot-readori Worker settings and recover the exact namespace_id
          # attached to binding SENT_RECORDS. This avoids adding/copying any
          # KV_NAMESPACE_ID GitHub secret and cannot accidentally create a new KV.
          WORKER_SETTINGS="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          )"

          SETTINGS_SUCCESS="$(printf '%s' "$WORKER_SETTINGS" | jq -r '.success // false')"
          if [[ "$SETTINGS_SUCCESS" != "true" ]]; then
            echo "::error::Unable to read settings for existing Worker '$WORKER_NAME'."
            printf '%s' "$WORKER_SETTINGS" | jq -c '{success,errors,messages}' || true
            exit 1
          fi

          KV_ID="$(
            printf '%s' "$WORKER_SETTINGS" |
              jq -r --arg binding "$KV_NAMESPACE_TITLE" '
                .result.bindings[]?
                | select(.type == "kv_namespace" and .name == $binding)
                | .namespace_id
              ' |
              head -n 1
          )"

          if [[ -z "$KV_ID" || "$KV_ID" == "null" ]]; then
            echo "::error::Worker '$WORKER_NAME' does not currently have KV binding '$KV_NAMESPACE_TITLE'."
            echo "::error::Existing bindings returned by Cloudflare:"
            printf '%s' "$WORKER_SETTINGS" |
              jq -r '.result.bindings[]? | "  - \(.name // "?") [\(.type // "?")]"' || true
            echo "::error::No KV namespace will be created or replaced automatically."
            exit 1
          fi

          echo "D1 database: $D1_DATABASE_NAME"
          echo "KV binding: $KV_NAMESPACE_TITLE (existing Worker binding recovered)"

          # Resource IDs are intentionally not printed. They only live in the
          # runner environment long enough to render wrangler.toml.
          {
            echo "D1_DATABASE_ID=$D1_ID"
            echo "KV_NAMESPACE_ID=$KV_ID"
            echo "KV_PREVIEW_NAMESPACE_ID=$KV_ID"
          } >> "$GITHUB_ENV"

          echo "Existing Cloudflare resources: PASS"

      # ============================================================
      # 5. Render ONLY resource IDs into wrangler.toml.
      #    Plain-text Worker vars remain owned by Cloudflare Dashboard
      #    and are preserved by --keep-vars.
      # ============================================================
      - name: Render wrangler.toml
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path("wrangler.toml.template").read_text(encoding="utf-8")
          replacements = {
              "__KV_NAMESPACE_ID__": os.environ["KV_NAMESPACE_ID"],
              "__KV_PREVIEW_NAMESPACE_ID__": os.environ.get("KV_PREVIEW_NAMESPACE_ID") or os.environ["KV_NAMESPACE_ID"],
              "__D1_DATABASE_ID__": os.environ["D1_DATABASE_ID"],
          }
          for token, value in replacements.items():
              template = template.replace(token, str(value))

          unresolved = sorted({part for part in template.replace('"', ' ').split() if "__" in part})
          if unresolved:
              raise SystemExit(f"Unresolved wrangler placeholders: {unresolved}")
          if "[vars]" in template:
              raise SystemExit("Rendered wrangler.toml unexpectedly contains [vars]")

          Path("wrangler.toml").write_text(template, encoding="utf-8")
          print("wrangler.toml rendered with existing resource IDs only")
          PY

          grep -E '^(name|main|binding|database_name)' wrangler.toml || true

      # ============================================================
      # 6. Confirm the existing production bindings.
      #    Secret VALUES stay on Cloudflare and are never copied into CI.
      # ============================================================
      - name: Verify existing Cloudflare Worker bindings
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          SECRET_JSON="$(npx wrangler secret list --name "$WORKER_NAME" --format json)"
          SETTINGS_JSON="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          )"

          has_secret() {
            printf '%s' "$SECRET_JSON" | jq -e --arg name "$1" '.[] | select(.name == $name)' >/dev/null
          }
          has_binding_name() {
            printf '%s' "$SETTINGS_JSON" | jq -e --arg name "$1" '.result.bindings[]? | select(.name == $name)' >/dev/null
          }
          has_remote_name() { has_secret "$1" || has_binding_name "$1"; }

          secret_required=(
            BOT_TOKEN
            WEBHOOK_SECRET
            ADMIN_SECRET
            APPLE_IAP_PRIVATE_KEY
            PRO_LEASE_PRIVATE_KEY_JWK
            DEVICE_CHALLENGE_SECRET
          )
          remote_required=(
            ADMIN_CHAT_ID
            APPLE_IAP_KEY_ID
            APPLE_IAP_ISSUER_ID
            APPLE_ALLOW_SANDBOX_IAP
            READORI_APP_TEAM_ID
          )

          missing=()
          for name in "${secret_required[@]}"; do
            has_secret "$name" || missing+=("$name(secret)")
          done
          for name in "${remote_required[@]}"; do
            has_remote_name "$name" || missing+=("$name(binding)")
          done

          if (( ${#missing[@]} )); then
            echo "::error::Existing Worker configuration is incomplete: ${missing[*]}"
            echo "::error::This workflow never copies or regenerates production secret values."
            exit 1
          fi

          # Production can run without Azure Entra until fallback is needed, so
          # these are notices rather than deployment blockers.
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SPEECH_REGION AZURE_SPEECH_RESOURCE_ID; do
            has_remote_name "$name" || echo "::notice::Optional Azure regional fallback binding is absent: $name"
          done

          echo "Existing Worker security/operations bindings: PASS"

      # ============================================================
      # 7. Build-only Wrangler validation
      # ============================================================
      - name: Wrangler dry-run
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/readori-bot-dry-run
          npx wrangler deploy \
            --dry-run \
            --outdir /tmp/readori-bot-dry-run \
            --keep-vars

          grep -Rqs 'readori-bot-clean-production-v1.1-r14-reading-sync-resilience-v2-20260821' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing Reader Hub + Reading Sync resilience revision"
            exit 1
          }
          grep -Rqs 'bot-admin-operations-v1.1-20260820' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing Bot Admin Operations v1.1"
            exit 1
          }
          grep -Rqs 'growth_referral_claims_enabled' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing Voice Pass runtime operations controls"
            exit 1
          }
          grep -Rqs 'apple-app-site-association' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing Universal Link AASA routes"
            exit 1
          }
          grep -Rqs 'voice-pass/og.jpg' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing Voice Pass social preview asset route"
            exit 1
          }
          grep -Rqs 'x-readori-tts-style-applied' /tmp/readori-bot-dry-run || {
            echo "::error::Dry-run bundle is missing semantic TTS diagnostics"
            exit 1
          }
          echo "Wrangler dry-run + release guards: PASS"

      - name: Stop after validate
        if: ${{ inputs.mode == 'validate' }}
        run: |
          echo "Validation completed."
          echo "No Cloudflare Worker code, D1 migration, or secret was changed."

      # ============================================================
      # 8. D1 migrations
      # ============================================================
      - name: Apply D1 migrations
        if: ${{ inputs.mode == 'deploy' && inputs.run_migrations }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Verify required D1 tables
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail

          OUT="$(
            npx wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          )"

          required_tables=(
            coupon_codes
            ordinary_coupon_claims
            send_records
            bind_codes
            social_bindings
            reading_sessions
            reading_session_dedup
            user_cultivation
            daily_reading_stats
            cultivation_logs
            user_finished_books
            pro_applications
            app_devices
            pro_purchases
            pro_devices
            pro_device_activation_history
            pro_reward_codes
            level24_pro_rewards
            ai_tts_daily_usage
            ai_tts_global_daily_usage
            ai_tts_provider_health
            bot_settings
            bot_admin_audit_log
            growth_referral_profiles
            growth_referrals
            growth_offer_inventory
            growth_reward_grants
          )

          missing=()
          for table in "${required_tables[@]}"; do
            grep -q "$table" <<<"$OUT" || missing+=("$table")
          done

          if (( ${#missing[@]} )); then
            echo "::error::Missing required D1 table(s): ${missing[*]}"
            exit 1
          fi

          echo "Required D1 tables: PASS (${#required_tables[@]})"

          DEMO_OUT="$(
            npx wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --json \
              --command="SELECT COUNT(*) AS count FROM coupon_codes WHERE is_used=0 AND link LIKE 'https://your-shop.com/%';"
          )"
          DEMO_COUNT="$(printf '%s' "$DEMO_OUT" | jq -r '.[0].results[0].count // 0')"
          if [[ "$DEMO_COUNT" != "0" ]]; then
            echo "::error::Unused demo coupon seed rows still exist after migrations."
            exit 1
          fi
          echo "Demo coupon cleanup: PASS"

          GROWTH_SETTINGS_OUT="$(
            npx wrangler d1 execute "$D1_DATABASE_NAME" \
              --remote \
              --json \
              --command="SELECT key, value FROM bot_settings WHERE key IN ('growth_referral_claims_enabled','growth_referral_pause_message') ORDER BY key;"
          )"
          GROWTH_SETTINGS_COUNT="$(printf '%s' "$GROWTH_SETTINGS_OUT" | jq -r '.[0].results | length // 0')"
          if [[ "$GROWTH_SETTINGS_COUNT" != "2" ]]; then
            echo "::error::Voice Pass Bot Operations settings are missing after migrations."
            exit 1
          fi
          echo "Voice Pass Bot Operations settings: PASS"

      # ============================================================
      # 9. Deploy code/config only.
      #
      # IMPORTANT:
      # - No `wrangler secret put` here.
      # - Existing Worker secrets are preserved by Wrangler deployment.
      # - --keep-vars preserves ALL existing remote plain-text vars.
      # - This workflow renders resource IDs only; it never renders TTS/provider vars.
      # ============================================================
      - name: Deploy Cloudflare Worker
        if: ${{ inputs.mode == 'deploy' }}
        working-directory: bot
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars

      # ============================================================
      # 10. Health check using EXISTING public-repo endpoint secret
      # ============================================================
      - name: Health check
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
        run: |
          set -euo pipefail

          BASE="${READORI_SOCIAL_WORKER_ENDPOINT:-}"
          if [[ -z "$BASE" ]]; then
            echo "::notice::READORI_SOCIAL_WORKER_ENDPOINT is empty; deployment succeeded, HTTP health check skipped."
            exit 0
          fi

          BASE="${BASE%/}"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
                 "$BASE/health" > /tmp/readori-health.json; then
              cat /tmp/readori-health.json
              echo
              REVISION="$(jq -r '.revision // empty' /tmp/readori-health.json)"
              if [[ "$REVISION" != 'readori-bot-clean-production-v1.1-r14-reading-sync-resilience-v2-20260821' ]]; then
                echo "::error::Worker is healthy but stale. Expected R14 Reading Sync Resilience revision; got: ${REVISION:-missing}"
                exit 1
              fi
              echo "Worker health + deployed revision: PASS ($REVISION)"
              exit 0
            fi
            echo "Health attempt $attempt failed; retrying..."
            sleep 3
          done

          echo "::error::Worker deployed but /health did not become healthy."
          exit 1

      # ============================================================
      # 11. Summary
      # ============================================================
      - name: Summary
        if: ${{ always() }}
        working-directory: bot
        shell: bash
        run: |
          {
            echo "## Readori Bot"
            echo
            echo "- CI repository: \`${{ github.repository }}\`"
            echo "- Source: \`$BOT_REPOSITORY\`"
            echo "- Ref: \`${{ inputs.bot_ref }}\`"
            echo "- SHA: \`$(git rev-parse --short HEAD 2>/dev/null || echo unknown)\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Worker: \`$WORKER_NAME\`"
            echo "- D1: \`$D1_DATABASE_NAME\`"
            echo "- KV: \`$KV_NAMESPACE_TITLE\`"
            echo "- Existing Cloudflare Worker secret values were not copied or modified."
            echo "- After this unified Growth deploy, call POST /setup once with Authorization: Bearer ADMIN_SECRET so Telegram refreshes the administrator command menu (including /growth)."
          } >> "$GITHUB_STEP_SUMMARY"
