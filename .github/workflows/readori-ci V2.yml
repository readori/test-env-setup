name: Readori ci V2
# Unified pipeline — three modes via single dispatch:

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "unsigned = sideload | testflight = upload TF | screenshots = App Store + Accessibility screenshots"
        required: false
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - testflight
          - screenshots

      app_scheme:
        description: "xcodebuild scheme"
        required: false
        default: "Readori"
        type: string

      xcode_version:
        description: "Xcode version (optional, e.g. 26.0)"
        required: false
        default: ""
        type: string

      generate_icons:
        description: "Run icon generation script"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

      app_version:
        description: "Optional Marketing Version 1.MINOR.PATCH. Blank = compact CI auto version (e.g. run #137 → 1.13.6)."
        required: false
        default: ""
        type: string

      build_number:
        description: "Optional build number shown in parentheses. Blank = next build number inside this Marketing Version (normally 1, 2, 3...)."
        required: false
        default: ""
        type: string

      run_accessibility_ui:
        description: "Accessibility/iPad UI audit: no = static regression gate only (fast/default); yes = also run iPhone + iPad 13-inch + Split View + VoiceOver XCTest/screenshots."
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    environment: production

    env:
      MODE: ${{ github.event.inputs.mode }}
      SCHEME: ${{ github.event.inputs.app_scheme }}
      APP_VERSION_INPUT: ${{ github.event.inputs.app_version }}
      BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number }}
      READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
      CI_REVISION: "R14_BUILD57_USER_FEEDBACK_FIX_20260821"

    steps:

    - name: Print CI revision
      run: |
        echo "CI revision: $CI_REVISION"

    # ==============================================
    # 1. SSH — private source repository
    # ==============================================
    - name: Install private repository SSH key
      env:
        PRIVATE_REPO_KEY: ${{ secrets.PRIVATE_REPO_KEY }}
      run: |
        set -euo pipefail
        test -n "$PRIVATE_REPO_KEY" || { echo "::error::PRIVATE_REPO_KEY is required"; exit 1; }

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

        printf '%s\n' "$PRIVATE_REPO_KEY" > ~/.ssh/app_key
        chmod 600 ~/.ssh/app_key

        cat > ~/.ssh/config <<'EOF'
        Host github-app
          HostName github.com
          User git
          IdentityFile ~/.ssh/app_key
          IdentitiesOnly yes
        EOF
        chmod 600 ~/.ssh/config

    # ==============================================
    # 2. CLONE PRIVATE REPO
    # ==============================================
    - name: Clone readori/readori
      run: |
        git clone --depth=50 git@github-app:readori/readori.git core_project
        echo "[clone] $(git -C core_project rev-parse --short HEAD)"

    - name: Normalize accidental nested Readori overlay
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import shutil
        import sys

        project = Path("core_project")
        target = project / "Readori"
        nested = target / "Readori"

        if not nested.exists():
            print("Nested overlay check: PASS (no Readori/Readori directory)")
            raise SystemExit(0)

        files = [p for p in nested.rglob("*") if p.is_file()]
        if not files:
            print("Nested overlay directory is empty; removing it.")
            shutil.rmtree(nested)
            raise SystemExit(0)

        conflicts = []
        missing = []
        identical = []

        def digest(path: Path) -> str:
            h = hashlib.sha256()
            with path.open("rb") as fh:
                for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                    h.update(chunk)
            return h.hexdigest()

        for duplicate in files:
            rel = duplicate.relative_to(nested)
            canonical = target / rel
            if not canonical.exists():
                missing.append((duplicate, canonical))
                continue
            if not canonical.is_file() or digest(duplicate) != digest(canonical):
                conflicts.append((duplicate, canonical))
                continue
            identical.append((duplicate, canonical))

        if missing or conflicts:
            print("::error::Accidental nested Readori/Readori tree contains files that cannot be safely auto-removed.")
            for duplicate, canonical in missing:
                print(f"::error::Nested-only file: {duplicate} -> expected canonical {canonical}")
            for duplicate, canonical in conflicts:
                print(f"::error::Conflicting duplicate: {duplicate} != {canonical}")
            print("::error::Merge the differing file intentionally, then delete core_project/Readori/Readori.")
            raise SystemExit(1)

        print(f"Safe duplicate overlay detected: {len(identical)} identical file(s).")
        for duplicate, canonical in identical:
            print(f"  remove duplicate: {duplicate}")
            print(f"  keep canonical : {canonical}")

        shutil.rmtree(nested)
        print("Nested overlay normalized: removed core_project/Readori/Readori")
        PY

    # ==============================================
    # 3. SELECT XCODE VERSION
    # ==============================================
    - name: Select Xcode 26.x
      env:
        REQUESTED_XCODE_VERSION: ${{ inputs.xcode_version }}
      run: |
        set -euo pipefail

        SELECTED_XCODE_APP="$(python3 - <<'PY'
        import glob, os, re, sys

        requested = os.environ.get('REQUESTED_XCODE_VERSION', '').strip()
        candidates = []
        for path in glob.glob('/Applications/Xcode*.app'):
            name = os.path.basename(path)
            m = re.fullmatch(r'Xcode_(\d+(?:\.\d+){0,2})\.app', name)
            if not m:
                continue
            version = m.group(1)
            parts = tuple(int(x) for x in version.split('.'))
            if parts[0] != 26:
                continue
            candidates.append((parts, version, path))

        if requested:
            direct = f'/Applications/Xcode_{requested}.app'
            if os.path.isdir(direct):
                print(direct)
                raise SystemExit(0)
            matches = [item for item in candidates if item[1] == requested or item[1].startswith(requested + '.')]
            if matches:
                print(max(matches)[2])
                raise SystemExit(0)
            print(f'Requested Xcode {requested} was not found', file=sys.stderr)
            raise SystemExit(2)

        if not candidates:
            print('No Xcode 26.x installation found', file=sys.stderr)
            raise SystemExit(3)
        print(max(candidates)[2])
        PY
        )" || {
          echo "::error::Unable to select requested Xcode 26.x"
          echo "Installed Xcodes:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        }

        sudo xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"

        # Xcode 26.3: never pipe xcodebuild -version into head/grep.
        # A downstream command can close stdout early and make xcodebuild throw
        # NSFileHandleOperationException ("Broken pipe") with exit code 134.
        XCODE_VERSION_OUTPUT="$(xcodebuild -version 2>&1)"
        XCODE_VERSION_LINE="${XCODE_VERSION_OUTPUT%%$'\n'*}"
        XCODE_VERSION_RAW="${XCODE_VERSION_LINE#Xcode }"
        XCODE_MAJOR="${XCODE_VERSION_RAW%%.*}"
        SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

        if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
          echo "::error::Xcode 26+ is required; selected ${XCODE_VERSION_RAW:-unknown}"
          exit 1
        fi

        echo "SELECTED_XCODE_VERSION=$XCODE_VERSION_RAW" >> "$GITHUB_ENV"
        echo "Xcode: $XCODE_VERSION_RAW"
        echo "iOS SDK: $SDK_VERSION"
        echo "Developer dir: $(xcode-select -p)"

    # ==============================================
    # 4. SPM CACHE + RESOLVE
    # ==============================================
    - name: Cache Swift packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          core_project/.build
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-xcode-${{ env.SELECTED_XCODE_VERSION }}-${{ hashFiles('core_project/Package.resolved', 'core_project/Package.swift') }}
        restore-keys: |
          spm-${{ runner.os }}-xcode-${{ env.SELECTED_XCODE_VERSION }}-
          spm-${{ runner.os }}-
        # 🐛 修复：此前把 ~/Library/Developer/Xcode/DerivedData 也一起缓存，

    - name: Resolve Swift packages
      run: cd core_project && swift package resolve

    - name: Resolve clean 1.MINOR.PATCH version
      shell: bash
      env:
        MANUAL_APP_VERSION: ${{ github.event.inputs.app_version }}
      run: |
        set -euo pipefail
        MANUAL="${MANUAL_APP_VERSION:-}"
        if [[ -n "$MANUAL" ]]; then
          if ! [[ "$MANUAL" =~ ^1\.[0-9]+\.[0-9]$ ]]; then
            echo "::error::app_version must use 1.MINOR.PATCH (example: 1.12.3; PATCH is one digit). Got: $MANUAL"
            exit 64
          fi
          APP_VERSION="$MANUAL"
          VERSION_SOURCE="manual"
        else
          RUN_NUMBER="${{ github.run_number }}"
          # Compact, monotonic-looking Marketing Version while keeping major=1:
          # run 1 -> 1.0.0, run 137 -> 1.13.6, run 368 -> 1.36.7.
          ZERO=$(( RUN_NUMBER > 0 ? RUN_NUMBER - 1 : 0 ))
          MINOR=$(( ZERO / 10 ))
          PATCH=$(( ZERO % 10 ))
          APP_VERSION="1.${MINOR}.${PATCH}"
          VERSION_SOURCE="ci-compact(run=${RUN_NUMBER})"
          if (( MINOR > 99 )); then
            echo "::warning::Auto MINOR is now ${MINOR}. You may enter app_version manually to keep the public version visually shorter."
          fi
        fi

        # Non-TestFlight artifacts use a clean default build 1. TestFlight replaces
        # this later with manual build_number or the ASC per-version next number.
        DISPLAY_BUILD="${BUILD_NUMBER_INPUT:-1}"
        if ! [[ "$DISPLAY_BUILD" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::build_number must be a positive integer when provided. Got: ${DISPLAY_BUILD}"
          exit 64
        fi

        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "BUILD_NUMBER=$DISPLAY_BUILD" >> "$GITHUB_ENV"
        echo "Marketing Version: $APP_VERSION ($VERSION_SOURCE)"
        echo "Initial build number: $DISPLAY_BUILD"

    - name: Validate Swift source uniqueness
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        from collections import defaultdict

        root = Path("core_project/Readori")
        by_name = defaultdict(list)
        ignored_parts = {".build", ".swiftpm", "DerivedData", "build"}
        for path in root.rglob("*.swift"):
            if not path.is_file() or any(part in ignored_parts for part in path.parts):
                continue
            by_name[path.name].append(path)

        duplicates = {name: paths for name, paths in by_name.items() if len(paths) > 1}

        for target in ("HybridTextKitEngine.swift", "ReaderAdvancedPagerView.swift"):
            paths = by_name.get(target, [])
            print(f"[swift-source-check] {target}: {len(paths)}")
            for path in paths:
                print(f"  - {path}")

        if duplicates:
            print("::error::Duplicate Swift basenames exist in the Readori target.")
            for name in sorted(duplicates):
                print(f"::error::{name}")
                for path in duplicates[name]:
                    print(f"::error::  {path}")
            raise SystemExit(1)

        print(f"Swift source uniqueness: PASS ({sum(len(v) for v in by_name.values())} files)")
        PY

    # ==============================================
    # 4.4 BOOTSTRAP ACCESSIBILITY FINAL AUDIT ASSETS
    # Public CI is self-contained: if the private repo has not committed the
    # DeveloperTools overlay yet, inject the exact audit assets on the runner.
    # ==============================================
    - name: Bootstrap Accessibility Final Audit assets
      shell: bash
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/core_project"
        TOOLS="$ROOT/DeveloperTools/AccessibilityFinalAudit"
        if [[ -f "$TOOLS/accessibility_ipad_final_audit.py" && -f "$TOOLS/ci_accessibility_ipad_final.sh" && -f "$TOOLS/UITestHarness/ReadoriAccessibilityUITests.swift.template" ]]; then
          echo "Accessibility Final Audit assets already exist in private source; using repository copy."
          chmod +x "$TOOLS/ci_accessibility_ipad_final.sh" || true
          exit 0
        fi
        echo "Accessibility Final Audit assets are missing from private source; injecting public-CI fallback."
        mkdir -p "$TOOLS/UITestHarness"
        python3 - <<'PY_A11Y_BOOTSTRAP'
        from pathlib import Path
        import base64, os
        root = Path(os.environ["GITHUB_WORKSPACE"]) / "core_project" / "DeveloperTools" / "AccessibilityFinalAudit"
        assets = {
            'accessibility_ipad_final_audit.py': '',
            'ci_accessibility_ipad_final.sh': '',
            'UITestHarness/HarnessHostApp.swift.template': 'aW1wb3J0IFN3aWZ0VUkKCkBtYWluCnN0cnVjdCBSZWFkb3JpQWNjZXNzaWJpbGl0eUhhcm5lc3NIb3N0QXBwOiBBcHAgewogICAgdmFyIGJvZHk6IHNvbWUgU2NlbmUgewogICAgICAgIFdpbmRvd0dyb3VwIHsKICAgICAgICAgICAgVGV4dCgiUmVhZG9yaSBBY2Nlc3NpYmlsaXR5IEhhcm5lc3MiKQogICAgICAgICAgICAgICAgLnBhZGRpbmcoKQogICAgICAgIH0KICAgIH0KfQo=',
            'UITestHarness/ReadoriAccessibilityUITests.swift.template': '',
            'UITestHarness/project.yml': '',
        }
        for rel, payload in assets.items():
            path = root / rel
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(base64.b64decode(payload))
        print(f"Injected {len(assets)} Accessibility Final Audit assets into {root}")
        PY_A11Y_BOOTSTRAP
        chmod +x "$TOOLS/ci_accessibility_ipad_final.sh"

    # ==============================================
    # 4.5 ACCESSIBILITY + iPAD FINAL REGRESSION GATE
    # ==============================================
    - name: Accessibility + iPad Final static regression gate
      shell: bash
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/core_project"
        AUDIT="$ROOT/DeveloperTools/AccessibilityFinalAudit/accessibility_ipad_final_audit.py"
        UI_SCRIPT="$ROOT/DeveloperTools/AccessibilityFinalAudit/ci_accessibility_ipad_final.sh"
        TEST_TEMPLATE="$ROOT/DeveloperTools/AccessibilityFinalAudit/UITestHarness/ReadoriAccessibilityUITests.swift.template"

        for required in "$AUDIT" "$UI_SCRIPT" "$TEST_TEMPLATE"; do
          [[ -f "$required" ]] || {
            echo "::error::Accessibility Final Audit bootstrap failed; expected asset is still missing: $required"
            exit 66
          }
        done

        python3 "$AUDIT"
        chmod +x "$UI_SCRIPT"

        # Public-CI contract: these regression protections must not silently disappear.
        grep -q 'performAccessibilityAudit' "$TEST_TEMPLATE" || { echo '::error::XCTest accessibility audit was removed'; exit 1; }
        grep -q 'testIPad13SplitCompactLayout' "$TEST_TEMPLATE" || { echo '::error::iPad Split View test was removed'; exit 1; }
        grep -q 'testReaderVoiceOverAX5TTS' "$TEST_TEMPLATE" || { echo '::error::VoiceOver + AX5 TTS test was removed'; exit 1; }
        grep -q 'testReadingStatisticsChartsExposeData' "$TEST_TEMPLATE" || { echo '::error::Reading Statistics spoken-data test was removed'; exit 1; }
        echo 'Accessibility/iPad source regression gate: PASS'

    # ==============================================
    # 5. ICON GENERATION (optional, skip for screenshots)
    # ==============================================
    - name: Generate icons
      if: ${{ github.event.inputs.generate_icons == 'yes' && env.MODE != 'screenshots' }}
      run: |
        if [[ -f "core_project/scripts/generate_icons.swift" ]]; then
          swift core_project/scripts/generate_icons.swift "${GITHUB_WORKSPACE}/core_project"
        fi

    # ==============================================
    # 5.5 iPHONE + iPAD 13 + SPLIT VIEW + VOICEOVER UI TEST / SCREENSHOTS
    # Full UI audit is opt-in to conserve GitHub Actions minutes; static regression gates always run.
    # ==============================================
    - name: Run iPhone + iPad 13 + Split View + VoiceOver UI audit
      if: ${{ github.event.inputs.run_accessibility_ui == 'yes' }}
      timeout-minutes: 45
      shell: bash
      env:
        READORI_A11Y_OUTPUT: ${{ runner.temp }}/readori-accessibility-final
        READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
        READORI_API_SECRET: ${{ secrets.READORI_API_SECRET }}
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/core_project"
        SCRIPT="$ROOT/DeveloperTools/AccessibilityFinalAudit/ci_accessibility_ipad_final.sh"
        [[ -x "$SCRIPT" ]] || chmod +x "$SCRIPT"
        "$SCRIPT" "$ROOT"

    - name: Upload Accessibility iPhone/iPad screenshots
      if: ${{ always() && github.event.inputs.run_accessibility_ui == 'yes' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Readori-Accessibility-iPhone-iPad13-Screenshots-${{ github.run_number }}
        path: ${{ runner.temp }}/readori-accessibility-final/screenshots
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Accessibility XCTest result bundles
      if: ${{ always() && github.event.inputs.run_accessibility_ui == 'yes' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Readori-Accessibility-XCResults-${{ github.run_number }}
        path: ${{ runner.temp }}/readori-accessibility-final/results
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Accessibility simulator build log
      if: ${{ always() && github.event.inputs.run_accessibility_ui == 'yes' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Readori-Accessibility-Build-Log-${{ github.run_number }}
        path: ${{ runner.temp }}/readori-accessibility-final/readori-simulator-build.log
        if-no-files-found: warn
        retention-days: 14

    - name: Accessibility/iPad release-gate summary
      if: ${{ success() && github.event.inputs.run_accessibility_ui == 'yes' }}
      shell: bash
      run: |
        {
          echo '## Accessibility + iPad Final Audit — PASS'
          echo
          echo '- Fixed-text Dynamic Type regression gate: PASS'
          echo '- Unlabeled icon-only interaction regression gate: PASS'
          echo '- iPad full-screen lock regression gate: PASS'
          echo '- AX5 TTS reflow regression gate: PASS'
          echo '- Reading Statistics VoiceOver data regression gate: PASS'
          echo '- iPhone Accessibility XCTest/screenshot: PASS'
          echo '- iPad 13-inch portrait + landscape XCTest/screenshot: PASS'
          echo '- iPad compact Split View branch: PASS'
          echo '- VoiceOver-specific Reader + TTS branch: PASS'
        } >> "$GITHUB_STEP_SUMMARY"

    # ==============================================
    # 6. INSTALL asc-cli (TestFlight only)
    # ==============================================
    - name: Ensure asc-cli is available
      if: ${{ env.MODE == 'testflight' }}
      run: |
        set -euo pipefail
        if ! command -v asc >/dev/null 2>&1; then
          brew tap tddworks/tap
          brew install tddworks/tap/asccli
        fi
        asc --version
        echo "asc: $(command -v asc)"

    - name: Resolve Pro Lease public key
      env:
        PRO_LEASE_PUBLIC_KEY_VAR: ${{ vars.PRO_LEASE_PUBLIC_KEY }}
        PRO_LEASE_PUBLIC_KEY_SECRET: ${{ secrets.PRO_LEASE_PUBLIC_KEY }}
      run: |
        set -euo pipefail

        echo "GitHub environment: production"
        if [[ -n "${PRO_LEASE_PUBLIC_KEY_VAR:-}" ]]; then
          echo "PRO_LEASE_PUBLIC_KEY via vars context: FOUND"
        else
          echo "PRO_LEASE_PUBLIC_KEY via vars context: NOT FOUND"
        fi

        if [[ -n "${PRO_LEASE_PUBLIC_KEY_SECRET:-}" ]]; then
          echo "PRO_LEASE_PUBLIC_KEY via secrets context: FOUND"
        else
          echo "PRO_LEASE_PUBLIC_KEY via secrets context: NOT FOUND"
        fi

        KEY="${PRO_LEASE_PUBLIC_KEY_VAR:-${PRO_LEASE_PUBLIC_KEY_SECRET:-}}"
        KEY="$(printf '%s' "$KEY" | tr -d '\r\n[:space:]')"

        if [[ -z "$KEY" ]]; then
          if [[ "${MODE:-}" == "testflight" ]]; then
            echo "::error::PRO_LEASE_PUBLIC_KEY is not visible to this workflow."
            echo "::error::Add it to the GitHub repository that RUNS this workflow:"
            echo "::error::Settings → Secrets and variables → Actions → Variables → PRO_LEASE_PUBLIC_KEY"
            echo "::error::Alternatively add it to Environment 'production', because this job uses environment: production."
            echo "::error::Do not add the public key only to the Bot repository or only to the private source repository."
            exit 1
          fi
          echo "::notice::PRO_LEASE_PUBLIC_KEY is not configured; continuing because MODE is not testflight."
          exit 0
        fi

        # The generator emits a Base64-encoded 65-byte uncompressed P-256 public key.
        KEY="$KEY" python3 - <<'PY'
        import base64, os, sys
        value = os.environ["KEY"]
        try:
            raw = base64.b64decode(value, validate=True)
        except Exception as exc:
            print(f"::error::PRO_LEASE_PUBLIC_KEY is not valid Base64: {exc}")
            sys.exit(1)
        if len(raw) != 65 or raw[0] != 0x04:
            print(f"::error::PRO_LEASE_PUBLIC_KEY decoded shape is invalid: expected 65-byte uncompressed P-256 key, got {len(raw)} bytes.")
            sys.exit(1)
        print(f"PRO_LEASE_PUBLIC_KEY validation: PASS ({len(raw)} decoded bytes)")
        PY

        {
          echo "PRO_LEASE_PUBLIC_KEY<<EOF"
          echo "$KEY"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Validate TestFlight / Match secrets
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      run: |
        set -euo pipefail
        missing=()
        for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_APP_ID ASC_TEAM_ID MATCH_PASSWORD; do
          [[ -n "${!name:-}" ]] || missing+=("$name")
        done
        if (( ${#missing[@]} )); then
          echo "::error::Missing TestFlight / Match secrets: ${missing[*]}"
          exit 1
        fi

        [[ -n "${TARGET_REPO_PAT:-}" ]] || {
          echo "::error::Missing Repository secret: TARGET_REPO_PAT"
          echo "::error::TARGET_REPO_PAT must have access to readori/readori-certificates."
          exit 1
        }
        if ! [[ "$APP_VERSION" =~ ^1\.[0-9]+\.[0-9]$ ]]; then
          echo "::error::Resolved APP_VERSION must be 1.MINOR.PATCH. Got: $APP_VERSION"
          exit 1
        fi
        if [[ -z "${PRO_LEASE_PUBLIC_KEY:-}" ]]; then
          echo "::error::Missing PRO_LEASE_PUBLIC_KEY repository variable/secret. Generate it with bot/scripts/generate-pro-lease-key.mjs."
          exit 1
        fi

    # ==============================================
    # 7. ASC API KEY JSON (TestFlight only)
    # ==============================================
    - name: Setup ASC API key
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        printf '%s' "$ASC_PRIVATE_KEY" \
          > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

        python3 - << PYEOF
        import json, os
        key_path = os.path.expanduser(
            f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8"
        )
        json.dump({
            "key_id":    os.environ["ASC_KEY_ID"],
            "issuer_id": os.environ["ASC_ISSUER_ID"],
            "key":       open(key_path).read(),
            "in_house":  False
        }, open("/tmp/asc_api_key.json", "w"))
        print("ASC API key JSON ready")
        PYEOF

    # ==============================================
    # 8. AUTHENTICATE asc-cli
    # ==============================================
    - name: Authenticate asc-cli
      if: ${{ env.MODE == 'testflight' }}
      run: |
        asc auth login \
          --key-id           ${{ secrets.ASC_KEY_ID }} \
          --issuer-id        ${{ secrets.ASC_ISSUER_ID }} \
          --private-key-path ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

    # ==============================================
    # 9. CLEAN BUILD NUMBER (TestFlight only)
    # Manual override is allowed. Auto mode increments only inside APP_VERSION,
    # so a new public version normally starts at (1) instead of inheriting 100+.
    # ==============================================
    - name: Resolve TestFlight build number
      if: ${{ env.MODE == 'testflight' }}
      shell: bash
      env:
        MANUAL_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
      run: |
        set -euo pipefail
        MANUAL="${MANUAL_BUILD_NUMBER:-}"

        if [[ -n "$MANUAL" ]]; then
          [[ "$MANUAL" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::build_number must be a positive integer. Got: $MANUAL"
            exit 64
          }
          BUILD_NUMBER="$MANUAL"
          SOURCE="manual"
        else
          echo "Resolving next build for Marketing Version $APP_VERSION (iOS)..."
          BUILD_NUMBER=""

          # asc-cli >= 0.1.59 has a version/platform-aware next-number command.
          # Parse JSON or plain output defensively because the public CI may update asc-cli.
          set +e
          NEXT_RAW="$(asc builds next-number \
            --app-id '${{ secrets.ASC_APP_ID }}' \
            --version "$APP_VERSION" \
            --platform ios \
            --output json 2>/tmp/asc-next-number.err)"
          NEXT_RC=$?
          set -e

          if [[ $NEXT_RC -eq 0 && -n "$NEXT_RAW" ]]; then
            BUILD_NUMBER="$(NEXT_RAW="$NEXT_RAW" python3 - <<'PY'
        import json, os, re
        raw=os.environ.get('NEXT_RAW','').strip()
        if re.fullmatch(r'[1-9][0-9]*', raw):
            print(raw)
            raise SystemExit
        try:
            obj=json.loads(raw)
        except Exception:
            m=re.search(r'(?<![0-9])([1-9][0-9]*)(?![0-9])', raw)
            print(m.group(1) if m else '')
            raise SystemExit

        preferred={'nextBuildNumber','nextNumber','buildNumber','number','value'}
        def walk(v):
            if isinstance(v, dict):
                for k in preferred:
                    x=v.get(k)
                    if isinstance(x,(int,str)) and str(x).isdigit() and int(x)>0:
                        return str(x)
                for x in v.values():
                    r=walk(x)
                    if r:
                        return r
            elif isinstance(v, list):
                for x in v:
                    r=walk(x)
                    if r:
                        return r
            return ''
        print(walk(obj))
        PY
        )"
          fi

          # Compatibility fallback: list only this marketing version/platform and
          # calculate max(buildNumber)+1. Never fall back to global github.run_number.
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "next-number unavailable/unparseable; using filtered build list fallback."
            set +e
            LIST_RAW="$(asc builds list \
              --app-id '${{ secrets.ASC_APP_ID }}' \
              --version "$APP_VERSION" \
              --platform ios \
              --output json 2>/tmp/asc-build-list.err)"
            LIST_RC=$?
            set -e
            if [[ $LIST_RC -eq 0 ]]; then
              BUILD_NUMBER="$(LIST_RAW="$LIST_RAW" APP_VERSION="$APP_VERSION" python3 - <<'PY'
        import json, os
        try:
            data=json.loads(os.environ.get('LIST_RAW',''))
        except Exception:
            print('')
            raise SystemExit
        items=data.get('data',data) if isinstance(data,dict) else data
        nums=[]
        if isinstance(items,list):
            for item in items:
                if not isinstance(item,dict):
                    continue
                version=str(item.get('version',''))
                if version and version != os.environ['APP_VERSION']:
                    continue
                n=item.get('buildNumber')
                if n is None:
                    attrs=item.get('attributes') if isinstance(item.get('attributes'),dict) else {}
                    n=attrs.get('version')
                if str(n).isdigit():
                    nums.append(int(n))
        print((max(nums)+1) if nums else 1)
        PY
        )"
            fi
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unable to determine a safe build number for $APP_VERSION."
            echo "::error::Set workflow input build_number manually instead of falling back to a large/global CI number."
            [[ ! -s /tmp/asc-next-number.err ]] || cat /tmp/asc-next-number.err
            [[ ! -s /tmp/asc-build-list.err ]] || cat /tmp/asc-build-list.err
            exit 65
          fi
          SOURCE="App Store Connect per-version sequence"
        fi

        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        echo "TestFlight version: $APP_VERSION ($BUILD_NUMBER)"
        echo "Build number source: $SOURCE"

    # ==============================================
    # 10. SIGNING — Fastlane Match / readori-certificates
    # ==============================================
    - name: Install App Store signing assets with Fastlane Match
      if: ${{ env.MODE == 'testflight' }}
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      run: |
        set -euo pipefail

        APP_BUNDLE_ID="com.readori.app"
        MATCH_GIT_URL="https://github.com/readori/readori-certificates.git"
        KEYCHAIN_NAME="readori-ci.keychain-db"
        KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        PROFILE_PLIST="/tmp/readori-match-profile.plist"

        echo "READORI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

        # Single GitHub token policy: Match uses TARGET_REPO_PAT over HTTPS.
        [[ -n "${TARGET_REPO_PAT:-}" ]] || {
          echo "::error::TARGET_REPO_PAT is required for readori/readori-certificates."
          exit 1
        }

        MATCH_AUTH="$(printf '%s:%s' 'readori' "$TARGET_REPO_PAT" | base64 | tr -d '\n')"
        echo "::add-mask::$TARGET_REPO_PAT"
        echo "::add-mask::$MATCH_AUTH"

        git -c http.extraheader="AUTHORIZATION: basic $MATCH_AUTH" \
          ls-remote "$MATCH_GIT_URL" HEAD >/dev/null
        echo "Match repository access: PASS"

        # Keep this workflow independent from the private Readori repository.
        # Pin Fastlane so signing behavior is reproducible across GitHub runners.
        sudo gem install fastlane -v 2.238.0 --no-document
        fastlane --version

        # Dedicated ephemeral keychain; later manual codesign continues to use
        # READORI_KEYCHAIN_PATH exactly as before.
        rm -f "$KEYCHAIN_PATH"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
        security default-keychain -d user -s "$KEYCHAIN_PATH"

        # /tmp/asc_api_key.json is created earlier by "Setup ASC API key".
        [[ -s /tmp/asc_api_key.json ]] || {
          echo "::error::ASC API key JSON is missing before Match."
          exit 1
        }

        # CI is deliberately readonly: the certificates repository is the
        # signing source of truth. This installs the encrypted Distribution
        # certificate/private key and AppStore_com.readori.app.mobileprovision.
        MATCH_PASSWORD="$MATCH_PASSWORD" \
        fastlane match appstore \
          --app_identifier "$APP_BUNDLE_ID" \
          --git_url "$MATCH_GIT_URL" \
          --git_branch main \
          --git_basic_authorization "$MATCH_AUTH" \
          --team_id "$ASC_TEAM_ID" \
          --api_key_path /tmp/asc_api_key.json \
          --readonly true \
          --keychain_name "$KEYCHAIN_NAME" \
          --keychain_password "$KEYCHAIN_PASSWORD"

        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

        IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution\|iPhone Distribution' || true)"
        if [[ "$IDENTITY_COUNT" -lt 1 ]]; then
          echo "::error::Fastlane Match completed, but no Apple Distribution signing identity is available."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi

        # Match/Xcode may install profiles in either of these locations.
        # Resolve the exact com.readori.app profile, then normalize it to the
        # path expected by the existing manual-sign build step.
        SELECTED_PROFILE=""
        PROFILE_UUID=""
        PROFILE_NAME=""
        PROFILE_EXPIRATION=""

        while IFS= read -r profile; do
          [[ -f "$profile" ]] || continue
          if ! security cms -D -i "$profile" > "$PROFILE_PLIST" 2>/dev/null; then
            continue
          fi

          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"
          [[ "$APP_IDENTIFIER" == "${ASC_TEAM_ID}.${APP_BUNDLE_ID}" ]] || continue

          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST" 2>/dev/null || true)"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST" 2>/dev/null || true)"
          EXPIRATION="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST" 2>/dev/null || true)"
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)"

          [[ -n "$UUID" ]] || continue
          if [[ "$GET_TASK_ALLOW" == "true" ]]; then
            echo "::warning::Ignoring development profile for $APP_BUNDLE_ID: ${NAME:-unknown}"
            continue
          fi

          SELECTED_PROFILE="$profile"
          PROFILE_UUID="$UUID"
          PROFILE_NAME="$NAME"
          PROFILE_EXPIRATION="$EXPIRATION"
          break
        done < <(
          find \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            -type f -name '*.mobileprovision' -print 2>/dev/null || true
        )

        rm -f "$PROFILE_PLIST"

        if [[ -z "$SELECTED_PROFILE" || -z "$PROFILE_UUID" ]]; then
          echo "::error::Match did not install an App Store provisioning profile for ${ASC_TEAM_ID}.${APP_BUNDLE_ID}."
          echo "::error::Expected Match asset: profiles/appstore/AppStore_com.readori.app.mobileprovision"
          exit 1
        fi

        mkdir -p "$PROFILE_DIR"
        TARGET_PROFILE="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
        if [[ "$SELECTED_PROFILE" != "$TARGET_PROFILE" ]]; then
          cp "$SELECTED_PROFILE" "$TARGET_PROFILE"
        fi
        chmod 600 "$TARGET_PROFILE" || true

        # Verify the normalized profile one final time.
        security cms -D -i "$TARGET_PROFILE" > "$PROFILE_PLIST"
        FINAL_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" 2>/dev/null || true)"
        rm -f "$PROFILE_PLIST"
        [[ "$FINAL_APP_ID" == "${ASC_TEAM_ID}.${APP_BUNDLE_ID}" ]] || {
          echo "::error::Resolved provisioning profile belongs to unexpected App ID: ${FINAL_APP_ID:-missing}"
          exit 1
        }
        # embedded.mobileprovision is an authorization envelope. Apple commonly
        # represents Associated Domains permission there as ['*'] rather than the
        # concrete applinks host. Parse the plist structurally instead of grepping
        # PlistBuddy's human-formatted Array { ... } output. The exact Readori host
        # is checked separately in Readori.entitlements and after final codesign.
        export PROFILE_PLIST_FOR_ASSOCIATED_DOMAINS="$TARGET_PROFILE"
        PROFILE_ASSOCIATED_DOMAINS_JSON="$(python3 - <<'PY_PROFILE_AUTH'
        import json, os, plistlib, subprocess, tempfile
        profile = os.environ['PROFILE_PLIST_FOR_ASSOCIATED_DOMAINS']
        with tempfile.NamedTemporaryFile(suffix='.plist') as tmp:
            subprocess.run(['security', 'cms', '-D', '-i', profile], stdout=tmp, check=True)
            tmp.flush()
            with open(tmp.name, 'rb') as fh:
                payload = plistlib.load(fh)
        ent = payload.get('Entitlements', {}) or {}
        domains = ent.get('com.apple.developer.associated-domains', [])
        if isinstance(domains, str):
            domains = [domains]
        if not isinstance(domains, list):
            raise SystemExit('PROFILE_ASSOCIATED_DOMAINS_INVALID_TYPE')
        domains = [str(x).strip() for x in domains if str(x).strip()]
        if not domains:
            raise SystemExit('PROFILE_ASSOCIATED_DOMAINS_MISSING')
        allowed = {'*', 'applinks:*', 'applinks:api.readori.com'}
        if not any(item in allowed for item in domains):
            raise SystemExit('PROFILE_ASSOCIATED_DOMAINS_UNEXPECTED:' + json.dumps(domains, ensure_ascii=False))
        print(json.dumps(domains, ensure_ascii=False))
        PY_PROFILE_AUTH
        )" || {
          echo "::error::The App Store provisioning profile for ${APP_BUNDLE_ID} does not authorize Associated Domains."
          echo "::error::Expected profile authorization '*', 'applinks:*', or 'applinks:api.readori.com'."
          exit 1
        }
        echo "Associated Domains profile authorization: PASS $PROFILE_ASSOCIATED_DOMAINS_JSON"

        echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
        echo "Signing identity installed by Match: yes"
        echo "Provisioning profile: ${PROFILE_NAME:-unknown} ($PROFILE_UUID)"
        [[ -n "$PROFILE_EXPIRATION" ]] && echo "Profile expiration: $PROFILE_EXPIRATION"

    # ==============================================
    # 11a. BUILD — unsigned (sideload)
    # ==============================================
    - name: Build unsigned IPA
      if: ${{ env.MODE == 'unsigned' }}
      env:
        ALLOW_WRAPPED_APP: "1"
        APP_BUNDLE_IDENTIFIER: "com.readori.app"
        READORI_SOCIAL_WORKER_ENDPOINT: ${{ secrets.READORI_SOCIAL_WORKER_ENDPOINT }}
      run: |
        mkdir -p build
        cd core_project
        chmod +x scripts/build_unsigned_ipa.sh
        ./scripts/build_unsigned_ipa.sh "$SCHEME" "${GITHUB_WORKSPACE}/build"

    # ==============================================
    # 11b. BUILD — signed IPA for App Store (Match-installed identity/profile)
    # ==============================================
    - name: Build signed IPA (SPM manual sign)
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      run: |
        set -euo pipefail
        REPO_ROOT="$GITHUB_WORKSPACE/core_project"
        BUILD_ROOT="$GITHUB_WORKSPACE/build"
        DERIVED_DATA="$BUILD_ROOT/DerivedData"
        EXPORT_DIR="$BUILD_ROOT/export"
        INFO_PLIST="$REPO_ROOT/Readori/Supporting/Info.plist"
        ENTITLEMENTS="$REPO_ROOT/Readori/Supporting/Readori.entitlements"
        LAUNCH_STORYBOARD="$REPO_ROOT/Readori/Supporting/LaunchScreen.storyboard"
        ICONSET_DIR="$REPO_ROOT/Readori/Resources/Assets.xcassets/AppIcon.appiconset"
        AUTH_KEY="/tmp/asc_keys/AuthKey_${ASC_KEY_ID}.p8"

        mkdir -p "$EXPORT_DIR"
        rm -rf "$DERIVED_DATA"

        # Universal Link source contract: the app entitlement, provisioning profile,
        # and final manually-signed entitlement must all agree.
        [[ -f "$ENTITLEMENTS" ]] || { echo "::error::Missing Readori.entitlements"; exit 1; }
        grep -q 'com.apple.developer.associated-domains' "$ENTITLEMENTS" || {
          echo "::error::Source entitlements do not declare Associated Domains."
          exit 1
        }
        grep -q 'applinks:api.readori.com' "$ENTITLEMENTS" || {
          echo "::error::Source entitlements are missing applinks:api.readori.com."
          exit 1
        }
        echo "Source Universal Link entitlement: PASS"

        # ── Pre-build: Strip alpha from AppIcon PNGs (Apple requires no transparency) ──
        if [[ -d "$ICONSET_DIR" ]]; then
          echo "Stripping alpha from AppIcon PNGs..."
          # 🐛 修复：之前这里检查的文件名是 icon-1024.png，但 generate_icons.swift
          MARKETING_ICON="$ICONSET_DIR/AppIcon-1024x1024@1x-ios-marketing.png"
          if [[ ! -f "$MARKETING_ICON" ]]; then
            echo "$(basename "$MARKETING_ICON") missing, generating from largest available icon..."
            # Run generate_icons.swift if available
            if [[ -f "$REPO_ROOT/scripts/generate_icons.swift" ]]; then
              swift "$REPO_ROOT/scripts/generate_icons.swift" "$REPO_ROOT" 2>&1 || true
            fi
            # Fallback: scale up from the largest icon still present if generation failed
            if [[ ! -f "$MARKETING_ICON" ]]; then
              LARGEST=$(ls -S "$ICONSET_DIR"/*.png 2>/dev/null | head -1)
              if [[ -n "$LARGEST" ]]; then
                sips -z 1024 1024 "$LARGEST" --out "$MARKETING_ICON" 2>/dev/null || true
                echo "Generated $(basename "$MARKETING_ICON") from $LARGEST"
              fi
            fi
          fi
          for png in "$ICONSET_DIR"/*.png; do
            [[ -f "$png" ]] && sips -s format png -s formatOptions 100 --setProperty hasAlpha false "$png" --out "$png" 2>/dev/null || true
          done
          echo "Alpha stripped from all AppIcon PNGs"
        fi

        # ── Step 1: Build unsigned (with INFOPLIST_FILE for proper bundle) ──
        echo "=== Step 1: Build unsigned ==="
        cd "$REPO_ROOT"
        # 🐛 Bug 修复（"iPad 上装了最新版本，App 还是以 iPhone 兼容模式跑在小窗口里"）：
        xcodebuild build \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$DERIVED_DATA" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -onlyUsePackageVersionsFromResolvedFile \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          TARGETED_DEVICE_FAMILY="1,2" \
          GENERATE_INFOPLIST_FILE=NO \
          INFOPLIST_FILE="$INFO_PLIST" \
          INFOPLIST_KEY_UILaunchStoryboardName=LaunchScreen \
          CURRENT_PROJECT_VERSION="${{ env.BUILD_NUMBER }}" \
          MARKETING_VERSION="${{ env.APP_VERSION }}" \
          READORI_SOCIAL_WORKER_ENDPOINT="$READORI_SOCIAL_WORKER_ENDPOINT" \
          PRO_LEASE_PUBLIC_KEY="$PRO_LEASE_PUBLIC_KEY" \
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
          ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=YES \
          ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ENABLE_TESTABILITY=NO \
          2>&1 | tee /tmp/build.log

        echo "** BUILD SUCCEEDED **"

        # ── Step 2: Find or wrap .app bundle ──
        echo "=== Step 2: Locate .app bundle ==="
        PRODUCT_DIR="$DERIVED_DATA/Build/Products/Release-iphoneos"
        APP_PATH=""

        # Try standard product directory first
        if [[ -d "$PRODUCT_DIR/${SCHEME}.app" ]]; then
          APP_PATH="$PRODUCT_DIR/${SCHEME}.app"
        else
          # Search DerivedData for .app
          APP_PATH=$(find "$DERIVED_DATA" -type d -name '*.app' \
            ! -path '*/Index.noindex/*' ! -path '*/SourcePackages/*' \
            | while read -r app; do
                if [[ -f "$app/$SCHEME" ]]; then echo "$app"; break; fi
              done) || true
        fi

        if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
          echo "No .app bundle found. Wrapping bare executable into .app..."
          APP_BINARY="$PRODUCT_DIR/$SCHEME"
          if [[ ! -f "$APP_BINARY" ]]; then
            APP_BINARY=$(find "$PRODUCT_DIR" -name "$SCHEME" -type f | head -1)
          fi
          if [[ ! -f "$APP_BINARY" ]]; then
            echo "ERROR: No executable found in $PRODUCT_DIR"
            ls -la "$PRODUCT_DIR" || true
            exit 1
          fi

          APP_PATH="$BUILD_ROOT/${SCHEME}.app"
          rm -rf "$APP_PATH"
          mkdir -p "$APP_PATH"

          cp "$APP_BINARY" "$APP_PATH/$SCHEME"
          chmod +x "$APP_PATH/$SCHEME"
          cp "$INFO_PLIST" "$APP_PATH/Info.plist"

          # Patch Info.plist for app bundle
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $SCHEME" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.readori.app" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.BUILD_NUMBER }}" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ env.APP_VERSION }}" "$APP_PATH/Info.plist" || true
          if [[ -n "$READORI_SOCIAL_WORKER_ENDPOINT" ]]; then
            /usr/bin/plutil -replace READORI_SOCIAL_WORKER_ENDPOINT -string "$READORI_SOCIAL_WORKER_ENDPOINT" "$APP_PATH/Info.plist" || true
          fi
          if [[ -n "${PRO_LEASE_PUBLIC_KEY:-}" ]]; then
            /usr/bin/plutil -replace PRO_LEASE_PUBLIC_KEY -string "$PRO_LEASE_PUBLIC_KEY" "$APP_PATH/Info.plist" || true
          fi

          # UIDeviceFamily
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"

          # UILaunchScreen dict
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$APP_PATH/Info.plist" || true

          # Compile LaunchScreen storyboard
          if [[ -f "$LAUNCH_STORYBOARD" ]]; then
            xcrun ibtool --compile "$APP_PATH/LaunchScreen.storyboardc" "$LAUNCH_STORYBOARD" \
              --target-device iphone --minimum-deployment-target 16.0 || true
          fi

          # Copy app icons
          if [[ -d "$ICONSET_DIR" ]]; then
            [[ -f "$ICONSET_DIR/AppIcon-60x60@2x-iphone.png" ]] && cp "$ICONSET_DIR/AppIcon-60x60@2x-iphone.png" "$APP_PATH/AppIcon60x60@2x.png"
            [[ -f "$ICONSET_DIR/AppIcon-60x60@3x-iphone.png" ]] && cp "$ICONSET_DIR/AppIcon-60x60@3x-iphone.png" "$APP_PATH/AppIcon60x60@3x.png"
          fi

          # Copy compiled Assets.car from build products (contains AppIcon + other assets)
          ASSETS_CAR=$(find "$DERIVED_DATA" -name "Assets.car" ! -path "*/SourcePackages/*" | head -1)
          if [[ -n "$ASSETS_CAR" ]]; then
            cp "$ASSETS_CAR" "$APP_PATH/Assets.car"
            echo "Copied Assets.car from: $ASSETS_CAR"
          else
            echo "No Assets.car found. Compiling asset catalog manually..."
            ASSETS_XCASSETS="$REPO_ROOT/Readori/Resources/Assets.xcassets"
            if [[ -d "$ASSETS_XCASSETS" ]]; then
              xcrun actool "$ASSETS_XCASSETS" \
                --compile "$APP_PATH" \
                --platform iphoneos \
                --minimum-deployment-target 16.0 \
                --app-icon AppIcon \
                --output-partial-info-plist /tmp/assetcatalog_partial.plist \
                2>&1 || echo "WARNING: actool failed"
            fi
          fi

          # Copy SPM resources (lproj folders, Fonts, etc.)
          for RESOURCE_DIR in "$PRODUCT_DIR"/${SCHEME}_${SCHEME}.bundle "$PRODUCT_DIR"/Readori_Readori.bundle; do
            if [[ -d "$RESOURCE_DIR" ]]; then
              echo "Copying SPM resource bundle: $RESOURCE_DIR"
              cp -R "$RESOURCE_DIR" "$APP_PATH/" || true
              # Hoist .lproj directories to app root (iOS requires them at bundle root for localization)
              # Skip old_* dirs — invalid locale names cause App Store warning 90176
              for LPROJ in "$RESOURCE_DIR"/*.lproj; do
                if [[ -d "$LPROJ" ]]; then
                  LPROJ_NAME=$(basename "$LPROJ")
                  if [[ "$LPROJ_NAME" == old_* ]]; then
                    echo "  Skipping $LPROJ_NAME (invalid locale name)"
                    continue
                  fi
                  echo "  Hoisting $LPROJ_NAME to app root"
                  cp -R "$LPROJ" "$APP_PATH/$LPROJ_NAME"
                fi
              done
              # Also hoist Fonts directory if present
              if [[ -d "$RESOURCE_DIR/Fonts" ]]; then
                echo "  Hoisting Fonts to app root"
                cp -R "$RESOURCE_DIR/Fonts" "$APP_PATH/Fonts"
              fi
            fi
          done
          # Verify lproj presence at app root
          echo "=== Localization check ==="
          ls -d "$APP_PATH"/*.lproj 2>/dev/null || echo "WARNING: No .lproj directories at app root!"

          # Remove old_* lproj dirs (invalid locale names cause warning 90176)
          find "$APP_PATH" -type d -name 'old_*' -exec rm -rf {} + 2>/dev/null || true

          echo "Wrapped .app at: $APP_PATH"

        # Always ensure required plist fields (whether found or wrapped)
        XCODE_OUTPUT="$(xcodebuild -version 2>/dev/null || true)"
        XCODE_FIRST_LINE="${XCODE_OUTPUT%%$'\n'*}"
        XCODE_LAST_LINE="${XCODE_OUTPUT##*$'\n'}"
        XCODE_VER="${XCODE_FIRST_LINE#Xcode }"
        XCODE_BUILD="${XCODE_LAST_LINE#Build version }"
        SDK_VER=$(xcrun --show-sdk-version --sdk iphoneos)
        SDK_BUILD=$(xcrun --show-sdk-build-version --sdk iphoneos)
        SDK_NAME="iphoneos${SDK_VER}"
        OS_BUILD=$(sw_vers -buildVersion)

        echo "Injecting DT* fields:"
        echo "  Xcode=$XCODE_VER  XcodeBuild=$XCODE_BUILD"
        echo "  SDK=$SDK_NAME  SDKBuild=$SDK_BUILD"
        echo "  macOS Build=$OS_BUILD"
        PB="/usr/libexec/PlistBuddy"
        PLIST="$APP_PATH/Info.plist"

        # DT* build metadata (required by App Store validation)
        $PB -c "Delete :DTPlatformName" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformName string iphoneos" "$PLIST"
        $PB -c "Delete :DTPlatformVersion" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformVersion string $SDK_VER" "$PLIST"
        $PB -c "Delete :DTSDKName" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTSDKName string $SDK_NAME" "$PLIST"
        $PB -c "Delete :DTSDKBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTSDKBuild string $SDK_BUILD" "$PLIST"
        $PB -c "Delete :DTXcode" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTXcode string $(echo $XCODE_VER | tr -d '.')" "$PLIST"
        $PB -c "Delete :DTXcodeBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTXcodeBuild string $XCODE_BUILD" "$PLIST"
        $PB -c "Delete :DTCompiler" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTCompiler string com.apple.compilers.llvm.clang.1_0" "$PLIST"
        $PB -c "Delete :DTPlatformBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :DTPlatformBuild string $SDK_BUILD" "$PLIST"
        $PB -c "Delete :BuildMachineOSBuild" "$PLIST" 2>/dev/null || true
        $PB -c "Add :BuildMachineOSBuild string $(sw_vers -buildVersion)" "$PLIST"
        $PB -c "Delete :MinimumOSVersion" "$PLIST" 2>/dev/null || true
        $PB -c "Add :MinimumOSVersion string 16.0" "$PLIST"

        # UIRequiredDeviceCapabilities (required for App Store)
        $PB -c "Delete :UIRequiredDeviceCapabilities" "$PLIST" 2>/dev/null || true
        $PB -c "Add :UIRequiredDeviceCapabilities array" "$PLIST"
        $PB -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$PLIST"

        # CFBundleSupportedPlatforms (required: single-element array)
        $PB -c "Delete :CFBundleSupportedPlatforms" "$PLIST" 2>/dev/null || true
        $PB -c "Add :CFBundleSupportedPlatforms array" "$PLIST"
        $PB -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" "$PLIST"

        # LSSupportsOpeningDocumentsInPlace (required when CFBundleDocumentTypes exists)
        $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
        $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"

        fi

        echo "Using .app: $APP_PATH"
        echo "Contents:"
        ls -la "$APP_PATH/" | head -20

        # ── Step 3: Embed provisioning profile ──
        echo "=== Step 3: Embed provisioning profile ==="
        PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
        [[ -f "$PROFILE_PATH" ]] || { echo "ERROR: Provisioning profile not found: $PROFILE_PATH"; exit 1; }
        if [[ -n "$PROFILE_PATH" ]]; then
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"
          echo "Embedded: $PROFILE_PATH"
        else
          echo "WARNING: No provisioning profile found to embed"
        fi

        # ── Step 4: Code sign ──
        echo "=== Step 4: Code signing ==="

        # Find the signing identity.
        # IMPORTANT: do not probe "iPhone Distribution" first with grep under
        # `set -euo pipefail`; modern Match assets are normally named
        # "Apple Distribution", and a no-match grep would terminate the step
        # before the fallback could run.
        echo "Available code-signing identities:"
        security find-identity -v -p codesigning "$READORI_KEYCHAIN_PATH" || true

        SIGN_ID="$(
          security find-identity -v -p codesigning "$READORI_KEYCHAIN_PATH" 2>/dev/null |
            awk -F'"' '
              /Apple Distribution|iPhone Distribution/ && first == "" { first = $2 }
              END { print first }
            '
        )"

        if [[ -z "$SIGN_ID" ]]; then
          echo "::error::No Apple Distribution signing identity found in Match keychain: $READORI_KEYCHAIN_PATH"
          exit 1
        fi
        echo "Signing identity: $SIGN_ID"

        # Build entitlements for codesign — must include application-identifier
        # and match the provisioning profile capabilities
        SIGN_ENTITLEMENTS="/tmp/sign_entitlements.plist"
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict/>\n</plist>\n' > "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :application-identifier string ${ASC_TEAM_ID}.com.readori.app" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${ASC_TEAM_ID}" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :get-task-allow bool false" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :keychain-access-groups array" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :keychain-access-groups:0 string ${ASC_TEAM_ID}.com.readori.app" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" "$SIGN_ENTITLEMENTS"
        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:0 string applinks:api.readori.com" "$SIGN_ENTITLEMENTS"

        # Check if profile supports iCloud — if so, add iCloud entitlements
        if [[ -n "$PROFILE_PATH" ]]; then
          PROF_ENTS=$(security cms -D -i "$APP_PATH/embedded.mobileprovision" 2>/dev/null || true)
          if echo "$PROF_ENTS" | grep -q "icloud-services"; then
            echo "Profile supports iCloud, adding iCloud entitlements"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers array" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-container-identifiers:0 string iCloud.com.readori.app" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services array" "$SIGN_ENTITLEMENTS"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.icloud-services:0 string CloudDocuments" "$SIGN_ENTITLEMENTS"
          else
            echo "Profile does NOT support iCloud, skipping iCloud entitlements"
          fi
        fi

        echo "=== Entitlements for signing ==="
        cat "$SIGN_ENTITLEMENTS"

        # Sign frameworks/dylibs first (if any)
        find "$APP_PATH" -name "*.framework" -o -name "*.dylib" | while read -r lib; do
          codesign -f -s "$SIGN_ID" --timestamp=none "$lib" 2>&1 || true
        done

        # Sign the app bundle
        codesign -f -s "$SIGN_ID" --entitlements "$SIGN_ENTITLEMENTS" --timestamp=none "$APP_PATH"
        echo "Code signing succeeded"

        # Verify, including the Universal Link entitlement that must survive the
        # manual-sign packaging path used by this workflow.
        codesign -dvv "$APP_PATH" 2>&1
        codesign --verify --strict "$APP_PATH" 2>&1 || echo "WARNING: strict verification failed"
        SIGNED_ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true)"
        if ! grep -q 'applinks:api.readori.com' <<<"$SIGNED_ENTITLEMENTS"; then
          echo "::error::Final signed app is missing applinks:api.readori.com."
          exit 1
        fi
        echo "Final signed Associated Domains entitlement: PASS"

        # ── Step 5: Package IPA ──
        echo "=== Step 5: Package IPA ==="
        PAYLOAD_DIR="$BUILD_ROOT/Payload"
        rm -rf "$PAYLOAD_DIR"
        mkdir -p "$PAYLOAD_DIR"
        cp -R "$APP_PATH" "$PAYLOAD_DIR/"

        IPA_PATH="$EXPORT_DIR/${SCHEME}.ipa"
        cd "$BUILD_ROOT"
        zip -r -q "$IPA_PATH" Payload
        echo "IPA=$IPA_PATH" >> $GITHUB_ENV
        echo "Built: $IPA_PATH ($(du -h "$IPA_PATH" | cut -f1))"

    # ==============================================
    # 12. VERSION TAG
    # ==============================================
    - name: Tag build version
      if: ${{ env.MODE != 'screenshots' }}
      run: |
        SHORT_SHA=$(git -C core_project rev-parse --short HEAD)
        BN="${BUILD_NUMBER:-1}"
        echo "BUILD_TAG=${APP_VERSION:-1.0.0}($BN)-${SHORT_SHA}" >> $GITHUB_ENV

    # ==============================================
    # 12.5 VERIFY APP ICON in .app bundle
    # ==============================================
    - name: Verify App Icon in bundle
      if: ${{ env.MODE == 'testflight' }}
      continue-on-error: true
      run: |
        APP_BUNDLE=$(find build -maxdepth 3 -name "*.app" -type d | head -1)
        if [[ -z "$APP_BUNDLE" ]]; then
          echo "WARNING: No .app bundle found for icon verification"
          exit 0
        fi
        echo "=== App Icon Verification ==="
        echo "Bundle: $APP_BUNDLE"
        # Check for icon files at app root
        ICON_COUNT=$(find "$APP_BUNDLE" -maxdepth 1 -name "AppIcon*" -o -name "icon-*" | wc -l)
        echo "Icon files at root: $ICON_COUNT"
        find "$APP_BUNDLE" -maxdepth 1 -name "AppIcon*" -o -name "icon-*" | sort
        # Check for Assets.car (compiled asset catalog with AppIcon)
        if [[ -f "$APP_BUNDLE/Assets.car" ]]; then
          echo "Assets.car: PRESENT ($(stat -f%z "$APP_BUNDLE/Assets.car" 2>/dev/null || echo 'size unknown') bytes)"
          # List AppIcon entries in asset catalog
          xcrun --sdk iphoneos assetutil --info "$APP_BUNDLE/Assets.car" 2>/dev/null | \
            python3 -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            icons = [e for e in data if 'AppIcon' in str(e.get('Name','')) or 'icon' in str(e.get('Name','')).lower()]
            if icons:
                print(f'AppIcon entries in Assets.car: {len(icons)}')
                for i in icons[:5]:
                    print(f'  {i.get(\"Name\",\"?\")}  {i.get(\"RenditionName\",\"\")}  {i.get(\"SizeOnDisk\",\"\")}')
            else:
                print('WARNING: No AppIcon entries found in Assets.car!')
        except: print('Could not parse Assets.car info')
        " || echo "assetutil not available"
        else
          echo "WARNING: Assets.car NOT FOUND in app bundle!"
        fi

    # ==============================================
    # 13. UPLOAD TO TESTFLIGHT
    # ==============================================
    - name: Upload to TestFlight
      if: ${{ env.MODE == 'testflight' }}
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      run: |
        IPA=$(find build -name "*.ipa" | head -1)
        echo "Uploading: $IPA  |  tag: ${BUILD_TAG:-unknown}"
        AUTH_KEY="/tmp/asc_keys/AuthKey_${ASC_KEY_ID}.p8"

        # 🐛 Bug修复：Xcode 26 起 `altool --upload-app` 已被标记为 [DEPRECATED]，
        xcrun altool --upload-package "$IPA" \
          --type ios \
          --apple-id "$ASC_APP_ID" \
          --bundle-id "com.readori.app" \
          --bundle-version "${BUILD_NUMBER}" \
          --bundle-short-version-string "${APP_VERSION}" \
          --apiKey "$ASC_KEY_ID" \
          --apiIssuer "$ASC_ISSUER_ID" \
          2>&1 || {
          echo "altool --upload-package failed, trying legacy --upload-app as last resort..."
          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 || {
            echo "Both upload methods failed. Please upload $IPA manually via Transporter,"
            echo "or verify ASC_APP_ID/ASC_KEY_ID/ASC_ISSUER_ID secrets are correct."
            exit 1
          }
        }

    # ==============================================
    # 14. AUTO-CAPTURE SIMULATOR SCREENSHOTS
    # ==============================================
    - name: Auto-capture simulator screenshots
      if: ${{ env.MODE == 'screenshots' }}
      continue-on-error: true
      timeout-minutes: 35
      shell: bash
      env:
        PRO_LEASE_PUBLIC_KEY: ${{ secrets.PRO_LEASE_PUBLIC_KEY }}
      run: |
        # Best-effort capture step, but every potentially blocking Simulator command
        # has its own timeout. The following validation step remains the hard gate.
        set +e

        SCREENSHOTS_DIR="$GITHUB_WORKSPACE/screenshots_captured"
        TARGET_DIR="$GITHUB_WORKSPACE/core_project/screenshots"
        BUNDLE_ID="com.readori.app"
        BUILD_DIR="/tmp/sim_build"
        BUILD_LOG="/tmp/sim_build.log"
        LOCALES="en-US"

        rm -rf "$SCREENSHOTS_DIR"

        # Skip auto-capture if screenshots already exist.
        if [[ -d "$TARGET_DIR" ]] && [[ -n "$(ls -A "$TARGET_DIR" 2>/dev/null)" ]]; then
          echo "Pre-staged screenshots found at $TARGET_DIR — skipping auto-capture"
          exit 0
        fi

        # ------------------------------------------------------------------
        # macOS runner-safe timeout helper.
        # Do not depend on GNU `timeout`/`gtimeout`; GitHub macOS runners do
        # not guarantee coreutils. Python kills the whole process group.
        # ------------------------------------------------------------------
        run_with_timeout() {
          local seconds="$1"
          shift
          python3 - "$seconds" "$@" <<'PY_TIMEOUT'
        import os
        import signal
        import subprocess
        import sys
        import time

        seconds = float(sys.argv[1])
        command = sys.argv[2:]
        if not command:
            print("::error::run_with_timeout received no command", flush=True)
            raise SystemExit(64)

        proc = subprocess.Popen(command, start_new_session=True)
        try:
            raise SystemExit(proc.wait(timeout=seconds))
        except subprocess.TimeoutExpired:
            rendered = " ".join(command)
            print(f"::error::Command timed out after {seconds:g}s: {rendered}", flush=True)
            try:
                os.killpg(proc.pid, signal.SIGTERM)
            except ProcessLookupError:
                pass
            try:
                proc.wait(timeout=5)
            except subprocess.TimeoutExpired:
                try:
                    os.killpg(proc.pid, signal.SIGKILL)
                except ProcessLookupError:
                    pass
                proc.wait()
            raise SystemExit(124)
        PY_TIMEOUT
        }

        # ------------------------------------------------------------------
        # Select a simulator from the runtime that matches the currently
        # selected Xcode's iPhoneSimulator SDK first. This avoids accidentally
        # choosing an identically named iPad from an older installed runtime.
        # Output: udid|name
        # ------------------------------------------------------------------
        pick_simulator() {
          python3 - "$@" <<'PY_PICK_SIM'
        import json
        import re
        import subprocess
        import sys

        patterns = sys.argv[1:]

        sdk = subprocess.run(
            ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"],
            capture_output=True,
            text=True,
            check=True,
        ).stdout.strip()

        raw = subprocess.run(
            ["xcrun", "simctl", "list", "devices", "available", "--json"],
            capture_output=True,
            text=True,
            check=True,
        ).stdout
        data = json.loads(raw)
        devices_by_runtime = data.get("devices", {})

        def version_tuple(value: str):
            nums = re.findall(r"\d+", value)
            return tuple(int(x) for x in nums[:3])

        sdk_version = version_tuple(sdk)
        ios_runtime_ids = [
            rid for rid in devices_by_runtime
            if "SimRuntime.iOS-" in rid
        ]

        exact = [
            rid for rid in ios_runtime_ids
            if version_tuple(rid.split("SimRuntime.iOS-", 1)[1]) == sdk_version
        ]
        remaining = [rid for rid in ios_runtime_ids if rid not in exact]
        remaining.sort(
            key=lambda rid: version_tuple(rid.split("SimRuntime.iOS-", 1)[1]),
            reverse=True,
        )
        ordered_runtimes = exact + remaining

        for runtime_id in ordered_runtimes:
            devices = [
                d for d in devices_by_runtime.get(runtime_id, [])
                if d.get("isAvailable", True)
            ]
            for pattern in patterns:
                for device in devices:
                    if pattern in device.get("name", ""):
                        print(f"{device['udid']}|{device['name']}", end="")
                        raise SystemExit(0)
        PY_PICK_SIM
        }

        simulator_state() {
          local udid="$1"
          xcrun simctl list devices 2>/dev/null | grep -F "$udid" | head -1 || true
        }

        # ------------------------------------------------------------------
        # Boot + wait until CoreSimulator reports the device fully ready.
        # Fixed sleep is intentionally NOT used here.
        # One controlled reboot is allowed if bootstatus hangs/fails.
        # ------------------------------------------------------------------
        ensure_simulator_ready() {
          local udid="$1"
          local label="$2"

          echo "[$label] boot requested: $udid"
          run_with_timeout 15 xcrun simctl boot "$udid" || true

          echo "[$label] waiting for bootstatus..."
          if run_with_timeout 90 xcrun simctl bootstatus "$udid" -b; then
            echo "[$label] simulator ready: $(simulator_state "$udid")"
            return 0
          fi

          echo "::warning::[$label] first bootstatus failed; rebooting simulator once"
          run_with_timeout 15 xcrun simctl shutdown "$udid" || true
          sleep 2
          run_with_timeout 15 xcrun simctl boot "$udid" || true

          if run_with_timeout 90 xcrun simctl bootstatus "$udid" -b; then
            echo "[$label] simulator ready after reboot: $(simulator_state "$udid")"
            return 0
          fi

          echo "::error::[$label] simulator failed to become ready"
          simulator_state "$udid"
          return 1
        }

        install_app_with_retry() {
          local udid="$1"
          local label="$2"

          echo "[$label] removing stale app installation (if any)..."
          run_with_timeout 15 xcrun simctl uninstall "$udid" "$BUNDLE_ID" || true

          echo "[$label] installing app..."
          if run_with_timeout 45 xcrun simctl install "$udid" "$APP_PATH"; then
            echo "[$label] app installed"
            return 0
          fi

          echo "::warning::[$label] install failed/timed out; rebooting and retrying once"
          run_with_timeout 15 xcrun simctl shutdown "$udid" || true
          sleep 2
          ensure_simulator_ready "$udid" "$label install-retry" || return 1
          run_with_timeout 15 xcrun simctl uninstall "$udid" "$BUNDLE_ID" || true

          if run_with_timeout 45 xcrun simctl install "$udid" "$APP_PATH"; then
            echo "[$label] app installed after retry"
            return 0
          fi

          echo "::error::[$label] app install failed after retry"
          return 1
        }

        IPHONE_SIM="$(pick_simulator \
          "iPhone 17 Pro Max" \
          "iPhone 16 Pro Max" \
          "iPhone 15 Pro Max" \
          "iPhone 14 Pro Max" \
          "iPhone 13 Pro Max")"

        IPAD_SIM="$(pick_simulator \
          "iPad Pro 13-inch (M5)" \
          "iPad Pro 13-inch (M4)" \
          "iPad Pro (12.9-inch) (6th generation)" \
          "iPad Pro (12.9-inch) (5th generation)")"

        if [[ -z "$IPHONE_SIM" && -z "$IPAD_SIM" ]]; then
          echo "::error::No suitable iPhone or iPad simulator available"
          xcrun simctl list devices available || true
          exit 1
        fi

        [[ -n "$IPHONE_SIM" ]] && echo "iPhone simulator: $IPHONE_SIM" || echo "::warning::No iPhone simulator found"
        [[ -n "$IPAD_SIM"   ]] && echo "iPad simulator:   $IPAD_SIM"   || echo "::warning::No iPad simulator found"

        # ------------------------------------------------------------------
        # Build exactly once. The same Simulator .app can be installed on the
        # chosen iPhone and iPad for this Xcode/SDK.
        # ------------------------------------------------------------------
        BOOT_UDID="${IPHONE_SIM%%|*}"
        BOOT_LABEL="iPhone build simulator"
        if [[ -z "$BOOT_UDID" || "$BOOT_UDID" == "$IPHONE_SIM" && -z "$IPHONE_SIM" ]]; then
          BOOT_UDID="${IPAD_SIM%%|*}"
          BOOT_LABEL="iPad build simulator"
        fi

        if ! ensure_simulator_ready "$BOOT_UDID" "$BOOT_LABEL"; then
          echo "::error::Unable to prepare a simulator for the screenshot build"
          exit 1
        fi

        cd "$GITHUB_WORKSPACE/core_project"
        INFOPLIST_ABS="$GITHUB_WORKSPACE/core_project/Readori/Supporting/Info.plist"

        # Never reuse a partially written/stale simulator binary from a prior
        # command in the same runner.
        rm -rf "$BUILD_DIR"
        rm -f "$BUILD_LOG"
        mkdir -p "$BUILD_DIR"

        echo "[build] compiling simulator app (hard timeout: 20 minutes)..."
        run_with_timeout 1200 xcodebuild build \
          -scheme                    "$SCHEME" \
          -sdk                       iphonesimulator \
          -destination               "platform=iOS Simulator,id=$BOOT_UDID" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          -onlyUsePackageVersionsFromResolvedFile \
          GENERATE_INFOPLIST_FILE=NO \
          INFOPLIST_FILE="$INFOPLIST_ABS" \
          READORI_SOCIAL_WORKER_ENDPOINT="$READORI_SOCIAL_WORKER_ENDPOINT" \
          PRO_LEASE_PUBLIC_KEY="${PRO_LEASE_PUBLIC_KEY:-}" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          ENABLE_TESTABILITY=NO \
          CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
          > "$BUILD_LOG" 2>&1
        BUILD_RC=$?

        grep -E "error:|Build succeeded|BUILD SUCCEEDED|BUILD FAILED" "$BUILD_LOG" || true

        if [[ $BUILD_RC -ne 0 ]]; then
          echo "::error::Simulator build failed/timed out (exit=$BUILD_RC)"
          echo "---- last 150 lines of $BUILD_LOG ----"
          tail -150 "$BUILD_LOG" || true
          exit 1
        fi

        # SwiftPM executable products are emitted as a bare executable in this
        # project; wrap it into a simulator .app and preserve resources.
        APP_PATH="$BUILD_DIR/${SCHEME}.app"
        APP_BINARY="$BUILD_DIR/$SCHEME"
        rm -rf "$APP_PATH"

        if [[ ! -f "$APP_BINARY" ]]; then
          echo "::error::No simulator executable found at $APP_BINARY"
          echo "---- last 150 lines of $BUILD_LOG ----"
          tail -150 "$BUILD_LOG" || true
          exit 1
        fi

        mkdir -p "$APP_PATH"
        cp "$APP_BINARY" "$APP_PATH/$SCHEME"
        chmod +x "$APP_PATH/$SCHEME"
        cp "$INFOPLIST_ABS" "$APP_PATH/Info.plist"

        /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $SCHEME" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-1}" "$APP_PATH/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION:-1.0.0}" "$APP_PATH/Info.plist" || true

        if [[ -n "${READORI_SOCIAL_WORKER_ENDPOINT:-}" ]]; then
          /usr/bin/plutil -replace READORI_SOCIAL_WORKER_ENDPOINT -string "$READORI_SOCIAL_WORKER_ENDPOINT" "$APP_PATH/Info.plist" || true
        fi
        if [[ -n "${PRO_LEASE_PUBLIC_KEY:-}" ]]; then
          /usr/bin/plutil -replace PRO_LEASE_PUBLIC_KEY -string "$PRO_LEASE_PUBLIC_KEY" "$APP_PATH/Info.plist" || true
        fi

        /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$APP_PATH/Info.plist" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$APP_PATH/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:1 integer 2" "$APP_PATH/Info.plist"

        ASSETS_CAR="$(find "$BUILD_DIR" -maxdepth 1 -name 'Assets.car' | head -1)"
        [[ -n "$ASSETS_CAR" ]] && cp "$ASSETS_CAR" "$APP_PATH/Assets.car"

        for RESOURCE_DIR in "$BUILD_DIR/${SCHEME}_${SCHEME}.bundle" "$BUILD_DIR/Readori_Readori.bundle"; do
          if [[ -d "$RESOURCE_DIR" ]]; then
            cp -R "$RESOURCE_DIR" "$APP_PATH/" || true
            for LPROJ in "$RESOURCE_DIR"/*.lproj; do
              if [[ -d "$LPROJ" ]]; then
                LPROJ_NAME="$(basename "$LPROJ")"
                [[ "$LPROJ_NAME" == old_* ]] && continue
                cp -R "$LPROJ" "$APP_PATH/$LPROJ_NAME"
              fi
            done
            if [[ -d "$RESOURCE_DIR/Fonts" ]]; then
              cp -R "$RESOURCE_DIR/Fonts" "$APP_PATH/Fonts"
            fi
          fi
        done

        echo "Wrapped simulator .app at: $APP_PATH"
        ls -d "$APP_PATH"/*.lproj 2>/dev/null || echo "::warning::No .lproj directories at app root — localized screenshots will not work"

        # Start iPad early while iPhone capture is running. We intentionally do
        # not block here; capture_for_device will use bootstatus before install.
        if [[ -n "$IPHONE_SIM" && -n "$IPAD_SIM" ]]; then
          IPAD_UDID="${IPAD_SIM%%|*}"
          echo "[iPad prewarm] requesting boot in parallel with upcoming iPhone capture..."
          run_with_timeout 15 xcrun simctl boot "$IPAD_UDID" || true
        fi

        capture_for_device() {
          local udid="$1"
          local display_name="$2"
          local display_type="$3"
          local failures=0

          echo "============================================================"
          echo "[$display_type] Capturing $display_name"
          echo "[$display_type] udid=$udid"
          echo "============================================================"

          if ! ensure_simulator_ready "$udid" "$display_type"; then
            echo "::error::[$display_type] simulator never became ready; skipping device"
            return 1
          fi

          if ! install_app_with_retry "$udid" "$display_type"; then
            echo "::error::[$display_type] installation failed; skipping device"
            return 1
          fi

          for LOCALE in $LOCALES; do
            local out_dir="$SCREENSHOTS_DIR/$LOCALE/$display_type"
            mkdir -p "$out_dir"

            local apple_lang="en"
            local apple_locale="en_US"
            case "$LOCALE" in
              zh-Hans) apple_lang="zh-Hans"; apple_locale="zh_CN" ;;
              zh-Hant) apple_lang="zh-Hant"; apple_locale="zh_TW" ;;
            esac

            capture_one() {
              local tab="$1"
              local file="$2"
              local wait_seconds=6
              [[ "$tab" == "reader" ]] && wait_seconds=9

              echo "[$display_type][$LOCALE][$tab] terminate"
              run_with_timeout 15 xcrun simctl terminate "$udid" "$BUNDLE_ID" || true

              echo "[$display_type][$LOCALE][$tab] launch"
              if ! run_with_timeout 30 env \
                SIMCTL_CHILD_READORI_SCREENSHOT_MODE=1 \
                SIMCTL_CHILD_READORI_SCREENSHOT_TAB="$tab" \
                xcrun simctl launch "$udid" "$BUNDLE_ID" \
                  -AppleLanguages "($apple_lang)" \
                  -AppleLocale "$apple_locale"; then
                echo "::warning::[$display_type][$LOCALE][$tab] first launch failed; retrying once"
                run_with_timeout 15 xcrun simctl terminate "$udid" "$BUNDLE_ID" || true
                sleep 2
                if ! run_with_timeout 30 env \
                  SIMCTL_CHILD_READORI_SCREENSHOT_MODE=1 \
                  SIMCTL_CHILD_READORI_SCREENSHOT_TAB="$tab" \
                  xcrun simctl launch "$udid" "$BUNDLE_ID" \
                    -AppleLanguages "($apple_lang)" \
                    -AppleLocale "$apple_locale"; then
                  echo "::error::[$display_type][$LOCALE][$tab] launch failed after retry"
                  return 1
                fi
              fi

              echo "[$display_type][$LOCALE][$tab] waiting ${wait_seconds}s for UI"
              sleep "$wait_seconds"

              rm -f "$file"
              echo "[$display_type][$LOCALE][$tab] screenshot -> $file"
              if ! run_with_timeout 20 xcrun simctl io "$udid" screenshot "$file"; then
                echo "::warning::[$display_type][$LOCALE][$tab] screenshot command failed/timed out; retrying once"
                sleep 2
                run_with_timeout 20 xcrun simctl io "$udid" screenshot "$file" || true
              fi

              local size=0
              [[ -f "$file" ]] && size="$(wc -c < "$file" 2>/dev/null | tr -d ' ' || echo 0)"
              if [[ ! -s "$file" ]] || (( ${size:-0} < 2048 )); then
                echo "::warning::[$display_type][$LOCALE][$tab] invalid/empty screenshot; final retry"
                sleep 2
                rm -f "$file"
                run_with_timeout 20 xcrun simctl io "$udid" screenshot "$file" || true
                size=0
                [[ -f "$file" ]] && size="$(wc -c < "$file" 2>/dev/null | tr -d ' ' || echo 0)"
              fi

              if [[ ! -s "$file" ]] || (( ${size:-0} < 2048 )); then
                echo "::error::[$display_type][$LOCALE][$tab] screenshot still invalid after retries"
                return 1
              fi

              local dimensions
              dimensions="$(sips -g pixelWidth -g pixelHeight "$file" 2>/dev/null | awk '/pixelWidth/ {w=$2} /pixelHeight/ {h=$2} END {if (w && h) print w "x" h}')"
              echo "[$display_type][$LOCALE][$tab] OK ${dimensions:-unknown} ${size} bytes"
              return 0
            }

            capture_one "bookshelf"       "$out_dir/01_bookshelf.png"       || failures=$((failures + 1))
            capture_one "reader"          "$out_dir/02_reader.png"          || failures=$((failures + 1))
            capture_one "explore"         "$out_dir/03_explore.png"         || failures=$((failures + 1))
            capture_one "settings"        "$out_dir/04_settings.png"        || failures=$((failures + 1))
            capture_one "pro"             "$out_dir/05_pro.png"             || failures=$((failures + 1))
            capture_one "personalization" "$out_dir/06_personalization.png" || failures=$((failures + 1))
          done

          echo "[$display_type] shutting down simulator"
          run_with_timeout 20 xcrun simctl shutdown "$udid" || true

          if (( failures > 0 )); then
            echo "::error::[$display_type] completed with $failures screenshot failure(s)"
            return 1
          fi

          echo "[$display_type] all screenshots captured successfully"
          return 0
        }

        CAPTURE_RC=0

        if [[ -n "$IPHONE_SIM" ]]; then
          capture_for_device "${IPHONE_SIM%%|*}" "${IPHONE_SIM##*|}" "APP_IPHONE_67" || CAPTURE_RC=1
        else
          echo "::warning::Skipping iPhone screenshots (no simulator available)"
          CAPTURE_RC=1
        fi

        if [[ -n "$IPAD_SIM" ]]; then
          capture_for_device "${IPAD_SIM%%|*}" "${IPAD_SIM##*|}" "APP_IPAD_PRO_3GEN_129" || CAPTURE_RC=1
        else
          echo "::error::Skipping iPad screenshots — App Store requires iPad screenshots for this universal app"
          CAPTURE_RC=1
        fi

        # Move captured screenshots to the path consumed by validation/upload.
        if [[ -d "$SCREENSHOTS_DIR" ]] && [[ -n "$(ls -A "$SCREENSHOTS_DIR" 2>/dev/null)" ]]; then
          rm -rf "$TARGET_DIR"
          mv "$SCREENSHOTS_DIR" "$TARGET_DIR"
          echo "Auto-captured screenshots saved to $TARGET_DIR"
          find "$TARGET_DIR" -name '*.png' -print | sort
        else
          echo "::error::No screenshots were captured"
          CAPTURE_RC=1
        fi

        # continue-on-error keeps artifact diagnostics available; the next
        # Validate captured screenshots step is the authoritative hard gate.
        exit "$CAPTURE_RC"

    - name: Validate captured screenshots
      if: ${{ env.MODE == 'screenshots' }}
      run: |
        set -euo pipefail
        ROOT="$GITHUB_WORKSPACE/core_project/screenshots/en-US"
        IPHONE_DIR="$ROOT/APP_IPHONE_67"
        IPAD_DIR="$ROOT/APP_IPAD_PRO_3GEN_129"

        validate_set() {
          local dir="$1"
          local label="$2"
          [[ -d "$dir" ]] || { echo "::error::$label screenshot directory missing: $dir"; exit 1; }
          local count
          count="$(find "$dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          [[ "$count" -eq 6 ]] || { echo "::error::$label requires exactly 6 screenshots; found $count"; exit 1; }
          while IFS= read -r png; do
            [[ -s "$png" ]] || { echo "::error::Empty screenshot: $png"; exit 1; }
            width="$(sips -g pixelWidth "$png" 2>/dev/null | awk '/pixelWidth/ {print $2}')"
            height="$(sips -g pixelHeight "$png" 2>/dev/null | awk '/pixelHeight/ {print $2}')"
            [[ "$width" =~ ^[0-9]+$ && "$height" =~ ^[0-9]+$ ]] || { echo "::error::Unable to read screenshot dimensions: $png"; exit 1; }
            if (( width < 1000 || height < 1000 )); then
              echo "::error::Screenshot dimensions look invalid: ${width}x${height} $png"
              exit 1
            fi
          done < <(find "$dir" -maxdepth 1 -type f -name '*.png' | sort)
          echo "$label screenshots: PASS ($count files)"
        }

        validate_set "$IPHONE_DIR" "iPhone"
        validate_set "$IPAD_DIR" "iPad"

    # ==============================================
    # 16.6 PUBLISH SCREENSHOTS AS BUILD ARTIFACT
    # ==============================================
    - name: Publish captured screenshots as build artifact
      if: ${{ env.MODE == 'screenshots' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: app-store-screenshots
        path: core_project/screenshots/
        if-no-files-found: error
        retention-days: 14

    # ==============================================
    # 18. SUBSCRIPTION GROUPS — diagnostic list
    # ==============================================
    - name: List subscription groups (diagnostic)
      if: ${{ env.MODE == 'testflight' }}
      continue-on-error: true
      run: |
        echo "=== Subscription Groups ==="
        asc subscription-groups list \
          --app-id ${{ secrets.ASC_APP_ID }} \
          --output json | \
          python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        groups = data['data'] if isinstance(data, dict) and 'data' in data else (data if isinstance(data, list) else [])
        for g in groups:
            if isinstance(g, dict):
                print(f\"  {g.get('referenceName','?')}  id={g.get('id','?')}\")
            else:
                print(f'  {g}')
        " || echo "(no subscription groups or error)"

    # ==============================================
    # 19. UPLOAD IPA ARTIFACT
    # ==============================================
    - name: Upload IPA artifact
      if: ${{ env.MODE != 'screenshots' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: readori-${{ env.BUILD_TAG || github.run_number }}
        retention-days: 7
        if-no-files-found: error
        path: |
          build/*.ipa
          build/export/*.ipa

    # ==============================================
    # 20. CLEANUP EPHEMERAL SIGNING MATERIAL
    # ==============================================
    - name: Clean up signing material
      if: ${{ always() && env.MODE == 'testflight' }}
      run: |
        set +e
        rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
        rm -rf /tmp/asc_keys
        rm -f /tmp/asc_api_key.json /tmp/sign_entitlements.plist \
          /tmp/readori-match-profile.plist
        if [[ -n "${PROFILE_UUID:-}" ]]; then
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
        fi
        if [[ -n "${READORI_KEYCHAIN_PATH:-}" && -f "$READORI_KEYCHAIN_PATH" ]]; then
          security delete-keychain "$READORI_KEYCHAIN_PATH" >/dev/null 2>&1 || true
        fi
        echo "Ephemeral signing material cleaned"
